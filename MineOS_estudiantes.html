<script>
/* Lessons, part B: memory management (no virtual memory) and MineOS. Original text, CC0-1.0. */
window.MineOS.lessons.push(
{ id: 'contiguous', zone: 'mine', lab: { route: 'memory', preset: 'holes' },
es: { title: 'Memoria y asignación contigua', goal: 'Explicar base, límite y fragmentación externa.',
 story: 'La RAM es como un corredor de cofres en línea. Cada proceso necesita varios cofres seguidos.',
 body: '<p>Para ejecutarse, en este modelo un proceso debe estar <b>completo en memoria principal</b>. En <b>asignación contigua</b> ocupa una sola región seguida.</p><p>Dos registros lo protegen: <b>base</b> (dónde empieza) y <b>límite</b> (cuánto mide). El hardware revisa cada dirección:</p><p class="math">si 0 ≤ lógica < límite: física = base + lógica; si no, error de protección</p><p>Solo el SO, en modo kernel, puede cambiar esos registros.</p><p>Al entrar y salir procesos quedan <b>huecos</b>. Si al liberar hay dos huecos vecinos, se <b>fusionan</b>. <b>Fragmentación externa:</b> hay memoria libre suficiente en total, pero repartida. <b>Compactar</b> mueve procesos para juntar los huecos; cuesta copias y requiere que se puedan reubicar.</p>',
 mc: 'Los <i>chunks</i> son trozos del mundo que el servidor mantiene en RAM. En el laboratorio los bloques de memoria representan regiones de procesos; es una analogía, no la forma en que Java organiza los chunks.',
 example: '<p>Un proceso tiene base 3000 y límite 500.</p><table><tr><th>Dirección lógica</th><th>Resultado</th></tr><tr><td>120</td><td>física 3120</td></tr><tr><td>499</td><td>física 3499 (última válida)</td></tr><tr><td>500</td><td>error de protección</td></tr></table>',
 quiz: { q: 'Hay dos huecos separados de 100 y 150. ¿Entra un proceso contiguo de 200 sin compactar?', options: ['Sí, porque hay 250 libres', 'No, porque ningún hueco mide al menos 200', 'Sí, si se divide el proceso en dos'], hint: 'Sumar espacio no lo vuelve continuo.', why: 'Es fragmentación externa.' } },
en: { title: 'Memory and contiguous allocation', goal: 'Explain base, limit and external fragmentation.',
 story: 'RAM is like a corridor of chests in a row. Each process needs several chests next to each other.',
 body: '<p>To run, in this model a process must be <b>entirely in main memory</b>. With <b>contiguous allocation</b> it occupies one single region.</p><p>Two registers protect it: <b>base</b> (where it starts) and <b>limit</b> (how long it is). The hardware checks every address:</p><p class="math">if 0 ≤ logical < limit: physical = base + logical; else protection error</p><p>Only the OS, in kernel mode, may change those registers.</p><p>As processes come and go, <b>holes</b> appear. When freeing leaves two neighbouring holes, they are <b>merged</b>. <b>External fragmentation:</b> there is enough free memory in total, but it is split up. <b>Compaction</b> moves processes to join the holes; it costs copying and requires processes to be relocatable.</p>',
 mc: '<i>Chunks</i> are pieces of the world the server keeps in RAM. In the lab, memory blocks stand for process regions; it is an analogy, not how Java lays out chunks.',
 example: '<p>A process has base 3000 and limit 500.</p><table><tr><th>Logical address</th><th>Result</th></tr><tr><td>120</td><td>physical 3120</td></tr><tr><td>499</td><td>physical 3499 (last valid one)</td></tr><tr><td>500</td><td>protection error</td></tr></table>',
 quiz: { q: 'There are two separate holes of 100 and 150. Does a contiguous 200-unit process fit without compaction?', options: ['Yes, because 250 units are free', 'No, because no hole is at least 200', 'Yes, by splitting the process in two'], hint: 'Adding up space does not make it continuous.', why: 'This is external fragmentation.' } },
answer: 1 },

{ id: 'fit', zone: 'mine', lab: { route: 'memory', preset: 'diverge' },
es: { title: 'First, Best, Worst y Segregated Fit', goal: 'Comparar cuatro formas de elegir un hueco.',
 story: 'Llega un proceso y hay varios huecos donde cabe. ¿Cuál escoges?',
 body: '<table><tr><th>Política</th><th>Elige</th></tr><tr><td><b>First Fit</b></td><td>El primer hueco suficiente (por dirección)</td></tr><tr><td><b>Best Fit</b></td><td>El más pequeño que alcance</td></tr><tr><td><b>Worst Fit</b></td><td>El más grande</td></tr><tr><td><b>Segregated Fit</b></td><td>Agrupa huecos por clases de tamaño [2ᵏ, 2ᵏ⁺¹−1]. Busca primero en la clase del pedido y, si nada sirve, en la siguiente clase superior</td></tr></table><p>En empates de tamaño gana la dirección menor. Ninguna política es la mejor para todas las cargas.</p><p class="math">fragmentación externa = libre total − hueco libre más grande</p>',
 mc: 'La Mina de Memoria permite ver las cuatro políticas lado a lado con los mismos eventos.',
 example: '<p>Huecos en orden: 100, 500, 200, 300, 600. Llega un pedido de 212.</p><table><tr><th>Política</th><th>Hueco</th><th>Sobra</th></tr><tr><td>First</td><td>500</td><td>288</td></tr><tr><td>Best</td><td>300</td><td>88</td></tr><tr><td>Worst</td><td>600</td><td>388</td></tr><tr><td>Segregated</td><td>500</td><td>288</td></tr></table><p>En Segregated, 212 es de la clase 128–255; el 200 está en esa clase pero no alcanza. La clase 256–511 contiene el 500 y el 300, y se toma el primero por dirección.</p>',
 code: 'first:  holes.find(h => h.size >= n)\nbest:   min size among fitting holes\nworst:  max size among fitting holes\nsegregated: lowest size class with a fitting hole',
 quiz: { q: 'Huecos 400, 250 y 700, en ese orden. Pedido 240. ¿Qué elige Best Fit?', options: ['400', '250', '700'], hint: 'El menor que alcance.', why: '250 deja solo 10 libres.' } },
en: { title: 'First, Best, Worst and Segregated Fit', goal: 'Compare four ways of choosing a hole.',
 story: 'A process arrives and several holes can hold it. Which one do you pick?',
 body: '<table><tr><th>Policy</th><th>Chooses</th></tr><tr><td><b>First Fit</b></td><td>The first hole big enough (by address)</td></tr><tr><td><b>Best Fit</b></td><td>The smallest one that fits</td></tr><tr><td><b>Worst Fit</b></td><td>The largest one</td></tr><tr><td><b>Segregated Fit</b></td><td>Groups holes into size classes [2ᵏ, 2ᵏ⁺¹−1]. Searches the request’s class first and, if nothing fits, the next higher class</td></tr></table><p>Ties go to the lowest address. No policy is best for every workload.</p><p class="math">external fragmentation = total free − largest free hole</p>',
 mc: 'The Memory Mine shows the four policies side by side with the same events.',
 example: '<p>Holes in order: 100, 500, 200, 300, 600. A request of 212 arrives.</p><table><tr><th>Policy</th><th>Hole</th><th>Leftover</th></tr><tr><td>First</td><td>500</td><td>288</td></tr><tr><td>Best</td><td>300</td><td>88</td></tr><tr><td>Worst</td><td>600</td><td>388</td></tr><tr><td>Segregated</td><td>500</td><td>288</td></tr></table><p>In Segregated Fit, 212 belongs to class 128–255; the 200 hole is there but too small. Class 256–511 holds 500 and 300, and the first by address is taken.</p>',
 code: 'first:  holes.find(h => h.size >= n)\nbest:   min size among fitting holes\nworst:  max size among fitting holes\nsegregated: lowest size class with a fitting hole',
 quiz: { q: 'Holes 400, 250 and 700, in that order. Request 240. What does Best Fit choose?', options: ['400', '250', '700'], hint: 'The smallest one that fits.', why: '250 leaves only 10 free.' } },
answer: 1 },

{ id: 'paging', zone: 'mine', lab: { route: 'paging' },
es: { title: 'Paginación', goal: 'Traducir una dirección lógica y calcular la fragmentación interna.',
 story: '¿Y si el proceso no tuviera que estar en cofres seguidos?',
 body: '<p>La memoria lógica se divide en <b>páginas</b> y la física en <b>marcos</b> del mismo tamaño. La <b>tabla de páginas</b> indica en qué marco está cada página. Aquí <b>todas las páginas del proceso se cargan</b> antes de ejecutar.</p><p class="math">página = L ÷ P (división entera)<br>desplazamiento = L mod P<br>física = marco · P + desplazamiento</p><p>No hay fragmentación externa, pero la última página puede quedar incompleta: <b>fragmentación interna</b>.</p><p class="math">interna = ⌈tamaño ÷ P⌉ · P − tamaño</p><p>Una caché llamada <b>TLB</b> guarda traducciones recientes para no consultar la tabla en memoria cada vez.</p>',
 mc: 'Imagina el mundo guardado en estantes iguales: dos trozos vecinos del proceso pueden terminar en estantes muy separados.',
 example: '<p>Página de 4 bytes y tabla [5, 6, 1, 2]. Dirección lógica 13:</p><p class="math">página 3, desplazamiento 1 → marco 2 → física = 2·4 + 1 = 9</p><p>Un proceso de 72 766 bytes con páginas de 2 048 usa 36 páginas y desperdicia 962 bytes.</p>',
 code: 'page   = logical // pageSize\noffset = logical %  pageSize\nreturn pageTable[page] * pageSize + offset',
 quiz: { q: 'Con la misma tabla [5, 6, 1, 2] y páginas de 4, ¿cuál es la dirección física de la lógica 6?', options: ['26', '10', '6'], hint: 'Primero calcula 6 ÷ 4 y 6 mod 4.', why: 'Página 1 → marco 6 → 6·4 + 2 = 26.' } },
en: { title: 'Paging', goal: 'Translate a logical address and compute internal fragmentation.',
 story: 'What if the process did not need chests that are next to each other?',
 body: '<p>Logical memory is split into <b>pages</b> and physical memory into <b>frames</b> of the same size. The <b>page table</b> says which frame holds each page. Here <b>all pages of a process are loaded</b> before it runs.</p><p class="math">page = L ÷ P (integer division)<br>offset = L mod P<br>physical = frame · P + offset</p><p>There is no external fragmentation, but the last page may be partly empty: <b>internal fragmentation</b>.</p><p class="math">internal = ⌈size ÷ P⌉ · P − size</p><p>A cache called the <b>TLB</b> keeps recent translations so the table in memory is not read every time.</p>',
 mc: 'Picture the world stored on identical shelves: two neighbouring pieces of a process may end up on shelves far apart.',
 example: '<p>4-byte pages and table [5, 6, 1, 2]. Logical address 13:</p><p class="math">page 3, offset 1 → frame 2 → physical = 2·4 + 1 = 9</p><p>A 72,766-byte process with 2,048-byte pages uses 36 pages and wastes 962 bytes.</p>',
 code: 'page   = logical // pageSize\noffset = logical %  pageSize\nreturn pageTable[page] * pageSize + offset',
 quiz: { q: 'With the same table [5, 6, 1, 2] and 4-byte pages, what is the physical address of logical 6?', options: ['26', '10', '6'], hint: 'First compute 6 ÷ 4 and 6 mod 4.', why: 'Page 1 → frame 6 → 6·4 + 2 = 26.' } },
answer: 0 },

{ id: 'segmentation', zone: 'mine', lab: { route: 'segmentation' },
es: { title: 'Segmentación', goal: 'Validar un par (segmento, desplazamiento) y traducirlo.',
 story: 'Un programa no es un bloque sin forma: tiene código, datos, pila…',
 body: '<p>La <b>segmentación</b> divide el programa en partes <b>lógicas</b> de tamaño variable. Una dirección es un par <b>(s, d)</b>: número de segmento y desplazamiento. La <b>tabla de segmentos</b> guarda base y límite de cada uno.</p><p class="math">1. ¿Existe s? 2. ¿d < límite[s]? 3. física = base[s] + d</p><p>Cada segmento se ubica con una política de huecos, así que puede haber <b>fragmentación externa</b>.</p><table><tr><th></th><th>Paginación</th><th>Segmentación</th></tr><tr><td>Tamaño de las partes</td><td>Fijo</td><td>Variable</td></tr><tr><td>Fragmentación típica</td><td>Interna</td><td>Externa</td></tr><tr><td>Sentido para el programador</td><td>No</td><td>Sí</td></tr></table>',
 mc: 'Es como construir por partes (casa, granja, bodega): cada una con su propio terreno y su propia cerca.',
 example: '<p>Segmento 0: base 1000, límite 400. Segmento 1: base 3000, límite 120.</p><table><tr><th>(s, d)</th><th>Resultado</th></tr><tr><td>(0, 399)</td><td>1399</td></tr><tr><td>(1, 100)</td><td>3100</td></tr><tr><td>(1, 120)</td><td>error: fuera del límite</td></tr></table>',
 code: 'if s >= table.length:        trap\nif d >= table[s].limit:      trap\nreturn table[s].base + d',
 quiz: { q: 'Segmento con base 500 y límite 200. ¿Qué pasa con d = 250?', options: ['Física 750', 'Error: d no es menor que el límite', 'Física 250'], hint: 'Valida antes de sumar.', why: '250 ≥ 200, así que el hardware genera una excepción.' } },
en: { title: 'Segmentation', goal: 'Validate a (segment, offset) pair and translate it.',
 story: 'A program is not a shapeless lump: it has code, data, a stack…',
 body: '<p><b>Segmentation</b> splits a program into <b>logical</b> parts of variable size. An address is a pair <b>(s, d)</b>: segment number and offset. The <b>segment table</b> stores the base and limit of each one.</p><p class="math">1. Does s exist? 2. Is d < limit[s]? 3. physical = base[s] + d</p><p>Each segment is placed with a hole-fitting policy, so <b>external fragmentation</b> can appear.</p><table><tr><th></th><th>Paging</th><th>Segmentation</th></tr><tr><td>Size of the parts</td><td>Fixed</td><td>Variable</td></tr><tr><td>Typical fragmentation</td><td>Internal</td><td>External</td></tr><tr><td>Meaningful to the programmer</td><td>No</td><td>Yes</td></tr></table>',
 mc: 'It is like building in parts (house, farm, storage): each with its own land and its own fence.',
 example: '<p>Segment 0: base 1000, limit 400. Segment 1: base 3000, limit 120.</p><table><tr><th>(s, d)</th><th>Result</th></tr><tr><td>(0, 399)</td><td>1399</td></tr><tr><td>(1, 100)</td><td>3100</td></tr><tr><td>(1, 120)</td><td>error: beyond the limit</td></tr></table>',
 code: 'if s >= table.length:        trap\nif d >= table[s].limit:      trap\nreturn table[s].base + d',
 quiz: { q: 'A segment has base 500 and limit 200. What happens with d = 250?', options: ['Physical 750', 'Error: d is not below the limit', 'Physical 250'], hint: 'Validate before adding.', why: '250 ≥ 200, so the hardware raises an exception.' } },
answer: 1 },

{ id: 'implementation', zone: 'tower', lab: { route: 'server' },
es: { title: 'Cómo está construido MineOS', goal: 'Describir las piezas del simulador y cómo se comprueba.',
 story: 'Para saber si una idea mejora un servidor, primero se prueba en una maqueta que siempre se comporta igual con los mismos datos.',
 body: '<p>Hay dos implementaciones de la planificación:</p><ul><li><b>Simulador Java</b> (carpeta <code>sim-core</code>): genera trazas de trabajo con semilla y compara planificadores.</li><li><b>Motor web</b> (<code>site/js/engine</code>): repite esa planificación en tu navegador.</li></ul><p>Piezas principales: <b>Trace</b> (tareas de cada tick), <b>Job</b> (la ficha o PCB de una tarea), <b>TickScheduler</b> (la política) y <b>Simulator</b> (el reloj y la CPU).</p><p>La separación entre <b>política</b> (a quién elegir) y <b>mecanismo</b> (cómo se ejecuta) permite cambiar de planificador sin tocar el reloj.</p><p><b>Comprobación:</b> se reprodujeron en el motor web las trazas del simulador Java (4 escenarios × 3 planificadores × con y sin presupuesto) y coincidieron las 288 métricas comparadas.</p>',
 mc: 'Es un modelo educativo: los costos de CPU son sintéticos y no se ejecuta ni se modifica el juego.',
 example: '<p>El ciclo de un tick:</p><ol><li>Llegan las tareas del tick. Si una igual sigue pendiente, la nueva se descarta.</li><li>El planificador aplica aging o boost.</li><li>Mientras haya tiempo y trabajo, elige una tarea y le da su quantum.</li><li>Se mide cuánto duró el tick.</li></ol>',
 code: 'while (now < budgetEnd):\n    job = scheduler.next()\n    slice = min(quantum(job), job.remaining, budgetEnd - now)\n    now += slice;  job.remaining -= slice\n    if job.remaining > 0: scheduler.onPreempt(job, slice >= quantum(job))',
 quiz: { q: '¿Qué parte del código cambiarías para probar un planificador nuevo?', options: ['El reloj del simulador', 'Una nueva implementación de TickScheduler', 'La traza de tareas'], hint: 'La política está separada del mecanismo.', why: 'La interfaz TickScheduler concentra la política.' } },
en: { title: 'How MineOS is built', goal: 'Describe the parts of the simulator and how it is checked.',
 story: 'To find out whether an idea improves a server, first test it on a model that always behaves the same with the same data.',
 body: '<p>There are two implementations of the scheduling:</p><ul><li><b>Java simulator</b> (<code>sim-core</code> folder): creates seeded workload traces and compares schedulers.</li><li><b>Web engine</b> (<code>site/js/engine</code>): repeats that scheduling in your browser.</li></ul><p>Main parts: <b>Trace</b> (tasks of each tick), <b>Job</b> (a task’s record or PCB), <b>TickScheduler</b> (the policy) and <b>Simulator</b> (clock and CPU).</p><p>Separating <b>policy</b> (whom to pick) from <b>mechanism</b> (how it runs) lets you swap schedulers without touching the clock.</p><p><b>Check:</b> the Java simulator’s traces (4 scenarios × 3 schedulers × with and without budget) were replayed in the web engine and all 288 compared metrics matched.</p>',
 mc: 'This is a teaching model: CPU costs are synthetic and the game is neither run nor modified.',
 example: '<p>The cycle of one tick:</p><ol><li>The tick’s tasks arrive. If an identical one is still pending, the new one is dropped.</li><li>The scheduler applies aging or boost.</li><li>While there is time and work, it picks a task and gives it its quantum.</li><li>The tick duration is measured.</li></ol>',
 code: 'while (now < budgetEnd):\n    job = scheduler.next()\n    slice = min(quantum(job), job.remaining, budgetEnd - now)\n    now += slice;  job.remaining -= slice\n    if job.remaining > 0: scheduler.onPreempt(job, slice >= quantum(job))',
 quiz: { q: 'Which part would you change to try a new scheduler?', options: ['The simulator clock', 'A new implementation of TickScheduler', 'The task trace'], hint: 'Policy is separate from mechanism.', why: 'The TickScheduler interface holds the policy.' } },
answer: 1 },

{ id: 'improvement', zone: 'tower', lab: { route: 'server' },
es: { title: 'La mejora: antes y después', goal: 'Justificar una mejora con datos y decir qué cuesta.',
 story: 'El servidor está sobrecargado. ¿Qué cambiamos y qué perdemos a cambio?',
 body: '<p>Se comparan dos ideas sobre la línea base FCFS:</p><ol><li><b>Planificar por prioridad</b> (4 niveles + RR + aging).</li><li><b>Presupuesto de tick:</b> cortar a los 50 ms y dejar lo pendiente para el siguiente. Si una entidad pide otra actualización mientras la anterior sigue pendiente, la nueva se descarta.</li></ol><p>Resultados en el escenario sobrecargado, promedio de 10 semillas (simulador Java, sin memoria virtual):</p><table><tr><th>Configuración</th><th>TPS</th><th>Latencia p99 del jugador</th><th>Entidades descartadas</th></tr><tr><td>FCFS</td><td>9,4</td><td>108 ms</td><td>0 %</td></tr><tr><td>Priority</td><td>9,4</td><td>7,5 ms</td><td>0 %</td></tr><tr><td>Priority + presupuesto</td><td>20</td><td>7,5 ms</td><td>64 %</td></tr></table><p><b>Lectura:</b> sin presupuesto, cambiar el planificador no reduce el trabajo total (los TPS no cambian); cambia <i>quién espera</i>. El presupuesto recupera los 20 TPS porque hace menos actualizaciones.</p>',
 mc: '“p99 = 7,5 ms” significa que el 99 % de las tareas de jugador terminaron en 7,5 ms o menos dentro del modelo. No es una medición de un servidor real.',
 example: '<p>Los costos de la mejora:</p><ul><li>Los ticks de bloques (cultivos) pasan de unos 111 ms a 265 ms de p99 con presupuesto.</li><li>Las entidades se actualizan menos veces.</li><li>Con MFQ y presupuesto, los circuitos llegan a un p99 promedio de unos 8,6 s: inanición.</li></ul>',
 quiz: { q: 'Con presupuesto, el servidor sobrecargado vuelve a 20 TPS. ¿Por qué?', options: ['La CPU se vuelve más rápida', 'Deja trabajo para después y descarta actualizaciones repetidas', 'Priority reduce el costo de cada tarea'], hint: 'Mira la última columna de la tabla.', why: 'No se hace todo el trabajo: se sacrifica frecuencia de actualización.' } },
en: { title: 'The improvement: before and after', goal: 'Justify an improvement with data and state what it costs.',
 story: 'The server is overloaded. What do we change, and what do we give up?',
 body: '<p>Two ideas are compared against the FCFS baseline:</p><ol><li><b>Priority scheduling</b> (4 levels + RR + aging).</li><li><b>Tick budget:</b> cut at 50 ms and leave pending work for the next tick. If an entity asks for another update while the previous one is pending, the new one is dropped.</li></ol><p>Results for the overloaded scenario, average of 10 seeds (Java simulator, no virtual memory):</p><table><tr><th>Configuration</th><th>TPS</th><th>Player p99 latency</th><th>Dropped entity updates</th></tr><tr><td>FCFS</td><td>9.4</td><td>108 ms</td><td>0%</td></tr><tr><td>Priority</td><td>9.4</td><td>7.5 ms</td><td>0%</td></tr><tr><td>Priority + budget</td><td>20</td><td>7.5 ms</td><td>64%</td></tr></table><p><b>Reading:</b> without a budget, changing the scheduler does not reduce total work (TPS stays the same); it changes <i>who waits</i>. The budget gets back to 20 TPS because it performs fewer updates.</p>',
 mc: '“p99 = 7.5 ms” means 99% of player tasks finished in 7.5 ms or less inside the model. It is not a measurement of a real server.',
 example: '<p>What the improvement costs:</p><ul><li>Block ticks (crops) go from about 111 ms to 265 ms p99 with the budget.</li><li>Entities are updated less often.</li><li>With MFQ and a budget, circuits reach an average p99 of about 8.6 s: starvation.</li></ul>',
 quiz: { q: 'With a budget, the overloaded server returns to 20 TPS. Why?', options: ['The CPU becomes faster', 'It postpones work and drops repeated updates', 'Priority lowers the cost of each task'], hint: 'Look at the last column of the table.', why: 'Not all the work gets done: update frequency is sacrificed.' } },
answer: 1 }
);

/* In-site manual, teacher guide, glossary and about page. CC0-1.0. */

window.MineOS.pages = {
manual: {
es: `<h2>1. Para empezar</h2><p>Abre la página: no necesitas cuenta ni instalar nada. Cambia de idioma con los botones <b>ES / EN</b>. Cambiar de idioma conserva la página y los datos de los laboratorios.</p>
<h2>2. El mundo de bloques</h2><table><tr><th>Acción</th><th>Teclado y ratón</th><th>Pantalla táctil</th></tr><tr><td>Mirar</td><td>Arrastrar</td><td>Arrastrar</td></tr><tr><td>Caminar</td><td>W A S D o flechas</td><td>Botones en pantalla</td></tr><tr><td>Saltar</td><td>Espacio</td><td>Botón ⤒</td></tr><tr><td>Viajar a una estación</td><td>Teclas 1–4</td><td>Barra inferior</td></tr><tr><td>Entrar a una estación</td><td>E o el botón «Entrar»</td><td>Botón «Entrar»</td></tr><tr><td>Volver al punto de partida</td><td>Botón «Volver al inicio»</td><td>Botón «Volver al inicio»</td></tr></table><p>El mundo es para recorrerlo: no se pueden poner ni quitar bloques, y una pared invisible en la orilla evita caer al agua. Para usar las teclas, primero haz clic en el mundo. Si prefieres no usar el 3D, la lista de estaciones debajo del mundo ofrece todo el contenido.</p>
<h2>3. La ruta de aprendizaje</h2><p>Cada lección tiene: objetivo, situación, explicación, ejemplo resuelto, pseudocódigo cuando aplica, reto, pista y solución. Al pulsar «Comprobar» aparece junto a la opción elegida un ✔ verde (correcta) o una ✘ roja (incorrecta). Cada reto termina de una de dos formas: <b>éxito</b> (aciertas con «Comprobar») o <b>skip</b> («Ver solución»: muestra la respuesta y abre la siguiente lección, pero no cuenta como éxito ni como fallo). Cada respuesta incorrecta antes de terminar el reto cuenta como <b>fallo</b>. La barra de «Mi ruta» solo avanza con los éxitos, y debajo aparece el recuento: éxitos, fallos y skips.</p><p><b>Orden:</b> dentro de cada mundo las lecciones se abren una tras otra (🔒 = bloqueada). Puedes pasar de un mundo a otro cuando quieras; por ejemplo, avanzar en la Mina y luego volver a la Aldea.</p>
<h2>4. Laboratorio de planificadores</h2><ol><li>Elige un escenario: se carga al instante. También puedes editar la tabla.</li><li>En ráfagas escribe <code>5</code> (solo CPU) o <code>2,3,2</code> (CPU, I/O, CPU).</li><li>Elige algoritmo y parámetros. Escribe tu predicción.</li><li>Pulsa «Reproducir» (verde) para verlo correr, o «Un paso» para avanzar despacio, y lee la explicación de cada decisión.</li><li>Al terminar, la página te dice si tu predicción fue correcta.</li><li>Al terminar revisa el Gantt, la tabla de intervalos y las métricas.</li><li>Usa «Comparar todos» para ver la misma carga con los ocho algoritmos.</li></ol>
<h2>5. Servidor: antes y después</h2><p>Elige un servidor de ejemplo o define jugadores, criaturas, circuitos y semilla. Cambiar un valor no ejecuta nada: pulsa «▶ Simular» para correr la simulación (el resultado anterior se ve gris hasta entonces). Los ticks se dibujan uno a uno, las tarjetas comparan antes y después y «¿Quién espera?» muestra qué tareas ganan o pierden. «Antes» siempre es FCFS sin presupuesto. Compara Priority con y sin presupuesto: sin presupuesto cambian las esperas pero no los TPS.</p>
<h2>6. Laboratorios de memoria</h2><ul><li><b>Asignación contigua:</b> cada línea de eventos es <code>nombre inicio fin tamaño</code>. Si dos eventos ocurren a la vez, primero se libera. «Compactar» solo ocurre cuando lo pides. «Reproducir» muestra cada evento en orden.</li><li><b>Paginación:</b> indica marcos ocupados y observa en cuáles queda el proceso. Nada se calcula hasta pulsar «▶ Calcular». Escribe tu respuesta antes y la página te dice si acertaste.</li><li><b>Segmentación:</b> cada línea es <code>nombre base límite</code>. También puedes escribir tu respuesta o «error».</li></ul>
<h2>7. Accesibilidad y problemas comunes</h2><ul><li>Todo se puede usar con teclado; los diagramas tienen tabla equivalente.</li><li>Si el sistema pide reducir movimiento, las nubes y demostraciones animadas se detienen.</li><li><b>No se ve el mundo:</b> activa la aceleración gráfica o usa las tarjetas.</li><li><b>Se borró el avance:</b> se guarda solo en el navegador; el modo privado o borrar datos lo elimina. Algunas vistas previas (por ejemplo, la de una app de chat o de archivos) no permiten guardar: abre el archivo directamente en el navegador.</li></ul>`,
en: `<h2>1. Getting started</h2><p>Open the page: no account or installation needed. Switch language with the <b>ES / EN</b> buttons. Switching keeps the current page and lab data.</p>
<h2>2. The block world</h2><table><tr><th>Action</th><th>Keyboard and mouse</th><th>Touch screen</th></tr><tr><td>Look</td><td>Drag</td><td>Drag</td></tr><tr><td>Walk</td><td>W A S D or arrows</td><td>On-screen buttons</td></tr><tr><td>Jump</td><td>Space</td><td>⤒ button</td></tr><tr><td>Travel to a station</td><td>Keys 1–4</td><td>Bottom bar</td></tr><tr><td>Enter a station</td><td>E or the “Enter” button</td><td>“Enter” button</td></tr><tr><td>Go back to the starting point</td><td>“Back to start” button</td><td>“Back to start” button</td></tr></table><p>The world is for exploring: blocks cannot be placed or removed, and an invisible wall at the shore keeps you from falling into the water. Click the world before using the keys. If you prefer not to use 3D, the station list below the world offers all the content.</p>
<h2>3. The learning path</h2><p>Each lesson has: goal, situation, explanation, solved example, pseudocode where relevant, challenge, hint and solution. Pressing “Check” puts a green ✔ (right) or a red ✘ (wrong) next to the chosen option. Each challenge ends in one of two ways: <b>success</b> (right answer with “Check”) or <b>skip</b> (“Show solution”: it shows the answer and opens the next lesson, but counts as neither success nor failure). Each wrong answer before the challenge ends counts as a <b>failure</b>. The “My path” bar only moves with successes, and below it you see the count of successes, failures and skips.</p><p><b>Order:</b> inside each world the lessons open one after another (🔒 = locked). You can move between worlds whenever you like; for example, progress in the Mine and then go back to the Village.</p>
<h2>4. Scheduler lab</h2><ol><li>Pick a scenario: it loads at once. You can also edit the table.</li><li>For bursts type <code>5</code> (CPU only) or <code>2,3,2</code> (CPU, I/O, CPU).</li><li>Choose algorithm and parameters. Type your prediction.</li><li>Press “Play” (green) to watch it run, or “One step” to go slowly, and read why each decision was made.</li><li>At the end, the page tells you whether your prediction was right.</li><li>At the end, review the Gantt chart, interval table and metrics.</li><li>Use “Compare all” to see the same workload under all eight algorithms.</li></ol>
<h2>5. Server: before and after</h2><p>Pick an example server or set players, creatures, circuits and seed. Changing a value runs nothing: press “▶ Simulate” to run it (the previous result is greyed out until then). Ticks are drawn one by one, the cards compare before and after, and “Who waits?” shows which tasks win or lose. “Before” is always FCFS without a budget. Compare Priority with and without the budget: without it, waiting changes but TPS do not.</p>
<h2>6. Memory labs</h2><ul><li><b>Contiguous allocation:</b> each event line is <code>name start end size</code>. When two events happen at once, releases go first. “Compact” only happens when you ask. “Play” shows each event in order.</li><li><b>Paging:</b> list the busy frames and see where the process lands. Nothing is calculated until you press “▶ Calculate”. Type your answer before it and the page tells you if you got it right.</li><li><b>Segmentation:</b> each line is <code>name base limit</code>. You can also type your answer or “error”.</li></ul>
<h2>7. Accessibility and common problems</h2><ul><li>Everything works with a keyboard; diagrams have an equivalent table.</li><li>If your system asks for reduced motion, clouds and animated demos stop.</li><li><b>The world does not show:</b> enable hardware acceleration or use the cards.</li><li><b>Progress disappeared:</b> it is stored only in the browser; private mode or clearing data removes it. Some previews (for example in a chat or file app) cannot save: open the file directly in your browser.</li></ul>`
},
teach: {
es: `<p><b>Público:</b> estudiantes de colegio (aprox. 15–18 años) con poca experiencia en programación. Los tiempos son estimaciones de diseño: aún no se han probado con estudiantes.</p>
<h2>Taller STEAM sugerido (90 minutos)</h2><table><tr><th>Min</th><th>Actividad</th></tr><tr><td>0–10</td><td>Recorrer el mundo y discutir: ¿por qué hay lag?</td></tr><tr><td>10–25</td><td><b>Juego sin computador:</b> cinco estudiantes son procesos con tarjetas que indican su ráfaga; otro es el planificador y otro la CPU con un cronómetro. Jueguen FCFS y luego Round Robin. Anoten esperas.</td></tr><tr><td>25–50</td><td>Lecciones de métricas, FCFS y Round Robin + laboratorio</td></tr><tr><td>50–70</td><td><b>Memoria con piezas:</b> una fila de 20 casillas en papel y fichas de distintos largos. Probar First, Best y Worst Fit. Verificar en el laboratorio.</td></tr><tr><td>70–90</td><td>Reto de ingeniería en el laboratorio del servidor: lograr 20 TPS y explicar qué se sacrificó.</td></tr></table>
<h2>Conexiones STEAM</h2><ul><li><b>Ciencia:</b> hipótesis, experimento con semilla y comparación.</li><li><b>Tecnología:</b> qué hace un sistema operativo.</li><li><b>Ingeniería:</b> compromisos de diseño.</li><li><b>Arte:</b> diseñar en el mundo o en papel una representación de una cola o una memoria.</li><li><b>Matemáticas:</b> promedios, división entera, residuo y percentiles.</li></ul>
<h2>Rúbrica de retroalimentación</h2><table><tr><th>Dimensión</th><th>Inicial</th><th>Suficiente</th><th>Sólida</th></tr><tr><td>Procedimiento</td><td>Traza incompleta</td><td>Traza válida</td><td>Localiza y explica divergencias</td></tr><tr><td>Resultado</td><td>Sin justificar</td><td>Con unidades</td><td>Verificado por otro método</td></tr><tr><td>Compromisos</td><td>Dice cuál es “mejor”</td><td>Dice para qué métrica</td><td>Explica quién paga el costo</td></tr></table>
<p>Es una herramienta de acompañamiento, no una calificación oficial. El material es de dominio público (CC0): puedes copiarlo, adaptarlo y publicarlo.</p>`,
en: `<p><b>Audience:</b> school students (about 15–18) with little programming experience. Timings are design estimates: they have not yet been tested with students.</p>
<h2>Suggested STEAM workshop (90 minutes)</h2><table><tr><th>Min</th><th>Activity</th></tr><tr><td>0–10</td><td>Walk the world and discuss: why is there lag?</td></tr><tr><td>10–25</td><td><b>Unplugged game:</b> five students are processes holding cards with their burst; one is the scheduler and one is the CPU with a timer. Play FCFS, then Round Robin. Record waiting times.</td></tr><tr><td>25–50</td><td>Lessons on metrics, FCFS and Round Robin + lab</td></tr><tr><td>50–70</td><td><b>Memory with pieces:</b> a row of 20 paper cells and strips of different lengths. Try First, Best and Worst Fit. Check in the lab.</td></tr><tr><td>70–90</td><td>Engineering challenge in the server lab: reach 20 TPS and explain what was sacrificed.</td></tr></table>
<h2>STEAM connections</h2><ul><li><b>Science:</b> hypothesis, seeded experiment and comparison.</li><li><b>Technology:</b> what an operating system does.</li><li><b>Engineering:</b> design trade-offs.</li><li><b>Art:</b> design a picture of a queue or a memory, in the world or on paper.</li><li><b>Mathematics:</b> averages, integer division, remainder and percentiles.</li></ul>
<h2>Feedback rubric</h2><table><tr><th>Dimension</th><th>Starting</th><th>Sufficient</th><th>Strong</th></tr><tr><td>Procedure</td><td>Incomplete trace</td><td>Valid trace</td><td>Finds and explains divergences</td></tr><tr><td>Result</td><td>Unjustified</td><td>With units</td><td>Checked by another method</td></tr><tr><td>Trade-offs</td><td>Says which is “best”</td><td>Says for which metric</td><td>Explains who pays the cost</td></tr></table>
<p>This supports feedback; it is not an official grade. The material is public domain (CC0): copy, adapt and publish it.</p>`
},
about: {
es: `<h2>Proyecto</h2><p>MineOS nació como proyecto final de Sistemas Operativos en la Universidad del Rosario (Bogotá). Esta versión lo convierte en un recurso abierto de promoción STEAM.</p><h2>Licencia</h2><p>El código, los textos y las texturas originales de este sitio se dedican al dominio público con <b>CC0 1.0</b>. Dos componentes de terceros conservan su propia licencia: <b>three.js</b> (MIT) y la fuente <b>VT323</b> (SIL OFL 1.1). Los nombres y marcas de terceros no se ceden.</p><h2>Minecraft</h2><p>Minecraft es una marca de Mojang / Microsoft. Aquí se menciona solo para explicar el contexto del modelo. El sitio no usa texturas, sonidos, logotipos, personajes ni código del juego.</p><h2>Límites</h2><ul><li>Es una simulación educativa: no es un kernel ni mide un servidor real.</li><li>Los costos de CPU son sintéticos.</li><li>Se modela un solo núcleo.</li><li>La memoria virtual (reemplazo de páginas, fallos de página) queda fuera del alcance.</li><li>No se ha hecho una prueba formal con estudiantes.</li></ul><h2>Para profundizar</h2><ul><li>Silberschatz, Galvin y Gagne, <i>Operating System Concepts</i>.</li><li>Arpaci-Dusseau, <i>Operating Systems: Three Easy Pieces</i>.</li><li>UR-OS, simulador académico creado por el profesor Pedro Wightman (no se redistribuye aquí).</li></ul>`,
en: `<h2>Project</h2><p>MineOS started as an Operating Systems final project at Universidad del Rosario (Bogotá). This version turns it into an open STEAM outreach resource.</p><h2>Licence</h2><p>The original code, text and textures of this site are dedicated to the public domain under <b>CC0 1.0</b>. Two third-party components keep their own licences: <b>three.js</b> (MIT) and the <b>VT323</b> font (SIL OFL 1.1). Third-party names and trademarks are not waived.</p><h2>Minecraft</h2><p>Minecraft is a trademark of Mojang / Microsoft. It is mentioned only to explain the context of the model. The site uses no textures, sounds, logos, characters or code from the game.</p><h2>Limits</h2><ul><li>It is an educational simulation: not a kernel, and it does not measure a real server.</li><li>CPU costs are synthetic.</li><li>A single core is modelled.</li><li>Virtual memory (page replacement, page faults) is out of scope.</li><li>No formal test with students has been run.</li></ul><h2>Further reading</h2><ul><li>Silberschatz, Galvin and Gagne, <i>Operating System Concepts</i>.</li><li>Arpaci-Dusseau, <i>Operating Systems: Three Easy Pieces</i>.</li><li>UR-OS, an academic simulator created by Professor Pedro Wightman (not redistributed here).</li></ul>`
},

<script>
/* Original procedural 16x16 pixel textures. Generated at run time; no third-party game assets. CC0-1.0. */
window.MineOS = window.MineOS || {};
window.MineOS.textures = (function () {
  'use strict';
  function rand(seed) { let a = seed; return () => { a = (a * 16807) % 2147483647; return a / 2147483647; }; }
  function canvas(paint, seed) {
    const c = document.createElement('canvas'); c.width = c.height = 16;
    const g = c.getContext('2d'); const r = rand(seed);
    const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
    paint(px, r, g);
    return c;
  }
  const speckle = (colors) => (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, colors[Math.floor(r() * colors.length)]); };
  const defs = {
    grassTop: speckle(['#67a94a', '#5d9c43', '#72b552', '#579040', '#6aae4c']),
    dirt: speckle(['#8a6242', '#7b5639', '#976d4b', '#6f4c32']),
    grassSide: (px, r) => { speckle(['#8a6242', '#7b5639', '#976d4b'])(px, r); for (let x = 0; x < 16; x++) { const h = 3 + Math.floor(r() * 3); for (let y = 0; y < h; y++) px(x, y, r() < 0.5 ? '#67a94a' : '#579040'); } },
    stone: (px, r) => { speckle(['#8d9298', '#858a90', '#959aa0'])(px, r); for (let i = 0; i < 9; i++) { const x = Math.floor(r() * 12), y = Math.floor(r() * 15); for (let k = 0; k < 4; k++) px(x + k, y, '#6f747a'); } },
    sand: speckle(['#dccf9a', '#d3c58e', '#e4d8a6']),
    wood: (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, x % 4 === 0 ? '#5b3d22' : r() < 0.5 ? '#7a5430' : '#704c2a'); },
    leaves: speckle(['#3f7d35', '#356b2d', '#4b8f3f', '#2c5a26', '#57a049']),
    plank: (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, y % 4 === 3 || (x === (y < 8 ? 4 : 11)) ? '#8a6a3c' : r() < 0.5 ? '#b99157' : '#ae874f'); },
    water: speckle(['#3a78c9', '#3f82d4', '#346dba']),
    lamp: (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const edge = x < 2 || y < 2 || x > 13 || y > 13; px(x, y, edge ? '#6b4a1f' : r() < 0.5 ? '#ffd75e' : '#ffc23a'); } },
    circuit: (px, r) => { speckle(['#243447', '#203042'])(px, r); for (let i = 0; i < 16; i++) { px(i, 5, '#38e0c0'); px(10, i, '#38e0c0'); } [[3, 5], [10, 12], [10, 5]].forEach(([x, y]) => { for (let a = -1; a < 2; a++) for (let b = -1; b < 2; b++) px(x + a, y + b, '#f2b84b'); }); },
    brick: (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const o = Math.floor(y / 4) % 2 ? 4 : 0; px(x, y, y % 4 === 3 || (x + o) % 8 === 7 ? '#cfc4b8' : r() < 0.5 ? '#a4503f' : '#97473a'); } }
  };
  const cache = {};
  function get(name) { if (!cache[name]) cache[name] = canvas(defs[name], 7 + Object.keys(defs).indexOf(name) * 131); return cache[name]; }
  /* faces: [top, side, bottom] */
  const blocks = {
    grass: ['grassTop', 'grassSide', 'dirt'], dirt: ['dirt', 'dirt', 'dirt'], stone: ['stone', 'stone', 'stone'], sand: ['sand', 'sand', 'sand'],
    wood: ['plank', 'wood', 'plank'], leaves: ['leaves', 'leaves', 'leaves'], plank: ['plank', 'plank', 'plank'], water: ['water', 'water', 'water'],
    lamp: ['lamp', 'lamp', 'lamp'], circuit: ['circuit', 'circuit', 'circuit'], brick: ['brick', 'brick', 'brick']
  };
  function install() {
    const root = document.documentElement.style;
    ['dirt', 'stone', 'plank', 'grassTop', 'grassSide', 'wood', 'lamp', 'circuit'].forEach((n) => root.setProperty('--tex-' + n, `url(${get(n).toDataURL()})`));
  }
  return { get, blocks, install };
})();

<script>
/* Interactive labs. All numbers come from the engines; this file only draws them. CC0-1.0. */
(function () {
  'use strict';
  const M = window.MineOS;
  const t = (k, p) => M.t(k, p), esc = (s) => M.esc(s), num = (v, d) => M.num(v, d);
  let timer = null, anim = null;
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } if (anim) { cancelAnimationFrame(anim); anim = null; } };

  const COLORS = ['#2f80ed', '#e8833a', '#2f9e62', '#b052c9', '#d64550', '#118a8a', '#9a7b1c', '#5c6bc0', '#c2477f', '#4d7c0f'];
  const SYMBOLS = ['▲', '●', '■', '◆', '★', '✚', '▼', '⬟', '✦', '◉'];
  const $ = (root, sel) => root.querySelector(sel);
  const field = (label, html) => `<label class="field"><span>${label}</span>${html}</label>`;
  const intOr = (v) => (/^\s*\d+\s*$/.test(v) ? Number(v) : NaN);
  const card = (kind, title, text) => `<div class="result ${kind}"><span class="result-icon" aria-hidden="true">${kind === 'ok' ? '✔' : kind === 'bad' ? '✘' : 'ℹ'}</span><div><b>${title}</b>${text ? `<p>${text}</p>` : ''}</div></div>`;
  // Makes a fresh result visible: it blinks once and scrolls into view if it is off-screen.
  const flash = (el, scroll) => {
    if (!el) return;
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    if (scroll && el.scrollIntoView) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.top > window.innerHeight - 120) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  };
  // Labs never rely on form submission: some embedded previews block it silently.
  const wireRun = (root, run) => {
    $(root, '#run').onclick = (e) => { e.preventDefault(); run(); };
    root.querySelectorAll('#form input:not([type=checkbox]), #form select').forEach((el) => {
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); run(); } });
    });
  };
  const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const table = (head, rows) => `<div class="scroll"><table><thead><tr>${head.map((h) => `<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  // ------------------------------------------------------------------ CPU lab
  const P = (id, arrival, bursts, priority) => ({ id, arrival: String(arrival), bursts: String(bursts), priority: String(priority) });
  const PRESETS = {
    convoy: { es: 'Efecto convoy (24, 3, 3)', en: 'Convoy effect (24, 3, 3)', algorithm: 'FCFS', quantum: 4, rows: [P('P1', 0, 24, 2), P('P2', 0, 3, 0), P('P3', 0, 3, 1)] },
    srtf: { es: 'Llegadas escalonadas (SRTF)', en: 'Staggered arrivals (SRTF)', algorithm: 'SRTF', quantum: 4, rows: [P('P1', 0, 8, 2), P('P2', 1, 4, 1), P('P3', 2, 9, 3), P('P4', 3, 5, 0)] },
    rr: { es: 'Turnos con Round Robin', en: 'Round Robin turns', algorithm: 'RR', quantum: 4, rows: [P('P1', 0, 24, 1), P('P2', 0, 3, 1), P('P3', 0, 3, 1)] },
    io: { es: 'Con entrada/salida', en: 'With input/output', algorithm: 'RR', quantum: 3, rows: [P('Player', 0, '2,5,2', 0), P('Farm', 0, 9, 3), P('Door', 2, '1,3,1', 1)] },
    starve: { es: 'Inanición y aging', en: 'Starvation and aging', algorithm: 'PRIO', quantum: 4, preemptive: true, aging: 0, rows: [P('Crop', 0, 3, 3), P('Play1', 0, 6, 1), P('Play2', 5, 6, 1), P('Play3', 11, 6, 1), P('Play4', 17, 6, 1)] },
    queues: { es: 'Colas por prioridad', en: 'Queues by priority', algorithm: 'PQ', quantum: 4, rows: [P('low', 0, 6, 3), P('high', 2, 2, 0)] },
    mfq: { es: 'Cortas contra largas (MFQ)', en: 'Short vs long (MFQ)', algorithm: 'MFQ', quantum: 2, rows: [P('Long', 0, 14, 2), P('Mid', 1, 5, 2), P('Short', 4, 2, 2)] },
    fair: { es: 'Reparto justo (CFS)', en: 'Fair share (CFS)', algorithm: 'CFS', quantum: 1, rows: [P('Heavy', 0, 12, 0), P('Light', 0, 12, 3)] }
  };
  const NAMES = { FCFS: 'FCFS', SJF: 'SJF (non-preemptive)', SRTF: 'SRTF (SJF preemptive)', RR: 'Round Robin', PRIO: 'Priority', PQ: 'Priority Queue', MFQ: 'MFQ', CFS: 'CFS (simplified)' };

  let cpuState = null;
  function loadPreset(id) {
    const p = PRESETS[id];
    return { preset: id, algorithm: p.algorithm, quantum: String(p.quantum), cs: '0', aging: String(p.aging || 0), preemptive: !!p.preemptive, rows: p.rows.map((r) => ({ ...r })), pos: -1, prediction: '', changed: false, loaded: true };
  }
  function cpuRun(s, algorithm) {
    const procs = s.rows.map((r) => ({
      id: r.id.trim(), arrival: intOr(r.arrival), priority: intOr(r.priority),
      bursts: r.bursts.split(',').map(intOr)
    }));
    return M.cpu.simulate(procs, { algorithm: algorithm || s.algorithm, quantum: intOr(s.quantum), contextSwitch: intOr(s.cs), aging: intOr(s.aging), preemptive: s.preemptive });
  }

  function cpuLab(main, preset) {
    if (preset && PRESETS[preset] && (!cpuState || cpuState.route !== preset)) { cpuState = loadPreset(preset); cpuState.route = preset; }
    if (!cpuState) cpuState = loadPreset('convoy');
    const s = cpuState, lang = M.lang();
    main.innerHTML = `<section class="page wide"><h1>${t('labCpu')}</h1>
      <details class="panel"><summary>${t('rules')}</summary><p>${t('rulesCpu')}</p></details>
      <div class="panel controls">
        ${field(t('presets'), `<select id="preset">${Object.entries(PRESETS).map(([k, v]) => `<option value="${k}" ${k === s.preset ? 'selected' : ''}>${v[lang]}</option>`).join('')}</select>`)}
        ${field(t('algorithm'), `<select id="algorithm">${M.cpu.ALGORITHMS.map((a) => `<option value="${a}" ${a === s.algorithm ? 'selected' : ''}>${NAMES[a]}</option>`).join('')}</select>`)}
        ${field(t('quantum'), `<input id="quantum" inputmode="numeric" value="${esc(s.quantum)}">`)}
        ${field(t('cs'), `<input id="cs" inputmode="numeric" value="${esc(s.cs)}">`)}
        ${field(t('aging'), `<input id="aging" inputmode="numeric" value="${esc(s.aging)}">`)}
        <label class="check"><input type="checkbox" id="preemptive" ${s.preemptive ? 'checked' : ''}> ${t('preemptive')} (Priority)</label>
      </div>
      <div class="panel"><div class="scroll"><table class="edit"><thead><tr><th>${t('process')}</th><th>${t('arrival')}</th><th>${t('bursts')}</th><th>${t('prio')}</th><th></th></tr></thead><tbody>
        ${s.rows.map((r, i) => `<tr data-i="${i}">${['id', 'arrival', 'bursts', 'priority'].map((k) => `<td><input data-k="${k}" aria-label="${t(k === 'id' ? 'process' : k === 'priority' ? 'prio' : k)} ${i + 1}" value="${esc(r[k])}" maxlength="${k === 'id' ? 8 : 24}"></td>`).join('')}<td><button class="btn small" data-del="${i}" type="button" aria-label="${t('remove')} ${esc(r.id)}">✕</button></td></tr>`).join('')}
      </tbody></table></div><button class="btn" id="add" type="button">+ ${t('addRow')}</button></div>
      <div id="notice" role="status">${s.loaded ? card('ok', t('presetLoaded', { name: PRESETS[s.preset][lang] }), t('presetLoadedText')) : s.changed ? card('info', t('changed'), '') : ''}</div>
      <div id="sim"></div></section>`;

    const sim = $(main, '#sim');
    let result = null;
    const color = (id) => { const i = s.rows.findIndex((r) => r.id.trim() === id); return COLORS[(i < 0 ? 0 : i) % COLORS.length]; };
    const sym = (id) => SYMBOLS[Math.max(0, s.rows.findIndex((r) => r.id.trim() === id)) % SYMBOLS.length];
    const mob = (id, extra) => `<span class="mob" style="--c:${color(id)}"><i aria-hidden="true">${sym(id)}</i><b>${esc(id)}</b>${extra ? `<small>${extra}</small>` : ''}</span>`;

    function build() {
      stop();
      try { result = cpuRun(s); } catch (e) {
        result = null;
        sim.innerHTML = `<div class="panel bad" role="alert"><b>${t('invalid')}:</b><ul>${(e.details || []).map((d) => `<li>${esc(t('err_' + d.code, d))}</li>`).join('') || `<li>${esc(e.message)}</li>`}</ul></div>`;
        return;
      }
      s.pos = Math.min(s.pos, result.steps.length);
      sim.innerHTML = `<div class="panel">
          ${field(t('predict'), `<input id="prediction" inputmode="decimal" value="${esc(s.prediction)}">`)}
          <div class="row transport"><button class="btn primary big" id="play" type="button">▶ ${t('play')}</button><button class="btn" id="step" type="button">${t('step')} ⏭</button><button class="btn" id="back" type="button">⏮ ${t('stepBack')}</button><button class="btn" id="end" type="button">${t('toEnd')}</button><button class="btn" id="rst" type="button">⟲ ${t('reset')}</button>
          ${field(t('speed'), '<input type="range" id="speed" min="1" max="10" value="6">')}</div>
          <div class="xp thin" aria-hidden="true"><span id="bar" style="width:0"></span></div></div>
        <div class="machine" id="machine"></div><div class="panel" aria-live="polite"><h2>${t('events')}</h2><ul id="log"></ul></div>
        <div class="panel"><h2>${t('gantt')}</h2><div class="scroll"><div class="gantt" id="gantt" role="img" aria-label="${t('gantt')}"></div></div><details><summary>${t('table')}</summary><div id="intervals"></div></details></div>
        <div class="panel" id="metrics"></div>
        <div class="panel"><button class="btn" id="cmp" type="button">${t('compare')}</button><div id="comparison"></div></div>`;
      $(sim, '#prediction').oninput = (e) => { s.prediction = e.target.value; };
      const toMachine = () => flash($(sim, '#machine'), true);
      $(sim, '#step').onclick = () => { stop(); advance(1); toMachine(); };
      $(sim, '#back').onclick = () => { stop(); advance(-1); };
      $(sim, '#end').onclick = () => { stop(); s.pos = result.steps.length; draw(); toMachine(); };
      $(sim, '#rst').onclick = () => { stop(); s.pos = -1; draw(); };
      $(sim, '#play').onclick = () => {
        if (timer) { stop(); draw(); return; }
        if (s.pos >= result.steps.length) s.pos = -1;
        timer = setInterval(() => { advance(1); if (s.pos >= result.steps.length) { stop(); draw(); flash($(sim, '#metrics'), false); } }, 1100 - 100 * Number($(sim, '#speed').value));
        advance(1); toMachine();
      };
      $(sim, '#speed').onchange = () => { if (timer) { stop(); $(sim, '#play').click(); } };
      $(sim, '#cmp').onclick = () => {
        const rows = M.cpu.ALGORITHMS.map((a) => { const r = cpuRun(s, a).metrics; return [NAMES[a], num(r.avgWaiting), num(r.avgResponse), num(r.avgTurnaround), r.switches, r.makespan]; });
        $(sim, '#comparison').innerHTML = table([t('algorithm'), t('waiting'), t('response'), t('turnaround'), t('switches'), t('end')], rows) + `<p class="muted">${t('compareNote')}</p>`;
      };
      draw();
    }
    function predictionCard(real) {
      const p = Number(String(s.prediction).replace(',', '.'));
      if (!String(s.prediction).trim()) return card('info', t('predictNone'), '');
      if (!Number.isFinite(p)) return card('bad', t('predictInvalid'), '');
      const diff = Math.abs(p - real);
      return diff <= 0.5 ? card('ok', t('predictOk'), t('predictCheck', { p: s.prediction, r: num(real) }))
        : card('bad', t('predictBad', { d: num(diff) }), t('predictCheck', { p: s.prediction, r: num(real) }));
    }
    function advance(d) { s.pos = Math.max(-1, Math.min(result.steps.length, s.pos + d)); draw(); }
    function draw() {
      const n = result.steps.length, finished = s.pos >= n;
      const st = s.pos < 0 ? null : result.steps[Math.min(s.pos, n - 1)];
      const levels = result.steps[0].queues.length;
      const qName = (l) => (levels === 1 ? t('ready') : `${t('ready')} Q${l}`);
      const queues = Array.from({ length: levels }, (_, l) => {
        const items = st && !finished ? st.queues[l] : [];
        return `<div class="lane"><h3>${qName(l)}</h3><div class="mobs">${items.map((p) => mob(p.id, s.algorithm === 'CFS' ? 'vr ' + num(p.vruntime) : s.algorithm === 'PRIO' ? 'p' + p.priority : '⏳' + p.remaining)).join('') || `<em>${t('empty')}</em>`}</div></div>`;
      }).join('');
      const cpuBox = !st || finished || st.running === null ? `<em>${t('idle')}</em>` : mob(st.running, st.contextSwitch ? t('switching') : '⏳' + st.remaining);
      $(sim, '#machine').innerHTML = `<div class="clock">${t('time')}: <b>${!st ? '—' : finished ? 't = ' + n : `[${st.t}, ${st.t + 1})`}</b></div>
        <div class="cpu-box ${st && !finished && st.running ? 'on' : ''}"><h3>${t('cpu')}</h3>${cpuBox}</div>
        <div class="lanes">${queues}
        <div class="lane io"><h3>${t('io')}</h3><div class="mobs">${st && !finished ? st.io.map((p) => mob(p.id, '⏳' + p.left)).join('') || `<em>${t('empty')}</em>` : `<em>${t('empty')}</em>`}</div></div>
        <div class="lane done"><h3>${t('done')}</h3><div class="mobs">${(finished ? result.results.map((r) => r.id) : st ? st.done : []).map((id) => mob(id)).join('') || `<em>${t('empty')}</em>`}</div></div></div>`;
      const ev = !st ? [t('ev_start')] : finished ? result.steps[n - 1].events.filter((e) => e.code === 'exit').map((e) => t('ev_exit', e)) : st.events.map((e) => t('ev_' + e.code, e));
      $(sim, '#log').innerHTML = (ev.length ? ev : [t('ev_none')]).map((e) => `<li>${esc(e)}</li>`).join('');
      const shown = finished ? n : s.pos + 1;
      const segs = result.segments.filter((g) => g.start < shown).map((g) => ({ ...g, end: Math.min(g.end, shown) }));
      $(sim, '#gantt').innerHTML = segs.map((g) => {
        const special = g.label === 'IDLE' || g.label === 'CS';
        const name = g.label === 'IDLE' ? t('idle') : g.label === 'CS' ? 'CS' : g.label;
        return `<div class="seg ${special ? 'blank' : ''}" style="--c:${special ? '#8b949e' : color(g.label)};width:${Math.max(30 + name.length * 9, (g.end - g.start) * 24)}px" title="${esc(name)} [${g.start}, ${g.end})"><b>${special ? '' : sym(g.label)} ${esc(name)}</b><small><span>${g.start}</span><span>${g.end}</span></small></div>`;
      }).join('');
      $(sim, '#intervals').innerHTML = table([t('process'), t('start'), t('end')], segs.map((g) => [esc(g.label === 'IDLE' ? t('idle') : g.label), g.start, g.end]));
      const m = result.metrics, box = $(sim, '#metrics');
      if (!finished) box.innerHTML = `<h2>${t('metrics')}</h2><p class="muted">${t('metricsHidden')}</p>`;
      else {
        box.innerHTML = `<h2>${t('metrics')}</h2>${table([t('process'), t('arrival'), 'CPU', t('finish'), t('turnaround'), t('response'), t('waiting')],
          result.results.map((r) => [esc(r.id), r.arrival, r.cpu, r.finish, r.turnaround, r.response, r.waiting]).concat([[`<b>${t('average')}</b>`, '', '', '', `<b>${num(m.avgTurnaround)}</b>`, `<b>${num(m.avgResponse)}</b>`, `<b>${num(m.avgWaiting)}</b>`]]))}
          <p>${t('util')}: <b>${num(100 * m.utilization, 1)} %</b> · ${t('throughput')}: <b>${num(m.throughput, 3)}</b> · ${t('switches')}: <b>${m.switches}</b></p>
          ${predictionCard(m.avgWaiting)}`;
      }
      $(sim, '#play').textContent = timer ? '⏸ ' + t('pause') : finished ? '⟲ ' + t('playAgain') : '▶ ' + t('play');
      $(sim, '#bar').style.width = `${(100 * Math.max(0, finished ? n : s.pos + 1)) / n}%`;
      $(sim, '#back').disabled = s.pos < 0;
      $(sim, '#step').disabled = finished;
    }
    function dirty() { s.pos = -1; s.changed = true; s.loaded = false; $(main, '#notice').innerHTML = card('info', t('changed'), ''); build(); }
    ['algorithm', 'quantum', 'cs', 'aging'].forEach((k) => { $(main, '#' + k).onchange = (e) => { s[k] = e.target.value; dirty(); }; });
    $(main, '#preemptive').onchange = (e) => { s.preemptive = e.target.checked; dirty(); };
    main.querySelectorAll('table.edit input').forEach((inp) => { inp.onchange = () => { s.rows[+inp.closest('tr').dataset.i][inp.dataset.k] = inp.value; dirty(); }; });
    main.querySelectorAll('[data-del]').forEach((b) => { b.onclick = () => { s.rows.splice(+b.dataset.del, 1); s.pos = -1; s.changed = true; s.loaded = false; cpuLab(main); }; });
    $(main, '#add').onclick = () => {
      if (s.rows.length >= M.cpu.LIMITS.processes) return;
      let i = 1; while (s.rows.some((r) => r.id === 'P' + i)) i++;
      s.rows.push(P('P' + i, 0, 3, 1)); s.pos = -1; s.changed = true; s.loaded = false; cpuLab(main);
    };
    // Choosing a scenario loads it at once (there is no separate "load" button to forget).
    $(main, '#preset').onchange = (e) => { stop(); cpuState = loadPreset(e.target.value); cpuState.route = preset; cpuState.loaded = true; cpuLab(main, preset); flash($(main, '#notice'), false); };
    build();
  }

  // ------------------------------------------------------------------ Server lab
  const SRV_PRESETS = {
    calm: { players: '5', mobs: '100', circuits: '2' },
    full: { players: '25', mobs: '900', circuits: '14' },
    redstone: { players: '10', mobs: '300', circuits: '25' },
    limit: { players: '60', mobs: '3000', circuits: '30' }
  };
  let srvState = { preset: 'full', players: '25', mobs: '900', circuits: '14', seed: '7', scheduler: 'PRIORITY', budget: true, runs: 0 };
  let traceCache = null;
  function serverLab(main) {
    if (anim) { cancelAnimationFrame(anim); anim = null; }
    const s = srvState;
    const inputs = [['players', 1, 60], ['mobs', 0, 3000], ['circuits', 0, 30], ['seed', 0, 999999]];
    main.innerHTML = `<section class="page wide"><h1>${t('labServer')}</h1><p>${t('serverNote')}</p>
      <div class="panel"><h2>${t('srvPick')}</h2><div class="row">${Object.keys(SRV_PRESETS).map((k) => `<button class="btn ${k === s.preset ? 'pressed' : ''}" type="button" data-preset="${k}" aria-pressed="${k === s.preset}">${t('srv_' + k)}</button>`).join('')}</div></div>
      <div class="panel controls" id="form" role="group" aria-label="${t('labServer')}">
        ${inputs.map(([k, lo, hi]) => field(`${t(k)} (${lo}–${hi})`, `<input type="number" id="${k}" min="${lo}" max="${hi}" step="1" value="${esc(s[k])}" required>`)).join('')}
        ${field(t('scheduler'), `<select id="scheduler">${['FCFS', 'PRIORITY', 'MFQ'].map((a) => `<option ${a === s.scheduler ? 'selected' : ''}>${a}</option>`).join('')}</select>`)}
        <label class="check"><input type="checkbox" id="budget" ${s.budget ? 'checked' : ''}> ${t('budget')}</label>
        <button class="btn primary big" type="button" id="run">▶ ${t('runServer')}</button></div>
      <div id="out" aria-live="polite">${s.justLoaded ? card('ok', t('presetLoaded', { name: t('srv_' + s.preset) }), t('srvPress')) : card('info', t('srvPress'), '')}</div>
      <details class="panel"><summary>${t('research')}</summary><p>${t('researchNote')} ${t('circuitsNone')}</p>
        ${field(t('scenario'), `<select id="scen">${['heavy', 'medium', 'light', 'explorers'].map((x) => `<option>${x}</option>`).join('')}</select>`)}<div id="research"></div></details></section>`;
    const research = () => {
      const sc = $(main, '#scen').value;
      const cell = (v) => `<b>${num(v.mean, 1)}</b> <small>[${num(v.min, 1)} – ${num(v.max, 1)}]</small>`;
      $(main, '#research').innerHTML = table([t('scheduler'), t('budget'), t('tps'), t('playerP99'), t('redP99'), t('chunkP99'), t('skipped')],
        M.results.filter((r) => r.scenario === sc).sort((a, b) => a.budget - b.budget).map((r) => [r.scheduler, r.budget ? t('yes') : t('no'), cell(r.tps), cell(r.player_p99), cell(r.redstone_p99), cell(r.chunktick_p99), cell(r.entity_skip)]));
    };
    $(main, '#scen').onchange = research; research();

    // Plain-language reading of the two runs, built only from the numbers.
    function explain(a, b) {
      const out = [];
      if (a.tps >= 19.95) out.push(t('exNoLag'));
      else if (b.tps >= 19.95) out.push(t('exBudget', { a: num(a.tps, 1), d: num(b.skipPct.ENTITY, 1) }));
      else out.push(t('exSameTps', { a: num(a.tps, 1) }));
      const pa = a.latency.PLAYER.p99, pb = b.latency.PLAYER.p99;
      if (pb < pa * 0.8) out.push(t('exPlayerBetter', { a: num(pa, 1), b: num(pb, 1) }));
      else if (pb > pa * 1.2) out.push(t('exPlayerWorse', { a: num(pa, 1), b: num(pb, 1) }));
      const ca = a.latency.CHUNK_TICK.p99, cb = b.latency.CHUNK_TICK.p99, ra = a.latency.REDSTONE.p99, rb = b.latency.REDSTONE.p99;
      if (cb > ca * 1.2) out.push(t('exBlocksPay', { a: num(ca, 1), b: num(cb, 1) }));
      if (rb > ra * 1.2) out.push(t('exRedPay', { a: num(ra, 1), b: num(rb, 1) }));
      if (s.scheduler === 'FCFS' && !s.budget) out.push(t('exSame'));
      return out;
    }
    // The button reacts at once ("Simulating…"); the work starts after the browser has painted that.
    const go = () => {
      if (anim) { cancelAnimationFrame(anim); anim = null; }
      const btn = $(main, '#run');
      btn.disabled = true; btn.textContent = '⏳ ' + t('simulating');
      $(main, '#out').insertAdjacentHTML('afterbegin', `<div id="srvbusy">${card('info', t('simulating'), '')}</div>`);
      setTimeout(() => { try { compute(); } finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = '▶ ' + t('runServer'); } } }, 30);
    };
    const compute = () => {
      const w = { ticks: 300 };
      for (const [k] of inputs) w[k] = Number(s[k]);
      // Same values as last time → reuse the same workload instead of generating it again.
      const key = JSON.stringify(w);
      if (!traceCache || traceCache.key !== key) traceCache = { key, trace: M.server.workload(w) };
      const trace = traceCache.trace;
      const a = M.server.run(trace, { scheduler: 'FCFS', budget: false, warmup: 60 });
      const b = M.server.run(trace, { scheduler: s.scheduler, budget: s.budget, warmup: 60 });
      s.runs++; s.justLoaded = false;
      const max = Math.max(60, ...a.timeline, ...b.timeline);
      const y50 = 120 - (50 / max) * 115;
      const chart = (id, title) => `<figure><figcaption>${title} · <span id="${id}-t">tick 0</span></figcaption><svg id="${id}" viewBox="0 0 600 120" preserveAspectRatio="none" role="img" aria-label="${title}">
        <line x1="0" x2="600" y1="${y50}" y2="${y50}" stroke="currentColor" stroke-dasharray="6 4"/></svg></figure>`;
      const after = `${t('after')}: ${s.scheduler}${s.budget ? ' + ' + t('budget') : ''}`;
      // Who waits? One pair of bars per kind of task; the improvement shows up here even when TPS do not change.
      const kinds = [['PLAYER', 'kPlayer'], ['REDSTONE', 'kRed'], ['CHUNK_TICK', 'kBlocks']];
      const lmax = Math.max(...kinds.flatMap(([k]) => [a.latency[k].p99, b.latency[k].p99]), 1);
      const bar = (v, cls) => `<div class="hbar ${cls}"><span style="width:${Math.max(1.5, (100 * Math.sqrt(v)) / Math.sqrt(lmax))}%"></span><b>${num(v, 1)} ms</b></div>`;
      const delta = (va, vb, lowerIsBetter, unit, d = 1) => {
        const better = lowerIsBetter ? vb < va - 1e-9 : vb > va + 1e-9, worse = lowerIsBetter ? vb > va + 1e-9 : vb < va - 1e-9;
        return `<div class="kpi ${better ? 'up' : worse ? 'down' : ''}"><small>${t('before')}</small><span>${num(va, d)}${unit}</span><i aria-hidden="true">→</i><span><b>${num(vb, d)}${unit}</b></span><em>${better ? t('better') : worse ? t('worse') : t('equal')}</em></div>`;
      };
      const rows = [['tps', (r) => r.tps], ['msptAvg', (r) => r.msptAvg], ['msptP99', (r) => r.msptP99], ['playerP99', (r) => r.latency.PLAYER.p99], ['redP99', (r) => r.latency.REDSTONE.p99], ['chunkP99', (r) => r.latency.CHUNK_TICK.p99], ['skipped', (r) => r.skipPct.ENTITY]];
      $(main, '#out').innerHTML = `<div class="panel" id="srvres"><h2>${t('srvRun', { n: s.runs })}: ${esc(s.players)} ${t('players').toLowerCase()} · ${esc(s.mobs)} ${t('mobs').toLowerCase()} · ${esc(s.circuits)} ${t('circuits').toLowerCase()} → ${after}</h2>
        <div class="kpis"><div><h3>${t('tps')}</h3>${delta(a.tps, b.tps, false, '')}</div><div><h3>${t('playerP99')}</h3>${delta(a.latency.PLAYER.p99, b.latency.PLAYER.p99, true, ' ms')}</div><div><h3>${t('skipped')}</h3>${delta(a.skipPct.ENTITY, b.skipPct.ENTITY, true, ' %')}</div></div>
        <ul class="explain">${explain(a, b).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
        <h3>${t('tickChart')}</h3>${chart('ca', t('before'))}${chart('cb', after)}
        <h3>${t('whoWaits')}</h3><p class="muted">${t('whoWaitsNote')}</p>
        <div class="who">${kinds.map(([k, label]) => `<div class="who-row"><span>${t(label)}</span><div>${bar(a.latency[k].p99, 'before')}${bar(b.latency[k].p99, 'after')}</div></div>`).join('')}</div>
        <p class="legend"><span class="sw before"></span> ${t('before')} &nbsp; <span class="sw after"></span> ${esc(after)}</p>
        <details><summary>${t('resultsTable')}</summary>${table([t('metrics'), t('before'), after], rows.map(([k, f]) => [t(k), num(f(a), 1), `<b>${num(f(b), 1)}</b>`]))}</details></div>`;
      // Replay the ticks as if the server were running: both charts fill tick by tick.
      const svgA = $(main, '#ca'), svgB = $(main, '#cb'), ns = 'http://www.w3.org/2000/svg';
      const draw = (svg, v, i) => { const r = document.createElementNS(ns, 'rect'); r.setAttribute('x', i * 2); r.setAttribute('y', 120 - (v / max) * 115); r.setAttribute('width', 1.6); r.setAttribute('height', (v / max) * 115); r.setAttribute('fill', v > 50.001 ? '#d64550' : '#3f9e52'); svg.insertBefore(r, svg.lastElementChild); };
      const n = a.timeline.length; let i = 0; const t0 = performance.now(), total = reduced() ? 0 : 1600;
      const stepAnim = (now) => {
        if (!svgA.isConnected) { anim = null; return; } // the page was redrawn
        const upto = total ? Math.min(n, Math.ceil(((now - t0) / total) * n)) : n;
        for (; i < upto; i++) { draw(svgA, a.timeline[i], i); draw(svgB, b.timeline[i], i); }
        $(main, '#ca-t').textContent = `tick ${i}/${n}`; $(main, '#cb-t').textContent = `tick ${i}/${n}`;
        anim = i < n ? requestAnimationFrame(stepAnim) : null;
      };
      anim = requestAnimationFrame(stepAnim);
      flash($(main, '#srvres'), true);
    };
    const read = () => { inputs.forEach(([k]) => { s[k] = $(main, '#' + k).value; }); s.scheduler = $(main, '#scheduler').value; s.budget = $(main, '#budget').checked; };
    // Each field must be a whole number inside its range; otherwise we say which one and run nothing.
    const valid = () => {
      for (const [k, lo, hi] of inputs) {
        const v = intOr(String(s[k])), el = $(main, '#' + k);
        const bad = !(v >= lo && v <= hi);
        el.classList.toggle('invalid', bad); el.setAttribute('aria-invalid', String(bad));
        if (bad) { $(main, '#out').innerHTML = card('bad', t('srvInvalid', { name: t(k), lo, hi }), ''); el.focus(); return false; }
      }
      return true;
    };
    wireRun(main, () => { read(); if (valid()) go(); });
    // Changing a value never runs the simulation: it only greys out the old result until "Simulate" is pressed.
    const stale = () => {
      read(); s.justLoaded = false;
      if (anim) { cancelAnimationFrame(anim); anim = null; }
      const old = $(main, '#srvres');
      if (old) old.classList.add('stale');
      const n = $(main, '#srvstale');
      if (n) n.remove();
      $(main, '#out').insertAdjacentHTML('afterbegin', `<div id="srvstale">${card('info', old ? t('srvStale') : t('srvPress'), '')}</div>`);
      if (!old) $(main, '#out').querySelectorAll(':scope > .result').forEach((x) => x.remove());
    };
    ['scheduler', 'budget'].forEach((k) => { $(main, '#' + k).onchange = stale; });
    inputs.forEach(([k]) => { $(main, '#' + k).oninput = () => { s.preset = ''; main.querySelectorAll('[data-preset]').forEach((x) => { x.classList.remove('pressed'); x.setAttribute('aria-pressed', 'false'); }); stale(); }; });
    main.querySelectorAll('[data-preset]').forEach((btn) => { btn.onclick = () => { Object.assign(s, SRV_PRESETS[btn.dataset.preset], { preset: btn.dataset.preset, justLoaded: true }); serverLab(main); }; });
  }

  // ------------------------------------------------------------------ Memory lab
  const MEM_PRESETS = {
    diverge: { total: '1700', text: 'A 0 10 500\nx 0 90 100\nB 0 10 300\ny 0 90 100\nC 0 10 600\nz 0 90 100\nE 20 90 250\nF 30 90 550' },
    holes: { total: '550', text: 'a 0 5 100\nx 0 20 100\nb 0 6 150\ny 0 20 100\nbig 8 20 200\nz 9 20 120' },
    uros: { total: '2048', text: 'P0 0 15 300\nP1 10 25 500\nP2 16 35 200\nP3 20 30 150\nP4 25 37 400\nP5 28 40 700\nP6 30 41 200' }
  };
  let memState = null;
  function parseEvents(s) {
    const total = intOr(s.total);
    const lines = s.text.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!(total >= 64 && total <= 100000) || !lines.length || lines.length > 20) return null;
    const names = new Set(), events = [];
    for (const l of lines) {
      const p = l.split(/\s+/);
      const [name, a, b, size] = [p[0], intOr(p[1]), intOr(p[2]), intOr(p[3])];
      if (p.length !== 4 || names.has(name) || name.length > 8 || !(a >= 0) || !(b > a) || !(size > 0)) return null;
      names.add(name);
      events.push({ t: a, op: 'alloc', name, size }, { t: b, op: 'free', name, size });
    }
    return { total, events };
  }
  const POLICY_NAMES = { first: 'First Fit', best: 'Best Fit', worst: 'Worst Fit', segregated: 'Segregated Fit' };
  function strip(total, blocks, names) {
    const parts = [];
    let at = 0;
    blocks.slice().sort((a, b) => a.base - b.base).forEach((b) => {
      if (b.base > at) parts.push({ base: at, size: b.base - at });
      parts.push(b); at = b.base + b.size;
    });
    if (at < total) parts.push({ base: at, size: total - at });
    return `<div class="strip">${parts.map((p) => {
      const i = p.name ? names.indexOf(p.name) : -1;
      return `<div class="region ${p.name ? '' : 'hole'}" style="--c:${COLORS[Math.max(i, 0) % COLORS.length]};flex-grow:${p.size}" title="${esc(p.name || t('free'))} [${p.base}, ${p.base + p.size})"><b>${esc(p.name || t('free'))}</b><small>${p.size}</small></div>`;
    }).join('')}</div>`;
  }
  const $label = (k) => ({ diverge: 'First ≠ Best ≠ Worst', holes: t('external'), uros: 'UR-OS (2 KiB)' }[k] || k);
  function memoryLab(main, preset) {
    if (preset && MEM_PRESETS[preset] && (!memState || memState.route !== preset)) memState = { ...MEM_PRESETS[preset], preset, policy: 'first', pos: 0, route: preset, manual: null, loaded: true };
    if (!memState) memState = { ...MEM_PRESETS.diverge, preset: 'diverge', policy: 'first', pos: 0, manual: null, loaded: true };
    const s = memState;
    main.innerHTML = `<section class="page wide"><h1>${t('labMemory')}</h1>
      <div class="panel controls">
        ${field(t('presets'), `<select id="preset"><option value="">${t('custom')}</option>${[['diverge', 'First ≠ Best ≠ Worst'], ['holes', t('external')], ['uros', 'UR-OS (2 KiB)']].map(([k, n]) => `<option value="${k}" ${k === s.preset ? 'selected' : ''}>${n}</option>`).join('')}</select>`)}
        ${field(t('policy'), `<select id="policy">${M.memory.POLICIES.map((p) => `<option value="${p}" ${p === s.policy ? 'selected' : ''}>${POLICY_NAMES[p]}</option>`).join('')}</select>`)}
        ${field(t('totalMem'), `<input id="total" inputmode="numeric" value="${esc(s.total)}">`)}
        ${field(t('events2'), `<textarea id="text" rows="8" spellcheck="false">${esc(s.text)}</textarea>`)}
      </div><div id="notice" role="status">${s.loaded && s.preset ? card('ok', t('presetLoaded', { name: $label(s.preset) }), t('memLoadedText')) : ''}</div><div id="sim"></div></section>`;
    const sim = $(main, '#sim');
    function draw() {
      const parsed = parseEvents(s);
      if (!parsed) { sim.innerHTML = `<p class="panel bad" role="alert">${t('memErr')}</p>`; return; }
      const runs = {};
      M.memory.POLICIES.forEach((p) => { runs[p] = M.memory.runScenario(parsed.total, p, parsed.events); });
      const hist = runs[s.policy].history;
      s.pos = Math.max(0, Math.min(s.pos, hist.length));
      const names = s.text.split('\n').map((l) => l.trim().split(/\s+/)[0]).filter(Boolean);
      const at = (p) => (s.pos === 0 ? { blocks: [], stats: M.memory.stats(M.memory.createMemory(parsed.total, p)) } : runs[p].history[s.pos - 1]);
      let cur = at(s.policy), message = t('ev_start'), moved = null;
      if (s.pos > 0) {
        const h = hist[s.pos - 1], r = h.result, d = { name: h.event.name, ...r };
        const key = r.ok ? (h.event.op === 'alloc' ? 'loaded' : 'released') : r.reason === 'external' ? 'failExternal' : r.reason === 'neverLoaded' ? 'failNever' : 'failCapacity';
        message = `t=${h.event.t}: ${t(key, d)}`;
      }
      if (s.manual && s.manual.pos === s.pos && s.manual.policy === s.policy) { cur = s.manual.view; moved = s.manual.moved; message = t('compacted', { n: moved }); }
      const st = cur.stats;
      sim.innerHTML = `<div class="panel" id="memres"><div class="row transport"><button class="btn primary big" id="play" type="button">${timer ? '⏸ ' + t('pause') : s.pos >= hist.length ? '⟲ ' + t('playAgain') : '▶ ' + t('play')}</button><button class="btn" id="step" type="button" ${s.pos >= hist.length ? 'disabled' : ''}>${t('step')} ⏭</button><button class="btn" id="back" type="button" ${s.pos === 0 ? 'disabled' : ''}>⏮ ${t('stepBack')}</button><button class="btn" id="end" type="button">${t('toEnd')}</button><button class="btn" id="rst" type="button">⟲ ${t('reset')}</button><button class="btn" id="compact" type="button">${t('compact')}</button><b>${s.pos} / ${hist.length}</b></div>
        <div class="xp thin" aria-hidden="true"><span style="width:${hist.length ? (100 * s.pos) / hist.length : 0}%"></span></div>
        ${card(s.pos > 0 && !hist[s.pos - 1].result.ok && !moved ? 'bad' : s.pos > 0 ? 'ok' : 'info', esc(message), '')}<h2>${t('memStrip')} · ${POLICY_NAMES[s.policy]}</h2>${strip(parsed.total, cur.blocks, names)}
        <p>${t('freeTotal')}: <b>${st.free}</b> · ${t('largest')}: <b>${st.largest}</b> · ${t('holes')}: <b>${st.holes}</b> · ${t('external')}: <b>${st.external}</b> (${num(st.externalPct, 1)} %)</p>
        <details><summary>${t('table')}</summary>${table([t('name'), t('base'), t('end')], cur.blocks.map((b) => [esc(b.name), b.base, b.base + b.size - 1]))}</details></div>
        <div class="panel"><h2>${t('compareFit')}</h2>${M.memory.POLICIES.map((p) => {
          const v = at(p); const lost = runs[p].history.slice(0, s.pos).filter((h) => h.event.op === 'alloc' && !h.result.ok).map((h) => h.event.name);
          return `<h3>${POLICY_NAMES[p]}</h3>${strip(parsed.total, v.blocks, names)}<p class="muted">${t('external')}: ${v.stats.external} · ${t('failed')}: ${lost.length ? esc(lost.join(', ')) : '—'}</p>`;
        }).join('')}</div>`;
      $(sim, '#step').onclick = () => { stop(); s.pos++; s.manual = null; draw(); };
      $(sim, '#back').onclick = () => { stop(); s.pos--; s.manual = null; draw(); };
      $(sim, '#end').onclick = () => { stop(); s.pos = hist.length; s.manual = null; draw(); };
      $(sim, '#rst').onclick = () => { stop(); s.pos = 0; s.manual = null; draw(); };
      $(sim, '#play').onclick = () => {
        if (timer) { stop(); draw(); return; }
        if (s.pos >= hist.length) s.pos = 0;
        s.manual = null;
        timer = setInterval(() => { s.pos++; if (s.pos >= hist.length) stop(); draw(); }, reduced() ? 1400 : 900);
        s.pos++; draw(); flash($(sim, '#memres'), true);
      };
      $(sim, '#compact').onclick = () => {
        // A what-if on the current picture: the scripted history is not altered.
        const mem = { total: parsed.total, policy: s.policy, blocks: cur.blocks.map((b) => ({ ...b })), holes: [] };
        const n = M.memory.compact(mem);
        s.manual = { pos: s.pos, policy: s.policy, moved: n, view: { blocks: mem.blocks, stats: M.memory.stats(mem) } };
        draw();
      };
    }
    $(main, '#policy').onchange = (e) => { s.policy = e.target.value; draw(); flash($(sim, '#memres'), false); };
    ['total', 'text'].forEach((k) => { $(main, '#' + k).onchange = (e) => { stop(); s[k] = e.target.value; s.pos = 0; s.manual = null; s.preset = ''; s.loaded = false; $(main, '#preset').value = ''; $(main, '#notice').innerHTML = card('info', t('changed'), ''); draw(); }; });
    $(main, '#preset').onchange = (e) => { stop(); if (!e.target.value) return; Object.assign(s, MEM_PRESETS[e.target.value], { preset: e.target.value, pos: 0, manual: null, loaded: true }); memoryLab(main, preset); flash($(main, '#notice'), false); };
    draw();
  }

  // ------------------------------------------------------------------ Paging lab
  const PAGE_EX = {
    ok: { pageSize: '64', frames: '16', busy: '0,1,3,4,8', size: '300', logical: '130' },
    edge: { pageSize: '64', frames: '16', busy: '0,1,3,4,8', size: '300', logical: '299' },
    out: { pageSize: '64', frames: '16', busy: '0,1,3,4,8', size: '300', logical: '310' },
    full: { pageSize: '64', frames: '8', busy: '0,1,2,3,4,5', size: '300', logical: '10' }
  };
  let pageState = { ...PAGE_EX.ok, guess: '', ex: 'ok' };
  function pagingLab(main) {
    const s = pageState;
    const keys = ['pageSize', 'frames', 'busy', 'size', 'logical'];
    main.innerHTML = `<section class="page wide"><h1>${t('labPaging')}</h1>
      <div class="panel"><h2>${t('tryExample')}</h2><div class="row">${Object.keys(PAGE_EX).map((k) => `<button class="btn ${k === s.ex ? 'pressed' : ''}" type="button" data-ex="${k}">${t('pg_' + k)}</button>`).join('')}</div></div>
      <div class="panel controls" id="form" role="group" aria-label="${t('labPaging')}">
      ${[['pageSize', 'pageSize'], ['frames', 'frames'], ['busy', 'busyFrames'], ['size', 'procSize'], ['logical', 'logical']].map(([k, label]) => field(t(label), `<input id="${k}" value="${esc(s[k])}">`)).join('')}
      ${field(t('yourAnswerPhys'), `<input id="guess" inputmode="numeric" value="${esc(s.guess)}" placeholder="?">`)}
      <button class="btn primary big" type="button" id="run">▶ ${t('translate')}</button></div><div id="out" aria-live="polite"></div></section>`;
    const out = $(main, '#out');
    function draw(checking) {
      const P_ = intOr(s.pageSize), F = intOr(s.frames), size = intOr(s.size), L = intOr(s.logical);
      const busy = s.busy.trim() ? s.busy.split(',').map(intOr) : [];
      if (!(P_ >= 4 && P_ <= 4096 && (P_ & (P_ - 1)) === 0) || !(F >= 1 && F <= 64) || !(size >= 1 && size <= 1e6) || !(L >= 0) || busy.some((b) => !(b >= 0 && b < F))) {
        out.innerHTML = card('bad', t('pageErr'), ''); return;
      }
      const free = []; for (let i = 0; i < F; i++) if (!busy.includes(i)) free.push(i);
      const proc = M.memory.pageProcess(size, P_, free);
      if (!proc.ok) { out.innerHTML = card('bad', t('noFrames', proc), ''); return; }
      const tr = M.memory.translatePage(L, P_, proc.table, size);
      const frames = Array.from({ length: F }, (_, f) => {
        const pg = proc.table.indexOf(f);
        const hit = tr.ok && tr.frame === f;
        return `<div class="frame ${busy.includes(f) ? 'used' : pg >= 0 ? 'mine' : ''} ${hit ? 'hit' : ''}"><small>${t('frame')} ${f}</small><b>${busy.includes(f) ? '▨' : pg >= 0 ? t('page') + ' ' + pg : '·'}</b></div>`;
      }).join('');
      let verdict = '';
      if (checking && s.guess.trim()) {
        const g = s.guess.trim().toLowerCase();
        const saidError = ['error', 'excepcion', 'excepción', 'exception', 'x'].includes(g);
        const right = tr.ok ? intOr(g) === tr.physical : saidError;
        verdict = right ? card('ok', t('guessOk'), '') : card('bad', t('guessBad'), tr.ok ? t('guessWas', { v: tr.physical }) : t('guessErr'));
      }
      out.innerHTML = `${verdict}<div class="panel" id="pgres">${tr.ok ? card('ok', `${t('physical')}: ${tr.physical}`, '') + `<p class="math">${t('page')} = ${L} div ${P_} = <b>${tr.page}</b><br>${t('offset')} = ${L} mod ${P_} = <b>${tr.offset}</b><br>${t('frame')} = ${t('pageTable')}[${tr.page}] = <b>${tr.frame}</b><br>${t('physical')} = ${tr.frame} × ${P_} + ${tr.offset} = <b>${tr.physical}</b></p>` : card('bad', t('badAddress'), '')}
        <p>${t('internal')}: ${proc.pages} × ${P_} − ${size} = <b>${proc.internal}</b></p></div>
        <div class="panel"><h2>${t('frames')}</h2><div class="frames">${frames}</div></div>
