:root { --ink: #1d2127; --paper: #f4f1e8; --panel: #fffdf6; --stone: #c6c6c6; --stone-d: #555a60; --accent: #2e7d32; --warn: #b3261e; --link: #14558f; --pixel: 'VT323', ui-monospace, monospace; --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: auto; }
body { margin: 0; font-family: var(--body); font-size: 17px; line-height: 1.6; color: var(--ink); background: #3b2a1d var(--tex-dirt); background-size: 64px; image-rendering: pixelated; }
h1, h2, h3, .btn, .brand, nav.top a, .langs button, summary, legend, .badge, .clock, figcaption { font-family: var(--pixel); font-weight: 400; font-variant-ligatures: none; letter-spacing: .01em; }
h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); line-height: 1.15; margin: .3em 0 .5em; }
h2 { font-size: 1.35rem; margin: 1.1em 0 .4em; }
h3 { font-size: 1.05rem; margin: .6em 0 .25em; }
a { color: var(--link); }
:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; z-index: 50; background: #fff; padding: 8px 12px; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 16px; background: #26221f; color: #fff; border-bottom: 6px solid #67a94a; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-size: 1.35rem; }
.brand small { color: #ffd75e; font-size: .85rem; }
nav.top { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
nav.top a { color: #f1f1f1; text-decoration: none; padding: 4px 10px; border: 2px solid transparent; }
nav.top a:hover, nav.top a[aria-current] { background: #57514c; border-color: #fff #1b1816 #1b1816 #fff; }
.langs button { cursor: pointer; background: var(--stone); border: 3px solid; border-color: #fff var(--stone-d) var(--stone-d) #fff; padding: 3px 10px; font-weight: 700; }
.langs button[aria-pressed=true] { background: #ffd75e; border-color: var(--stone-d) #fff #fff var(--stone-d); }
main { min-height: 60vh; outline: none; }
footer { color: #fff; text-align: center; font-size: .8rem; padding: 18px 16px 26px; text-shadow: 1px 1px #000; }
footer p { margin: 4px 0; }

.page { max-width: 960px; margin: 22px auto; padding: 14px clamp(14px, 3vw, 34px) 28px; background: var(--paper); border: 4px solid; border-color: #fff #6d6256 #6d6256 #fff; box-shadow: 0 0 0 3px #17120d; }
.page.wide { max-width: 1180px; }
.panel { background: var(--panel); border: 3px solid; border-color: #fff #9d9484 #9d9484 #fff; box-shadow: 0 0 0 2px #4a4238; padding: 10px 16px; margin: 14px 0; min-width: 0; }
.btn { display: inline-block; cursor: pointer; font-size: 1.02rem; line-height: 1.3; color: var(--ink); text-decoration: none; background: var(--stone); border: 3px solid; border-color: #fff var(--stone-d) var(--stone-d) #fff; box-shadow: 0 0 0 2px #1d1d1d; padding: 7px 15px; margin: 3px; }
.btn:hover:not(:disabled) { background: #d9dde8; }
.btn:active:not(:disabled) { border-color: var(--stone-d) #fff #fff var(--stone-d); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: #55b146; color: #0c1f08; }
.btn.primary:hover:not(:disabled) { background: #69c75a; }
.btn.danger { background: #e8a49e; }
.btn.small { font-size: .85rem; padding: 3px 9px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row.between { justify-content: space-between; margin-top: 18px; }
.muted { color: #5d584f; font-size: .92rem; }
.info, .ok, .bad { padding: 6px 12px; border-left: 6px solid; }
.info { background: #e3eefb; border-color: #2563a8; }
.ok { background: #e0f2da; border-color: var(--accent); }
.bad { background: #fbe3e1; border-color: var(--warn); }
.info:empty, #feedback:empty { display: none; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: .93rem; background: #fffefa; }
th, td { border: 1px solid #a99f8c; padding: 5px 9px; text-align: left; vertical-align: top; }
th { background: #e4dccb; }
pre { background: #1f252d; color: #e7f0ea; padding: 12px 14px; overflow-x: auto; border: 3px solid #0d1013; font-size: .88rem; line-height: 1.5; }
code { font-family: ui-monospace, Consolas, monospace; }
.math, .flow { font-family: ui-monospace, Consolas, monospace; background: #f0ead9; padding: 8px 12px; overflow-wrap: anywhere; }

.cube { display: inline-block; width: 46px; height: 46px; background-size: 100% 100%; image-rendering: pixelated; box-shadow: inset -6px -6px 0 rgba(0,0,0,.25), inset 4px 4px 0 rgba(255,255,255,.18); flex: none; }
.cube.small { width: 28px; height: 28px; vertical-align: middle; }
.cube.tiny { width: 28px; height: 28px; }
.tex-grass { background-image: var(--tex-grassSide); }
.tex-lamp { background-image: var(--tex-lamp); }
.tex-stone { background-image: var(--tex-stone); }
.tex-circuit { background-image: var(--tex-circuit); }
.tex-plank { background-image: var(--tex-plank); }
.tex-brick { background: repeating-linear-gradient(#97473a 0 8px, #d8cdc1 8px 10px); }

.world-wrap { position: relative; height: min(74vh, 680px); min-height: 440px; background: linear-gradient(#8ccdf4, #cdeafd 60%, #67a94a 60%); overflow: hidden; }
#world { position: absolute; inset: 0; outline: none; }
#world:focus-visible { box-shadow: inset 0 0 0 4px #ffb000; }
#world canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.hero { position: absolute; z-index: 2; left: clamp(10px, 4vw, 48px); top: 24px; max-width: 520px; background: rgba(255,253,246,.94); }
.hero h1 { margin-top: 0; font-size: clamp(1.45rem, 3.4vw, 2.2rem); }
.hero p { margin: .4em 0; }
.hero .kicker { font-family: var(--pixel); color: var(--accent); font-weight: 700; }
.hero.hidden { display: none; }
.world-tools { position: absolute; right: 8px; top: 8px; z-index: 3; }
.world-prompt { position: absolute; z-index: 3; left: 50%; bottom: 78px; transform: translateX(-50%); background: rgba(20,18,16,.85); color: #fff; font-family: var(--pixel); padding: 6px 12px; white-space: nowrap; border: 2px solid #ffd75e; }
.hotbar { position: absolute; z-index: 3; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; background: rgba(30,30,30,.8); padding: 4px; border: 3px solid #111; max-width: 100%; }
.hotbar button { position: relative; width: 44px; height: 46px; padding: 0; display: grid; place-items: center; cursor: pointer; background: #77716c; border: 3px solid; border-color: #3a3733 #d9d6d2 #d9d6d2 #3a3733; }
.hotbar button[aria-pressed=true] { outline: 3px solid #fff; z-index: 1; }
.hotbar small { position: absolute; right: 2px; bottom: -2px; color: #fff; font-family: var(--pixel); text-shadow: 1px 1px #000; }
.hotbar .gap { width: 8px; }
.touch { display: none; position: absolute; z-index: 3; left: 10px; bottom: 76px; grid-template-columns: repeat(3, 46px); gap: 4px; }
.touch button { height: 46px; font-size: 1.1rem; background: rgba(255,255,255,.75); border: 2px solid #222; touch-action: none; user-select: none; }
.touch [data-hold=forward] { grid-column: 2; }
.touch [data-hold=left] { grid-column: 1; }
.touch [data-hold=back] { grid-column: 2; }
.touch [data-hold=right] { grid-column: 3; }
.touch [data-hold=jump] { grid-column: 3; grid-row: 1; }
@media (pointer: coarse) { .touch { display: grid; } }
.world-fallback { position: absolute; bottom: 12px; left: 12px; right: 12px; background: #fff; padding: 8px 12px; }
.help { text-align: center; color: #fff; background: #26221f; margin: 0; padding: 6px 12px; font-size: .85rem; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; max-width: 1180px; margin: 0 auto; }
section.page > .cards:only-child { margin-top: 8px; }
.card { display: block; color: var(--ink); text-decoration: none; background: var(--panel); border: 4px solid; border-color: #fff #857b6c #857b6c #fff; box-shadow: 0 0 0 2px #2b241c; padding: 14px 16px; }
.card:hover { transform: translateY(-3px); }
.card h2 { margin: .4em 0 .2em; font-size: 1.15rem; }
.card p { margin: 0; font-size: .93rem; }

.xp { height: 18px; background: #2b2b2b; border: 3px solid #111; }
.xp span { display: block; height: 100%; background: repeating-linear-gradient(90deg, #7ed957 0 14px, #4caf3b 14px 16px); }
.lesson-list { padding-left: 22px; margin: 6px 0; }
.lesson-list a { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 4px 0; }
.badge { font-size: .72rem; padding: 1px 7px; background: #ddd6c8; color: #3b352b; white-space: nowrap; }
.badge.visited { background: #cfe2f7; }
.badge.solved { background: #a8e08f; }
.badge.solvedHelp { background: #ffe08a; }
.lesson-grid { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 18px; max-width: 1240px; margin: 0 auto; padding: 0 14px; align-items: start; }
.lesson-grid .page { margin: 18px 0; width: 100%; }
.side { margin-top: 18px; font-size: .9rem; }
.side .lesson-list a { flex-direction: column; align-items: flex-start; gap: 0; }
@media (max-width: 860px) { .lesson-grid { display: flex; flex-direction: column-reverse; align-items: stretch; } }
.goal { font-size: 1.05rem; }
.sign { background: #c69c62 var(--tex-plank); background-size: 64px; padding: 6px; }
.sign::first-line { font-weight: 600; }
.sign { background-blend-mode: soft-light; border: 4px solid #6b4a26; padding: 10px 14px; }
.note { background: #e7f3dd; border: 3px dashed #4b7d35; padding: 10px 14px; margin: 14px 0; }
.quiz fieldset { border: 0; padding: 0; margin: 0; }
.quiz legend { font-size: 1.08rem; padding: 4px 0 8px; }
.quiz label { display: flex; gap: 8px; align-items: baseline; padding: 5px 6px; cursor: pointer; }
.quiz label:hover { background: #f0ead9; }
.prose table td:first-child { font-weight: 600; }
.glossary dt { font-weight: 700; font-family: var(--pixel); }
.glossary dd { margin: 0; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: .86rem; font-weight: 600; max-width: 100%; }
input, select, textarea { font: inherit; font-size: .95rem; padding: 5px 8px; background: #fff; color: var(--ink); border: 2px solid #5f574a; border-radius: 0; max-width: 100%; }
.controls input:not([type=checkbox]) { width: 150px; }
textarea { font-family: ui-monospace, Consolas, monospace; min-width: min(280px, 100%); }
.check { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
table.edit input { width: 100%; min-width: 70px; }
.transport .field { margin-left: 10px; }

.machine { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; background: #26313a var(--tex-stone); background-blend-mode: multiply; background-size: 64px; padding: 14px; border: 4px solid #111; color: #fff; }
.machine .clock { grid-column: 1 / -1; font-size: 1.2rem; text-shadow: 2px 2px #000; }
.cpu-box { min-height: 160px; display: grid; place-content: center; justify-items: center; background: rgba(0,0,0,.55); border: 6px solid #6d747b; }
.cpu-box.on { border-color: #ffd75e; box-shadow: 0 0 20px #ffc23a; }
.lanes { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lane { background: rgba(0,0,0,.55); border: 2px solid #79828a; padding: 2px 10px 8px; }
.lane h3 { margin: 4px 0; font-size: .95rem; }
.lane.io { border-color: #5db7ff; }
.lane.done { border-color: #7ed957; }
.mobs { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; align-items: center; }
.mob { display: inline-grid; justify-items: center; min-width: 58px; padding: 4px 7px; color: #fff; background: var(--c); border: 3px solid; border-color: rgba(255,255,255,.7) rgba(0,0,0,.55) rgba(0,0,0,.55) rgba(255,255,255,.7); line-height: 1.15; text-shadow: 1px 1px 2px #000; animation: pop .25s ease-out; }
.mob i { font-style: normal; font-size: .75rem; }
.mob small { font-size: .72rem; }
@keyframes pop { from { transform: scale(.7); } to { transform: scale(1); } }
@media (max-width: 620px) { .machine { grid-template-columns: 1fr; } .cpu-box { min-height: 100px; } }
.gantt { display: flex; min-height: 58px; width: max-content; padding-bottom: 4px; }
.seg { background: var(--c); color: #fff; padding: 3px 4px; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid rgba(0,0,0,.5); text-shadow: 1px 1px 2px #000; font-size: .8rem; white-space: nowrap; overflow: hidden; }
.seg.blank { background: repeating-linear-gradient(45deg, #8b949e 0 6px, #a9b1ba 6px 12px); }
.seg small { display: flex; justify-content: space-between; gap: 6px; }
figure { margin: 10px 0; }
figure svg { width: 100%; height: 130px; background: #fffefa; border: 2px solid #8f8677; }

.strip { display: flex; width: 100%; height: 54px; border: 3px solid #17120d; background: #fff; }
.region { flex-basis: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--c); color: #fff; border-right: 2px solid #17120d; text-shadow: 1px 1px 2px #000; font-size: .78rem; line-height: 1.15; }
.region:last-child { border-right: 0; }
.region.hole { background: repeating-linear-gradient(45deg, #eee9dc 0 6px, #ddd6c4 6px 12px); color: #37322a; text-shadow: none; }
.frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
.frame { border: 3px solid #4a4238; padding: 6px; text-align: center; background: #fffefa; }
.frame small { display: block; }
.frame.used { background: #bdb7aa; }
.frame.mine { background: #bfe3ae; }
.frame.hit { background: #ffd75e; outline: 3px solid var(--warn); }

#toasts { position: fixed; right: 14px; top: 14px; z-index: 40; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; gap: 10px; align-items: center; background: #23201d; color: #fff; border: 3px solid #ffd75e; padding: 8px 14px; max-width: 320px; font-family: var(--pixel); animation: pop .25s; }
.toast-icon { font-size: 1.6rem; color: #ffd75e; }

@media (max-width: 640px) {
  .hero { right: 10px; top: 10px; padding: 8px 12px; font-size: .9rem; }
  .world-wrap { min-height: 540px; }
  .hotbar button { width: 34px; height: 40px; }
  .hotbar .cube.tiny { width: 22px; height: 22px; }
  .hotbar .gap { width: 3px; }
  .page { margin: 10px 6px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .card:hover { transform: none; } }
@media print { .topbar, footer, .side, .quiz, .btn { display: none !important; } body { background: #fff; } }
.prose table, .lesson table { display: block; overflow-x: auto; overflow-wrap: anywhere; }
.prose td, .prose th { min-width: 64px; }
@media (max-width: 640px) { .prose table, .lesson table { font-size: .8rem; } .prose td, .prose th { padding: 4px 5px; } }
@media (max-width: 640px) {
  .topbar { gap: 6px; padding: 6px 8px; }
  .topbar .brand { flex: 1; }
  nav.top { order: 3; flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; }
  nav.top a { white-space: nowrap; }
  .world-tools { display: none; }
}
.hero .notice-legal { font-size: .78rem; font-weight: 700; border-top: 2px solid #9d9484; padding-top: 6px; margin-top: 10px; }
footer p:first-child { font-size: .9rem; font-weight: 700; }

/* ---- Result cards: success / failure / info, impossible to miss ---- */
.result { display: flex; gap: 14px; align-items: flex-start; margin: 12px 0; padding: 12px 16px; border: 4px solid; font-size: 1.02rem; box-shadow: 0 0 0 2px #1d1d1d; animation: pop .25s ease-out; }
.result p { margin: 4px 0 0; }
.result b { font-family: var(--pixel); font-size: 1.35rem; font-weight: 400; line-height: 1.15; }
.result-icon { flex: none; display: grid; place-items: center; width: 42px; height: 42px; font-size: 1.6rem; color: #fff; border: 3px solid rgba(0,0,0,.35); }
.result.ok { background: #e0f2da; border-color: #2e7d32; }
.result.ok .result-icon { background: #2e7d32; }
.result.bad { background: #fbe3e1; border-color: var(--warn); }
.result.bad .result-icon { background: var(--warn); }
.result.info { background: #e3eefb; border-color: #2563a8; }
.result.info .result-icon { background: #2563a8; }
.shake { animation: shake .45s; }
@keyframes shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.flash { animation: flash 1s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 6px #ffd75e; } 100% { box-shadow: 0 0 0 2px #4a4238; } }
.quiz label.right { background: #c9ebbd; outline: 3px solid #2e7d32; }
.quiz label.wrong { background: #f7cdc9; outline: 3px solid var(--warn); }
.quiz label.answer { background: #e3eefb; outline: 3px dashed #2563a8; }
.quiz .mark { font-size: 1.7rem; font-weight: 700; line-height: 1; margin-left: 6px; }
.quiz label.right .mark { color: #2e7d32; }
.quiz label.wrong .mark { color: var(--warn); }
.quiz label.answer .mark { color: #2563a8; }
.tally { font-size: .85rem; color: #5b5448; margin: 2px 0 8px; }
.stale { opacity: .45; filter: grayscale(.6); }
.kicker { font-family: var(--pixel); color: var(--accent); margin: 0; }

/* ---- Locked lessons ---- */
.lesson-list li.locked { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; color: #7a7266; }
.side .lesson-list li.locked { flex-direction: column; gap: 0; }
.badge.locked { background: #b9b2a6; color: #2b2620; }
.lesson-list a[aria-current=page] { font-weight: 700; }

/* ---- Lab controls ---- */
.btn.big { font-size: 1.2rem; padding: 9px 20px; }
.btn.pressed { background: #ffd75e; border-color: var(--stone-d) #fff #fff var(--stone-d); }
.xp.thin { height: 10px; border-width: 2px; margin-top: 8px; }
.xp.thin span { transition: width .25s; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.kpis h3 { margin: 0 0 4px; font-size: 1.05rem; }
.kpi { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; padding: 8px 10px; background: #eee9dc; border: 3px solid #9d9484; }
.kpi small { width: 100%; color: #5b5448; }
.kpi span { font-size: 1.15rem; }
.kpi span b { font-size: 1.5rem; }
.kpi em { margin-left: auto; font-style: normal; font-family: var(--pixel); padding: 0 6px; background: #ddd6c8; }
.kpi.up { background: #e0f2da; border-color: #2e7d32; }
.kpi.up em { background: #2e7d32; color: #fff; }
.kpi.down { background: #fbe3e1; border-color: var(--warn); }
.kpi.down em { background: var(--warn); color: #fff; }
.explain { background: #fff8dc; border: 3px dashed #c69c62; padding: 8px 12px 8px 30px; }
.explain li { margin: 3px 0; }
.who-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: center; margin: 8px 0; }
.who-row > span { font-family: var(--pixel); font-size: 1.1rem; }
.hbar { position: relative; height: 22px; margin: 2px 0; background: #ece6d8; }
.hbar span { display: block; height: 100%; transition: width .6s ease-out; }
.hbar b { position: absolute; left: 6px; top: 0; font-size: .82rem; line-height: 22px; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.hbar.before span, .sw.before { background: #d64550; }
.hbar.after span, .sw.after { background: #3f9e52; }
.sw { display: inline-block; width: 14px; height: 14px; vertical-align: middle; border: 2px solid #1d1d1d; }
.legend { font-size: .9rem; }

/* ---- Teachers page ---- */
.teacher-banner { background: #23201d; color: #ffd75e; font-family: var(--pixel); text-align: center; padding: 6px; font-size: 1.1rem; }
@media (prefers-reduced-motion: reduce) { .shake, .flash, .result { animation: none; } }

.controls input.invalid { border-color: var(--warn); outline: 3px solid #f7cdc9; }

</style>

<script>
/*
 * MineOS CPU scheduling engine (teaching model). CC0-1.0.
 * Pure and deterministic: same input => same trace. No DOM access.
 *
 * Conventions (shown to students in the lab):
 *  - Time is an integer; each slice is the half-open interval [t, t+1).
 *  - At instant t: arrivals and finished I/O enter ready FIRST, then the process
 *    whose quantum expired. Ties: main criterion, time it became ready, input order.
 *  - Preemption needs a STRICTLY better candidate.
 *  - Context-switch cost is paid only when the CPU changes to a different process.
 *  - Each I/O request has its own device (no I/O queue).
 *  - Lower priority number = more important.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

  'use strict';

  const ALGORITHMS = ['FCFS', 'SJF', 'SRTF', 'RR', 'PRIO', 'PQ', 'MFQ', 'CFS'];

  const LIMITS = { processes: 10, bursts: 7, burst: 60, arrival: 200, quantum: 50, cs: 5, aging: 100, time: 5000 };

  function isInt(v, lo, hi) { return Number.isInteger(v) && v >= lo && v <= hi; }

  function validate(procs, cfg) {
    const errors = [];
    if (!ALGORITHMS.includes(cfg.algorithm)) errors.push({ code: 'algorithm' });
    if (!isInt(cfg.quantum, 1, LIMITS.quantum)) errors.push({ code: 'quantum', max: LIMITS.quantum });
    if (!isInt(cfg.contextSwitch, 0, LIMITS.cs)) errors.push({ code: 'contextSwitch', max: LIMITS.cs });
    if (!isInt(cfg.aging, 0, LIMITS.aging)) errors.push({ code: 'aging', max: LIMITS.aging });
    if (!Array.isArray(procs) || procs.length < 1 || procs.length > LIMITS.processes) {
      errors.push({ code: 'count', max: LIMITS.processes });
      return errors;
    }
    const seen = new Set();
    procs.forEach((p) => {
      if (!p.id || seen.has(p.id)) errors.push({ code: 'id', id: p.id });
      seen.add(p.id);
      if (!isInt(p.arrival, 0, LIMITS.arrival)) errors.push({ code: 'arrival', id: p.id, max: LIMITS.arrival });
      if (!isInt(p.priority, 0, 9)) errors.push({ code: 'priority', id: p.id });
      const b = p.bursts;
      if (!Array.isArray(b) || b.length % 2 !== 1 || b.length > LIMITS.bursts ||
          !b.every((x) => isInt(x, 1, LIMITS.burst))) errors.push({ code: 'bursts', id: p.id, max: LIMITS.burst });
    });
    return errors;
  }

  function simulate(inputProcs, inputCfg) {
    const cfg = Object.assign({ algorithm: 'FCFS', quantum: 4, contextSwitch: 0, aging: 0, preemptive: false }, inputCfg);
    const errors = validate(inputProcs, cfg);
    if (errors.length) { const e = new Error('invalid input'); e.details = errors; throw e; }

    const algo = cfg.algorithm;
    const levelCount = algo === 'PQ' ? 4 : algo === 'MFQ' ? 3 : 1;
    const procs = inputProcs.map((p, order) => ({
      id: p.id, order, arrival: p.arrival, priority: p.priority, bursts: p.bursts.slice(),
      burstIndex: 0, remaining: p.bursts[0], ioLeft: 0, state: 'NEW',
      level: 0, effPriority: p.priority, readySince: 0, waitedSinceBoost: 0, qUsed: 0, vruntime: 0,
      waiting: 0, firstRun: null, finish: null
    }));
    let ready = [];        // queue in arrival order; levels are filtered views
    let running = null;
    let expired = null;

      id: p.id, arrival: p.arrival, cpu: p.bursts.filter((_, i) => i % 2 === 0).reduce((a, b) => a + b, 0),

      config: cfg, steps, segments: segmentsOf(steps), results,
      metrics: {
        makespan: t, avgWaiting: avg('waiting'), avgTurnaround: avg('turnaround'), avgResponse: avg('response'),

    if (policy === 'best') return fits.reduce((a, b) => (b.size < a.size ? b : a));
    if (policy === 'worst') return fits.reduce((a, b) => (b.size > a.size ? b : a));

    return fits.reduce((a, b) => (sizeClass(b.size) < sizeClass(a.size) ? b : a));
  }

  function allocate(mem, name, size) {
    if (!posInt(size)) return { ok: false, reason: 'size' };
    if (mem.blocks.some((b) => b.name === name)) return { ok: false, reason: 'duplicate' };
    const hole = chooseHole(mem.holes, size, mem.policy);
    if (!hole) {
      return { ok: false, reason: stats(mem).free >= size ? 'external' : 'capacity' };
    }
    const base = hole.base;
    const holeSize = hole.size;
    hole.base += size;
    hole.size -= size;

  }

    const i = mem.blocks.findIndex((b) => b.name === name);

/*
 * MineOS tick-server engine: a JavaScript port of the scheduling part of the Java
 * simulator (sim-core). Every chunk is already in RAM, so there are no page faults
 * (virtual memory is out of scope). Times are integer microseconds. CC0-1.0.

  'use strict';

  const TICK_US = 50000;
  const TYPES = ['PLAYER', 'REDSTONE', 'ENTITY', 'CHUNK_TICK'];
  const PRIORITY_OF = { PLAYER: 0, REDSTONE: 1, ENTITY: 2, CHUNK_TICK: 3 };

  /** Array-backed deque with amortised O(1) operations at both ends. */
  class Deque {
    constructor() { this.front = []; this.back = []; this.head = 0; }
    get size() { return this.front.length + this.back.length - this.head; }
    addLast(x) { this.back.push(x); }
    addFirst(x) { this.front.push(x); }

      return x;
    }

      return null;
    };

      admit(j) { if (j.level < 0) j.level = PRIORITY_OF[j.type]; j.waitTicks = 0; qs[j.level].addLast(j); },
      next, quantum: () => quantumUs,
      preempt(j, full) { if (full) qs[j.level].addLast(j); else qs[j.level].addFirst(j); },
      tickStart() {

      scheduler: o.scheduler, budget: o.budget, timeline, latency, skipPct, generated, skipped,
      msptAvg: ms.mean, msptP95: ms.p95, msptP99: ms.p99, overrunPct: mspt.length ? (100 * overruns) / mspt.length : 0,

    };

  function workload(p) {

      return x < 0.8 ? 20 + Math.floor(r() * 40) : x < 0.95 ? 60 + Math.floor(r() * 90) : 150 + Math.floor(r() * 250);
    });
    const circuits = Array.from({ length: p.circuits }, () => 1200 + Math.floor(r() * 3800));

    for (let t = 0; t < p.ticks; t++) {
      const out = [];
      players.forEach((c, i) => {
        out.push({ key: i, type: 'PLAYER', cost: jitter(c) });
        for (let n = 0; n < 10; n++) out.push({ key: i * 100 + n, type: 'CHUNK_TICK', cost: jitter(35) });
      });
      mobs.forEach((c, i) => out.push({ key: i, type: 'ENTITY', cost: jitter(c) }));
      circuits.forEach((c, i) => out.push({ key: i, type: 'REDSTONE', cost: jitter(c) }));
      for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
      trace.push(out);
    }
    return trace;
  }

  TYPES.forEach((t, i) => { TYPE_INDEX[t] = i; });
  return { TICK_US, TYPES, run, workload };
});

es: { title: '¿Qué es un sistema operativo?', goal: 'Reconocer las tareas del sistema operativo: repartir recursos y protegerlos.',
 story: 'Veinte personas juegan en el mismo mundo. Todas quieren moverse ya, los cultivos deben crecer y las puertas automáticas deben abrirse. Pero el computador es uno solo.',
 body: '<p>Un <b>sistema operativo (SO)</b> es el programa que administra el computador y sirve de intermediario entre las aplicaciones y el <i>hardware</i>. Tiene dos grandes trabajos:</p><ul><li><b>Repartir recursos:</b> tiempo de CPU, memoria, disco y dispositivos.</li><li><b>Proteger:</b> impedir que un programa dañe a otro o al propio sistema.</li></ul><p>El <b>kernel</b> es la parte central del SO: la que siempre está activa y tiene control total del hardware.</p>',
 mc: 'Un servidor de Minecraft no es un sistema operativo, pero enfrenta problemas parecidos: mucho trabajo, poco tiempo y memoria limitada. Por eso sirve como maqueta para estudiar las decisiones de un SO.',
 example: '<p>Clasifiquemos responsabilidades:</p><table><tr><th>Situación</th><th>¿Quién responde?</th></tr><tr><td>Ejecutar una suma</td><td>Hardware (CPU)</td></tr><tr><td>Decidir qué programa usa la CPU ahora</td><td>Sistema operativo</td></tr><tr><td>Dibujar el inventario del juego</td><td>Aplicación</td></tr><tr><td>Impedir que un programa lea la memoria de otro</td><td>SO con ayuda del hardware</td></tr></table>',
 quiz: { q: 'Dos programas quieren usar la CPU al mismo tiempo en un computador de un solo núcleo. ¿Quién decide el turno?', options: ['El programa que pesa más', 'El sistema operativo', 'El monitor'], hint: 'Piensa quién reparte los recursos.', why: 'Repartir el tiempo de CPU es una decisión de administración de recursos del SO.' } },
en: { title: 'What is an operating system?', goal: 'Recognise the two jobs of an operating system: sharing resources and protecting them.',
 story: 'Twenty people play in the same world. Everyone wants to move right now, crops must grow and automatic doors must open. There is only one computer.',
 body: '<p>An <b>operating system (OS)</b> is the program that manages the computer and sits between applications and <i>hardware</i>. It has two big jobs:</p><ul><li><b>Sharing resources:</b> CPU time, memory, disk and devices.</li><li><b>Protection:</b> stopping one program from damaging another one or the system itself.</li></ul><p>The <b>kernel</b> is the core of the OS: it is always active and has full control of the hardware.</p>',
 mc: 'A Minecraft server is not an operating system, but it faces similar problems: lots of work, little time and limited memory. That makes it a good scale model for studying OS decisions.',
 example: '<p>Let us sort some responsibilities:</p><table><tr><th>Situation</th><th>Who is in charge?</th></tr><tr><td>Performing an addition</td><td>Hardware (CPU)</td></tr><tr><td>Deciding which program gets the CPU now</td><td>Operating system</td></tr><tr><td>Drawing the game inventory</td><td>Application</td></tr><tr><td>Stopping a program from reading another one’s memory</td><td>OS helped by hardware</td></tr></table>',
 quiz: { q: 'Two programs want the CPU at the same time on a single-core computer. Who decides the turn?', options: ['The biggest program', 'The operating system', 'The monitor'], hint: 'Think about who shares the resources.', why: 'Sharing CPU time is a resource-management decision of the OS.' } },
answer: 1 },

{ id: 'process', zone: 'village', lab: { route: 'cpu', preset: 'io' },
es: { title: 'Procesos, estados y PCB', goal: 'Distinguir un programa de un proceso y seguir sus cambios de estado.',
 story: 'El archivo del juego está guardado en el disco y no hace nada. Cuando lo abres, empieza a ocupar memoria y a pedir CPU. Si lo abres dos veces, hay dos ejecuciones distintas.',
 body: '<p>Un <b>programa</b> es un archivo con instrucciones: es pasivo. Un <b>proceso</b> es un programa en ejecución: tiene memoria propia (código, datos, <i>heap</i> y <i>stack</i>), un contador de programa y registros.</p><p>Estados: <b>New</b> (se está creando), <b>Ready</b> (listo, esperando CPU), <b>Running</b> (usando la CPU), <b>Waiting</b> (esperando un evento, por ejemplo que termine una operación de entrada/salida o <i>I/O</i>) y <b>Terminated</b> (terminó).</p><p>El SO guarda la ficha de cada proceso en su <b>PCB</b> (<i>Process Control Block</i>): estado, contador de programa, registros, prioridad, memoria y archivos abiertos. Con esa ficha puede pausarlo y reanudarlo.</p><div class="flow">New → Ready → Running → Terminated<br>Running → Ready (le quitan la CPU)<br>Running → Waiting (pide I/O) → Ready (la I/O terminó)</div><p><b>Ojo:</b> de Waiting nunca se pasa directo a Running. Primero hay que volver a la cola de listos.</p>',
 mc: 'En el modelo de MineOS, cada tarea del tick (la acción de un jugador, la actualización de un animal) se trata como un proceso pequeño. Su ficha en el código es la clase Job.',
 example: '<p>Un proceso A usa 2 unidades de CPU, espera 3 de I/O y usa 2 más. Si está solo:</p><table><tr><th>Intervalo</th><th>Estado de A</th></tr><tr><td>[0, 2)</td><td>Running</td></tr><tr><td>[2, 5)</td><td>Waiting (la CPU queda libre)</td></tr><tr><td>[5, 7)</td><td>Running</td></tr><tr><td>t = 7</td><td>Terminated</td></tr></table>',
 quiz: { q: 'La lectura del disco de un proceso acaba de terminar. ¿A qué estado pasa?', options: ['Running', 'Ready', 'Terminated'], hint: 'Que el evento haya ocurrido no significa que la CPU esté libre.', why: 'Vuelve a Ready; el planificador decidirá cuándo ejecutarlo.' } },
en: { title: 'Processes, states and the PCB', goal: 'Tell a program from a process and follow its state changes.',
 story: 'The game file sits on disk doing nothing. When you open it, it starts using memory and asking for CPU. Open it twice and you get two separate executions.',
 body: '<p>A <b>program</b> is a file with instructions: it is passive. A <b>process</b> is a program in execution: it has its own memory (code, data, <i>heap</i> and <i>stack</i>), a program counter and registers.</p><p>States: <b>New</b> (being created), <b>Ready</b> (waiting for the CPU), <b>Running</b> (using the CPU), <b>Waiting</b> (waiting for an event, such as the end of an input/output or <i>I/O</i> operation) and <b>Terminated</b> (finished).</p><p>The OS keeps a record of each process in its <b>PCB</b> (<i>Process Control Block</i>): state, program counter, registers, priority, memory and open files. With that record it can pause and resume it.</p><div class="flow">New → Ready → Running → Terminated<br>Running → Ready (the CPU is taken away)<br>Running → Waiting (asks for I/O) → Ready (I/O finished)</div><p><b>Careful:</b> a process never goes straight from Waiting to Running. It first returns to the ready queue.</p>',
 mc: 'In the MineOS model, each task inside a tick (a player action, an animal update) is treated as a tiny process. In the code its record is the Job class.',
 example: '<p>Process A uses 2 CPU units, waits 3 units for I/O and uses 2 more. If it is alone:</p><table><tr><th>Interval</th><th>State of A</th></tr><tr><td>[0, 2)</td><td>Running</td></tr><tr><td>[2, 5)</td><td>Waiting (the CPU is idle)</td></tr><tr><td>[5, 7)</td><td>Running</td></tr><tr><td>t = 7</td><td>Terminated</td></tr></table>',
 quiz: { q: 'A process’s disk read has just finished. Which state does it move to?', options: ['Running', 'Ready', 'Terminated'], hint: 'The event happening does not mean the CPU is free.', why: 'It goes back to Ready; the scheduler decides when it runs.' } },
answer: 1 },

{ id: 'kernel', zone: 'village', lab: null,
es: { title: 'Interrupciones y llamadas al sistema', goal: 'Explicar cómo el SO recupera el control y cómo un programa le pide servicios.',
 story: 'Un programa quiere guardar tu partida. No puede escribir en el disco como le dé la gana: tiene que pedírselo al sistema operativo.',
 body: '<p>La CPU tiene al menos dos modos. En <b>modo usuario</b> corren las aplicaciones, con permisos limitados. En <b>modo kernel</b> corre el núcleo del SO y puede usar instrucciones privilegiadas.</p><ul><li><b>System call:</b> la petición de un programa al SO (abrir un archivo, crear un proceso). Cambia a modo kernel, atiende y regresa.</li><li><b>Interrupción:</b> una señal que avisa que algo ocurrió (llegó un dato, terminó el disco, sonó el <i>timer</i>).</li><li><b>Cambio de contexto:</b> guardar el estado de un proceso en su PCB y cargar el de otro. Es trabajo necesario, pero no avanza ningún programa.</li></ul><p>Una interrupción <b>no siempre</b> cambia de proceso: el SO puede atenderla y devolver la CPU al mismo.</p>',
 mc: 'Guardar el mundo en el disco termina en llamadas al sistema: el juego (a través de Java) pide al SO que escriba los archivos.',
 example: '<p>Guardar una partida:</p><ol><li>El juego llama a una función de una biblioteca.</li><li>La biblioteca hace la <i>system call</i> de escritura.</li><li>La CPU pasa a modo kernel y el SO inicia la operación de disco.</li><li>El SO regresa a modo usuario, quizá con otro proceso.</li><li>Cuando el disco termina, una interrupción avisa al SO.</li></ol>',
 quiz: { q: 'Llega una interrupción del teclado mientras corre el proceso A. ¿Qué es correcto?', options: ['Siempre se cambia a otro proceso', 'El SO la atiende y puede devolver la CPU a A', 'A queda terminado'], hint: 'Cambio de modo y cambio de proceso no son lo mismo.', why: 'Hay cambio a modo kernel; cambiar de proceso es una decisión aparte.' } },
en: { title: 'Interrupts and system calls', goal: 'Explain how the OS regains control and how a program asks it for services.',
 story: 'A program wants to save your game. It cannot write to disk however it likes: it has to ask the operating system.',
 body: '<p>The CPU has at least two modes. Applications run in <b>user mode</b> with limited permissions. The OS core runs in <b>kernel mode</b> and may use privileged instructions.</p><ul><li><b>System call:</b> a program’s request to the OS (open a file, create a process). It switches to kernel mode, serves the request and returns.</li><li><b>Interrupt:</b> a signal saying something happened (data arrived, the disk finished, the <i>timer</i> fired).</li><li><b>Context switch:</b> saving one process’s state in its PCB and loading another’s. It is necessary work, but no program makes progress meanwhile.</li></ul><p>An interrupt does <b>not always</b> switch processes: the OS may handle it and give the CPU back to the same one.</p>',
 mc: 'Saving the world to disk ends in system calls: the game (through Java) asks the OS to write the files.',
 example: '<p>Saving a game:</p><ol><li>The game calls a library function.</li><li>The library makes the write <i>system call</i>.</li><li>The CPU enters kernel mode and the OS starts the disk operation.</li><li>The OS returns to user mode, maybe running another process.</li><li>When the disk finishes, an interrupt notifies the OS.</li></ol>',
 quiz: { q: 'A keyboard interrupt arrives while process A runs. Which statement is right?', options: ['The CPU always switches to another process', 'The OS handles it and may give the CPU back to A', 'A is terminated'], hint: 'A mode switch and a process switch are different things.', why: 'There is a switch to kernel mode; switching processes is a separate decision.' } },
answer: 1 },

{ id: 'tick', zone: 'village', lab: { route: 'server' },
es: { title: 'El reloj del servidor: el tick', goal: 'Calcular TPS a partir de MSPT y distinguir concurrencia de paralelismo.',
 story: 'Cuando el servidor “tiene lag”, las puertas tardan en abrir y los animales se mueven a saltos. Algo no está alcanzando a hacerse a tiempo.',
 body: '<p>El juego avanza en pasos llamados <b>ticks</b>. La meta es 20 por segundo, así que cada uno dispone de <b>50 ms</b>.</p><ul><li><b>MSPT:</b> milisegundos que tarda un tick.</li><li><b>TPS:</b> ticks por segundo. Si MSPT ≤ 50, TPS = 20; si es mayor, TPS ≈ 1000 / MSPT.</li></ul><p><b>Concurrencia:</b> varias tareas avanzan en el mismo periodo, por turnos. <b>Paralelismo:</b> varias tareas se ejecutan en el mismo instante en distintos núcleos. Un <b>hilo</b> (<i>thread</i>) es una línea de ejecución dentro de un proceso; los hilos de un proceso comparten código y datos, pero cada uno tiene sus registros y su pila.</p>',
 mc: 'MineOS modela un solo hilo principal que ejecuta las tareas de cada tick, una a la vez: hay concurrencia, pero no paralelismo. Los servidores reales usan además otros hilos para algunas labores.',
 example: '<p>Si el trabajo de un tick toma 80 ms:</p><p class="math">TPS = 1000 / 80 = 12,5</p><p>El mundo avanza a 12,5 pasos por segundo en lugar de 20.</p>',
 quiz: { q: 'Cada tick tarda 100 ms. ¿Cuántos TPS logra el servidor?', options: ['20', '10', '5'], hint: '¿Cuántos bloques de 100 ms caben en un segundo?', why: '1000 / 100 = 10 TPS.' } },
en: { title: 'The server clock: the tick', goal: 'Compute TPS from MSPT and tell concurrency from parallelism.',
 story: 'When the server “lags”, doors open late and animals move in jumps. Some work is not getting done in time.',
 body: '<p>The game advances in steps called <b>ticks</b>. The target is 20 per second, so each one has <b>50 ms</b>.</p><ul><li><b>MSPT:</b> milliseconds one tick takes.</li><li><b>TPS:</b> ticks per second. If MSPT ≤ 50, TPS = 20; if larger, TPS ≈ 1000 / MSPT.</li></ul><p><b>Concurrency:</b> several tasks make progress in the same period by taking turns. <b>Parallelism:</b> several tasks execute at the same instant on different cores. A <b>thread</b> is a line of execution inside a process; threads of one process share code and data, but each has its own registers and stack.</p>',
 mc: 'MineOS models a single main thread that runs the tasks of each tick one at a time: there is concurrency but no parallelism. Real servers also use other threads for some work.',
 example: '<p>If one tick’s work takes 80 ms:</p><p class="math">TPS = 1000 / 80 = 12.5</p><p>The world advances 12.5 steps per second instead of 20.</p>',
 quiz: { q: 'Each tick takes 100 ms. How many TPS does the server reach?', options: ['20', '10', '5'], hint: 'How many 100 ms blocks fit in one second?', why: '1000 / 100 = 10 TPS.' } },
answer: 1 },

{ id: 'metrics', zone: 'station', lab: { route: 'cpu', preset: 'convoy' },
es: { title: 'Planificación y métricas', goal: 'Calcular tiempo de respuesta, de retorno y de espera.',
 story: 'Varias criaturas hacen fila frente a una sola máquina. El planificador es quien decide cuál entra.',
 body: '<p>Un proceso alterna <b>ráfagas</b> de CPU y esperas de I/O. El <b>planificador</b> elige a quién de la cola <i>ready</i> darle la CPU; el <b>dispatcher</b> hace el cambio. Es <b>apropiativo</b> (<i>preemptive</i>) si puede quitar la CPU a un proceso que aún no ha terminado su ráfaga.</p><table><tr><th>Métrica</th><th>Cómo se calcula</th></tr><tr><td>Retorno (<i>turnaround</i>)</td><td>finalización − llegada</td></tr><tr><td>Respuesta</td><td>primera ejecución − llegada</td></tr><tr><td>Espera</td><td>tiempo total en la cola <i>ready</i></td></tr><tr><td>Utilización</td><td>CPU ocupada / tiempo total</td></tr><tr><td><i>Throughput</i></td><td>procesos terminados / tiempo total</td></tr></table><p>Si no hay I/O ni costo de cambio: espera = retorno − CPU.</p>',
 mc: 'La respuesta de la tarea de un jugador es lo que se siente: cuánto tarda el mundo en reaccionar a lo que hizo.',
 example: '<p>A llega en 0, empieza en 2, usa 3 unidades seguidas y termina en 5.</p><p class="math">respuesta = 2 − 0 = 2 · retorno = 5 − 0 = 5 · espera = 5 − 3 = 2</p>',
 quiz: { q: 'B llega en 1, empieza en 4 y termina en 9 tras una sola ráfaga de 5. ¿Cuáles son su respuesta, retorno y espera?', options: ['3, 8 y 3', '4, 9 y 4', '3, 9 y 5'], hint: 'Resta siempre la llegada.', why: 'Respuesta 4−1=3, retorno 9−1=8, espera 8−5=3.' } },
en: { title: 'Scheduling and metrics', goal: 'Compute response, turnaround and waiting time.',
 story: 'Several creatures queue in front of a single machine. The scheduler decides who goes in.',
 body: '<p>A process alternates CPU <b>bursts</b> and I/O waits. The <b>scheduler</b> chooses who in the <i>ready</i> queue gets the CPU; the <b>dispatcher</b> performs the switch. It is <b>preemptive</b> if it can take the CPU from a process whose burst has not finished.</p><table><tr><th>Metric</th><th>How to compute it</th></tr><tr><td>Turnaround</td><td>finish − arrival</td></tr><tr><td>Response</td><td>first run − arrival</td></tr><tr><td>Waiting</td><td>total time in the <i>ready</i> queue</td></tr><tr><td>Utilisation</td><td>busy CPU / total time</td></tr><tr><td>Throughput</td><td>finished processes / total time</td></tr></table><p>With no I/O and no switch cost: waiting = turnaround − CPU time.</p>',
 mc: 'The response time of a player’s task is what you feel: how long the world takes to react to what you did.',
 example: '<p>A arrives at 0, starts at 2, uses 3 units in a row and finishes at 5.</p><p class="math">response = 2 − 0 = 2 · turnaround = 5 − 0 = 5 · waiting = 5 − 3 = 2</p>',
 quiz: { q: 'B arrives at 1, starts at 4 and finishes at 9 after a single burst of 5. What are its response, turnaround and waiting times?', options: ['3, 8 and 3', '4, 9 and 4', '3, 9 and 5'], hint: 'Always subtract the arrival time.', why: 'Response 4−1=3, turnaround 9−1=8, waiting 8−5=3.' } },
answer: 0 },

{ id: 'fcfs', zone: 'station', lab: { route: 'cpu', preset: 'convoy' },
es: { title: 'FCFS y el efecto convoy', goal: 'Dibujar un diagrama de Gantt FCFS y explicar el efecto convoy.',
 story: 'Una máquina enorme entra primero a la CPU. Detrás, dos jugadores que solo querían abrir una puerta tienen que esperar.',
 body: '<p><b>FCFS</b> (<i>First-Come, First-Served</i>) atiende en orden de llegada y no es apropiativo. Es simple y no deja a nadie sin turno si cada ráfaga termina. Su problema es el <b>efecto convoy</b>: una ráfaga larga hace esperar a todas las cortas.</p>',
 mc: 'MineOS usa FCFS como línea base (“antes de la mejora”): una cola y cada tarea corre hasta terminar. Es una simplificación del modelo, no una descripción exacta del código de Minecraft.',
 example: '<p>P1 = 24, P2 = 3, P3 = 3; todos llegan en 0 en ese orden.</p><div class="flow">P1 [0,24) → P2 [24,27) → P3 [27,30)</div><p class="math">espera media = (0 + 24 + 27) / 3 = 17</p><p>Con el orden P2, P3, P1: (0 + 3 + 6) / 3 = <b>3</b>. El trabajo total es igual; cambió quién espera.</p>',
 code: 'next():\n    return readyQueue.removeFirst()     // runs until it blocks or ends',
 quiz: { q: 'A, B y C llegan juntos, en ese orden, con ráfagas 6, 2 y 1. ¿Cuál es la espera media?', options: ['3', '14/3 ≈ 4,67', '9'], hint: 'Cada uno espera la suma de las ráfagas que tiene delante.', why: 'Esperas 0, 6 y 8: suman 14 y se dividen entre 3.' } },
en: { title: 'FCFS and the convoy effect', goal: 'Draw an FCFS Gantt chart and explain the convoy effect.',
 story: 'A huge machine gets the CPU first. Behind it, two players who only wanted to open a door have to wait.',
 body: '<p><b>FCFS</b> (<i>First-Come, First-Served</i>) serves in arrival order and is not preemptive. It is simple, and nobody is skipped as long as every burst ends. Its problem is the <b>convoy effect</b>: one long burst makes all the short ones wait.</p>',
 mc: 'MineOS uses FCFS as the baseline (“before the improvement”): one queue, each task runs to completion. This is a simplification of the model, not an exact description of Minecraft’s code.',
 example: '<p>P1 = 24, P2 = 3, P3 = 3; all arrive at 0 in that order.</p><div class="flow">P1 [0,24) → P2 [24,27) → P3 [27,30)</div><p class="math">average waiting = (0 + 24 + 27) / 3 = 17</p><p>With the order P2, P3, P1: (0 + 3 + 6) / 3 = <b>3</b>. Total work is the same; what changed is who waits.</p>',
 code: 'next():\n    return readyQueue.removeFirst()     // runs until it blocks or ends',
 quiz: { q: 'A, B and C arrive together, in that order, with bursts 6, 2 and 1. What is the average waiting time?', options: ['3', '14/3 ≈ 4.67', '9'], hint: 'Each one waits for the sum of the bursts ahead of it.', why: 'Waits 0, 6 and 8 add up to 14, divided by 3.' } },
answer: 1 },

{ id: 'sjf', zone: 'station', lab: { route: 'cpu', preset: 'srtf' },
es: { title: 'SJF y SRTF: primero lo más corto', goal: 'Comparar la versión no apropiativa y la apropiativa de “primero el más corto”.',
 story: 'Si en la fila hay alguien que solo necesita un segundo, ¿conviene dejarlo pasar?',
 body: '<p><b>SJF</b> (<i>Shortest Job First</i>) elige la ráfaga más corta disponible y no la interrumpe. <b>SRTF</b> (<i>Shortest Remaining Time First</i>) es su versión apropiativa: si llega alguien a quien le falta <b>estrictamente menos</b> que al actual, lo reemplaza.</p><p>SJF minimiza la espera media cuando todos los procesos están disponibles a la vez y se conocen sus ráfagas. En la práctica no se conoce el futuro: se <b>estima</b> con el promedio exponencial:</p><p class="math">τ nueva = α · ráfaga observada + (1 − α) · τ anterior, con 0 ≤ α ≤ 1</p><p>Riesgo: una tarea larga puede sufrir <b>inanición</b> (<i>starvation</i>) si siguen llegando cortas.</p>',
 mc: 'Un servidor no sabe con exactitud cuánto costará actualizar una criatura antes de hacerlo. Solo podría estimarlo a partir de lo que costó antes.',
 example: '<p>SRTF con P1(llegada 0, CPU 8), P2(1, 4), P3(2, 9), P4(3, 5):</p><div class="flow">P1 [0,1) → P2 [1,5) → P4 [5,10) → P1 [10,17) → P3 [17,26)</div><p class="math">esperas 9, 0, 15, 2 → media 6,5</p><p>Predicción: con α = 0,5, τ anterior = 10 y observada = 6, τ nueva = <b>8</b>.</p>',
 code: 'on arrival of p:\n    if p.remaining < running.remaining:   // strictly smaller\n        preempt(running)\nnext():\n    return ready.minBy(remaining)',
 quiz: { q: 'A empieza en t=0 con ráfaga 5. En t=2 llega B con ráfaga 4. ¿SRTF interrumpe a A?', options: ['Sí, porque 4 < 5', 'No, porque a A solo le faltan 3', 'Sí, porque B es nuevo'], hint: 'Compara contra lo que le falta.', why: 'A tiene 3 restantes, menos que las 4 de B.' } },
en: { title: 'SJF and SRTF: shortest first', goal: 'Compare the non-preemptive and preemptive versions of “shortest first”.',
 story: 'If someone in the queue only needs one second, should we let them go first?',
 body: '<p><b>SJF</b> (<i>Shortest Job First</i>) picks the shortest available burst and does not interrupt it. <b>SRTF</b> (<i>Shortest Remaining Time First</i>) is its preemptive version: if a newcomer has <b>strictly less</b> left than the running one, it takes over.</p><p>SJF minimises average waiting when all processes are available at once and their bursts are known. In practice the future is unknown, so it is <b>estimated</b> with an exponential average:</p><p class="math">new τ = α · observed burst + (1 − α) · previous τ, with 0 ≤ α ≤ 1</p><p>Risk: a long task can suffer <b>starvation</b> if short ones keep arriving.</p>',
 mc: 'A server does not know exactly how much updating a creature will cost before doing it. It could only estimate it from earlier costs.',
 example: '<p>SRTF with P1(arrival 0, CPU 8), P2(1, 4), P3(2, 9), P4(3, 5):</p><div class="flow">P1 [0,1) → P2 [1,5) → P4 [5,10) → P1 [10,17) → P3 [17,26)</div><p class="math">waits 9, 0, 15, 2 → average 6.5</p><p>Prediction: with α = 0.5, previous τ = 10 and observed = 6, new τ = <b>8</b>.</p>',
 code: 'on arrival of p:\n    if p.remaining < running.remaining:   // strictly smaller\n        preempt(running)\nnext():\n    return ready.minBy(remaining)',
 quiz: { q: 'A starts at t=0 with a burst of 5. At t=2, B arrives with a burst of 4. Does SRTF preempt A?', options: ['Yes, because 4 < 5', 'No, because A only has 3 left', 'Yes, because B is new'], hint: 'Compare against what is left.', why: 'A has 3 left, less than B’s 4.' } },
answer: 1 },

{ id: 'rr', zone: 'station', lab: { route: 'cpu', preset: 'rr' },
es: { title: 'Round Robin: turnos justos', goal: 'Trazar Round Robin y explicar el efecto del quantum.',
 story: 'Todos reciben un turno corto. Si no alcanzas a terminar, vuelves al final de la fila.',
 body: '<p><b>Round Robin (RR)</b> da a cada proceso como máximo un <b>quantum</b>. Si lo agota y no terminó, vuelve al final de la cola. Si termina antes, libera la CPU de inmediato.</p><ul><li>Quantum <b>muy grande</b>: se comporta como FCFS.</li><li>Quantum <b>muy pequeño</b>: responde rápido, pero gasta mucho en cambios de contexto.</li></ul><p>Convención de este curso: si alguien llega justo cuando vence un quantum, entra a la cola <b>antes</b> que el que sale.</p>',
 mc: 'Dentro de cada nivel del planificador por prioridad de MineOS se usa Round Robin con quantum de 2 ms.',
 example: '<p>P1 = 24, P2 = 3, P3 = 3, quantum 4, sin costo de cambio.</p><div class="flow">P1 [0,4) → P2 [4,7) → P3 [7,10) → P1 [10,30)</div><p class="math">esperas 6, 4, 7 → media 17/3 ≈ 5,67</p><p>Desde t=10, P1 está solo: recibe varios turnos seguidos sin cambiar de proceso.</p>',
 code: 'on quantum expired:\n    ready.addLast(running)   // after processes arriving at the same instant\nnext():\n    return ready.removeFirst()',
 quiz: { q: 'A = 3 y B = 2 llegan en 0 (A primero), con quantum 1. ¿Quién termina primero y cuándo?', options: ['A en t=3', 'B en t=4', 'B en t=2'], hint: 'Escribe los turnos: A, B, A, B, A.', why: 'B recibe su segundo turno en [3,4).' } },
en: { title: 'Round Robin: fair turns', goal: 'Trace Round Robin and explain the effect of the quantum.',
 story: 'Everyone gets a short turn. If you do not finish, you go to the back of the queue.',
 body: '<p><b>Round Robin (RR)</b> gives each process at most one <b>quantum</b>. If it uses it all and is not done, it goes to the back of the queue. If it finishes early, it frees the CPU at once.</p><ul><li><b>Very large</b> quantum: behaves like FCFS.</li><li><b>Very small</b> quantum: responds quickly but spends a lot on context switches.</li></ul><p>Course convention: if someone arrives exactly when a quantum expires, they join the queue <b>before</b> the one leaving the CPU.</p>',
 mc: 'Inside each level of the MineOS priority scheduler, Round Robin runs with a 2 ms quantum.',
 example: '<p>P1 = 24, P2 = 3, P3 = 3, quantum 4, no switch cost.</p><div class="flow">P1 [0,4) → P2 [4,7) → P3 [7,10) → P1 [10,30)</div><p class="math">waits 6, 4, 7 → average 17/3 ≈ 5.67</p><p>From t=10, P1 is alone: it gets several turns in a row without a process switch.</p>',
 code: 'on quantum expired:\n    ready.addLast(running)   // after processes arriving at the same instant\nnext():\n    return ready.removeFirst()',
 quiz: { q: 'A = 3 and B = 2 arrive at 0 (A first), quantum 1. Who finishes first, and when?', options: ['A at t=3', 'B at t=4', 'B at t=2'], hint: 'Write the turns: A, B, A, B, A.', why: 'B gets its second turn in [3,4).' } },
answer: 1 },

{ id: 'priority', zone: 'station', lab: { route: 'cpu', preset: 'starve' },
es: { title: 'Prioridades, inanición y aging', goal: 'Provocar inanición y mitigarla con envejecimiento.',
 story: 'Los jugadores pasan primero. Pero si siempre hay jugadores, ¿cuándo crecen los cultivos?',
 body: '<p>Cada proceso tiene una <b>prioridad</b>. Aquí, <b>número menor = más importante</b>. Puede ser apropiativa o no.</p><p><b>Inanición:</b> un proceso de baja prioridad espera indefinidamente. <b>Aging</b> (envejecimiento): cada cierto tiempo de espera se mejora su prioridad. En este laboratorio la mejora dura hasta que el proceso deja la CPU.</p>',
 mc: 'MineOS ordena las tareas así: jugador (0), circuitos o redstone (1), criaturas y entidades (2) y ticks de bloques como cultivos (3). Una tarea sube un nivel si pasa 3 ticks esperando.',
 example: '<p>Todos llegan en 0. Ráfagas P1=10, P2=1, P3=2, P4=1, P5=5; prioridades 3, 1, 4, 5, 2.</p><div class="flow">P2 → P5 → P1 → P3 → P4</div><p class="math">esperas 6, 0, 16, 18, 1 → media 41/5 = 8,2</p>',
 code: 'every N units waiting:\n    p.effectivePriority = max(0, p.effectivePriority - 1)\nnext():\n    return ready.minBy(effectivePriority)',
 quiz: { q: 'Con “número menor = más importante”, ¿qué debe hacer el aging con un proceso que espera mucho?', options: ['Subirle el número', 'Bajarle el número', 'Eliminarlo'], hint: 'Revisa qué dirección significa más importancia.', why: 'Un número menor le permite competir mejor.' } },
en: { title: 'Priorities, starvation and aging', goal: 'Cause starvation and reduce it with aging.',
 story: 'Players go first. But if there are always players, when do the crops grow?',
 body: '<p>Each process has a <b>priority</b>. Here, <b>lower number = more important</b>. It can be preemptive or not.</p><p><b>Starvation:</b> a low-priority process waits indefinitely. <b>Aging:</b> after waiting for some time its priority is improved. In this lab the boost lasts until the process leaves the CPU.</p>',
 mc: 'MineOS orders tasks like this: player (0), circuits or redstone (1), creatures and entities (2), and block ticks such as crops (3). A task moves up one level after waiting 3 ticks.',
 example: '<p>All arrive at 0. Bursts P1=10, P2=1, P3=2, P4=1, P5=5; priorities 3, 1, 4, 5, 2.</p><div class="flow">P2 → P5 → P1 → P3 → P4</div><p class="math">waits 6, 0, 16, 18, 1 → average 41/5 = 8.2</p>',
 code: 'every N units waiting:\n    p.effectivePriority = max(0, p.effectivePriority - 1)\nnext():\n    return ready.minBy(effectivePriority)',
 quiz: { q: 'With “lower number = more important”, what should aging do to a process that has waited long?', options: ['Raise its number', 'Lower its number', 'Remove it'], hint: 'Check which direction means more important.', why: 'A lower number lets it compete better.' } },
answer: 1 },

{ id: 'pq', zone: 'station', lab: { route: 'cpu', preset: 'queues' },
es: { title: 'Priority Queue: varias colas fijas', goal: 'Seguir un planificador con una cola por nivel de prioridad.',
 story: 'En vez de una sola fila hay cuatro: una para cada tipo de trabajo.',
 body: '<p>En una <b>cola multinivel</b> fija cada proceso pertenece siempre a la misma cola. Hay dos reglas: una <b>dentro</b> de cada cola (aquí Round Robin) y otra <b>entre</b> colas (aquí prioridad estricta: Q0 antes que Q1, etc.).</p><p>Si llega trabajo a una cola superior, el proceso actual es expropiado y vuelve al final de su propia cola. Sin aging, las colas bajas pueden sufrir inanición.</p>',
 mc: 'Es la idea del planificador PRIORITY de MineOS: cuatro colas por tipo de tarea. MineOS le agrega aging.',
 example: '<p>“low” (cola 3, CPU 6) llega en 0. “high” (cola 0, CPU 2) llega en 2. Quantum 4.</p><div class="flow">low [0,2) → high [2,4) → low [4,8)</div>',
 code: 'next():\n    for level in 0..3:\n        if queue[level] not empty:\n            return queue[level].removeFirst()',
 quiz: { q: 'La cola 0 está vacía, la cola 1 tiene dos procesos y la cola 3 tiene uno. ¿Cuándo corre el de la cola 3?', options: ['Se turna con los de la cola 1', 'Cuando no quede trabajo listo en colas superiores', 'De primero, porque su número es mayor'], hint: 'Entre colas hay prioridad estricta.', why: 'Mientras exista trabajo listo en colas 0 a 2, la cola 3 espera.' } },
en: { title: 'Priority Queue: several fixed queues', goal: 'Follow a scheduler with one queue per priority level.',
 story: 'Instead of one line there are four: one for each kind of work.',
 body: '<p>In a fixed <b>multilevel queue</b> each process always belongs to the same queue. There are two rules: one <b>inside</b> each queue (Round Robin here) and one <b>between</b> queues (strict priority here: Q0 before Q1, and so on).</p><p>If work arrives in a higher queue, the running process is preempted and goes to the back of its own queue. Without aging, low queues can starve.</p>',
 mc: 'This is the idea behind the MineOS PRIORITY scheduler: four queues by task type. MineOS adds aging.',
 example: '<p>“low” (queue 3, CPU 6) arrives at 0. “high” (queue 0, CPU 2) arrives at 2. Quantum 4.</p><div class="flow">low [0,2) → high [2,4) → low [4,8)</div>',
 code: 'next():\n    for level in 0..3:\n        if queue[level] not empty:\n            return queue[level].removeFirst()',
 quiz: { q: 'Queue 0 is empty, queue 1 has two processes and queue 3 has one. When does the one in queue 3 run?', options: ['It alternates with queue 1', 'When no ready work is left in higher queues', 'First, because its number is larger'], hint: 'Priority between queues is strict.', why: 'While queues 0 to 2 have ready work, queue 3 waits.' } },
answer: 1 },

{ id: 'mfq', zone: 'station', lab: { route: 'cpu', preset: 'mfq' },
es: { title: 'MFQ: colas con retroalimentación', goal: 'Seguir un proceso que cambia de cola según su comportamiento.',
 story: 'Nadie le dice al planificador qué tareas son cortas. Él lo descubre mirando cómo se comportan.',
 body: '<p>En <b>MFQ</b> (<i>Multilevel Feedback Queue</i>) todos entran a la cola más alta. Si agotan su quantum, <b>bajan</b>. Así las tareas cortas terminan pronto. Reglas del laboratorio: Q0 es RR con quantum q, Q1 es RR con 2q y Q2 es FCFS. Si lo expropia una cola superior o regresa de I/O, conserva su nivel.</p><p>Un <b>boost</b> periódico (subir todo a Q0) ayuda contra la inanición. El laboratorio por pasos no lo aplica; el laboratorio del servidor sí.</p>',
 mc: 'El MFQ de MineOS usa 0,5 ms, 2 ms y FCFS, con boost cada 20 ticks. En el servidor sobrecargado con presupuesto, aun así dejó los circuitos esperando varios segundos: MFQ premia lo corto, no lo importante.',
 example: '<p>Un proceso de 30 unidades, solo, con q = 8:</p><div class="flow">Q0: 8 unidades → Q1: 16 unidades → Q2: 6 unidades</div>',
 code: 'on quantum expired:\n    p.level = min(p.level + 1, 2)\n    queue[p.level].addLast(p)',
 quiz: { q: 'Con q = 8, un proceso solo necesita 10 unidades. ¿Cómo las reparte?', options: ['8 en Q0 y 2 en Q1', '10 en Q0', '8 en Q0, 1 en Q1 y 1 en Q2'], hint: 'Al agotar el quantum baja un nivel.', why: 'Gasta 8 en Q0, baja y termina las 2 restantes en Q1.' } },
en: { title: 'MFQ: queues with feedback', goal: 'Follow a process that changes queue according to its behaviour.',
 story: 'Nobody tells the scheduler which tasks are short. It finds out by watching how they behave.',
 body: '<p>In <b>MFQ</b> (<i>Multilevel Feedback Queue</i>) everyone enters the top queue. Using up the quantum moves you <b>down</b>, so short tasks finish early. Lab rules: Q0 is RR with quantum q, Q1 is RR with 2q and Q2 is FCFS. A process preempted by a higher queue, or returning from I/O, keeps its level.</p><p>A periodic <b>boost</b> (moving everything to Q0) helps against starvation. The step-by-step lab does not apply it; the server lab does.</p>',
 mc: 'The MineOS MFQ uses 0.5 ms, 2 ms and FCFS, with a boost every 20 ticks. On the overloaded server with a budget it still left circuits waiting several seconds: MFQ rewards what is short, not what is important.',
 example: '<p>A single 30-unit process with q = 8:</p><div class="flow">Q0: 8 units → Q1: 16 units → Q2: 6 units</div>',
 code: 'on quantum expired:\n    p.level = min(p.level + 1, 2)\n    queue[p.level].addLast(p)',
 quiz: { q: 'With q = 8, a lone process needs 10 units. How are they split?', options: ['8 in Q0 and 2 in Q1', '10 in Q0', '8 in Q0, 1 in Q1 and 1 in Q2'], hint: 'Using up the quantum moves it down one level.', why: 'It uses 8 in Q0, moves down and finishes the other 2 in Q1.' } },
answer: 0 },

{ id: 'cfs', zone: 'station', lab: { route: 'cpu', preset: 'fair' },
es: { title: 'CFS: reparto justo', goal: 'Usar el tiempo virtual (vruntime) para decidir turnos.',
 story: '¿Y si en vez de filas rígidas llevamos la cuenta de cuánto ha recibido cada uno?',
 body: '<p>La idea de <b>CFS</b> (<i>Completely Fair Scheduler</i>) es llevar para cada proceso un <b>vruntime</b> y escoger el menor. Con mayor <b>peso</b>, el vruntime crece más despacio y se recibe más CPU.</p><p class="math">vruntime += tiempo usado / peso</p><p>Versión didáctica del laboratorio: pesos 4, 3, 2 y 1 para prioridades 0 a 3; el recién llegado arranca con el menor vruntime activo; solo se expropia después de q unidades. El CFS real de Linux es mucho más elaborado (tabla de pesos <i>nice</i>, árbol rojo-negro), y las versiones recientes de Linux pasaron a otro algoritmo, EEVDF.</p>',
 mc: 'Es un planificador adicional del curso para comparar. El simulador Java del servidor de MineOS no lo incluye.',
 example: '<p>“heavy” (peso 4) y “light” (peso 1) usan 1 unidad cada vez:</p><p class="math">heavy suma 0,25 · light suma 1</p><p>A largo plazo, heavy recibe cerca de 4 unidades por cada 1 de light.</p>',
 code: 'charge(p):  p.vruntime += 1 / weight[p.priority]\nnext():     return ready.minBy(vruntime)',
 quiz: { q: 'A tiene vruntime 6 y B tiene 4,5. ¿Quién sigue?', options: ['A', 'B', 'El que llegó primero, sin mirar el vruntime'], hint: 'Se elige al que menos ha recibido, ponderado.', why: 'B tiene el menor vruntime.' } },
en: { title: 'CFS: fair sharing', goal: 'Use virtual runtime (vruntime) to decide turns.',
 story: 'What if, instead of rigid lines, we kept track of how much each one has received?',
 body: '<p>The idea of <b>CFS</b> (<i>Completely Fair Scheduler</i>) is to keep a <b>vruntime</b> for each process and pick the smallest. With a larger <b>weight</b>, vruntime grows more slowly and the process gets more CPU.</p><p class="math">vruntime += time used / weight</p><p>Teaching version in the lab: weights 4, 3, 2 and 1 for priorities 0 to 3; a newcomer starts at the smallest active vruntime; preemption only happens after q units. The real Linux CFS is far more elaborate (a <i>nice</i> weight table, a red-black tree), and recent Linux versions moved to another algorithm, EEVDF.</p>',
 mc: 'It is an extra course scheduler for comparison. The MineOS Java server simulator does not include it.',
 example: '<p>“heavy” (weight 4) and “light” (weight 1) use 1 unit at a time:</p><p class="math">heavy adds 0.25 · light adds 1</p><p>In the long run heavy gets about 4 units for every 1 of light.</p>',
 code: 'charge(p):  p.vruntime += 1 / weight[p.priority]\nnext():     return ready.minBy(vruntime)',
 quiz: { q: 'A has vruntime 6 and B has 4.5. Who goes next?', options: ['A', 'B', 'Whoever arrived first, ignoring vruntime'], hint: 'Pick the one that has received least, after weighting.', why: 'B has the smallest vruntime.' } },
answer: 1 }
];
