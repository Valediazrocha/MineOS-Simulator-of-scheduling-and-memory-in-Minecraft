<script>
/* Lessons, part B: memory management (no virtual memory) and MineOS. Original text, CC0-1.0. */
window.MineOS.lessons.push(
{ id: 'contiguous', zone: 'mine', lab: { route: 'memory', preset: 'holes' },
es: { title: 'Memoria y asignación contigua', goal: 'Explicar base, límite y fragmentación externa.',
 story: 'La RAM es como un corredor de cofres en línea. Cada proceso necesita varios cofres seguidos.',
 body: "<h3>Todo el proceso en un solo bloque</h3><p>En este modelo, para ejecutarse, un proceso debe estar <b>completo en memoria principal</b>. La forma más sencilla de ubicarlo es la <b>asignación contigua</b>: el proceso ocupa <b>una sola región seguida</b> de la RAM, sin cortes. Normalmente el SO se guarda una parte de la memoria para sí mismo y el resto se reparte entre los procesos.</p><h3>Base y límite: protección con dos registros</h3><p>Para que un proceso no lea ni escriba fuera de su región, el hardware usa dos registros:</p><ul><li><b>Base</b> (o reubicación): dónde empieza la región del proceso.</li><li><b>Límite:</b> cuánto mide.</li></ul><p>En cada acceso, el hardware revisa la dirección lógica antes de traducirla:</p><p class=\"math\">si 0 ≤ lógica &lt; límite: física = base + lógica · si no: error de protección</p><p>Solo el SO, en modo kernel, puede cambiar esos registros. Así un programa no puede «agrandarse» para espiar a otro.</p><h3>Huecos y particiones variables</h3><p>Al principio la memoria libre es un solo bloque grande. Cuando llega un proceso, se le da un pedazo del tamaño que necesita. Cuando termina, su espacio queda libre y se convierte en un <b>hueco</b>. Si al liberar quedan dos huecos vecinos, se <b>unen</b> en uno más grande.</p><p>Con el tiempo la memoria queda como un queso suizo: procesos y huecos de distintos tamaños, intercalados.</p><h3>El problema: fragmentación externa</h3><p>Hay <b>fragmentación externa</b> cuando hay memoria libre suficiente <b>en total</b>, pero repartida en huecos pequeños que, por separado, no sirven para el proceso que llega.</p><p>Una solución es la <b>compactación</b>: mover los procesos para juntar todos los huecos en uno solo. Pero cuesta mucho tiempo copiar la memoria, y solo se puede si los procesos se pueden reubicar (vinculación en tiempo de ejecución).</p><div class=\"recap\"><b>Para recordar.</b> Asignación contigua: un bloque seguido por proceso, protegido con base y límite. Su problema es la fragmentación externa.</div>",
 mc: 'Los <i>chunks</i> son trozos del mundo que el servidor mantiene en RAM. En el laboratorio los bloques de memoria representan regiones de procesos; es una analogía, no la forma en que Java organiza los chunks.',
 example: '<p>Un proceso tiene base 3000 y límite 500.</p><table><tr><th>Dirección lógica</th><th>Resultado</th></tr><tr><td>120</td><td>física 3120</td></tr><tr><td>499</td><td>física 3499 (última válida)</td></tr><tr><td>500</td><td>error de protección</td></tr></table>',
 quiz: { q: 'Hay dos huecos separados de 100 y 150. ¿Entra un proceso contiguo de 200 sin compactar?', options: ['Sí, porque hay 250 libres', 'Sí, si se divide el proceso en dos', 'No, porque ningún hueco mide al menos 200'], hint: 'Sumar espacio no lo vuelve continuo.', why: 'Es fragmentación externa.' } },
en: { title: 'Memory and contiguous allocation', goal: 'Explain base, limit and external fragmentation.',
 story: 'RAM is like a corridor of chests in a row. Each process needs several chests next to each other.',
 body: "<h3>The whole process in one block</h3><p>In this model, to run, a process must be <b>fully in main memory</b>. The simplest way to place it is <b>contiguous allocation</b>: the process takes <b>one single unbroken region</b> of RAM. Usually the OS keeps part of memory for itself and the rest is shared among processes.</p><h3>Base and limit: protection with two registers</h3><p>So that a process cannot read or write outside its region, the hardware uses two registers:</p><ul><li><b>Base</b> (or relocation): where the process’s region starts.</li><li><b>Limit:</b> how big it is.</li></ul><p>On every access, the hardware checks the logical address before translating it:</p><p class=\"math\">if 0 ≤ logical &lt; limit: physical = base + logical · otherwise: protection error</p><p>Only the OS, in kernel mode, can change those registers. That way a program cannot “grow” to spy on another one.</p><h3>Holes and variable partitions</h3><p>At first, free memory is one big block. When a process arrives, it gets a piece of the size it needs. When it ends, its space becomes free and turns into a <b>hole</b>. If releasing leaves two neighbouring holes, they <b>merge</b> into a bigger one.</p><p>Over time memory looks like Swiss cheese: processes and holes of different sizes, mixed together.</p><h3>The problem: external fragmentation</h3><p>There is <b>external fragmentation</b> when there is enough free memory <b>in total</b>, but split into small holes that, on their own, are useless for the arriving process.</p><p>One solution is <b>compaction</b>: moving the processes to gather all the holes into one. But copying memory takes a lot of time, and it is only possible if processes can be relocated (execution-time binding).</p><div class=\"recap\"><b>Remember.</b> Contiguous allocation: one unbroken block per process, protected with base and limit. Its problem is external fragmentation.</div>",
 mc: '<i>Chunks</i> are pieces of the world the server keeps in RAM. In the lab, memory blocks stand for process regions; it is an analogy, not how Java lays out chunks.',
 example: '<p>A process has base 3000 and limit 500.</p><table><tr><th>Logical address</th><th>Result</th></tr><tr><td>120</td><td>physical 3120</td></tr><tr><td>499</td><td>physical 3499 (last valid one)</td></tr><tr><td>500</td><td>protection error</td></tr></table>',
 quiz: { q: 'There are two separate holes of 100 and 150. Does a contiguous 200-unit process fit without compaction?', options: ['Yes, because 250 units are free', 'Yes, by splitting the process in two', 'No, because no hole is at least 200'], hint: 'Adding up space does not make it continuous.', why: 'This is external fragmentation.' } },
answer: 2 },

{ id: 'fit', zone: 'mine', lab: { route: 'memory', preset: 'diverge' },
es: { title: 'First, Best, Worst y Segregated Fit', goal: 'Comparar cuatro formas de elegir un hueco.',
 story: 'Llega un proceso y hay varios huecos donde cabe. ¿Cuál escoges?',
 body: "<h3>El problema de escoger un hueco</h3><p>Llega un proceso que necesita <i>n</i> bytes y hay varios huecos libres donde cabe. ¿Cuál se usa? Esta decisión se llama el <b>problema de asignación dinámica de memoria</b>, y cambia cuánto se desperdicia después.</p><h3>Las cuatro políticas</h3><table><tr><th>Política</th><th>Qué hueco elige</th><th>Idea detrás</th></tr><tr><td><b>First Fit</b></td><td>El <b>primero</b> que alcanza, recorriendo la memoria en orden de dirección</td><td>Es la más rápida: deja de buscar en cuanto encuentra uno</td></tr><tr><td><b>Best Fit</b></td><td>El <b>más pequeño</b> que alcanza</td><td>Deja el sobrante más pequeño posible y guarda los huecos grandes para después</td></tr><tr><td><b>Worst Fit</b></td><td>El <b>más grande</b></td><td>Deja un sobrante grande, que todavía puede servirle a otro proceso</td></tr><tr><td><b>Segregated Fit</b></td><td>Agrupa los huecos por <b>clases de tamaño</b> [2ᵏ, 2ᵏ⁺¹ − 1] y busca primero en la clase del pedido; si ningún hueco de esa clase alcanza, pasa a la siguiente clase</td><td>Busca rápido sin recorrer todos los huecos</td></tr></table><p>Reglas de este curso: si dos huecos empatan en tamaño, gana el de <b>dirección menor</b>; y dentro de una clase de Segregated Fit se toma el primero por dirección.</p><h3>¿Cuál es mejor?</h3><p>Las simulaciones muestran que First Fit y Best Fit suelen aprovechar mejor la memoria que Worst Fit, y First Fit es más rápido. Pero <b>ninguna política es la mejor para todas las cargas</b>: depende de los tamaños que lleguen. Y ninguna elimina la fragmentación externa; solo cambia cómo se reparte.</p><p>Para medirla se usa:</p><p class=\"math\">fragmentación externa = memoria libre total − hueco libre más grande</p><div class=\"recap\"><b>Para recordar.</b> First = el primero que alcanza; Best = el más pequeño que alcanza; Worst = el más grande; Segregated = busca por clases de tamaño.</div>",
 mc: 'La Mina de Memoria permite ver las cuatro políticas lado a lado con los mismos eventos.',
 example: '<p>Huecos en orden: 100, 500, 200, 300, 600. Llega un pedido de 212.</p><table><tr><th>Política</th><th>Hueco</th><th>Sobra</th></tr><tr><td>First</td><td>500</td><td>288</td></tr><tr><td>Best</td><td>300</td><td>88</td></tr><tr><td>Worst</td><td>600</td><td>388</td></tr><tr><td>Segregated</td><td>500</td><td>288</td></tr></table><p>En Segregated, 212 es de la clase 128–255; el 200 está en esa clase pero no alcanza. La clase 256–511 contiene el 500 y el 300, y se toma el primero por dirección.</p>',
 code: 'first:  holes.find(h => h.size >= n)\nbest:   min size among fitting holes\nworst:  max size among fitting holes\nsegregated: lowest size class with a fitting hole',
 quiz: { q: 'Huecos 400, 250 y 700, en ese orden. Pedido 240. ¿Qué elige Best Fit?', options: ['400', '250', '700'], hint: 'El menor que alcance.', why: '250 deja solo 10 libres.' } },
en: { title: 'First, Best, Worst and Segregated Fit', goal: 'Compare four ways of choosing a hole.',
 story: 'A process arrives and several holes can hold it. Which one do you pick?',
 body: "<h3>The problem of choosing a hole</h3><p>A process needing <i>n</i> bytes arrives and there are several free holes where it fits. Which one is used? This decision is called the <b>dynamic storage-allocation problem</b>, and it changes how much is wasted later.</p><h3>The four policies</h3><table><tr><th>Policy</th><th>Which hole it picks</th><th>The idea behind it</th></tr><tr><td><b>First Fit</b></td><td>The <b>first</b> one that is big enough, going through memory in address order</td><td>It is the fastest: it stops searching as soon as it finds one</td></tr><tr><td><b>Best Fit</b></td><td>The <b>smallest</b> one that is big enough</td><td>It leaves the smallest possible leftover and saves big holes for later</td></tr><tr><td><b>Worst Fit</b></td><td>The <b>largest</b> one</td><td>It leaves a big leftover, which may still be useful to another process</td></tr><tr><td><b>Segregated Fit</b></td><td>Groups holes into <b>size classes</b> [2ᵏ, 2ᵏ⁺¹ − 1] and searches the request’s class first; if no hole in that class is big enough, it moves to the next class</td><td>It searches quickly without going through every hole</td></tr></table><p>Rules in this course: if two holes tie in size, the one with the <b>lower address</b> wins; and inside a Segregated Fit class the first by address is taken.</p><h3>Which one is best?</h3><p>Simulations show that First Fit and Best Fit usually use memory better than Worst Fit, and First Fit is faster. But <b>no policy is best for every workload</b>: it depends on the sizes that arrive. And none removes external fragmentation; they only change how it is spread.</p><p>To measure it we use:</p><p class=\"math\">external fragmentation = total free memory − largest free hole</p><div class=\"recap\"><b>Remember.</b> First = the first that fits; Best = the smallest that fits; Worst = the largest; Segregated = searches by size class.</div>",
 mc: 'The Memory Mine shows the four policies side by side with the same events.',
 example: '<p>Holes in order: 100, 500, 200, 300, 600. A request of 212 arrives.</p><table><tr><th>Policy</th><th>Hole</th><th>Leftover</th></tr><tr><td>First</td><td>500</td><td>288</td></tr><tr><td>Best</td><td>300</td><td>88</td></tr><tr><td>Worst</td><td>600</td><td>388</td></tr><tr><td>Segregated</td><td>500</td><td>288</td></tr></table><p>In Segregated Fit, 212 belongs to class 128–255; the 200 hole is there but too small. Class 256–511 holds 500 and 300, and the first by address is taken.</p>',
 code: 'first:  holes.find(h => h.size >= n)\nbest:   min size among fitting holes\nworst:  max size among fitting holes\nsegregated: lowest size class with a fitting hole',
 quiz: { q: 'Holes 400, 250 and 700, in that order. Request 240. What does Best Fit choose?', options: ['400', '250', '700'], hint: 'The smallest one that fits.', why: '250 leaves only 10 free.' } },
answer: 1 },

{ id: 'paging', zone: 'mine', lab: { route: 'paging' },
es: { title: 'Paginación', goal: 'Traducir una dirección lógica y calcular la fragmentación interna.',
 story: '¿Y si el proceso no tuviera que estar en cofres seguidos?',
 body: "<h3>¿Y si el proceso no tuviera que estar en un solo bloque?</h3><p>La fragmentación externa aparece porque cada proceso necesita un bloque seguido. La <b>paginación</b> elimina esa exigencia: el proceso se reparte en pedazos iguales que pueden quedar en cualquier parte de la RAM.</p><h3>Páginas y marcos</h3><ul><li>La memoria <b>lógica</b> del proceso se divide en <b>páginas</b> del mismo tamaño P.</li><li>La memoria <b>física</b> se divide en <b>marcos</b> (<i>frames</i>) del mismo tamaño P.</li><li>Cada página se guarda en un marco libre, el que sea: no tienen que estar seguidos.</li></ul><p>Aquí, sin memoria virtual, <b>todas las páginas del proceso se cargan</b> antes de ejecutarlo.</p><h3>La tabla de páginas</h3><p>Como las páginas quedan salteadas, cada proceso tiene una <b>tabla de páginas</b> que dice en qué marco quedó cada página. La MMU la usa para traducir cada dirección lógica L en tres pasos:</p><ol><li><b>Número de página:</b> página = L ÷ P (división entera).</li><li><b>Desplazamiento</b> dentro de la página: d = L mod P (el residuo).</li><li>Busca el marco en la tabla y calcula: <b>física = marco · P + d</b>.</li></ol><p>El desplazamiento no cambia: la dirección queda en la misma posición dentro del marco que tenía dentro de la página.</p><h3>Fragmentación: adiós a la externa, hola a la interna</h3><p>Como cualquier marco libre sirve, <b>no hay fragmentación externa</b>. Pero el último pedazo del proceso casi nunca llena una página completa, así que se desperdicia el resto del último marco: eso es <b>fragmentación interna</b>.</p><p class=\"math\">fragmentación interna = ⌈tamaño ÷ P⌉ · P − tamaño</p><p>Con páginas más pequeñas se desperdicia menos, pero la tabla de páginas crece.</p><div class=\"recap\"><b>Para recordar.</b> Página = L ÷ P, desplazamiento = L mod P, física = marco · P + desplazamiento. La paginación no tiene fragmentación externa, pero sí interna.</div>",
 mc: 'Imagina el mundo guardado en estantes iguales: dos trozos vecinos del proceso pueden terminar en estantes muy separados.',
 example: '<p>Página de 4 bytes y tabla [5, 6, 1, 2]. Dirección lógica 13:</p><p class="math">página 3, desplazamiento 1 → marco 2 → física = 2·4 + 1 = 9</p><p>Un proceso de 72 766 bytes con páginas de 2 048 usa 36 páginas y desperdicia 962 bytes.</p>',
 code: 'page   = logical // pageSize\noffset = logical %  pageSize\nreturn pageTable[page] * pageSize + offset',
 quiz: { q: 'Con la misma tabla [5, 6, 1, 2] y páginas de 4, ¿cuál es la dirección física de la lógica 6?', options: ['26', '10', '6'], hint: 'Primero calcula 6 ÷ 4 y 6 mod 4.', why: 'Página 1 → marco 6 → 6·4 + 2 = 26.' } },
en: { title: 'Paging', goal: 'Translate a logical address and compute internal fragmentation.',
 story: 'What if the process did not need chests that are next to each other?',
 body: "<h3>What if the process did not have to be in one block?</h3><p>External fragmentation appears because each process needs one unbroken block. <b>Paging</b> removes that requirement: the process is split into equal pieces that can go anywhere in RAM.</p><h3>Pages and frames</h3><ul><li>The process’s <b>logical</b> memory is divided into <b>pages</b> of the same size P.</li><li><b>Physical</b> memory is divided into <b>frames</b> of the same size P.</li><li>Each page is stored in any free frame: they do not have to be next to each other.</li></ul><p>Here, without virtual memory, <b>all of a process’s pages are loaded</b> before it runs.</p><h3>The page table</h3><p>Since the pages end up scattered, each process has a <b>page table</b> that says which frame holds each page. The MMU uses it to translate each logical address L in three steps:</p><ol><li><b>Page number:</b> page = L ÷ P (integer division).</li><li><b>Offset</b> inside the page: d = L mod P (the remainder).</li><li>Look up the frame in the table and compute: <b>physical = frame · P + d</b>.</li></ol><p>The offset does not change: the address keeps the same position inside the frame that it had inside the page.</p><h3>Fragmentation: goodbye external, hello internal</h3><p>Since any free frame will do, <b>there is no external fragmentation</b>. But the last piece of the process almost never fills a whole page, so the rest of the last frame is wasted: that is <b>internal fragmentation</b>.</p><p class=\"math\">internal fragmentation = ⌈size ÷ P⌉ · P − size</p><p>Smaller pages waste less, but the page table grows.</p><div class=\"recap\"><b>Remember.</b> Page = L ÷ P, offset = L mod P, physical = frame · P + offset. Paging has no external fragmentation, but it does have internal fragmentation.</div>",
 mc: 'Picture the world stored on identical shelves: two neighbouring pieces of a process may end up on shelves far apart.',
 example: '<p>4-byte pages and table [5, 6, 1, 2]. Logical address 13:</p><p class="math">page 3, offset 1 → frame 2 → physical = 2·4 + 1 = 9</p><p>A 72,766-byte process with 2,048-byte pages uses 36 pages and wastes 962 bytes.</p>',
 code: 'page   = logical // pageSize\noffset = logical %  pageSize\nreturn pageTable[page] * pageSize + offset',
 quiz: { q: 'With the same table [5, 6, 1, 2] and 4-byte pages, what is the physical address of logical 6?', options: ['26', '10', '6'], hint: 'First compute 6 ÷ 4 and 6 mod 4.', why: 'Page 1 → frame 6 → 6·4 + 2 = 26.' } },
answer: 0 },

{ id: 'segmentation', zone: 'mine', lab: { route: 'segmentation' },
es: { title: 'Segmentación', goal: 'Validar un par (segmento, desplazamiento) y traducirlo.',
 story: 'Un programa no es un bloque sin forma: tiene código, datos, pila…',
 body: "<h3>La memoria como la ve el programador</h3><p>Un programador no piensa en su programa como una fila de bytes, sino como partes con sentido: el <b>código</b>, los <b>datos</b>, la <b>pila</b>, una biblioteca. La <b>segmentación</b> organiza la memoria siguiendo esa misma idea: cada parte del programa es un <b>segmento</b> de tamaño variable.</p><h3>Direcciones de dos partes</h3><p>Con segmentación, una dirección lógica ya no es un solo número, sino un par <b>(s, d)</b>:</p><ul><li><b>s:</b> el número de segmento (por ejemplo, 0 = código, 1 = datos, 2 = pila).</li><li><b>d:</b> el desplazamiento dentro de ese segmento.</li></ul><h3>La tabla de segmentos</h3><p>Cada proceso tiene una <b>tabla de segmentos</b>. Para cada segmento guarda su <b>base</b> (dónde empieza en la RAM) y su <b>límite</b> (cuánto mide). Para traducir (s, d), el hardware hace tres pasos:</p><ol><li>¿Existe el segmento s? Si no, error.</li><li>¿Es d menor que el límite de ese segmento? Si no, error de protección.</li><li>Si todo está bien: <b>física = base[s] + d</b>.</li></ol><p>Es como tener un registro base y un límite para cada parte del programa.</p><h3>Paginación contra segmentación</h3><table><tr><th></th><th>Paginación</th><th>Segmentación</th></tr><tr><td>Tamaño de las partes</td><td>Fijo (todas las páginas iguales)</td><td>Variable (cada segmento mide lo que necesita)</td></tr><tr><td>Fragmentación típica</td><td>Interna</td><td>Externa (cada segmento se ubica con una política de huecos)</td></tr><tr><td>¿Tiene sentido para el programador?</td><td>No: corta el programa en cualquier punto</td><td>Sí: cada segmento es una parte lógica</td></tr></table><p>Algunos procesadores, como los Intel de 32 bits, combinan las dos: primero segmentan y luego paginan cada segmento.</p><div class=\"recap\"><b>Para recordar.</b> Dirección = (s, d). Se revisa que s exista y que d &lt; límite; luego física = base + d. La segmentación sigue la estructura del programa, pero tiene fragmentación externa.</div>",
 mc: 'Es como construir por partes (casa, granja, bodega): cada una con su propio terreno y su propia cerca.',
 example: '<p>Segmento 0: base 1000, límite 400. Segmento 1: base 3000, límite 120.</p><table><tr><th>(s, d)</th><th>Resultado</th></tr><tr><td>(0, 399)</td><td>1399</td></tr><tr><td>(1, 100)</td><td>3100</td></tr><tr><td>(1, 120)</td><td>error: fuera del límite</td></tr></table>',
 code: 'if s >= table.length:        trap\nif d >= table[s].limit:      trap\nreturn table[s].base + d',
 quiz: { q: 'Segmento con base 500 y límite 200. ¿Qué pasa con d = 250?', options: ['Error: d no es menor que el límite', 'Física 750', 'Física 250'], hint: 'Valida antes de sumar.', why: '250 ≥ 200, así que el hardware genera una excepción.' } },
en: { title: 'Segmentation', goal: 'Validate a (segment, offset) pair and translate it.',
 story: 'A program is not a shapeless lump: it has code, data, a stack…',
 body: "<h3>Memory as the programmer sees it</h3><p>A programmer does not think of a program as a row of bytes, but as meaningful parts: the <b>code</b>, the <b>data</b>, the <b>stack</b>, a library. <b>Segmentation</b> organises memory following the same idea: each part of the program is a <b>segment</b> of variable size.</p><h3>Two-part addresses</h3><p>With segmentation, a logical address is no longer a single number, but a pair <b>(s, d)</b>:</p><ul><li><b>s:</b> the segment number (for example, 0 = code, 1 = data, 2 = stack).</li><li><b>d:</b> the offset inside that segment.</li></ul><h3>The segment table</h3><p>Each process has a <b>segment table</b>. For each segment it stores its <b>base</b> (where it starts in RAM) and its <b>limit</b> (how big it is). To translate (s, d), the hardware takes three steps:</p><ol><li>Does segment s exist? If not, error.</li><li>Is d less than that segment’s limit? If not, protection error.</li><li>If all is well: <b>physical = base[s] + d</b>.</li></ol><p>It is like having a base register and a limit for each part of the program.</p><h3>Paging versus segmentation</h3><table><tr><th></th><th>Paging</th><th>Segmentation</th></tr><tr><td>Size of the parts</td><td>Fixed (all pages are equal)</td><td>Variable (each segment is as big as it needs)</td></tr><tr><td>Typical fragmentation</td><td>Internal</td><td>External (each segment is placed with a hole policy)</td></tr><tr><td>Meaningful to the programmer?</td><td>No: it cuts the program at any point</td><td>Yes: each segment is a logical part</td></tr></table><p>Some processors, such as 32-bit Intel ones, combine both: they segment first and then page each segment.</p><div class=\"recap\"><b>Remember.</b> Address = (s, d). Check that s exists and that d &lt; limit; then physical = base + d. Segmentation follows the program’s structure, but has external fragmentation.</div>",
 mc: 'It is like building in parts (house, farm, storage): each with its own land and its own fence.',
 example: '<p>Segment 0: base 1000, limit 400. Segment 1: base 3000, limit 120.</p><table><tr><th>(s, d)</th><th>Result</th></tr><tr><td>(0, 399)</td><td>1399</td></tr><tr><td>(1, 100)</td><td>3100</td></tr><tr><td>(1, 120)</td><td>error: beyond the limit</td></tr></table>',
 code: 'if s >= table.length:        trap\nif d >= table[s].limit:      trap\nreturn table[s].base + d',
 quiz: { q: 'A segment has base 500 and limit 200. What happens with d = 250?', options: ['Error: d is not below the limit', 'Physical 750', 'Physical 250'], hint: 'Validate before adding.', why: '250 ≥ 200, so the hardware raises an exception.' } },
answer: 0 }

);

<script>
/* In-site manual, teacher guide, glossary and about page. CC0-1.0. */
window.MineOS = window.MineOS || {};
window.MineOS.pages = {
manual: {
es: `<h2>1. Para empezar</h2><p>Abre la página: no necesitas cuenta ni instalar nada. Cambia de idioma con los botones <b>ES / EN</b>. Cambiar de idioma conserva la página y los datos de los laboratorios.</p>
<h2>2. El mundo de bloques</h2><table><tr><th>Acción</th><th>Teclado y ratón</th><th>Pantalla táctil</th></tr><tr><td>Mirar</td><td>Arrastrar</td><td>Arrastrar</td></tr><tr><td>Caminar</td><td>W A S D o flechas</td><td>Botones en pantalla</td></tr><tr><td>Saltar</td><td>Espacio</td><td>Botón ⤒</td></tr><tr><td>Viajar a una estación</td><td>Teclas 1–5</td><td>Barra inferior</td></tr><tr><td>Entrar a una estación</td><td>E o el botón «Entrar»</td><td>Botón «Entrar»</td></tr><tr><td>Volver al punto de partida</td><td>Botón «Volver al inicio»</td><td>Botón «Volver al inicio»</td></tr></table><p>El mundo es para recorrerlo: no se pueden poner ni quitar bloques, y una pared invisible en la orilla evita caer al agua. Para usar las teclas, primero haz clic en el mundo. Si prefieres no usar el 3D, la lista de estaciones debajo del mundo ofrece todo el contenido.</p>
<h2>3. La ruta de aprendizaje</h2><p>Cada lección tiene: objetivo, situación, explicación, ejemplo resuelto, pseudocódigo cuando aplica, reto, pista y solución. Al pulsar «Comprobar» aparece junto a la opción elegida un ✔ verde (correcta) o una ✘ roja (incorrecta). Cada reto termina de una de dos formas: <b>éxito</b> (aciertas con «Comprobar») o <b>skip</b> («Ver solución»: muestra la respuesta y abre la siguiente lección, pero no cuenta como éxito ni como fallo). Cada respuesta incorrecta antes de terminar el reto cuenta como <b>fallo</b>. La barra de «Mi ruta» solo avanza con los éxitos, y debajo aparece el recuento: éxitos, fallos y skips.</p><p><b>Orden:</b> dentro de cada mundo las lecciones se abren una tras otra (🔒 = bloqueada). Puedes pasar de un mundo a otro cuando quieras; por ejemplo, avanzar en la Mina y luego volver a la Aldea.</p>
<h2>4. Laboratorio de planificadores</h2><ol><li>Elige un escenario: se carga al instante. También puedes editar la tabla.</li><li>En ráfagas escribe <code>5</code> (solo CPU) o <code>2,3,2</code> (CPU, I/O, CPU).</li><li>Elige algoritmo y parámetros. Escribe tu predicción.</li><li>Pulsa «Reproducir» (verde) para verlo correr, o «Un paso» para avanzar despacio, y lee la explicación de cada decisión.</li><li>Al terminar, la página te dice si tu predicción fue correcta.</li><li>Al terminar revisa el Gantt, la tabla de intervalos y las métricas.</li><li>Usa «Comparar todos» para ver la misma carga con los ocho algoritmos.</li></ol>
<h2>5. Servidor: antes y después</h2><p>Elige un servidor de ejemplo o define jugadores, criaturas, circuitos y semilla. Cambiar un valor no ejecuta nada: pulsa «▶ Simular» para correr la simulación (el resultado anterior se ve gris hasta entonces). Los ticks se dibujan uno a uno, las tarjetas comparan antes y después y «¿Quién espera?» muestra qué tareas ganan o pierden. «Antes» siempre es FCFS sin presupuesto. Compara Priority con y sin presupuesto: sin presupuesto cambian las esperas pero no los TPS.</p>
<h2>6. Laboratorios de memoria</h2><ul><li><b>Asignación contigua:</b> cada línea de eventos es <code>nombre inicio fin tamaño</code>. Si dos eventos ocurren a la vez, primero se libera. «Compactar» solo ocurre cuando lo pides. «Reproducir» muestra cada evento en orden.</li><li><b>Paginación:</b> indica marcos ocupados y observa en cuáles queda el proceso. Nada se calcula hasta pulsar «▶ Calcular». Escribe tu respuesta antes y la página te dice si acertaste.</li><li><b>Segmentación:</b> cada línea es <code>nombre base límite</code>. También puedes escribir tu respuesta o «error».</li></ul>
<h2>7. Mini UR-OS</h2><ul><li>Junta la CPU y la memoria en una sola simulación, como el simulador UR-OS del curso.</li><li>Elige un escenario, el planificador y el método de memoria (asignación contigua, paginación o segmentación). En la columna de memoria escribe el tamaño en bytes; con segmentación, los tamaños de cada segmento separados por comas (código, datos, pila).</li><li>Avanza con «Un paso» y mira tres cosas: la <b>cola de trabajos</b> (procesos que aún no caben en memoria), el <b>mapa de la RAM</b> y las <b>tablas de cada proceso</b>.</li><li>En «Traduce una dirección» elige un proceso cargado y escribe una dirección lógica: la página muestra la cuenta completa hasta la dirección física, o el error de protección.</li></ul>
<h2>8. Accesibilidad y problemas comunes</h2><ul><li>Todo se puede usar con teclado; los diagramas tienen tabla equivalente.</li><li>Si el sistema pide reducir movimiento, las nubes y demostraciones animadas se detienen.</li><li><b>No se ve el mundo:</b> activa la aceleración gráfica o usa las tarjetas.</li><li><b>Se borró el avance:</b> se guarda solo en el navegador; el modo privado o borrar datos lo elimina. Algunas vistas previas (por ejemplo, la de una app de chat o de archivos) no permiten guardar: abre el archivo directamente en el navegador.</li></ul>`,
en: `<h2>1. Getting started</h2><p>Open the page: no account or installation needed. Switch language with the <b>ES / EN</b> buttons. Switching keeps the current page and lab data.</p>
<h2>2. The block world</h2><table><tr><th>Action</th><th>Keyboard and mouse</th><th>Touch screen</th></tr><tr><td>Look</td><td>Drag</td><td>Drag</td></tr><tr><td>Walk</td><td>W A S D or arrows</td><td>On-screen buttons</td></tr><tr><td>Jump</td><td>Space</td><td>⤒ button</td></tr><tr><td>Travel to a station</td><td>Keys 1–5</td><td>Bottom bar</td></tr><tr><td>Enter a station</td><td>E or the “Enter” button</td><td>“Enter” button</td></tr><tr><td>Go back to the starting point</td><td>“Back to start” button</td><td>“Back to start” button</td></tr></table><p>The world is for exploring: blocks cannot be placed or removed, and an invisible wall at the shore keeps you from falling into the water. Click the world before using the keys. If you prefer not to use 3D, the station list below the world offers all the content.</p>
<h2>3. The learning path</h2><p>Each lesson has: goal, situation, explanation, solved example, pseudocode where relevant, challenge, hint and solution. Pressing “Check” puts a green ✔ (right) or a red ✘ (wrong) next to the chosen option. Each challenge ends in one of two ways: <b>success</b> (right answer with “Check”) or <b>skip</b> (“Show solution”: it shows the answer and opens the next lesson, but counts as neither success nor failure). Each wrong answer before the challenge ends counts as a <b>failure</b>. The “My path” bar only moves with successes, and below it you see the count of successes, failures and skips.</p><p><b>Order:</b> inside each world the lessons open one after another (🔒 = locked). You can move between worlds whenever you like; for example, progress in the Mine and then go back to the Village.</p>
<h2>4. Scheduler lab</h2><ol><li>Pick a scenario: it loads at once. You can also edit the table.</li><li>For bursts type <code>5</code> (CPU only) or <code>2,3,2</code> (CPU, I/O, CPU).</li><li>Choose algorithm and parameters. Type your prediction.</li><li>Press “Play” (green) to watch it run, or “One step” to go slowly, and read why each decision was made.</li><li>At the end, the page tells you whether your prediction was right.</li><li>At the end, review the Gantt chart, interval table and metrics.</li><li>Use “Compare all” to see the same workload under all eight algorithms.</li></ol>
<h2>5. Server: before and after</h2><p>Pick an example server or set players, creatures, circuits and seed. Changing a value runs nothing: press “▶ Simulate” to run it (the previous result is greyed out until then). Ticks are drawn one by one, the cards compare before and after, and “Who waits?” shows which tasks win or lose. “Before” is always FCFS without a budget. Compare Priority with and without the budget: without it, waiting changes but TPS do not.</p>
<h2>6. Memory labs</h2><ul><li><b>Contiguous allocation:</b> each event line is <code>name start end size</code>. When two events happen at once, releases go first. “Compact” only happens when you ask. “Play” shows each event in order.</li><li><b>Paging:</b> list the busy frames and see where the process lands. Nothing is calculated until you press “▶ Calculate”. Type your answer before it and the page tells you if you got it right.</li><li><b>Segmentation:</b> each line is <code>name base limit</code>. You can also type your answer or “error”.</li></ul>
<h2>7. Mini UR-OS</h2><ul><li>It puts the CPU and memory together in one simulation, like the UR-OS simulator used in the course.</li><li>Choose a scenario, the scheduler and the memory method (contiguous allocation, paging or segmentation). In the memory column type the size in bytes; with segmentation, the size of each segment separated by commas (code, data, stack).</li><li>Step forward with “One step” and watch three things: the <b>job queue</b> (processes that do not fit in memory yet), the <b>RAM map</b> and <b>each process’s table</b>.</li><li>In “Translate an address” pick a loaded process and type a logical address: the page shows the full calculation down to the physical address, or the protection error.</li></ul>
<h2>8. Accessibility and common problems</h2><ul><li>Everything works with a keyboard; diagrams have an equivalent table.</li><li>If your system asks for reduced motion, clouds and animated demos stop.</li><li><b>The world does not show:</b> enable hardware acceleration or use the cards.</li><li><b>Progress disappeared:</b> it is stored only in the browser; private mode or clearing data removes it. Some previews (for example in a chat or file app) cannot save: open the file directly in your browser.</li></ul>`
},
teach: {
es: `<p><b>Público:</b> estudiantes de colegio (aprox. 15–18 años) con poca experiencia en programación. Los tiempos son estimaciones de diseño: aún no se han probado con estudiantes.</p>
<h2>Taller STEAM sugerido (90 minutos)</h2><table><tr><th>Min</th><th>Actividad</th></tr><tr><td>0–10</td><td><b>Gancho: ¿por qué hay lag?</b> Proyectar la página y recorrer el mundo de bloques. Abrir la conversación con la experiencia de los estudiantes en juegos en línea (ver detalle abajo).</td></tr><tr><td>10–25</td><td><b>Juego sin computador:</b> siete estudiantes representan procesos, planificador y CPU. Se juega primero FCFS y luego Round Robin, y se comparan las esperas (ver detalle abajo).</td></tr><tr><td>25–50</td><td>Lecciones de métricas, FCFS y Round Robin + laboratorio</td></tr><tr><td>50–70</td><td><b>Memoria con piezas:</b> una fila de 20 casillas en papel y fichas de distintos largos. Probar First, Best y Worst Fit. Verificar en el laboratorio.</td></tr><tr><td>70–90</td><td>Reto de ingeniería en el laboratorio del servidor: lograr 20 TPS y explicar qué se sacrificó.</td></tr></table>
<h2>Detalle de los primeros 25 minutos</h2><h3>Minutos 0–10: el gancho</h3><p><b>Objetivo:</b> que los estudiantes sientan que el tema les importa antes de ver teoría. No se explica nada técnico todavía.</p><ol><li>Proyecte la página principal y camine por el mundo de bloques mostrando las cinco estaciones. El mundo 3D en sí no tiene lag: solo sirve para presentar el sitio.</li><li>Pregunte: <i>«¿Alguna vez un juego en línea se les puso lento? ¿Qué pasaba?»</i>. Respuestas típicas: los bloques tardan en romperse, los animales se mueven a saltos, las puertas abren tarde.</li><li>Pregunte: <i>«¿Por qué creen que pasa?»</i>. Suelen decir: «hay muchos jugadores», «el computador es malo», «es el internet». Todas son razonables.</li><li>Lleve la conversación a la idea clave: <b>un solo computador tiene muchísimas tareas y poco tiempo</b>. Un servidor de Minecraft tiene 50 milisegundos para hacer todo el trabajo de cada paso del juego; si no alcanza, aparece el lag. Entonces tiene que <b>decidir en qué orden hace las tareas</b>. Quien toma esa decisión se llama <b>planificador</b>, y eso es lo que van a jugar ahora.</li></ol><h3>Minutos 10–25: el juego sin computador</h3><p><b>Materiales:</b> cinco tarjetas de papel, un marcador, un cronómetro (el del celular sirve) y el tablero.</p><p><b>Papeles:</b></p><table><tr><th>Papel</th><th>Cuántos</th><th>Qué hace</th></tr><tr><td>Proceso</td><td>5 estudiantes (A, B, C, D, E)</td><td>Cada uno tiene una tarjeta con su <b>ráfaga</b>: los segundos de CPU que necesita. Use A = 8, B = 2, C = 1, D = 4, E = 3.</td></tr><tr><td>Planificador</td><td>1 estudiante</td><td>Decide quién pasa a la CPU, siguiendo la regla de la ronda.</td></tr><tr><td>CPU</td><td>1 estudiante</td><td>Se para en un lugar del salón (la «CPU») y cuenta en voz alta los segundos que el proceso pasa a su lado.</td></tr><tr><td>Registradores</td><td>El resto del grupo</td><td>Anotan en el tablero cuándo empieza y cuándo termina cada proceso.</td></tr></table><p><b>Ronda 1: FCFS (el primero que llega es el primero en ser atendido).</b> Los cinco procesos hacen fila en el orden A, B, C, D, E. El planificador manda al primero a la CPU; el proceso se queda ahí todos los segundos de su tarjeta y luego se sienta. Pasa el siguiente. Resultado esperado:</p><table><tr><th>Proceso</th><th>Ráfaga</th><th>Empieza en</th><th>Termina en</th><th>Espera</th></tr><tr><td>A</td><td>8</td><td>0</td><td>8</td><td>0</td></tr><tr><td>B</td><td>2</td><td>8</td><td>10</td><td>8</td></tr><tr><td>C</td><td>1</td><td>10</td><td>11</td><td>10</td></tr><tr><td>D</td><td>4</td><td>11</td><td>15</td><td>11</td></tr><tr><td>E</td><td>3</td><td>15</td><td>18</td><td>15</td></tr></table><p>Espera media = (0 + 8 + 10 + 11 + 15) ÷ 5 = <b>8,8 segundos</b>. Pregunte a C cómo se sintió: necesitaba 1 segundo y esperó 10 por estar detrás de A. Esto se llama <b>efecto convoy</b>.</p><p><b>Ronda 2: Round Robin con quantum de 2 segundos.</b> Misma fila y mismas tarjetas, con una regla nueva: <b>nadie usa la CPU más de 2 segundos seguidos</b>. Si a un proceso se le acaban los 2 segundos y no ha terminado, tacha en su tarjeta lo que ya hizo, escribe lo que le falta y vuelve al <b>final</b> de la fila. Si termina antes, se sienta de inmediato.</p><div class="flow">A (2 s, le faltan 6) → B (2 s, termina) → C (1 s, termina) → D (2 s, le faltan 2) → E (2 s, le falta 1) → A (2 s, le faltan 4) → D (2 s, termina) → E (1 s, termina) → A (4 s, termina)</div><p>Al final A queda solo en la fila: recibe varios turnos seguidos. Esperas: A = 10, B = 2, C = 4, D = 9, E = 11. Espera media = 36 ÷ 5 = <b>7,2 segundos</b>.</p><p><b>Cierre (2–3 minutos):</b> compare las dos tablas con el grupo y pregunte: <i>«¿Quién ganó y quién perdió con el cambio de regla?»</i>. Las conclusiones que deben salir:</p><ul><li>Con Round Robin los procesos cortos esperan mucho menos (C pasó de 10 a 4 segundos).</li><li>A, el largo, esperó más (de 0 a 10 segundos).</li><li>El trabajo total fue el mismo: 18 segundos en las dos rondas. Solo cambió <b>quién espera</b>. Ningún algoritmo es gratis: siempre alguien paga el costo.</li></ul><p><b>Consejos:</b> si el grupo es grande, haga dos juegos a la vez con equipos distintos. Si no hay cronómetro, la CPU puede contar con aplausos (un aplauso = un segundo). En los minutos 25–50 los estudiantes pueden cargar estos mismos números en el laboratorio de CPU (FCFS y luego Round Robin con quantum 2) y comprobar que obtienen las mismas esperas del tablero.</p>
<h2>Conexiones STEAM</h2><ul><li><b>Ciencia:</b> hipótesis, experimento con semilla y comparación.</li><li><b>Tecnología:</b> qué hace un sistema operativo.</li><li><b>Ingeniería:</b> compromisos de diseño.</li><li><b>Arte:</b> diseñar en el mundo o en papel una representación de una cola o una memoria.</li><li><b>Matemáticas:</b> promedios, división entera, residuo y percentiles.</li></ul>
<h2>Segunda sesión sugerida (90 minutos)</h2><table><tr><th>Min</th><th>Actividad</th></tr><tr><td>0–20</td><td>Lecciones de la Aldea: crear procesos y comunicación entre procesos. Actividad: dos estudiantes se pasan mensajes por un «buzón» (una caja) y luego por una pizarra compartida; comparar qué es más rápido y qué genera más confusión.</td></tr><tr><td>20–45</td><td>Interbloqueos con objetos reales: cuatro estudiantes en círculo, cada uno necesita dos lápices y solo hay cuatro. Ver cómo se bloquean y probar la regla de pedir los lápices en orden numérico. Después, las lecciones del Cruce de Vagonetas.</td></tr><tr><td>45–65</td><td>Direcciones lógicas y físicas: cada estudiante escribe una «dirección» relativa a su puesto y otro la convierte en una posición absoluta del salón. Luego, las lecciones de paginación y segmentación.</td></tr><tr><td>65–90</td><td>Torre de Control: con el Mini UR-OS, encontrar un escenario donde un proceso espere por memoria aunque la CPU esté libre, y explicar por qué.</td></tr></table>
<h2>Rúbrica de retroalimentación</h2><table><tr><th>Dimensión</th><th>Inicial</th><th>Suficiente</th><th>Sólida</th></tr><tr><td>Procedimiento</td><td>Traza incompleta</td><td>Traza válida</td><td>Localiza y explica divergencias</td></tr><tr><td>Resultado</td><td>Sin justificar</td><td>Con unidades</td><td>Verificado por otro método</td></tr><tr><td>Compromisos</td><td>Dice cuál es “mejor”</td><td>Dice para qué métrica</td><td>Explica quién paga el costo</td></tr></table>
<p>Es una herramienta de acompañamiento, no una calificación oficial. El material es de dominio público (CC0): puedes copiarlo, adaptarlo y publicarlo.</p>`,
en: `<p><b>Audience:</b> school students (about 15–18) with little programming experience. Timings are design estimates: they have not yet been tested with students.</p>
<h2>Suggested STEAM workshop (90 minutes)</h2><table><tr><th>Min</th><th>Activity</th></tr><tr><td>0–10</td><td><b>Hook: why is there lag?</b> Project the site and walk around the block world. Start the conversation from the students’ experience with online games (see details below).</td></tr><tr><td>10–25</td><td><b>Unplugged game:</b> seven students act as processes, scheduler and CPU. Play FCFS first and then Round Robin, and compare the waiting times (see details below).</td></tr><tr><td>25–50</td><td>Lessons on metrics, FCFS and Round Robin + lab</td></tr><tr><td>50–70</td><td><b>Memory with pieces:</b> a row of 20 paper cells and strips of different lengths. Try First, Best and Worst Fit. Check in the lab.</td></tr><tr><td>70–90</td><td>Engineering challenge in the server lab: reach 20 TPS and explain what was sacrificed.</td></tr></table>
<h2>Details of the first 25 minutes</h2><h3>Minutes 0–10: the hook</h3><p><b>Goal:</b> make students feel the topic matters before any theory. Nothing technical is explained yet.</p><ol><li>Project the home page and walk around the block world, showing the five stations. The 3D world itself has no lag: it only introduces the site.</li><li>Ask: <i>“Has an online game ever got slow on you? What happened?”</i> Typical answers: blocks take long to break, animals move in jumps, doors open late.</li><li>Ask: <i>“Why do you think it happens?”</i> They usually say: “too many players”, “the computer is bad”, “it is the internet”. All are reasonable.</li><li>Steer the conversation to the key idea: <b>one computer has a huge number of tasks and little time</b>. A Minecraft server has 50 milliseconds to do all the work of each game step; if it does not make it, lag appears. So it has to <b>decide in what order it does the tasks</b>. Whoever makes that decision is called the <b>scheduler</b>, and that is what they are going to play now.</li></ol><h3>Minutes 10–25: the unplugged game</h3><p><b>Materials:</b> five paper cards, a marker, a stopwatch (a phone works) and the board.</p><p><b>Roles:</b></p><table><tr><th>Role</th><th>How many</th><th>What they do</th></tr><tr><td>Process</td><td>5 students (A, B, C, D, E)</td><td>Each holds a card with their <b>burst</b>: the seconds of CPU they need. Use A = 8, B = 2, C = 1, D = 4, E = 3.</td></tr><tr><td>Scheduler</td><td>1 student</td><td>Decides who goes to the CPU, following the round’s rule.</td></tr><tr><td>CPU</td><td>1 student</td><td>Stands in one spot in the room (the “CPU”) and counts out loud the seconds a process spends beside them.</td></tr><tr><td>Recorders</td><td>The rest of the class</td><td>Write on the board when each process starts and finishes.</td></tr></table><p><b>Round 1: FCFS (first come, first served).</b> The five processes line up in the order A, B, C, D, E. The scheduler sends the first one to the CPU; the process stays there for all the seconds on its card and then sits down. The next one goes. Expected result:</p><table><tr><th>Process</th><th>Burst</th><th>Starts at</th><th>Ends at</th><th>Waiting</th></tr><tr><td>A</td><td>8</td><td>0</td><td>8</td><td>0</td></tr><tr><td>B</td><td>2</td><td>8</td><td>10</td><td>8</td></tr><tr><td>C</td><td>1</td><td>10</td><td>11</td><td>10</td></tr><tr><td>D</td><td>4</td><td>11</td><td>15</td><td>11</td></tr><tr><td>E</td><td>3</td><td>15</td><td>18</td><td>15</td></tr></table><p>Average waiting = (0 + 8 + 10 + 11 + 15) ÷ 5 = <b>8.8 seconds</b>. Ask C how it felt: it needed 1 second and waited 10 because it was behind A. This is called the <b>convoy effect</b>.</p><p><b>Round 2: Round Robin with a 2-second quantum.</b> Same line and same cards, with a new rule: <b>nobody uses the CPU for more than 2 seconds in a row</b>. If a process runs out of its 2 seconds and has not finished, it crosses out what it did on its card, writes what it still needs and goes to the <b>back</b> of the line. If it finishes earlier, it sits down at once.</p><div class="flow">A (2 s, 6 left) → B (2 s, done) → C (1 s, done) → D (2 s, 2 left) → E (2 s, 1 left) → A (2 s, 4 left) → D (2 s, done) → E (1 s, done) → A (4 s, done)</div><p>At the end A is alone in the line: it gets several turns in a row. Waiting times: A = 10, B = 2, C = 4, D = 9, E = 11. Average waiting = 36 ÷ 5 = <b>7.2 seconds</b>.</p><p><b>Wrap-up (2–3 minutes):</b> compare the two tables with the class and ask: <i>“Who won and who lost when the rule changed?”</i> The conclusions that should come out:</p><ul><li>With Round Robin, short processes wait much less (C went from 10 to 4 seconds).</li><li>A, the long one, waited more (from 0 to 10 seconds).</li><li>The total work was the same: 18 seconds in both rounds. Only <b>who waits</b> changed. No algorithm is free: someone always pays the cost.</li></ul><p><b>Tips:</b> with a large class, run two games at once with different teams. Without a stopwatch, the CPU can count with claps (one clap = one second). In minutes 25–50 students can enter these same numbers in the CPU lab (FCFS, then Round Robin with quantum 2) and check that they get the same waiting times as on the board.</p>
<h2>STEAM connections</h2><ul><li><b>Science:</b> hypothesis, seeded experiment and comparison.</li><li><b>Technology:</b> what an operating system does.</li><li><b>Engineering:</b> design trade-offs.</li><li><b>Art:</b> design a picture of a queue or a memory, in the world or on paper.</li><li><b>Mathematics:</b> averages, integer division, remainder and percentiles.</li></ul>
<h2>Suggested second session (90 minutes)</h2><table><tr><th>Min</th><th>Activity</th></tr><tr><td>0–20</td><td>Village lessons: creating processes and interprocess communication. Activity: two students pass messages through a “mailbox” (a box) and then through a shared whiteboard; compare which is faster and which causes more confusion.</td></tr><tr><td>20–45</td><td>Deadlocks with real objects: four students in a circle, each needs two pencils and there are only four. Watch them get stuck and try the rule of picking up pencils in numerical order. Then, the Minecart Crossing lessons.</td></tr><tr><td>45–65</td><td>Logical and physical addresses: each student writes an “address” relative to their desk and another turns it into an absolute position in the classroom. Then, the paging and segmentation lessons.</td></tr><tr><td>65–90</td><td>Control Tower: with the Mini UR-OS, find a scenario where a process waits for memory even though the CPU is free, and explain why.</td></tr></table>
<h2>Feedback rubric</h2><table><tr><th>Dimension</th><th>Starting</th><th>Sufficient</th><th>Strong</th></tr><tr><td>Procedure</td><td>Incomplete trace</td><td>Valid trace</td><td>Finds and explains divergences</td></tr><tr><td>Result</td><td>Unjustified</td><td>With units</td><td>Checked by another method</td></tr><tr><td>Trade-offs</td><td>Says which is “best”</td><td>Says for which metric</td><td>Explains who pays the cost</td></tr></table>
<p>This supports feedback; it is not an official grade. The material is public domain (CC0): copy, adapt and publish it.</p>`
},
about: {
es: `<h2>Proyecto</h2><p>MineOS nació como proyecto final de Sistemas Operativos en la Universidad del Rosario (Bogotá). Esta versión lo convierte en un recurso abierto de promoción STEAM.</p><h2>Licencia</h2><p>El código, los textos y las texturas originales de este sitio se dedican al dominio público con <b>CC0 1.0</b>. Dos componentes de terceros conservan su propia licencia: <b>three.js</b> (MIT) y la fuente <b>VT323</b> (SIL OFL 1.1). Los nombres y marcas de terceros no se ceden.</p><h2>Minecraft</h2><p>Minecraft es una marca de Mojang / Microsoft. Aquí se menciona solo para explicar el contexto del modelo. El sitio no usa texturas, sonidos, logotipos, personajes ni código del juego.</p><h2>Límites</h2><ul><li>Es una simulación educativa: no es un kernel ni mide un servidor real.</li><li>Los costos de CPU son sintéticos.</li><li>Se modela un solo núcleo.</li><li>La memoria virtual (reemplazo de páginas, fallos de página) queda fuera del alcance.</li><li>No se ha hecho una prueba formal con estudiantes.</li></ul><h2>La Torre de Control y UR-OS</h2><p>La Torre de Control resume las entregas del curso, que se hicieron sobre el simulador UR-OS del profesor Pedro Wightman: planificadores de CPU (primera entrega) y gestión de memoria (segunda entrega). El laboratorio <b>Mini UR-OS</b> es una versión simplificada escrita desde cero para esta página, inspirada en UR-OS; no incluye su código.</p><h2>Para profundizar</h2><ul><li>Silberschatz, Galvin y Gagne, <i>Operating System Concepts</i>.</li><li>Arpaci-Dusseau, <i>Operating Systems: Three Easy Pieces</i>.</li><li>UR-OS, simulador académico creado por el profesor Pedro Wightman (no se redistribuye aquí).</li></ul>`,
en: `<h2>Project</h2><p>MineOS started as an Operating Systems final project at Universidad del Rosario (Bogotá). This version turns it into an open STEAM outreach resource.</p><h2>Licence</h2><p>The original code, text and textures of this site are dedicated to the public domain under <b>CC0 1.0</b>. Two third-party components keep their own licences: <b>three.js</b> (MIT) and the <b>VT323</b> font (SIL OFL 1.1). Third-party names and trademarks are not waived.</p><h2>Minecraft</h2><p>Minecraft is a trademark of Mojang / Microsoft. It is mentioned only to explain the context of the model. The site uses no textures, sounds, logos, characters or code from the game.</p><h2>Limits</h2><ul><li>It is an educational simulation: not a kernel, and it does not measure a real server.</li><li>CPU costs are synthetic.</li><li>A single core is modelled.</li><li>Virtual memory (page replacement, page faults) is out of scope.</li><li>No formal test with students has been run.</li></ul><h2>The Control Tower and UR-OS</h2><p>The Control Tower summarises the course deliverables, which were built on Professor Pedro Wightman’s UR-OS simulator: CPU schedulers (first deliverable) and memory management (second deliverable). The <b>Mini UR-OS</b> lab is a simplified version written from scratch for this site, inspired by UR-OS; it does not include its code.</p><h2>Further reading</h2><ul><li>Silberschatz, Galvin and Gagne, <i>Operating System Concepts</i>.</li><li>Arpaci-Dusseau, <i>Operating Systems: Three Easy Pieces</i>.</li><li>UR-OS, an academic simulator created by Professor Pedro Wightman (not redistributed here).</li></ul>`
},
glossary: [
 ['sched', 'Planificador', 'Scheduler', 'Parte del SO que elige qué proceso listo usa la CPU.', 'The part of the OS that picks which ready process gets the CPU.', 'metrics'],
 ['proc', 'Proceso', 'Process', 'Programa en ejecución con su estado y memoria.', 'A program in execution, with its state and memory.', 'process'],
 ['pcb', 'Bloque de control de proceso', 'PCB', 'Ficha con la información necesaria para administrar y reanudar un proceso.', 'Record with the information needed to manage and resume a process.', 'process'],
 ['thread', 'Hilo', 'Thread', 'Línea de ejecución dentro de un proceso.', 'A line of execution inside a process.', 'tick'],

  const procops = { id: 'procops', zone: 'village', lab: null,
es: { title: 'Crear y terminar procesos', goal: 'Seguir fork, exec, wait y exit, y reconocer procesos zombi y huérfanos.',
 story: 'Escribes un comando en la terminal y aparece un programa nuevo. ¿Quién lo creó? Otro proceso: la propia terminal.',
 body: "<h3>Cada proceso tiene un número y un padre</h3><p>El SO identifica a cada proceso con un número único, el <b>PID</b>. Un proceso puede crear otros: el que crea es el <b>padre</b> y los creados son sus <b>hijos</b>. Como los hijos también pueden crear procesos, se forma un <b>árbol de procesos</b>. En Linux la raíz del árbol es <code>systemd</code>, con PID 1.</p><h3>Las cuatro llamadas clave</h3><p>En sistemas tipo UNIX (Linux, macOS) la vida de un proceso se maneja con cuatro llamadas al sistema:</p><table><tr><th>Llamada</th><th>Qué hace</th></tr><tr><td><code>fork()</code></td><td>Crea un hijo que es una <b>copia</b> del padre. Los dos siguen desde la línea siguiente. Para saber quién es quién, <code>fork()</code> devuelve <b>0</b> al hijo y el <b>PID del hijo</b> al padre (y un número negativo si falla)</td></tr><tr><td><code>exec()</code></td><td><b>Reemplaza</b> el programa del proceso por otro. El PID no cambia, pero ahora ejecuta un programa distinto</td></tr><tr><td><code>wait()</code></td><td>El padre se detiene hasta que un hijo termine, y recibe su código de salida</td></tr><tr><td><code>exit()</code></td><td>El proceso termina y el SO libera su memoria y sus archivos</td></tr></table><p>La receta típica es: <b>fork</b> para crear una copia, <b>exec</b> en el hijo para que se convierta en otro programa, y <b>wait</b> en el padre para esperar a que termine. Así funciona la terminal cada vez que escribes un comando.</p><h3>Dos casos especiales</h3><ul><li><b>Proceso zombi:</b> el hijo ya terminó, pero el padre todavía no ha llamado a <code>wait()</code>. Su entrada sigue en la tabla de procesos porque guarda el código de salida que el padre aún no ha leído.</li><li><b>Proceso huérfano:</b> el padre terminó sin esperar al hijo. El hijo es <b>adoptado</b> por el proceso raíz (<code>systemd</code>), que hará el <code>wait()</code> por él.</li></ul><div class=\"recap\"><b>Para recordar.</b> fork crea una copia, exec cambia el programa, wait espera al hijo y exit termina. Un zombi ya terminó pero nadie lo ha esperado; un huérfano perdió a su padre.</div>",
 mc: 'Cuando alguien inicia un servidor de Minecraft escribiendo <code>java -jar server.jar</code> en una terminal, la terminal hace fork y el hijo hace exec de Java. El servidor queda como hijo de la terminal en el árbol de procesos.',
 example: '<p>La terminal (PID 100) ejecuta el comando <code>ls</code>:</p><table><tr><th>Paso</th><th>Terminal (PID 100)</th><th>Hijo (PID 101)</th></tr><tr><td>1</td><td><code>fork()</code> devuelve 101</td><td>Nace como copia; <code>fork()</code> le devuelve 0</td></tr><tr><td>2</td><td><code>wait()</code>: pasa a Waiting</td><td><code>exec("ls")</code>: ahora es el programa ls</td></tr><tr><td>3</td><td>Sigue esperando</td><td>Muestra los archivos y llama a <code>exit(0)</code></td></tr><tr><td>4</td><td><code>wait()</code> devuelve 101 y el código 0; muestra el prompt otra vez</td><td>Ya no existe</td></tr></table><p>Si la terminal no llamara a <code>wait()</code>, entre los pasos 3 y 4 el hijo sería un zombi.</p>',
 code: 'pid = fork()\nif pid < 0:\n    print("error: no se pudo crear el proceso")\nelif pid == 0:          # esto lo ejecuta el HIJO\n    exec("ls")\nelse:                   # esto lo ejecuta el PADRE\n    wait()\n    print("el hijo", pid, "terminó")',
 quiz: { q: 'Un programa ejecuta <code>fork()</code> dos veces seguidas, sin exec. ¿Cuántos procesos hay en total, contando el original?', options: ['2', '3', '4'], hint: 'El segundo fork lo ejecutan todos los procesos que ya existen.', why: 'El primer fork deja 2 procesos; cada uno ejecuta el segundo fork, así que quedan 2 × 2 = 4.' } },
en: { title: 'Creating and ending processes', goal: 'Follow fork, exec, wait and exit, and recognise zombie and orphan processes.',
 story: 'You type a command in the terminal and a new program appears. Who created it? Another process: the terminal itself.',
 body: "<h3>Every process has a number and a parent</h3><p>The OS identifies each process with a unique number, its <b>PID</b>. A process can create others: the creator is the <b>parent</b> and the created ones are its <b>children</b>. Since children can create processes too, a <b>process tree</b> forms. In Linux the root of the tree is <code>systemd</code>, with PID 1.</p><h3>The four key calls</h3><p>In UNIX-like systems (Linux, macOS) a process’s life is handled with four system calls:</p><table><tr><th>Call</th><th>What it does</th></tr><tr><td><code>fork()</code></td><td>Creates a child that is a <b>copy</b> of the parent. Both continue from the next line. To tell them apart, <code>fork()</code> returns <b>0</b> to the child and the <b>child’s PID</b> to the parent (and a negative number if it fails)</td></tr><tr><td><code>exec()</code></td><td><b>Replaces</b> the process’s program with another one. The PID stays the same, but it now runs a different program</td></tr><tr><td><code>wait()</code></td><td>The parent stops until a child ends, and receives its exit code</td></tr><tr><td><code>exit()</code></td><td>The process ends and the OS frees its memory and files</td></tr></table><p>The usual recipe is: <b>fork</b> to make a copy, <b>exec</b> in the child so it becomes another program, and <b>wait</b> in the parent until it finishes. That is how the terminal works every time you type a command.</p><h3>Two special cases</h3><ul><li><b>Zombie process:</b> the child has finished, but the parent has not called <code>wait()</code> yet. Its entry stays in the process table because it holds the exit code the parent has not read.</li><li><b>Orphan process:</b> the parent ended without waiting for the child. The child is <b>adopted</b> by the root process (<code>systemd</code>), which calls <code>wait()</code> for it.</li></ul><div class=\"recap\"><b>Remember.</b> fork makes a copy, exec changes the program, wait waits for the child and exit ends it. A zombie has finished but nobody has waited for it; an orphan has lost its parent.</div>",
 mc: 'When someone starts a Minecraft server by typing <code>java -jar server.jar</code> in a terminal, the terminal forks and the child execs Java. The server becomes a child of the terminal in the process tree.',
 example: '<p>The terminal (PID 100) runs the command <code>ls</code>:</p><table><tr><th>Step</th><th>Terminal (PID 100)</th><th>Child (PID 101)</th></tr><tr><td>1</td><td><code>fork()</code> returns 101</td><td>Born as a copy; <code>fork()</code> returns 0 to it</td></tr><tr><td>2</td><td><code>wait()</code>: moves to Waiting</td><td><code>exec("ls")</code>: it is now the ls program</td></tr><tr><td>3</td><td>Still waiting</td><td>Lists the files and calls <code>exit(0)</code></td></tr><tr><td>4</td><td><code>wait()</code> returns 101 and code 0; shows the prompt again</td><td>No longer exists</td></tr></table><p>If the terminal never called <code>wait()</code>, the child would be a zombie between steps 3 and 4.</p>',
 code: 'pid = fork()\nif pid < 0:\n    print("error: could not create the process")\nelif pid == 0:          # the CHILD runs this\n    exec("ls")\nelse:                   # the PARENT runs this\n    wait()\n    print("child", pid, "finished")',
 quiz: { q: 'A program calls <code>fork()</code> twice in a row, without exec. How many processes are there in total, counting the original?', options: ['2', '3', '4'], hint: 'Every process that already exists runs the second fork.', why: 'The first fork leaves 2 processes; each one runs the second fork, so there are 2 × 2 = 4.' } },
answer: 2 };

es: { title: 'Comunicación entre procesos', goal: 'Comparar memoria compartida y paso de mensajes, y distinguir comunicación directa e indirecta.',
 story: 'Dos amigos construyen una base. Uno pica piedra y el otro construye. ¿Cómo le pasa uno al otro lo que consiguió?',
 body: "<h3>¿Por qué se comunican los procesos?</h3><p>Un proceso es <b>independiente</b> si no comparte datos con nadie, y <b>cooperativo</b> si afecta a otros procesos o lo afectan. Los procesos cooperan para compartir información, para terminar más rápido dividiendo un trabajo en partes y para organizar un programa grande en piezas.</p><p>Pero cada proceso tiene su propia memoria y el SO no deja que uno lea la de otro. Para cooperar necesitan un mecanismo especial: la <b>comunicación entre procesos</b> o <b>IPC</b> (<i>Interprocess Communication</i>).</p><h3>Modelo 1: memoria compartida</h3><p>Los procesos le piden al SO una región de memoria que <b>ambos</b> puedan leer y escribir. Después de crearla, el SO ya no interviene: los procesos leen y escriben ahí directamente, como si fuera una pizarra común.</p><ul><li>Ventaja: es <b>muy rápido</b>.</li><li>Cuidado: los procesos deben ponerse de acuerdo para no escribir al mismo tiempo en el mismo lugar.</li></ul><h3>Modelo 2: paso de mensajes</h3><p>Los procesos no comparten nada. Usan dos operaciones del SO: <code>send(mensaje)</code> para enviar y <code>receive(mensaje)</code> para recibir. El SO lleva cada mensaje de un proceso al otro.</p><ul><li>Ventaja: es <b>más sencillo</b> y funciona también entre computadores distintos.</li><li>Desventaja: es <b>más lento</b>, porque cada mensaje es una llamada al sistema.</li></ul><h3>El ejemplo clásico: productor y consumidor</h3><p>Un proceso <b>produce</b> datos (por ejemplo, un servidor que genera páginas) y otro los <b>consume</b> (el navegador que las muestra). Entre los dos hay un <b>buffer</b>: un espacio donde el productor deja los datos y el consumidor los toma. Si el buffer está lleno, el productor espera; si está vacío, el consumidor espera.</p><h3>¿A quién se le envía?</h3><ul><li><b>Comunicación directa:</b> se nombra al otro proceso: <code>send(P, mensaje)</code>. Cada enlace une exactamente a dos procesos.</li><li><b>Comunicación indirecta:</b> se usa un <b>buzón</b> (o puerto): <code>send(A, mensaje)</code>. Varios procesos pueden enviar al mismo buzón y varios pueden leer de él.</li></ul><div class=\"recap\"><b>Para recordar.</b> Memoria compartida: rápida, pero hay que coordinarse. Paso de mensajes: más simple y sirve en red, pero más lento.</div>",
 mc: 'Un cofre compartido en la base es como memoria compartida: los dos meten y sacan objetos, pero si ambos toman el último bloque al mismo tiempo hay problemas. El chat es paso de mensajes: <code>/msg Alex hola</code> es directo (nombras a quién), y el chat de equipo <code>/teammsg</code> es indirecto (le llega a todo el que esté en ese canal).',
 example: '<p>¿Qué modelo conviene en cada caso?</p><table><tr><th>Situación</th><th>Modelo</th></tr><tr><td>Un editor de video y su vista previa intercambian imágenes enormes muchas veces por segundo, en el mismo computador</td><td>Memoria compartida</td></tr><tr><td>Un programa avisa a otro, en otro computador, que terminó una descarga</td><td>Paso de mensajes</td></tr><tr><td>Varios procesos trabajadores toman pedidos de una misma lista de espera</td><td>Mensajes indirectos (un buzón compartido)</td></tr></table>',
 code: '# memoria compartida (los dos procesos ven el mismo buffer)\nbuffer[entrada] = dato\nentrada = (entrada + 1) % TAMAÑO\n\n# paso de mensajes (el SO lleva el dato)\nsend(buzon_A, dato)      # productor\ndato = receive(buzon_A)  # consumidor',
 quiz: { q: 'Dos procesos del mismo computador intercambian muchísimos datos y quieren la máxima velocidad. ¿Qué modelo conviene?', options: ['Memoria compartida', 'Paso de mensajes', 'Ninguno: los procesos no pueden comunicarse'], hint: '¿En cuál de los dos el SO no interviene en cada intercambio?', why: 'Con memoria compartida, una vez creada la región, los datos se leen y escriben sin llamadas al sistema.' } },
en: { title: 'Interprocess communication', goal: 'Compare shared memory and message passing, and tell direct from indirect communication.',
 story: 'Two friends build a base together. One mines stone and the other builds. How does one hand over what they collected?',
 body: "<h3>Why do processes communicate?</h3><p>A process is <b>independent</b> if it shares no data with anyone, and <b>cooperating</b> if it affects or is affected by other processes. Processes cooperate to share information, to finish faster by splitting a job into parts and to organise a big program into pieces.</p><p>But each process has its own memory and the OS does not let one read another’s. To cooperate they need a special mechanism: <b>interprocess communication</b> or <b>IPC</b>.</p><h3>Model 1: shared memory</h3><p>The processes ask the OS for a memory region that <b>both</b> can read and write. Once it exists, the OS stays out: the processes read and write there directly, like a shared whiteboard.</p><ul><li>Advantage: it is <b>very fast</b>.</li><li>Watch out: the processes must agree not to write to the same place at the same time.</li></ul><h3>Model 2: message passing</h3><p>The processes share nothing. They use two OS operations: <code>send(message)</code> to send and <code>receive(message)</code> to receive. The OS carries each message from one process to the other.</p><ul><li>Advantage: it is <b>simpler</b> and also works between different computers.</li><li>Drawback: it is <b>slower</b>, because every message is a system call.</li></ul><h3>The classic example: producer and consumer</h3><p>One process <b>produces</b> data (for example, a server generating pages) and another <b>consumes</b> it (the browser showing them). Between them there is a <b>buffer</b>: a space where the producer leaves data and the consumer takes it. If the buffer is full, the producer waits; if it is empty, the consumer waits.</p><h3>Who receives it?</h3><ul><li><b>Direct communication:</b> you name the other process: <code>send(P, message)</code>. Each link joins exactly two processes.</li><li><b>Indirect communication:</b> you use a <b>mailbox</b> (or port): <code>send(A, message)</code>. Several processes can send to the same mailbox and several can read from it.</li></ul><div class=\"recap\"><b>Remember.</b> Shared memory: fast, but processes must coordinate. Message passing: simpler and works over a network, but slower.</div>",
 mc: 'A shared chest in the base is like shared memory: both players put items in and take them out, but if both grab the last block at the same moment there is trouble. Chat is message passing: <code>/msg Alex hi</code> is direct (you name the receiver), and team chat <code>/teammsg</code> is indirect (it reaches everyone on that channel).',
 example: '<p>Which model fits each case?</p><table><tr><th>Situation</th><th>Model</th></tr><tr><td>A video editor and its preview window swap huge images many times per second, on the same computer</td><td>Shared memory</td></tr><tr><td>A program tells another one, on a different computer, that a download has finished</td><td>Message passing</td></tr><tr><td>Several worker processes take jobs from the same waiting list</td><td>Indirect messages (a shared mailbox)</td></tr></table>',
 code: '# shared memory (both processes see the same buffer)\nbuffer[inPos] = item\ninPos = (inPos + 1) % SIZE\n\n# message passing (the OS carries the item)\nsend(mailbox_A, item)      # producer\nitem = receive(mailbox_A)  # consumer',
 quiz: { q: 'Two processes on the same computer swap huge amounts of data and want maximum speed. Which model fits?', options: ['Shared memory', 'Message passing', 'Neither: processes cannot communicate'], hint: 'In which of the two does the OS stay out of each exchange?', why: 'With shared memory, once the region exists, data is read and written without system calls.' } },
answer: 0 };

  const ipcnet = { id: 'ipcnet', zone: 'village', lab: null,
es: { title: 'Mensajes: esperas, buffers y red', goal: 'Distinguir envío bloqueante y no bloqueante, elegir un buffer y reconocer sockets y RPC.',
 story: 'Mandas un mensaje y te preguntas: ¿me quedo esperando hasta que lo lean o sigo jugando?',
 body: "<h3>¿Esperar o seguir?</h3><p>Cuando un proceso envía o recibe un mensaje, hay que decidir si se queda esperando. Cada operación puede ser:</p><table><tr><th></th><th>Bloqueante (síncrona)</th><th>No bloqueante (asíncrona)</th></tr><tr><td><code>send</code></td><td>Espera hasta que el mensaje sea recibido</td><td>Deja el mensaje y sigue con su trabajo</td></tr><tr><td><code>receive</code></td><td>Espera hasta que llegue un mensaje</td><td>Devuelve un mensaje, o «nada» si no hay, y sigue</td></tr></table><p>Si el envío y la recepción son bloqueantes, los dos procesos se encuentran en una <b>cita</b> (<i>rendezvous</i>): el mensaje pasa directo de uno a otro.</p><h3>¿Dónde esperan los mensajes? El buffer</h3><p>Los mensajes que van en camino esperan en una cola. Su tamaño cambia el comportamiento:</p><table><tr><th>Capacidad de la cola</th><th>Qué pasa con quien envía</th></tr><tr><td>Cero</td><td>Siempre espera a que el receptor tome el mensaje</td></tr><tr><td>Limitada (n mensajes)</td><td>Solo espera si la cola está llena</td></tr><tr><td>Ilimitada</td><td>Nunca espera (es un ideal: ninguna memoria es infinita)</td></tr></table><h3>Comunicación entre computadores</h3><p>Cuando los procesos están en computadores distintos se usa el modelo <b>cliente-servidor</b>: el <b>servidor</b> ofrece un servicio y espera; el <b>cliente</b> se conecta y le pide algo.</p><ul><li>Un <b>socket</b> es un extremo de la comunicación. Se identifica con una <b>dirección IP</b> (qué computador) y un <b>puerto</b> (qué programa dentro de ese computador). Una conexión une dos sockets: el del cliente y el del servidor.</li><li>Con <b>RPC</b> (<i>Remote Procedure Call</i>, llamada a procedimiento remoto) el programador llama una función como si fuera local, pero en realidad se ejecuta en otro computador. Un pequeño programa intermediario, el <b>stub</b>, empaca los parámetros en un mensaje, lo envía, espera la respuesta y la desempaca.</li></ul><div class=\"recap\"><b>Para recordar.</b> Bloqueante = esperar; no bloqueante = seguir. Entre computadores, los procesos se comunican con sockets (IP + puerto) o con RPC.</div>",
 mc: 'Minecraft Java es cliente-servidor: el servidor abre un socket en el puerto 25565 (el predeterminado) y espera conexiones. Tu juego es el cliente: abre su propio socket y se conecta a la IP del servidor en ese puerto.',
 example: '<p>Una conexión al servidor de una red local:</p><table><tr><th>Extremo</th><th>Socket (IP:puerto)</th></tr><tr><td>Cliente (tu juego)</td><td>192.168.1.20:52814 (puerto elegido al azar por el SO)</td></tr><tr><td>Servidor</td><td>192.168.1.5:25565</td></tr></table><p>Si cinco jugadores se conectan, el servidor sigue usando el puerto 25565, pero hay cinco conexiones distintas, porque cada cliente tiene su propio socket.</p>',
 code: 'servidor = socket()\nservidor.bind(25565)          # puerto donde escucha\nservidor.listen()\ncliente = servidor.accept()   # bloqueante: espera a que alguien se conecte\nmensaje = cliente.receive()   # bloqueante: espera un mensaje\ncliente.send("bienvenido")',
 quiz: { q: 'El buzón tiene capacidad cero. ¿Qué pasa con el proceso que envía?', options: ['Sigue sin esperar', 'Su mensaje se pierde', 'Espera hasta que el receptor tome el mensaje'], hint: 'Si no cabe ningún mensaje en la cola, ¿dónde queda el mensaje mientras tanto?', why: 'Sin espacio en la cola, el mensaje solo puede pasar directo al receptor, así que el emisor debe esperarlo.' } },
en: { title: 'Messages: waiting, buffers and networks', goal: 'Tell blocking from non-blocking sends, choose a buffer and recognise sockets and RPC.',
 story: 'You send a message and wonder: do I wait until it is read, or keep playing?',
 body: "<h3>Wait or carry on?</h3><p>When a process sends or receives a message, you must decide whether it waits. Each operation can be:</p><table><tr><th></th><th>Blocking (synchronous)</th><th>Non-blocking (asynchronous)</th></tr><tr><td><code>send</code></td><td>Waits until the message is received</td><td>Drops off the message and carries on</td></tr><tr><td><code>receive</code></td><td>Waits until a message arrives</td><td>Returns a message, or “nothing” if there is none, and carries on</td></tr></table><p>If both sending and receiving are blocking, the two processes meet at a <b>rendezvous</b>: the message passes straight from one to the other.</p><h3>Where do messages wait? The buffer</h3><p>Messages on their way wait in a queue. Its size changes the behaviour:</p><table><tr><th>Queue capacity</th><th>What happens to the sender</th></tr><tr><td>Zero</td><td>Always waits until the receiver takes the message</td></tr><tr><td>Bounded (n messages)</td><td>Only waits when the queue is full</td></tr><tr><td>Unbounded</td><td>Never waits (an ideal: no memory is infinite)</td></tr></table><h3>Communication between computers</h3><p>When the processes are on different computers, the <b>client-server</b> model is used: the <b>server</b> offers a service and waits; the <b>client</b> connects and asks for something.</p><ul><li>A <b>socket</b> is one end of the communication. It is identified by an <b>IP address</b> (which computer) and a <b>port</b> (which program on that computer). A connection joins two sockets: the client’s and the server’s.</li><li>With <b>RPC</b> (<i>Remote Procedure Call</i>) the programmer calls a function as if it were local, but it actually runs on another computer. A small go-between program, the <b>stub</b>, packs the parameters into a message, sends it, waits for the answer and unpacks it.</li></ul><div class=\"recap\"><b>Remember.</b> Blocking = wait; non-blocking = carry on. Between computers, processes communicate with sockets (IP + port) or with RPC.</div>",
 mc: 'Minecraft Java is client-server: the server opens a socket on port 25565 (the default) and waits for connections. Your game is the client: it opens its own socket and connects to the server’s IP on that port.',
 example: '<p>A connection to a server on a home network:</p><table><tr><th>Endpoint</th><th>Socket (IP:port)</th></tr><tr><td>Client (your game)</td><td>192.168.1.20:52814 (port picked at random by the OS)</td></tr><tr><td>Server</td><td>192.168.1.5:25565</td></tr></table><p>If five players connect, the server still uses port 25565, but there are five different connections, because each client has its own socket.</p>',
 code: 'server = socket()\nserver.bind(25565)           # port it listens on\nserver.listen()\nclient = server.accept()     # blocking: waits until someone connects\nmessage = client.receive()   # blocking: waits for a message\nclient.send("welcome")',
 quiz: { q: 'The mailbox has zero capacity. What happens to the sending process?', options: ['It carries on without waiting', 'Its message is lost', 'It waits until the receiver takes the message'], hint: 'If no message fits in the queue, where does the message stay in the meantime?', why: 'With no room in the queue, the message can only go straight to the receiver, so the sender has to wait for it.' } },
answer: 2 };
