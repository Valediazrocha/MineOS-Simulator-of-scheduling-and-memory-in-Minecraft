  const RAG_SVG = '<svg viewBox="0 0 320 140" width="320" style="max-width:100%;display:block;margin:8px auto;background:#fffefa" role="img" aria-label="P1, R1, P2, R2"><defs><marker id="dlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b2a1d"/></marker></defs><g stroke-width="3" fill="none" marker-end="url(#dlArrow)"><line x1="160" y1="25" x2="67" y2="63" stroke="#2f7a2a"/><line x1="67" y1="77" x2="143" y2="108" stroke="#c0571b" stroke-dasharray="7 4"/><line x1="160" y1="115" x2="253" y2="77" stroke="#2f7a2a"/><line x1="253" y1="63" x2="177" y2="31" stroke="#c0571b" stroke-dasharray="7 4"/></g><g stroke="#3b2a1d" stroke-width="3" fill="#f0ead9"><circle cx="50" cy="70" r="18"/><circle cx="270" cy="70" r="18"/><rect x="145" y="10" width="30" height="30"/><rect x="145" y="100" width="30" height="30"/></g><g fill="#3b2a1d"><circle cx="160" cy="25" r="4"/><circle cx="160" cy="115" r="4"/></g><g font-family="monospace" font-size="14" font-weight="700" fill="#3b2a1d" text-anchor="middle"><text x="50" y="75">P1</text><text x="270" y="75">P2</text><text x="200" y="18">R1</text><text x="200" y="133">R2</text></g></svg>';

  const deadlock = { id: 'deadlock', zone: 'rails', lab: null,
es: { title: '¿Qué es un interbloqueo?', goal: 'Definir interbloqueo (deadlock) y reconocer sus cuatro condiciones necesarias.',
 story: 'Dos vagonetas avanzan por una vía de un solo carril, una hacia la otra. Se detienen frente a frente. Ninguna puede retroceder y ninguna puede pasar.',
 body: "<h3>Recursos: pedir, usar, liberar</h3><p>Los procesos necesitan <b>recursos</b> para trabajar: una impresora, un archivo, una zona de memoria, un bloqueo (<i>lock</i>). Cada tipo de recurso puede tener una o varias <b>instancias</b> iguales; por ejemplo, un computador con dos impresoras idénticas tiene un tipo de recurso con dos instancias.</p><p>Un proceso siempre usa un recurso en tres pasos:</p><ol><li><b>Pedirlo.</b> Si no está libre, el proceso espera.</li><li><b>Usarlo.</b></li><li><b>Liberarlo</b>, para que otro lo pueda usar.</li></ol><h3>¿Qué es un interbloqueo?</h3><p>Un <b>interbloqueo</b> (<i>deadlock</i>) ocurre cuando un grupo de procesos queda esperando <b>para siempre</b>, porque cada uno espera un recurso que tiene otro proceso del mismo grupo. Nadie puede avanzar, así que nadie libera nada.</p><h3>Las cuatro condiciones</h3><p>Un interbloqueo solo puede ocurrir si se cumplen <b>las cuatro condiciones al mismo tiempo</b>:</p><table><tr><th>Condición</th><th>En palabras simples</th></tr><tr><td>1. Exclusión mutua</td><td>Al menos un recurso solo lo puede usar un proceso a la vez</td></tr><tr><td>2. Retención y espera</td><td>Un proceso se queda con lo que tiene mientras espera algo más</td></tr><tr><td>3. Sin expropiación</td><td>A un proceso no se le puede quitar un recurso a la fuerza: solo él lo suelta</td></tr><tr><td>4. Espera circular</td><td>P1 espera a P2, P2 espera a P3, …, y el último espera a P1: se forma un círculo</td></tr></table><p>Si falta <b>una sola</b> de las cuatro, no puede haber interbloqueo. Esta idea es la base de todas las soluciones de las próximas lecciones.</p><h3>No es lo mismo que la inanición</h3><p>En la <b>inanición</b> un proceso espera mucho porque siempre eligen a otros, pero el sistema sigue avanzando y el proceso podría ser atendido. En un <b>interbloqueo</b>, los procesos del círculo no avanzan nunca, pase lo que pase.</p><div class=\"recap\"><b>Para recordar.</b> Interbloqueo = un grupo de procesos esperándose en círculo para siempre. Necesita las cuatro condiciones a la vez.</div>",
 mc: 'El simulador de MineOS no tiene interbloqueos: una tarea nunca retiene un recurso mientras espera otro. Pero la imagen de las dos vagonetas en una vía de un solo carril muestra la idea: cada una ocupa la vía que la otra necesita.',
 example: '<p>Ana tiene el único <b>pico</b> y pide la única <b>mesa de trabajo</b>. Beto tiene la mesa y pide el pico. Revisemos las condiciones:</p><table><tr><th>Condición</th><th>¿Se cumple?</th></tr><tr><td>Exclusión mutua</td><td>Sí: cada objeto lo usa una persona a la vez</td></tr><tr><td>Retención y espera</td><td>Sí: cada uno guarda lo suyo mientras espera</td></tr><tr><td>Sin expropiación</td><td>Sí: nadie le quita nada a nadie</td></tr><tr><td>Espera circular</td><td>Sí: Ana → Beto → Ana</td></tr></table><p>Las cuatro se cumplen: hay interbloqueo.</p>',
 quiz: { q: 'En el ejemplo de Ana y Beto, supón que el SO sí pudiera quitarle el pico a Ana y dárselo a Beto. ¿Seguiría habiendo interbloqueo?', options: ['Sí, igual que antes', 'Solo si hubiera más de dos personas', 'No, porque deja de cumplirse una de las cuatro condiciones'], hint: 'Revisa la tercera condición.', why: 'Si se puede expropiar, falla la condición «sin expropiación», y sin las cuatro condiciones no hay interbloqueo.' } },
en: { title: 'What is a deadlock?', goal: 'Define deadlock and recognise its four necessary conditions.',
 story: 'Two minecarts roll along a single-lane track towards each other. They stop face to face. Neither can go back and neither can pass.',
 body: "<h3>Resources: request, use, release</h3><p>Processes need <b>resources</b> to work: a printer, a file, a memory area, a lock. Each resource type can have one or several identical <b>instances</b>; for example, a computer with two identical printers has one resource type with two instances.</p><p>A process always uses a resource in three steps:</p><ol><li><b>Request it.</b> If it is not free, the process waits.</li><li><b>Use it.</b></li><li><b>Release it</b>, so someone else can use it.</li></ol><h3>What is a deadlock?</h3><p>A <b>deadlock</b> happens when a group of processes is left waiting <b>forever</b>, because each one is waiting for a resource held by another process in the same group. Nobody can move forward, so nobody releases anything.</p><h3>The four conditions</h3><p>A deadlock can only happen when <b>all four conditions hold at the same time</b>:</p><table><tr><th>Condition</th><th>In plain words</th></tr><tr><td>1. Mutual exclusion</td><td>At least one resource can only be used by one process at a time</td></tr><tr><td>2. Hold and wait</td><td>A process keeps what it has while it waits for something else</td></tr><tr><td>3. No preemption</td><td>A resource cannot be taken from a process by force: only that process releases it</td></tr><tr><td>4. Circular wait</td><td>P1 waits for P2, P2 waits for P3, …, and the last one waits for P1: a circle forms</td></tr></table><p>If even <b>one</b> of the four is missing, there can be no deadlock. This idea is the basis of every solution in the next lessons.</p><h3>Not the same as starvation</h3><p>With <b>starvation</b> a process waits a long time because others keep being chosen, but the system keeps moving and the process could still be served. In a <b>deadlock</b>, the processes in the circle never move again, whatever happens.</p><div class=\"recap\"><b>Remember.</b> Deadlock = a group of processes waiting for each other in a circle forever. It needs all four conditions at once.</div>",
 mc: 'The MineOS simulator has no deadlocks: a task never holds one resource while it waits for another. But the picture of two minecarts on a single-lane track shows the idea: each one occupies the track the other needs.',
 example: '<p>Ana has the only <b>pickaxe</b> and asks for the only <b>crafting table</b>. Beto has the table and asks for the pickaxe. Let us check the conditions:</p><table><tr><th>Condition</th><th>Does it hold?</th></tr><tr><td>Mutual exclusion</td><td>Yes: each item is used by one person at a time</td></tr><tr><td>Hold and wait</td><td>Yes: each keeps what they have while waiting</td></tr><tr><td>No preemption</td><td>Yes: nobody takes anything from anybody</td></tr><tr><td>Circular wait</td><td>Yes: Ana → Beto → Ana</td></tr></table><p>All four hold: there is a deadlock.</p>',
 quiz: { q: 'In the Ana and Beto example, suppose the OS could take the pickaxe from Ana and give it to Beto. Would there still be a deadlock?', options: ['Yes, just as before', 'Only if there were more than two people', 'No, because one of the four conditions no longer holds'], hint: 'Look at the third condition.', why: 'If resources can be preempted, the “no preemption” condition fails, and without all four conditions there is no deadlock.' } },
answer: 2 };

  const rag = { id: 'rag', zone: 'rails', lab: null,
es: { title: 'Grafo de asignación de recursos', goal: 'Dibujar un grafo de asignación de recursos y decidir si un ciclo implica interbloqueo.',
 story: 'Para saber si alguien está atascado, primero hay que dibujar quién tiene qué y quién espera qué.',
 body: "<h3>Un dibujo para ver quién espera a quién</h3><p>Cuando hay muchos procesos y recursos es difícil ver a simple vista si hay un círculo de espera. Por eso se dibuja un <b>grafo de asignación de recursos</b>.</p><h3>Las piezas del dibujo</h3><ul><li><b>Procesos:</b> círculos (P1, P2, …).</li><li><b>Tipos de recurso:</b> cuadrados (R1, R2, …), con <b>un punto dentro por cada instancia</b>.</li><li><b>Flecha de petición</b> P → R: el proceso está esperando ese recurso.</li><li><b>Flecha de asignación</b> R → P: una instancia del recurso la tiene el proceso.</li></ul><p>Cuando un proceso pide un recurso se dibuja una flecha de petición; si se le concede, esa flecha se cambia por una de asignación; y cuando lo libera, la flecha se borra.</p>" + RAG_SVG + "<p class=\"muted\">Verde continua: asignación (R → P). Naranja punteada: petición (P → R).</p><h3>Cómo leerlo</h3><p>Lo primero es buscar un <b>ciclo</b>: un camino de flechas que salga de un nodo y vuelva a él.</p><table><tr><th>Lo que ves</th><th>Conclusión</th></tr><tr><td>No hay ciclos</td><td><b>No hay</b> interbloqueo</td></tr><tr><td>Hay un ciclo y cada recurso tiene <b>una sola instancia</b></td><td><b>Hay</b> interbloqueo</td></tr><tr><td>Hay un ciclo, pero algún recurso tiene <b>varias instancias</b></td><td><b>Puede haberlo o no</b>: hay que revisar si algún proceso puede terminar y liberar lo suyo</td></tr></table><p>Es decir: el ciclo es <b>necesario</b> para que haya interbloqueo, pero con varias instancias no es <b>suficiente</b>.</p><div class=\"recap\"><b>Para recordar.</b> Sin ciclo, no hay interbloqueo. Con ciclo e instancias únicas, sí lo hay. Con ciclo y varias instancias, hay que revisar.</div>",
 mc: 'Piénsalo como un mapa de la base: los jugadores son círculos, los cofres son cuadrados y cada objeto guardado es un punto. Las flechas dicen quién tiene cada objeto y quién lo está pidiendo.',
 example: '<p><b>Caso 1</b> (el dibujo de arriba). R1 y R2 tienen una instancia cada uno.</p><div class="flow">R1 → P1 (P1 tiene R1)  ·  P1 → R2 (P1 pide R2)<br>R2 → P2 (P2 tiene R2)  ·  P2 → R1 (P2 pide R1)<br>Ciclo: P1 → R2 → P2 → R1 → P1</div><p>Hay ciclo y cada recurso tiene una sola instancia: <b>interbloqueo</b>.</p><p><b>Caso 2.</b> Ahora R2 tiene <b>dos</b> instancias: una la tiene P2 y la otra P3. P3 no pide nada.</p><div class="flow">El ciclo P1 → R2 → P2 → R1 → P1 sigue en el dibujo,<br>pero P3 termina y libera su instancia de R2 → P1 la recibe → P1 termina y libera R1 → P2 avanza.</div><p>Hay ciclo, pero <b>no hay interbloqueo</b>.</p>',
 quiz: { q: 'Un grafo tiene un ciclo, y uno de los recursos del ciclo tiene 3 instancias. ¿Qué se puede concluir?', options: ['Hay interbloqueo seguro', 'No hay interbloqueo seguro', 'Puede haberlo o no: hay que revisar quién puede terminar'], hint: 'Recuerda el caso 2.', why: 'Con varias instancias, otro proceso fuera del ciclo puede liberar una instancia y romper la espera. El ciclo es necesario, pero no suficiente.' } },
en: { title: 'Resource-allocation graph', goal: 'Draw a resource-allocation graph and decide whether a cycle means deadlock.',
 story: 'To know whether anyone is stuck, you first have to draw who holds what and who is waiting for what.',
 body: "<h3>A drawing to see who waits for whom</h3><p>With many processes and resources it is hard to see at a glance whether there is a circle of waiting. That is why we draw a <b>resource-allocation graph</b>.</p><h3>The pieces of the drawing</h3><ul><li><b>Processes:</b> circles (P1, P2, …).</li><li><b>Resource types:</b> squares (R1, R2, …), with <b>one dot inside per instance</b>.</li><li><b>Request arrow</b> P → R: the process is waiting for that resource.</li><li><b>Assignment arrow</b> R → P: an instance of the resource is held by the process.</li></ul><p>When a process requests a resource a request arrow is drawn; if it is granted, that arrow becomes an assignment arrow; and when the process releases it, the arrow is erased.</p>" + RAG_SVG + "<p class=\"muted\">Solid green: assignment (R → P). Dashed orange: request (P → R).</p><h3>How to read it</h3><p>The first thing is to look for a <b>cycle</b>: a path of arrows that leaves a node and comes back to it.</p><table><tr><th>What you see</th><th>Conclusion</th></tr><tr><td>No cycles</td><td>There is <b>no</b> deadlock</td></tr><tr><td>A cycle, and each resource has <b>a single instance</b></td><td>There <b>is</b> a deadlock</td></tr><tr><td>A cycle, but some resource has <b>several instances</b></td><td>There <b>may or may not</b> be one: check whether some process can finish and release what it holds</td></tr></table><p>In other words: a cycle is <b>necessary</b> for a deadlock, but with several instances it is not <b>sufficient</b>.</p><div class=\"recap\"><b>Remember.</b> No cycle, no deadlock. A cycle with single instances means deadlock. A cycle with several instances needs checking.</div>",
 mc: 'Think of it as a map of the base: players are circles, chests are squares and each stored item is a dot. The arrows say who holds each item and who is asking for it.',
 example: '<p><b>Case 1</b> (the drawing above). R1 and R2 have one instance each.</p><div class="flow">R1 → P1 (P1 holds R1)  ·  P1 → R2 (P1 requests R2)<br>R2 → P2 (P2 holds R2)  ·  P2 → R1 (P2 requests R1)<br>Cycle: P1 → R2 → P2 → R1 → P1</div><p>There is a cycle and each resource has a single instance: <b>deadlock</b>.</p><p><b>Case 2.</b> Now R2 has <b>two</b> instances: P2 holds one and P3 holds the other. P3 requests nothing.</p><div class="flow">The cycle P1 → R2 → P2 → R1 → P1 is still in the drawing,<br>but P3 finishes and releases its instance of R2 → P1 gets it → P1 finishes and releases R1 → P2 moves on.</div><p>There is a cycle, but <b>no deadlock</b>.</p>',
 quiz: { q: 'A graph has a cycle, and one of the resources in the cycle has 3 instances. What can you conclude?', options: ['There is definitely a deadlock', 'There is definitely no deadlock', 'There may or may not be one: check who can finish'], hint: 'Remember case 2.', why: 'With several instances, a process outside the cycle can release an instance and break the wait. A cycle is necessary, but not sufficient.' } },
answer: 2 };

  const dlhandle = { id: 'dlhandle', zone: 'rails', lab: null,
es: { title: 'Prevenir y evitar interbloqueos', goal: 'Romper una condición para prevenir un interbloqueo y reconocer un estado seguro.',
 story: '¿Es mejor poner reglas para que el atasco nunca pueda pasar, o vigilar cada préstamo para no llegar a él?',
 body: "<h3>Cuatro formas de enfrentar el problema</h3><ol><li><b>Ignorarlo:</b> suponer que casi nunca pasa y, si pasa, reiniciar. Es lo que hacen Windows y Linux en la mayoría de los casos, porque las otras opciones cuestan.</li><li><b>Prevenirlo:</b> poner reglas para que sea imposible.</li><li><b>Evitarlo:</b> revisar cada petición y negarla si es peligrosa.</li><li><b>Detectarlo y recuperarse:</b> dejar que ocurra, encontrarlo y arreglarlo (siguiente lección).</li></ol><h3>Prevenir: romper una condición</h3><p>Como el interbloqueo necesita las cuatro condiciones, basta con que <b>una nunca se cumpla</b>:</p><table><tr><th>Condición</th><th>Cómo romperla</th><th>Qué cuesta</th></tr><tr><td>Exclusión mutua</td><td>Usar recursos que se puedan compartir, como un archivo de solo lectura</td><td>Muchos recursos no se pueden compartir (una impresora)</td></tr><tr><td>Retención y espera</td><td>Pedir todo al empezar, o soltar todo antes de pedir algo nuevo</td><td>Recursos guardados sin usar, y posible inanición</td></tr><tr><td>Sin expropiación</td><td>Si no te dan lo que pides, sueltas lo que tienes</td><td>Solo sirve con recursos cuyo estado se puede guardar y recuperar</td></tr><tr><td>Espera circular</td><td>Numerar los recursos y pedirlos siempre en <b>orden creciente</b></td><td>Es la opción más usada en la práctica</td></tr></table><h3>Evitar: no entrar a una zona peligrosa</h3><p>Para evitar, cada proceso tiene que avisar al principio cuál es el <b>máximo</b> de recursos que podría llegar a pedir. Con esa información, el SO solo concede una petición si después el sistema queda en un <b>estado seguro</b>.</p><p>Un estado es <b>seguro</b> si existe un orden (una <b>secuencia segura</b>) en el que todos los procesos pueden terminar uno tras otro: el primero termina con lo que está libre, libera lo suyo, y con eso le alcanza al siguiente, y así hasta el último.</p><div class=\"flow\">estado seguro → seguro que no hay interbloqueo<br>estado inseguro → puede llegar a haberlo (no siempre lo hay)</div><div class=\"recap\"><b>Para recordar.</b> Prevenir es romper una de las cuatro condiciones, sobre todo ordenando los recursos. Evitar es conceder solo si el sistema queda en un estado seguro.</div>",
 mc: 'Ordenar los recursos es como acordar en el servidor que todos consiguen primero madera, luego piedra y luego hierro. Así nadie puede quedarse con el hierro mientras espera madera, y no se forma el ciclo.',
 example: '<p>Hay <b>10</b> instancias de un recurso. Están libres 10 − (4 + 2 + 2) = <b>2</b>.</p><table><tr><th>Proceso</th><th>Máximo</th><th>Tiene</th><th>Le falta</th></tr><tr><td>P0</td><td>8</td><td>4</td><td>4</td></tr><tr><td>P1</td><td>4</td><td>2</td><td>2</td></tr><tr><td>P2</td><td>7</td><td>2</td><td>5</td></tr></table><div class="flow">Libres 2 → P1 (le faltan 2) termina → libres 2 + 2 = 4<br>Libres 4 → P0 (le faltan 4) termina → libres 4 + 4 = 8<br>Libres 8 → P2 (le faltan 5) termina → libres 8 + 2 = 10</div><p>La secuencia ⟨P1, P0, P2⟩ es segura, así que el estado es <b>seguro</b>.</p><p>Si ahora P2 pidiera 1 más y se la dieran, quedaría 1 libre. Ningún proceso podría terminar con 1 (a P1 le faltan 2): el estado sería <b>inseguro</b>. Por eso, evitando, P2 debe esperar.</p>',
 quiz: { q: 'Se numeran los recursos y todos los procesos deben pedirlos en orden creciente. ¿Qué condición se rompe?', options: ['Exclusión mutua', 'Retención y espera', 'Espera circular'], hint: 'Intenta dibujar un ciclo si todas las flechas de petición van hacia números mayores.', why: 'Para cerrar un ciclo, alguien tendría que pedir un recurso de número menor que uno que ya tiene, y eso está prohibido.' } },
en: { title: 'Preventing and avoiding deadlocks', goal: 'Break a condition to prevent deadlock and recognise a safe state.',
 story: 'Is it better to set rules so the jam can never happen, or to watch every loan so you never get there?',
 body: "<h3>Four ways to face the problem</h3><ol><li><b>Ignore it:</b> assume it almost never happens and, if it does, restart. This is what Windows and Linux do in most cases, because the other options are costly.</li><li><b>Prevent it:</b> set rules that make it impossible.</li><li><b>Avoid it:</b> check every request and refuse it if it is dangerous.</li><li><b>Detect it and recover:</b> let it happen, find it and fix it (next lesson).</li></ol><h3>Prevention: break one condition</h3><p>Since a deadlock needs all four conditions, it is enough that <b>one never holds</b>:</p><table><tr><th>Condition</th><th>How to break it</th><th>What it costs</th></tr><tr><td>Mutual exclusion</td><td>Use resources that can be shared, such as a read-only file</td><td>Many resources cannot be shared (a printer)</td></tr><tr><td>Hold and wait</td><td>Request everything at the start, or release everything before asking for something new</td><td>Resources kept without being used, and possible starvation</td></tr><tr><td>No preemption</td><td>If you do not get what you ask for, you release what you hold</td><td>Only works for resources whose state can be saved and restored</td></tr><tr><td>Circular wait</td><td>Number the resources and always request them in <b>increasing order</b></td><td>The most common choice in practice</td></tr></table><h3>Avoidance: stay out of the danger zone</h3><p>To avoid deadlock, each process must say at the start the <b>maximum</b> number of resources it might ever request. With that information, the OS only grants a request if the system is left in a <b>safe state</b> afterwards.</p><p>A state is <b>safe</b> if there is an order (a <b>safe sequence</b>) in which all processes can finish one after another: the first finishes with what is free, releases what it held, and that is enough for the next one, and so on until the last.</p><div class=\"flow\">safe state → definitely no deadlock<br>unsafe state → a deadlock may happen (not always)</div><div class=\"recap\"><b>Remember.</b> Preventing means breaking one of the four conditions, above all by ordering resources. Avoiding means granting only if the system stays in a safe state.</div>",
 mc: 'Ordering resources is like agreeing on the server that everyone gets wood first, then stone, then iron. Nobody can end up holding iron while waiting for wood, so no cycle can form.',
 example: '<p>There are <b>10</b> instances of one resource. Free: 10 − (4 + 2 + 2) = <b>2</b>.</p><table><tr><th>Process</th><th>Maximum</th><th>Holds</th><th>Still needs</th></tr><tr><td>P0</td><td>8</td><td>4</td><td>4</td></tr><tr><td>P1</td><td>4</td><td>2</td><td>2</td></tr><tr><td>P2</td><td>7</td><td>2</td><td>5</td></tr></table><div class="flow">Free 2 → P1 (needs 2) finishes → free 2 + 2 = 4<br>Free 4 → P0 (needs 4) finishes → free 4 + 4 = 8<br>Free 8 → P2 (needs 5) finishes → free 8 + 2 = 10</div><p>The sequence ⟨P1, P0, P2⟩ is safe, so the state is <b>safe</b>.</p><p>If P2 now asked for 1 more and got it, 1 would be free. No process could finish with 1 (P1 needs 2): the state would be <b>unsafe</b>. So, under avoidance, P2 has to wait.</p>',
 quiz: { q: 'Resources are numbered and every process must request them in increasing order. Which condition is broken?', options: ['Mutual exclusion', 'Hold and wait', 'Circular wait'], hint: 'Try to draw a cycle when every request arrow points to a higher number.', why: 'To close a cycle, someone would have to request a lower-numbered resource than one they already hold, and that is forbidden.' } },
answer: 2 };

es: { title: 'El algoritmo del banquero', goal: 'Aplicar el algoritmo de seguridad y decidir si se concede una petición.',
 story: 'Un banco presta dinero solo si sabe que, pase lo que pase, podrá atender a todos sus clientes hasta el final.',
 body: "<h3>La idea del banquero</h3><p>Un banco tiene una cantidad limitada de dinero y muchos clientes, cada uno con un cupo máximo de crédito. El banco no presta si, después de prestar, podría quedarse sin dinero para que todos los clientes terminen sus proyectos. El <b>algoritmo del banquero</b> aplica esa misma prudencia a los recursos de un computador. Sirve cuando hay <b>varios tipos</b> de recurso, cada uno con varias instancias.</p><h3>Las cuatro tablas</h3><table><tr><th>Tabla</th><th>Qué guarda</th></tr><tr><td><b>Available</b> (disponible)</td><td>Cuántas instancias libres hay de cada tipo</td></tr><tr><td><b>Max</b> (máximo)</td><td>Lo máximo que cada proceso dijo que podría pedir de cada tipo</td></tr><tr><td><b>Allocation</b> (asignado)</td><td>Lo que cada proceso tiene ahora</td></tr><tr><td><b>Need</b> (le falta)</td><td>Lo que todavía podría pedir: <b>Need = Max − Allocation</b></td></tr></table><h3>Paso 1: el algoritmo de seguridad</h3><p>Responde la pregunta «¿este estado es seguro?»:</p><ol><li>Empieza con <code>Work</code> = Available (lo que hay libre).</li><li>Busca un proceso que no haya terminado y cuyo <b>Need sea menor o igual que Work en todos los tipos</b> de recurso.</li><li>Si lo encuentras, imagina que termina: devuelve todo lo que tenía, así que <b>Work = Work + su Allocation</b>. Márcalo como terminado y vuelve al paso 2.</li><li>Si todos quedan marcados, el estado es <b>seguro</b> y el orden en que los marcaste es una secuencia segura. Si alguno no puede terminar nunca, es <b>inseguro</b>.</li></ol><h3>Paso 2: cuando un proceso pide algo</h3><ol><li>Si pide más que su Need, es un error: pide más de lo que declaró.</li><li>Si pide más de lo que hay disponible, tiene que esperar.</li><li>Si no, el SO <b>finge</b> que se lo da (resta de Available y de Need, suma a Allocation) y corre el algoritmo de seguridad. Si el resultado es seguro, se lo da de verdad; si no, deshace el cambio y el proceso espera.</li></ol><div class=\"recap\"><b>Para recordar.</b> Need = Max − Allocation. Una petición se concede solo si, después de fingir que se concede, todavía existe una secuencia segura.</div>",
 mc: 'Imagina un aldeano prudente que presta picos (A) y hachas (B). Solo presta si tiene la certeza de que todos los jugadores podrán terminar su obra y devolverle lo prestado.',
 example: '<p>Recursos: A = 7 picos, B = 5 hachas. En uso hay (1 + 2 + 2, 0 + 1 + 2) = (5, 3), así que Available = (7 − 5, 5 − 3) = <b>(2, 2)</b>.</p><table><tr><th>Proceso</th><th>Max (A, B)</th><th>Allocation</th><th>Need</th></tr><tr><td>P0</td><td>(4, 3)</td><td>(1, 0)</td><td>(3, 3)</td></tr><tr><td>P1</td><td>(3, 2)</td><td>(2, 1)</td><td>(1, 1)</td></tr><tr><td>P2</td><td>(5, 4)</td><td>(2, 2)</td><td>(3, 2)</td></tr></table><div class="flow">Work (2, 2): P0 necesita (3, 3), no alcanza. P1 necesita (1, 1), sí → Work = (2, 2) + (2, 1) = (4, 3)<br>Work (4, 3): P0 necesita (3, 3), sí → Work = (4, 3) + (1, 0) = (5, 3)<br>Work (5, 3): P2 necesita (3, 2), sí → Work = (5, 3) + (2, 2) = (7, 5)</div><p>Secuencia segura ⟨P1, P0, P2⟩: el estado es seguro.</p><p><b>Petición:</b> P0 pide (1, 1). Es ≤ Need (3, 3) y ≤ Available (2, 2). Fingimos: Available = (1, 1), Allocation de P0 = (2, 1), Need de P0 = (2, 2). Con Work (1, 1) termina P1 → (3, 2), luego P0 → (5, 3), luego P2 → (7, 5). Sigue siendo seguro: <b>se concede</b>.</p>',
 code: 'work = available.copy()\nfinish = [False] * n\nfound = True\nwhile found:\n    found = False\n    for i in range(n):\n        if not finish[i] and need[i] <= work:   # en todos los tipos\n            work = work + allocation[i]          # Pi termina y libera\n            finish[i] = True\n            found = True\nreturn all(finish)   # True = estado seguro',
 quiz: { q: 'Con las tablas del ejemplo (antes de la petición de P0), P0 pide (2, 2). ¿Se concede?', options: ['No: después de concederla ningún proceso podría terminar', 'Sí, porque hay (2, 2) disponibles', 'No: pide más de lo que declaró en Max'], hint: 'Finge la concesión: ¿cuánto queda en Available? ¿A alguien le alcanza?', why: 'Available quedaría en (0, 0) y todos los Need son mayores que eso: estado inseguro. P0 debe esperar.' } },
en: { title: 'The banker’s algorithm', goal: 'Run the safety algorithm and decide whether a request is granted.',
 story: 'A bank lends money only if it knows that, whatever happens, it can serve all its customers to the end.',
 body: "<h3>The banker’s idea</h3><p>A bank has a limited amount of money and many customers, each with a maximum credit limit. The bank does not lend if, after lending, it could run out of money for all customers to finish their projects. The <b>banker’s algorithm</b> applies the same caution to a computer’s resources. It is used when there are <b>several types</b> of resource, each with several instances.</p><h3>The four tables</h3><table><tr><th>Table</th><th>What it stores</th></tr><tr><td><b>Available</b></td><td>How many free instances of each type there are</td></tr><tr><td><b>Max</b></td><td>The most each process said it might request of each type</td></tr><tr><td><b>Allocation</b></td><td>What each process holds now</td></tr><tr><td><b>Need</b></td><td>What it might still request: <b>Need = Max − Allocation</b></td></tr></table><h3>Step 1: the safety algorithm</h3><p>It answers the question “is this state safe?”:</p><ol><li>Start with <code>Work</code> = Available (what is free).</li><li>Find a process that has not finished and whose <b>Need is less than or equal to Work in every</b> resource type.</li><li>If you find one, imagine it finishes: it gives back everything it held, so <b>Work = Work + its Allocation</b>. Mark it as finished and go back to step 2.</li><li>If every process ends up marked, the state is <b>safe</b> and the order in which you marked them is a safe sequence. If some process can never finish, it is <b>unsafe</b>.</li></ol><h3>Step 2: when a process asks for something</h3><ol><li>If it asks for more than its Need, it is an error: it asks for more than it declared.</li><li>If it asks for more than is available, it has to wait.</li><li>Otherwise the OS <b>pretends</b> to give it (subtract from Available and Need, add to Allocation) and runs the safety algorithm. If the result is safe, it gives it for real; if not, it undoes the change and the process waits.</li></ol><div class=\"recap\"><b>Remember.</b> Need = Max − Allocation. A request is granted only if, after pretending to grant it, a safe sequence still exists.</div>",
 mc: 'Picture a careful villager who lends pickaxes (A) and axes (B). It only lends if it is sure every player can finish their build and give everything back.',
 example: '<p>Resources: A = 7 pickaxes, B = 5 axes. In use: (1 + 2 + 2, 0 + 1 + 2) = (5, 3), so Available = (7 − 5, 5 − 3) = <b>(2, 2)</b>.</p><table><tr><th>Process</th><th>Max (A, B)</th><th>Allocation</th><th>Need</th></tr><tr><td>P0</td><td>(4, 3)</td><td>(1, 0)</td><td>(3, 3)</td></tr><tr><td>P1</td><td>(3, 2)</td><td>(2, 1)</td><td>(1, 1)</td></tr><tr><td>P2</td><td>(5, 4)</td><td>(2, 2)</td><td>(3, 2)</td></tr></table><div class="flow">Work (2, 2): P0 needs (3, 3), not enough. P1 needs (1, 1), yes → Work = (2, 2) + (2, 1) = (4, 3)<br>Work (4, 3): P0 needs (3, 3), yes → Work = (4, 3) + (1, 0) = (5, 3)<br>Work (5, 3): P2 needs (3, 2), yes → Work = (5, 3) + (2, 2) = (7, 5)</div><p>Safe sequence ⟨P1, P0, P2⟩: the state is safe.</p><p><b>Request:</b> P0 asks for (1, 1). It is ≤ Need (3, 3) and ≤ Available (2, 2). Pretend: Available = (1, 1), P0’s Allocation = (2, 1), P0’s Need = (2, 2). With Work (1, 1) P1 finishes → (3, 2), then P0 → (5, 3), then P2 → (7, 5). Still safe: <b>granted</b>.</p>',
 code: 'work = available.copy()\nfinish = [False] * n\nfound = True\nwhile found:\n    found = False\n    for i in range(n):\n        if not finish[i] and need[i] <= work:   # in every type\n            work = work + allocation[i]          # Pi finishes and releases\n            finish[i] = True\n            found = True\nreturn all(finish)   # True = safe state',
 quiz: { q: 'With the example tables (before P0’s request), P0 asks for (2, 2). Is it granted?', options: ['No: after granting it no process could finish', 'Yes, because (2, 2) is available', 'No: it asks for more than it declared in Max'], hint: 'Pretend to grant it: how much is left in Available? Is it enough for anyone?', why: 'Available would drop to (0, 0) and every Need is larger than that: unsafe state. P0 must wait.' } },
answer: 0 };

  const dldetect = { id: 'dldetect', zone: 'rails', lab: null,
es: { title: 'Detectar y recuperarse', goal: 'Detectar un interbloqueo con un grafo de espera o una tabla, y elegir cómo romperlo.',
 story: 'Si no pusiste reglas ni vigilaste los préstamos, queda otra opción: revisar de vez en cuando si alguien quedó atascado y arreglarlo.',
 body: "<h3>Dejar que pase y luego arreglarlo</h3><p>Si el sistema no previene ni evita los interbloqueos, puede revisar de vez en cuando si hay alguno y, si lo encuentra, romperlo. Para eso necesita dos cosas: un algoritmo para <b>detectarlo</b> y un plan para <b>recuperarse</b>.</p><h3>Detectar con una instancia por recurso: el grafo de espera</h3><p>Se parte del grafo de asignación de recursos y se quitan los cuadrados de los recursos. Queda el <b>grafo de espera</b> (<i>wait-for graph</i>): una flecha Pi → Pj significa «Pi espera un recurso que tiene Pj». Hay interbloqueo <b>si y solo si</b> este grafo tiene un ciclo.</p><h3>Detectar con varias instancias: una tabla</h3><p>Se usa un algoritmo muy parecido al de seguridad del banquero, pero con la tabla <b>Request</b>, que dice lo que cada proceso está pidiendo <b>ahora mismo</b>, en vez de Need:</p><ol><li>Work = Available. Los procesos que no tienen nada asignado se marcan de una vez: no bloquean a nadie.</li><li>Busca un proceso sin marcar cuyo Request sea ≤ Work. Si lo hay, supón que termina: Work = Work + su Allocation, y márcalo.</li><li>Repite. Los procesos que al final <b>queden sin marcar</b> están en interbloqueo.</li></ol><p>¿Cada cuánto revisar? Revisar en cada petición es caro; revisar muy poco deja a los procesos atascados más tiempo. Depende de qué tan seguido ocurren los interbloqueos.</p><h3>Recuperarse</h3><ul><li><b>Terminar procesos:</b> todos los del ciclo (rápido, pero se pierde mucho trabajo) o de uno en uno hasta que el ciclo se rompa (hay que volver a revisar después de cada uno).</li><li><b>Expropiar recursos:</b> quitarle recursos a un proceso <b>víctima</b> y hacerlo <b>retroceder</b> (<i>rollback</i>) a un punto anterior para que los pida otra vez.</li></ul><p>Para elegir la víctima se mira su prioridad, cuánto ha avanzado, cuántos recursos tiene y cuántos le faltan: se busca <b>perder el menor trabajo posible</b>. Y hay que evitar escoger siempre al mismo proceso, o sufrirá inanición.</p><div class=\"recap\"><b>Para recordar.</b> Con una instancia por recurso, un ciclo en el grafo de espera es interbloqueo. Para recuperarse se terminan procesos o se les quitan recursos, perdiendo el menor trabajo posible.</div>",
 mc: 'Los servidores de Minecraft tienen un vigilante (<i>watchdog</i>): si un tick tarda demasiado, por ejemplo porque un plugin dejó el hilo principal esperando para siempre, el vigilante lo detecta, escribe en la consola qué estaba haciendo cada hilo y puede detener el servidor. Es detección y recuperación.',
 example: '<p><b>Con tabla.</b> Dos tipos de recurso (A, B). Available = (0, 0).</p><table><tr><th>Proceso</th><th>Allocation</th><th>Request</th></tr><tr><td>P0</td><td>(0, 1)</td><td>(0, 0)</td></tr><tr><td>P1</td><td>(2, 0)</td><td>(1, 1)</td></tr><tr><td>P2</td><td>(1, 1)</td><td>(1, 0)</td></tr></table><div class="flow">Work (0, 0): P0 pide (0, 0), sí → Work = (0, 1)<br>Work (0, 1): P1 pide (1, 1), no. P2 pide (1, 0), no.<br>Nadie más puede avanzar.</div><p>P1 y P2 están en <b>interbloqueo</b>. Si P2 pidiera (0, 1) en vez de (1, 0), terminaría y liberaría (1, 1), Work sería (1, 2) y P1 también podría terminar: no habría interbloqueo.</p>',
 code: 'work = available.copy()\nfinish = [allocation[i] == 0 for i in range(n)]   # sin recursos: no bloquea a nadie\nfound = True\nwhile found:\n    found = False\n    for i in range(n):\n        if not finish[i] and request[i] <= work:\n            work = work + allocation[i]\n            finish[i] = True\n            found = True\nreturn [i for i in range(n) if not finish[i]]   # procesos en interbloqueo',
 quiz: { q: 'Para romper un interbloqueo hay que elegir una víctima. ¿Qué criterio tiene más sentido?', options: ['El proceso que más ha avanzado', 'Siempre el mismo proceso, para que sea predecible', 'El proceso que menos trabajo pierde al retroceder'], hint: 'Retroceder significa repetir trabajo.', why: 'Conviene perder el menor trabajo posible. Elegir siempre al mismo le causaría inanición.' } },
en: { title: 'Detecting and recovering', goal: 'Detect a deadlock with a wait-for graph or a table, and choose how to break it.',
 story: 'If you set no rules and did not watch the loans, there is one option left: check now and then whether someone got stuck, and fix it.',
 body: "<h3>Let it happen, then fix it</h3><p>If the system neither prevents nor avoids deadlocks, it can check every so often whether there is one and, if it finds one, break it. For that it needs two things: an algorithm to <b>detect</b> it and a plan to <b>recover</b>.</p><h3>Detection with one instance per resource: the wait-for graph</h3><p>Start from the resource-allocation graph and remove the resource squares. What is left is the <b>wait-for graph</b>: an arrow Pi → Pj means “Pi is waiting for a resource held by Pj”. There is a deadlock <b>if and only if</b> this graph has a cycle.</p><h3>Detection with several instances: a table</h3><p>Use an algorithm very similar to the banker’s safety algorithm, but with the <b>Request</b> table, which says what each process is asking for <b>right now</b>, instead of Need:</p><ol><li>Work = Available. Processes holding nothing are marked straight away: they block nobody.</li><li>Find an unmarked process whose Request is ≤ Work. If there is one, assume it finishes: Work = Work + its Allocation, and mark it.</li><li>Repeat. The processes that are <b>still unmarked</b> at the end are deadlocked.</li></ol><p>How often should you check? Checking on every request is expensive; checking too rarely leaves processes stuck for longer. It depends on how often deadlocks happen.</p><h3>Recovery</h3><ul><li><b>Terminate processes:</b> all of those in the cycle (fast, but a lot of work is lost) or one at a time until the cycle breaks (you must check again after each one).</li><li><b>Preempt resources:</b> take resources from a <b>victim</b> process and <b>roll it back</b> to an earlier point so it asks for them again.</li></ul><p>To pick the victim, look at its priority, how far it has got, how many resources it holds and how many it still needs: the aim is to <b>lose as little work as possible</b>. And avoid always picking the same process, or it will starve.</p><div class=\"recap\"><b>Remember.</b> With one instance per resource, a cycle in the wait-for graph means deadlock. To recover, terminate processes or take their resources, losing as little work as possible.</div>",
 mc: 'Minecraft servers have a watchdog: if a tick takes far too long, for example because a plugin left the main thread waiting forever, the watchdog notices, writes to the console what every thread was doing and can stop the server. That is detection and recovery.',
 example: '<p><b>With a table.</b> Two resource types (A, B). Available = (0, 0).</p><table><tr><th>Process</th><th>Allocation</th><th>Request</th></tr><tr><td>P0</td><td>(0, 1)</td><td>(0, 0)</td></tr><tr><td>P1</td><td>(2, 0)</td><td>(1, 1)</td></tr><tr><td>P2</td><td>(1, 1)</td><td>(1, 0)</td></tr></table><div class="flow">Work (0, 0): P0 requests (0, 0), yes → Work = (0, 1)<br>Work (0, 1): P1 requests (1, 1), no. P2 requests (1, 0), no.<br>Nobody else can move.</div><p>P1 and P2 are <b>deadlocked</b>. If P2 requested (0, 1) instead of (1, 0), it would finish and release (1, 1), Work would be (1, 2) and P1 could finish too: no deadlock.</p>',
 code: 'work = available.copy()\nfinish = [allocation[i] == 0 for i in range(n)]   # holds nothing: blocks nobody\nfound = True\nwhile found:\n    found = False\n    for i in range(n):\n        if not finish[i] and request[i] <= work:\n            work = work + allocation[i]\n            finish[i] = True\n            found = True\nreturn [i for i in range(n) if not finish[i]]   # deadlocked processes',
 quiz: { q: 'To break a deadlock you must choose a victim. Which criterion makes most sense?', options: ['The process that has made the most progress', 'Always the same process, so it is predictable', 'The process that loses the least work when rolled back'], hint: 'Rolling back means repeating work.', why: 'It is best to lose as little work as possible. Always picking the same one would make it starve.' } },
answer: 2 };

  const addresses = { id: 'addresses', zone: 'mine', lab: null,
es: { title: 'Direcciones lógicas y físicas', goal: 'Distinguir dirección lógica de física y explicar qué hace la MMU.',
 story: 'Un plano dice «el cofre va 2 bloques a la derecha de la puerta». El plano sirve en cualquier lugar del mundo, pero el cofre termina en una coordenada exacta.',
 body: "<h3>Dos formas de nombrar una posición de memoria</h3><p>Cuando un programa se ejecuta, la CPU genera direcciones de memoria: «lee lo que hay en la posición 745». Esa es una <b>dirección lógica</b>: la que ve el programa, como si él estuviera solo en la memoria y empezara en la posición 0.</p><p>La memoria RAM, en cambio, trabaja con <b>direcciones físicas</b>: la posición real de cada byte en el chip. Como en la RAM hay muchos procesos a la vez, el programa casi nunca queda guardado desde la posición 0 real.</p><ul><li><b>Espacio de direcciones lógico:</b> todas las direcciones que usa un programa (de 0 hasta su tamaño).</li><li><b>Espacio de direcciones físico:</b> las posiciones reales de la RAM donde quedó cargado.</li></ul><h3>La MMU: el traductor</h3><p>Alguien tiene que convertir cada dirección lógica en física, y hacerlo en <b>cada</b> acceso a memoria, millones de veces por segundo. Por eso no lo hace un programa, sino una pieza de hardware: la <b>MMU</b> (<i>Memory-Management Unit</i>, unidad de gestión de memoria).</p><p>La MMU más simple tiene un <b>registro de reubicación</b> que guarda dónde empieza el proceso en la RAM:</p><p class=\"math\">física = reubicación + lógica</p><p>El programa <b>nunca</b> ve direcciones físicas. Si el SO mueve el proceso a otra parte de la RAM, solo cambia el valor del registro; el programa sigue funcionando igual, sin enterarse.</p><h3>¿Cuándo se decide la dirección real?</h3><p>A esto se le llama <b>vinculación de direcciones</b> (<i>address binding</i>). Puede pasar en tres momentos:</p><table><tr><th>Momento</th><th>Idea</th><th>¿Se puede mover el proceso?</th></tr><tr><td>Al compilar</td><td>Se sabe de antemano dónde quedará; el código lleva direcciones reales fijas</td><td>No: habría que volver a compilar</td></tr><tr><td>Al cargar</td><td>Las direcciones se ajustan una sola vez, cuando el programa se carga en memoria</td><td>No: habría que volver a cargarlo</td></tr><tr><td>Al ejecutar</td><td>La MMU traduce en cada acceso</td><td>Sí: es lo que hacen los sistemas modernos</td></tr></table><p>Las lecciones que siguen (asignación contigua, paginación y segmentación) son <b>tres formas distintas</b> de hacer esta traducción.</p><div class=\"recap\"><b>Para recordar.</b> El programa usa direcciones lógicas; la RAM usa direcciones físicas. La MMU traduce: física = reubicación + lógica.</div>",
 mc: 'En los comandos de Minecraft, <code>~2 ~ ~3</code> son coordenadas <b>relativas</b> (a partir de quien ejecuta el comando), como una dirección lógica. El juego las convierte en coordenadas <b>absolutas</b> del mundo, como una dirección física. El mismo comando funciona en cualquier lugar.',
 example: '<p>Registro de reubicación = <b>20 000</b>.</p><table><tr><th>Dirección lógica</th><th>Dirección física</th></tr><tr><td>0</td><td>20 000</td></tr><tr><td>745</td><td>20 745</td></tr><tr><td>1 200</td><td>21 200</td></tr></table><p>El SO mueve el proceso y el registro pasa a <b>32 000</b>: la lógica 745 ahora es la física 32 745. El programa no se enteró.</p>',
 code: '# lo hace la MMU en cada acceso, no el programa\nfisica = reubicacion + logica',
 quiz: { q: 'El registro de reubicación vale 5000 y el programa usa la dirección lógica 250. ¿Cuál es la dirección física?', options: ['250', '4750', '5250'], hint: 'La MMU suma, no resta.', why: 'física = 5000 + 250 = 5250.' } },
en: { title: 'Logical and physical addresses', goal: 'Tell a logical address from a physical one and explain what the MMU does.',
 story: 'A blueprint says “the chest goes 2 blocks to the right of the door”. The blueprint works anywhere in the world, but the chest ends up at one exact coordinate.',
 body: "<h3>Two ways of naming a memory position</h3><p>When a program runs, the CPU generates memory addresses: “read what is at position 745”. That is a <b>logical address</b>: the one the program sees, as if it were alone in memory and started at position 0.</p><p>RAM, however, works with <b>physical addresses</b>: the real position of each byte on the chip. Since RAM holds many processes at once, a program is almost never stored from the real position 0.</p><ul><li><b>Logical address space:</b> all the addresses a program uses (from 0 up to its size).</li><li><b>Physical address space:</b> the real RAM positions where it was loaded.</li></ul><h3>The MMU: the translator</h3><p>Someone has to turn every logical address into a physical one, and do it on <b>every</b> memory access, millions of times per second. So it is not done by a program, but by a piece of hardware: the <b>MMU</b> (<i>Memory-Management Unit</i>).</p><p>The simplest MMU has a <b>relocation register</b> that stores where the process starts in RAM:</p><p class=\"math\">physical = relocation + logical</p><p>The program <b>never</b> sees physical addresses. If the OS moves the process to another part of RAM, only the register value changes; the program keeps working the same, without noticing.</p><h3>When is the real address decided?</h3><p>This is called <b>address binding</b>. It can happen at three moments:</p><table><tr><th>When</th><th>Idea</th><th>Can the process move?</th></tr><tr><td>At compile time</td><td>Its location is known in advance; the code holds fixed real addresses</td><td>No: it would need recompiling</td></tr><tr><td>At load time</td><td>Addresses are adjusted once, when the program is loaded into memory</td><td>No: it would need reloading</td></tr><tr><td>At execution time</td><td>The MMU translates on every access</td><td>Yes: this is what modern systems do</td></tr></table><p>The next lessons (contiguous allocation, paging and segmentation) are <b>three different ways</b> of doing this translation.</p><div class=\"recap\"><b>Remember.</b> The program uses logical addresses; RAM uses physical addresses. The MMU translates: physical = relocation + logical.</div>",
 mc: 'In Minecraft commands, <code>~2 ~ ~3</code> are <b>relative</b> coordinates (measured from whoever runs the command), like a logical address. The game turns them into <b>absolute</b> world coordinates, like a physical address. The same command works anywhere.',
 example: '<p>Relocation register = <b>20 000</b>.</p><table><tr><th>Logical address</th><th>Physical address</th></tr><tr><td>0</td><td>20 000</td></tr><tr><td>745</td><td>20 745</td></tr><tr><td>1 200</td><td>21 200</td></tr></table><p>The OS moves the process and the register becomes <b>32 000</b>: logical 745 is now physical 32 745. The program never noticed.</p>',
 code: '# the MMU does this on every access, not the program\nphysical = relocation + logical',
 quiz: { q: 'The relocation register holds 5000 and the program uses logical address 250. What is the physical address?', options: ['250', '4750', '5250'], hint: 'The MMU adds, it does not subtract.', why: 'physical = 5000 + 250 = 5250.' } },
answer: 2 };

  const tlb = { id: 'tlb', zone: 'mine', lab: null,
es: { title: 'La TLB y el tiempo de acceso', goal: 'Explicar para qué sirve la TLB y calcular el tiempo de acceso efectivo.',
 story: 'Si cada vez que quieres ir a tu base tuvieras que abrir el mapa completo, perderías mucho tiempo. Mejor anotar las coordenadas de los sitios que más visitas.',
 body: "<h3>El problema: dos viajes a la memoria</h3><p>La tabla de páginas de cada proceso está guardada en la RAM. Entonces, para leer un solo dato, la CPU tendría que ir <b>dos veces</b> a la memoria: una para leer la tabla y saber el marco, y otra para leer el dato. Eso haría todo el doble de lento.</p><h3>La solución: una caché de traducciones</h3><p>La <b>TLB</b> (<i>Translation Look-aside Buffer</i>) es una memoria muy pequeña y muy rápida, dentro de la CPU, que guarda las traducciones usadas hace poco: pares <b>(página, marco)</b>. Funciona porque los programas tienden a usar una y otra vez las mismas páginas.</p><ul><li><b>Acierto</b> (<i>hit</i>): la página está en la TLB. Se obtiene el marco de inmediato y solo hay un viaje a la memoria.</li><li><b>Fallo de TLB</b> (<i>miss</i>): la página no está en la TLB. Hay que leer la tabla en la RAM (un viaje extra) y luego guardar el par en la TLB. Si la TLB está llena, se reemplaza alguna entrada.</li></ul><p>Un fallo de TLB <b>no es un error</b>: la página sí está en la RAM, solo que su traducción no estaba a mano.</p><h3>¿Cuánto se gana? El tiempo de acceso efectivo</h3><p>La <b>tasa de aciertos</b> <i>h</i> es la fracción de accesos que encuentran la página en la TLB (por ejemplo, 0,8 = 80 %). Si un viaje a la RAM tarda <i>m</i> y no contamos el tiempo de la TLB:</p><p class=\"math\">tiempo efectivo = h · m + (1 − h) · 2m</p><p>La primera parte son los aciertos (un viaje) y la segunda los fallos (dos viajes).</p><h3>Al cambiar de proceso</h3><p>Cada proceso tiene su propia tabla de páginas, así que la página 3 de un proceso no es la página 3 de otro. Al cambiar de proceso, la TLB se vacía, o cada entrada lleva un identificador del proceso dueño (<b>ASID</b>) para no confundirlas.</p><div class=\"recap\"><b>Para recordar.</b> La TLB guarda traducciones recientes para evitar el viaje extra a la tabla. Tiempo efectivo = h · m + (1 − h) · 2m.</div>",
 mc: 'La TLB es como un libro con las coordenadas de tus diez lugares favoritos: casi siempre vas a uno de ellos, así que casi nunca tienes que abrir el mapa grande.',
 example: '<p>Un acceso a RAM tarda <b>100 ns</b>.</p><table><tr><th>Tasa de aciertos</th><th>Cálculo</th><th>Tiempo efectivo</th></tr><tr><td>80 %</td><td>0,80 · 100 + 0,20 · 200</td><td>120 ns</td></tr><tr><td>99 %</td><td>0,99 · 100 + 0,01 · 200</td><td>101 ns</td></tr><tr><td>Sin TLB</td><td>2 · 100</td><td>200 ns</td></tr></table><p>Con una buena tasa de aciertos, la paginación casi no hace más lento el acceso a memoria.</p>',
 code: 'marco = tlb.buscar(pagina)\nif marco is None:              # fallo de TLB (la página sí está en RAM)\n    marco = tablaPaginas[pagina]   # un acceso extra a memoria\n    tlb.guardar(pagina, marco)\nfisica = marco * tamPagina + desplazamiento',
 quiz: { q: 'Un acceso a RAM tarda 50 ns y la tasa de aciertos de la TLB es 90 %. Despreciando el tiempo de la TLB, ¿cuál es el tiempo efectivo?', options: ['50 ns', '55 ns', '100 ns'], hint: '0,9 · 50 + 0,1 · 100.', why: '45 + 10 = 55 ns.' } },
en: { title: 'The TLB and access time', goal: 'Explain what the TLB is for and compute the effective access time.',
 story: 'If you had to open the full map every time you wanted to go home, you would waste a lot of time. Better to write down the coordinates of the places you visit most.',
 body: "<h3>The problem: two trips to memory</h3><p>Each process’s page table is stored in RAM. So, to read a single piece of data, the CPU would have to go to memory <b>twice</b>: once to read the table and find the frame, and once to read the data. That would make everything twice as slow.</p><h3>The solution: a cache of translations</h3><p>The <b>TLB</b> (<i>Translation Look-aside Buffer</i>) is a very small, very fast memory inside the CPU that stores recently used translations: <b>(page, frame)</b> pairs. It works because programs tend to use the same pages again and again.</p><ul><li><b>Hit:</b> the page is in the TLB. The frame is known right away and there is only one trip to memory.</li><li><b>TLB miss:</b> the page is not in the TLB. The table must be read from RAM (one extra trip) and then the pair is stored in the TLB. If the TLB is full, some entry is replaced.</li></ul><p>A TLB miss is <b>not an error</b>: the page is in RAM, its translation just was not at hand.</p><h3>How much is gained? The effective access time</h3><p>The <b>hit ratio</b> <i>h</i> is the fraction of accesses that find the page in the TLB (for example, 0.8 = 80 %). If one trip to RAM takes <i>m</i> and we ignore the TLB time:</p><p class=\"math\">effective time = h · m + (1 − h) · 2m</p><p>The first part is the hits (one trip) and the second part the misses (two trips).</p><h3>When the process changes</h3><p>Each process has its own page table, so page 3 of one process is not page 3 of another. On a process switch, the TLB is flushed, or each entry carries an identifier of its owner process (<b>ASID</b>) so they are not mixed up.</p><div class=\"recap\"><b>Remember.</b> The TLB keeps recent translations to avoid the extra trip to the table. Effective time = h · m + (1 − h) · 2m.</div>",
 mc: 'The TLB is like a book with the coordinates of your ten favourite places: you almost always go to one of them, so you rarely need to open the big map.',
 example: '<p>One RAM access takes <b>100 ns</b>.</p><table><tr><th>Hit ratio</th><th>Calculation</th><th>Effective time</th></tr><tr><td>80 %</td><td>0.80 · 100 + 0.20 · 200</td><td>120 ns</td></tr><tr><td>99 %</td><td>0.99 · 100 + 0.01 · 200</td><td>101 ns</td></tr><tr><td>No TLB</td><td>2 · 100</td><td>200 ns</td></tr></table><p>With a good hit ratio, paging barely slows memory access down.</p>',
 code: 'frame = tlb.lookup(page)\nif frame is None:              # TLB miss (the page is in RAM)\n    frame = pageTable[page]    # one extra memory access\n    tlb.store(page, frame)\nphysical = frame * pageSize + offset',
 quiz: { q: 'One RAM access takes 50 ns and the TLB hit ratio is 90 %. Ignoring the TLB time, what is the effective access time?', options: ['50 ns', '55 ns', '100 ns'], hint: '0.9 · 50 + 0.1 · 100.', why: '45 + 10 = 55 ns.' } },
answer: 1 };

  const pagetable = { id: 'pagetable', zone: 'mine', lab: null,
es: { title: 'La tabla de páginas por dentro', goal: 'Usar el bit de validez, calcular el ahorro de las páginas compartidas y reconocer tablas jerárquicas e invertidas.',
 story: 'Una tabla de páginas parece una lista simple, pero cada entrada guarda más que un número de marco, y en un computador real la lista puede ser enorme.',
 body: "<h3>Cada entrada guarda más que un marco</h3><p>Hasta ahora la tabla de páginas parecía una lista de números de marco. En realidad, cada entrada lleva también unos bits de control. Esta lección muestra tres ideas importantes.</p><h3>1. El bit de validez: protección</h3><p>La tabla de páginas suele tener más entradas de las que el proceso usa. Cada entrada tiene un <b>bit de validez</b>:</p><ul><li><b>v</b> (válida): esa página pertenece al proceso.</li><li><b>i</b> (inválida): no pertenece; el proceso no debería usarla.</li></ul><p>Si el proceso intenta usar una página inválida, el hardware genera una excepción y el SO lo detiene. También puede haber bits de permiso: solo lectura, o lectura y escritura.</p><p><b>Ojo:</b> el bit protege <b>páginas completas</b>, no bytes. Si la última página está llena a medias, las direcciones del final de esa página pasan la revisión aunque estén fuera del proceso.</p><h3>2. Páginas compartidas: ahorrar memoria</h3><p>Si 30 estudiantes abren el mismo editor de texto, ¿hay que guardar 30 copias de su código? No. El código que nunca se modifica a sí mismo (<b>código reentrante</b>) se puede compartir: las tablas de páginas de los 30 procesos apuntan a los <b>mismos marcos</b> para el código. Cada proceso conserva sus propias páginas de datos.</p><h3>3. Tablas demasiado grandes</h3><p>Con direcciones de 32 bits y páginas de 4 KB, un proceso puede tener más de un millón de páginas, y su tabla ocuparía unos 4 MB. Para no gastar tanto hay tres estructuras:</p><ul><li><b>Jerárquica</b> (de dos niveles): la propia tabla se divide en páginas. El número de página se parte en dos: p1 indica la tabla externa y p2 la entrada dentro de una tabla interna. Solo se guardan las tablas internas que de verdad se usan.</li><li><b>Hash:</b> el número de página pasa por una función hash para encontrar su entrada rápido. Se usa con direcciones de más de 32 bits.</li><li><b>Invertida:</b> una sola tabla para todo el sistema, con una entrada por cada <b>marco</b> físico (no por página). Ocupa poco, pero buscar en ella es más lento.</li></ul><div class=\"recap\"><b>Para recordar.</b> El bit de validez protege páginas completas. El código reentrante se comparte. Las tablas grandes se organizan en niveles, con hash o invertidas.</div>",
 mc: 'Las páginas compartidas son como un libro de recetas colgado en la pared de la aldea: todos lo leen y nadie necesita su copia. Pero cada jugador tiene su propio inventario (sus datos).',
 example: '<p><b>Bit de validez.</b> Páginas de 1024 bytes y un proceso de 3000 bytes: usa ⌈3000 ÷ 1024⌉ = 3 páginas.</p><table><tr><th>Página</th><th>0</th><th>1</th><th>2</th><th>3</th><th>…</th><th>7</th></tr><tr><td>Bit</td><td>v</td><td>v</td><td>v</td><td>i</td><td>i</td><td>i</td></tr></table><p>La dirección 3500 está en la página 3: inválida → error. La 3050 está en la página 2: válida, aunque el proceso termina en 2999 (3 · 1024 = 3072).</p><p><b>Páginas compartidas.</b> 30 estudiantes usan el mismo editor: código de 200 KB y datos de 40 KB cada uno.</p><div class="flow">Sin compartir: 30 · (200 + 40) = 7200 KB<br>Compartiendo el código: 200 + 30 · 40 = 1400 KB</div><p><b>Dos niveles.</b> Dirección de 32 bits, páginas de 4 KB:</p><div class="flow">| p1: 10 bits | p2: 10 bits | desplazamiento: 12 bits |</div>',
 code: '# traducción con una tabla de dos niveles\ninterna = tablaExterna[p1]\nmarco   = interna[p2]\nfisica  = marco * tamPagina + d',
 quiz: { q: 'Páginas de 1024 bytes, proceso de 3000 bytes. ¿Qué pasa con la dirección lógica 3050?', options: ['Genera un error de protección', 'Se traduce sin error: cae en la página 2, que es válida', 'El SO agranda el proceso'], hint: 'Calcula 3050 ÷ 1024 y mira el bit de esa página.', why: '3050 ÷ 1024 = 2 (división entera), y la página 2 es válida. El bit protege páginas completas, no bytes.' } },
en: { title: 'Inside the page table', goal: 'Use the valid bit, compute the savings of shared pages and recognise hierarchical and inverted tables.',
 story: 'A page table looks like a simple list, but each entry holds more than a frame number, and on a real computer the list can be huge.',
 body: "<h3>Each entry holds more than a frame</h3><p>So far the page table looked like a list of frame numbers. In fact, each entry also carries some control bits. This lesson shows three important ideas.</p><h3>1. The valid bit: protection</h3><p>A page table usually has more entries than the process uses. Each entry has a <b>valid bit</b>:</p><ul><li><b>v</b> (valid): that page belongs to the process.</li><li><b>i</b> (invalid): it does not; the process should not use it.</li></ul><p>If the process tries to use an invalid page, the hardware raises an exception and the OS stops it. There may also be permission bits: read-only, or read-write.</p><p><b>Careful:</b> the bit protects <b>whole pages</b>, not bytes. If the last page is half full, the addresses at the end of that page pass the check even though they are outside the process.</p><h3>2. Shared pages: saving memory</h3><p>If 30 students open the same text editor, do we need to store 30 copies of its code? No. Code that never modifies itself (<b>reentrant code</b>) can be shared: the page tables of all 30 processes point to the <b>same frames</b> for the code. Each process keeps its own data pages.</p><h3>3. Tables that are too big</h3><p>With 32-bit addresses and 4 KB pages, a process can have over a million pages, and its table would take about 4 MB. To avoid spending that much there are three structures:</p><ul><li><b>Hierarchical</b> (two-level): the table itself is split into pages. The page number is split in two: p1 points to the outer table and p2 to the entry inside an inner table. Only the inner tables actually in use are kept.</li><li><b>Hashed:</b> the page number goes through a hash function to find its entry quickly. It is used with addresses longer than 32 bits.</li><li><b>Inverted:</b> a single table for the whole system, with one entry per physical <b>frame</b> (not per page). It is small, but searching it is slower.</li></ul><div class=\"recap\"><b>Remember.</b> The valid bit protects whole pages. Reentrant code can be shared. Large tables are organised in levels, with hashing or inverted.</div>",
 mc: 'Shared pages are like a recipe book hung on the village wall: everyone reads it and nobody needs their own copy. But each player has their own inventory (their data).',
 example: '<p><b>Valid bit.</b> 1024-byte pages and a 3000-byte process: it uses ⌈3000 ÷ 1024⌉ = 3 pages.</p><table><tr><th>Page</th><th>0</th><th>1</th><th>2</th><th>3</th><th>…</th><th>7</th></tr><tr><td>Bit</td><td>v</td><td>v</td><td>v</td><td>i</td><td>i</td><td>i</td></tr></table><p>Address 3500 is in page 3: invalid → error. Address 3050 is in page 2: valid, even though the process ends at 2999 (3 · 1024 = 3072).</p><p><b>Shared pages.</b> 30 students use the same editor: 200 KB of code and 40 KB of data each.</p><div class="flow">Without sharing: 30 · (200 + 40) = 7200 KB<br>Sharing the code: 200 + 30 · 40 = 1400 KB</div><p><b>Two levels.</b> 32-bit address, 4 KB pages:</p><div class="flow">| p1: 10 bits | p2: 10 bits | offset: 12 bits |</div>',
 code: '# translation with a two-level table\ninner    = outerTable[p1]\nframe    = inner[p2]\nphysical = frame * pageSize + d',
 quiz: { q: '1024-byte pages, a 3000-byte process. What happens with logical address 3050?', options: ['It raises a protection error', 'It is translated without error: it falls in page 2, which is valid', 'The OS makes the process bigger'], hint: 'Compute 3050 ÷ 1024 and look at that page’s bit.', why: '3050 ÷ 1024 = 2 (integer division), and page 2 is valid. The bit protects whole pages, not bytes.' } },
answer: 1 };
