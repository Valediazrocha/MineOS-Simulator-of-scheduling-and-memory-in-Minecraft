{ id: 'os', zone: 'village', lab: null,
es: { title: '¿Qué es un sistema operativo?', goal: 'Reconocer las tareas del sistema operativo: repartir recursos y protegerlos.',
 story: 'Veinte personas juegan en el mismo mundo. Todas quieren moverse ya, los cultivos deben crecer y las puertas automáticas deben abrirse. Pero el computador es uno solo.',
 body: "<h3>Las cuatro partes de un computador</h3><p>Un sistema de cómputo se puede ver como cuatro capas, una encima de otra:</p><ol><li><b>Hardware:</b> CPU, memoria RAM, disco y dispositivos (teclado, pantalla, red).</li><li><b>Sistema operativo:</b> controla el hardware y lo reparte entre los programas.</li><li><b>Aplicaciones:</b> el navegador, el juego, el editor de texto.</li><li><b>Usuarios:</b> personas (u otros computadores) que usan las aplicaciones.</li></ol><p>El <b>sistema operativo (SO)</b> es el programa que se ubica entre las aplicaciones y el hardware. Las aplicaciones no hablan directamente con el disco o con la tarjeta de red: le piden al SO que lo haga por ellas.</p><h3>Sus dos grandes trabajos</h3><ul><li><b>Repartir recursos.</b> Hay una sola CPU (o unos pocos núcleos), una memoria y un disco, pero muchos programas quieren usarlos a la vez. El SO decide quién usa qué y cuándo, buscando que sea eficiente y justo.</li><li><b>Proteger y controlar.</b> El SO impide que un programa con errores, o malicioso, dañe a otro programa o al propio sistema. Por ejemplo, no deja que un programa lea la memoria de otro.</li></ul><h3>El kernel</h3><p>El <b>kernel</b> (núcleo) es la parte central del SO: el programa que está siempre en ejecución desde que el computador arranca y que tiene control total del hardware. Las demás partes del sistema (las herramientas del sistema, la interfaz gráfica) se apoyan en él.</p><h3>Servicios que ofrece</h3><p>Para que los programas funcionen, el SO ofrece servicios como: ejecutar programas, manejar archivos, comunicarse con dispositivos de entrada y salida, comunicar programas entre sí, detectar errores y proteger la información.</p><h3>Cómo se organiza por dentro</h3><table><tr><th>Estructura</th><th>Idea</th></tr><tr><td>Simple o monolítica</td><td>Casi todo el SO es un solo programa grande. Es rápido, pero un error en una parte puede afectar a todo (UNIX tradicional, MS-DOS)</td></tr><tr><td>Por capas</td><td>Cada capa solo usa los servicios de la capa de abajo. Es ordenado, pero más lento</td></tr><tr><td>Microkernel</td><td>El kernel se deja muy pequeño y el resto corre como programas aparte. Es más seguro, pero hay más comunicación entre partes</td></tr><tr><td>Módulos</td><td>Un kernel base que carga piezas cuando las necesita, como un controlador nuevo (Linux)</td></tr></table><div class=\"recap\"><b>Para recordar.</b> El SO reparte los recursos y protege al sistema. El kernel es su parte central, siempre activa.</div>",
 mc: 'Un servidor de Minecraft no es un sistema operativo, pero enfrenta problemas parecidos: mucho trabajo, poco tiempo y memoria limitada. Por eso sirve como maqueta para estudiar las decisiones de un SO.',
 example: '<p>Clasifiquemos responsabilidades:</p><table><tr><th>Situación</th><th>¿Quién responde?</th></tr><tr><td>Ejecutar una suma</td><td>Hardware (CPU)</td></tr><tr><td>Decidir qué programa usa la CPU ahora</td><td>Sistema operativo</td></tr><tr><td>Dibujar el inventario del juego</td><td>Aplicación</td></tr><tr><td>Impedir que un programa lea la memoria de otro</td><td>SO con ayuda del hardware</td></tr></table>',
 quiz: { q: 'Dos programas quieren usar la CPU al mismo tiempo en un computador de un solo núcleo. ¿Quién decide el turno?', options: ['El sistema operativo', 'El programa que pesa más', 'El monitor'], hint: 'Piensa quién reparte los recursos.', why: 'Repartir el tiempo de CPU es una decisión de administración de recursos del SO.' } },
en: { title: 'What is an operating system?', goal: 'Recognise the two jobs of an operating system: sharing resources and protecting them.',
 story: 'Twenty people play in the same world. Everyone wants to move right now, crops must grow and automatic doors must open. There is only one computer.',
 body: "<h3>The four parts of a computer</h3><p>A computer system can be seen as four layers, one on top of another:</p><ol><li><b>Hardware:</b> CPU, RAM, disk and devices (keyboard, screen, network).</li><li><b>Operating system:</b> controls the hardware and shares it among programs.</li><li><b>Applications:</b> the browser, the game, the text editor.</li><li><b>Users:</b> people (or other computers) who use the applications.</li></ol><p>The <b>operating system (OS)</b> is the program that sits between applications and hardware. Applications do not talk to the disk or the network card directly: they ask the OS to do it for them.</p><h3>Its two big jobs</h3><ul><li><b>Sharing resources.</b> There is one CPU (or a few cores), one memory and one disk, but many programs want them at the same time. The OS decides who uses what and when, aiming to be efficient and fair.</li><li><b>Protection and control.</b> The OS stops a buggy or malicious program from damaging another program or the system itself. For example, it does not let one program read another one’s memory.</li></ul><h3>The kernel</h3><p>The <b>kernel</b> is the core of the OS: the program that is always running from the moment the computer starts and that has full control of the hardware. The rest of the system (system tools, the graphical interface) relies on it.</p><h3>Services it offers</h3><p>So that programs can work, the OS offers services such as: running programs, handling files, talking to input and output devices, letting programs communicate, detecting errors and protecting information.</p><h3>How it is organised inside</h3><table><tr><th>Structure</th><th>Idea</th></tr><tr><td>Simple or monolithic</td><td>Almost the whole OS is one big program. It is fast, but a bug in one part can affect everything (traditional UNIX, MS-DOS)</td></tr><tr><td>Layered</td><td>Each layer only uses the services of the layer below. It is tidy, but slower</td></tr><tr><td>Microkernel</td><td>The kernel is kept very small and the rest runs as separate programs. It is safer, but the parts must talk to each other more</td></tr><tr><td>Modules</td><td>A base kernel that loads pieces when it needs them, like a new driver (Linux)</td></tr></table><div class=\"recap\"><b>Remember.</b> The OS shares resources and protects the system. The kernel is its core, always active.</div>",
 mc: 'A Minecraft server is not an operating system, but it faces similar problems: lots of work, little time and limited memory. That makes it a good scale model for studying OS decisions.',
 example: '<p>Let us sort some responsibilities:</p><table><tr><th>Situation</th><th>Who is in charge?</th></tr><tr><td>Performing an addition</td><td>Hardware (CPU)</td></tr><tr><td>Deciding which program gets the CPU now</td><td>Operating system</td></tr><tr><td>Drawing the game inventory</td><td>Application</td></tr><tr><td>Stopping a program from reading another one’s memory</td><td>OS helped by hardware</td></tr></table>',
 quiz: { q: 'Two programs want the CPU at the same time on a single-core computer. Who decides the turn?', options: ['The operating system', 'The biggest program', 'The monitor'], hint: 'Think about who shares the resources.', why: 'Sharing CPU time is a resource-management decision of the OS.' } },
answer: 0 },

{ id: 'process', zone: 'village', lab: { route: 'cpu', preset: 'io' },
es: { title: 'Procesos, estados y PCB', goal: 'Distinguir un programa de un proceso y seguir sus cambios de estado.',
 story: 'El archivo del juego está guardado en el disco y no hace nada. Cuando lo abres, empieza a ocupar memoria y a pedir CPU. Si lo abres dos veces, hay dos ejecuciones distintas.',
 body: "<h3>Programa y proceso no son lo mismo</h3><p>Un <b>programa</b> es un archivo guardado en el disco con instrucciones: es <b>pasivo</b>, no hace nada por sí solo. Un <b>proceso</b> es un programa <b>en ejecución</b>: está en memoria, usa la CPU y cambia con el tiempo. Si abres el mismo juego dos veces, hay un solo programa pero dos procesos distintos.</p><h3>Qué tiene un proceso en memoria</h3><ul><li><b>Código</b> (<i>text</i>): las instrucciones del programa.</li><li><b>Datos:</b> las variables globales.</li><li><b>Heap:</b> memoria que el programa pide mientras corre (por ejemplo, al crear objetos).</li><li><b>Stack</b> (pila): datos temporales de las funciones que se están ejecutando.</li></ul><p>Además, tiene un <b>contador de programa</b> (qué instrucción sigue) y el valor de los <b>registros</b> de la CPU.</p><h3>Los cinco estados</h3><table><tr><th>Estado</th><th>Qué significa</th></tr><tr><td><b>New</b></td><td>Se está creando</td></tr><tr><td><b>Ready</b></td><td>Está listo, esperando su turno en la CPU</td></tr><tr><td><b>Running</b></td><td>Está usando la CPU en este momento</td></tr><tr><td><b>Waiting</b></td><td>Espera un evento, por ejemplo que termine una lectura del disco (entrada/salida o <i>I/O</i>)</td></tr><tr><td><b>Terminated</b></td><td>Terminó su trabajo</td></tr></table><p>En un núcleo de CPU solo puede haber <b>un proceso en Running</b> a la vez; los demás esperan en Ready o en Waiting.</p><div class=\"flow\">New → Ready → Running → Terminated<br>Running → Ready (le quitan la CPU)<br>Running → Waiting (pide I/O) → Ready (la I/O terminó)</div><p><b>Ojo:</b> de Waiting nunca se pasa directo a Running. Primero hay que volver a la cola de listos y esperar a que el planificador lo elija.</p><h3>La ficha del proceso: el PCB</h3><p>Para poder pausar un proceso y reanudarlo después justo donde iba, el SO guarda una ficha de cada uno, llamada <b>PCB</b> (<i>Process Control Block</i>). Contiene: su estado, su contador de programa, sus registros, su prioridad, qué memoria usa y qué archivos tiene abiertos.</p><div class=\"recap\"><b>Para recordar.</b> Un proceso es un programa en ejecución. Pasa por New, Ready, Running, Waiting y Terminated, y el SO guarda su información en el PCB.</div>",
 mc: "En el modelo de MineOS, cada tarea de un tick (la acción de un jugador, la actualización de un animal) se trata como un proceso pequeño, con su propia ficha: qué es, cuánto trabajo le falta y cuándo llegó.",
 example: '<p>Un proceso A usa 2 unidades de CPU, espera 3 de I/O y usa 2 más. Si está solo:</p><table><tr><th>Intervalo</th><th>Estado de A</th></tr><tr><td>[0, 2)</td><td>Running</td></tr><tr><td>[2, 5)</td><td>Waiting (la CPU queda libre)</td></tr><tr><td>[5, 7)</td><td>Running</td></tr><tr><td>t = 7</td><td>Terminated</td></tr></table>',
 quiz: { q: 'La lectura del disco de un proceso acaba de terminar. ¿A qué estado pasa?', options: ['Running', 'Ready', 'Terminated'], hint: 'Que el evento haya ocurrido no significa que la CPU esté libre.', why: 'Vuelve a Ready; el planificador decidirá cuándo ejecutarlo.' } },
en: { title: 'Processes, states and the PCB', goal: 'Tell a program from a process and follow its state changes.',
 story: 'The game file sits on disk doing nothing. When you open it, it starts using memory and asking for CPU. Open it twice and you get two separate executions.',
 body: "<h3>A program and a process are not the same</h3><p>A <b>program</b> is a file on disk with instructions: it is <b>passive</b>, it does nothing by itself. A <b>process</b> is a program <b>in execution</b>: it is in memory, uses the CPU and changes over time. If you open the same game twice, there is one program but two different processes.</p><h3>What a process has in memory</h3><ul><li><b>Code</b> (<i>text</i>): the program’s instructions.</li><li><b>Data:</b> the global variables.</li><li><b>Heap:</b> memory the program asks for while it runs (for example, when creating objects).</li><li><b>Stack:</b> temporary data of the functions being run.</li></ul><p>It also has a <b>program counter</b> (which instruction comes next) and the values of the CPU <b>registers</b>.</p><h3>The five states</h3><table><tr><th>State</th><th>Meaning</th></tr><tr><td><b>New</b></td><td>It is being created</td></tr><tr><td><b>Ready</b></td><td>It is ready, waiting for its turn on the CPU</td></tr><tr><td><b>Running</b></td><td>It is using the CPU right now</td></tr><tr><td><b>Waiting</b></td><td>It is waiting for an event, such as the end of a disk read (input/output or <i>I/O</i>)</td></tr><tr><td><b>Terminated</b></td><td>It has finished its work</td></tr></table><p>On one CPU core there can be only <b>one process in Running</b> at a time; the rest wait in Ready or Waiting.</p><div class=\"flow\">New → Ready → Running → Terminated<br>Running → Ready (the CPU is taken away)<br>Running → Waiting (asks for I/O) → Ready (I/O finished)</div><p><b>Careful:</b> a process never goes straight from Waiting to Running. It first goes back to the ready queue and waits for the scheduler to pick it.</p><h3>The process record: the PCB</h3><p>To pause a process and later resume it exactly where it was, the OS keeps a record for each one, called the <b>PCB</b> (<i>Process Control Block</i>). It holds: its state, program counter, registers, priority, the memory it uses and its open files.</p><div class=\"recap\"><b>Remember.</b> A process is a program in execution. It goes through New, Ready, Running, Waiting and Terminated, and the OS keeps its information in the PCB.</div>",
 mc: "In the MineOS model, each task in a tick (a player action, an animal update) is treated as a tiny process, with its own record: what it is, how much work it has left and when it arrived.",
 example: '<p>Process A uses 2 CPU units, waits 3 units for I/O and uses 2 more. If it is alone:</p><table><tr><th>Interval</th><th>State of A</th></tr><tr><td>[0, 2)</td><td>Running</td></tr><tr><td>[2, 5)</td><td>Waiting (the CPU is idle)</td></tr><tr><td>[5, 7)</td><td>Running</td></tr><tr><td>t = 7</td><td>Terminated</td></tr></table>',
 quiz: { q: 'A process’s disk read has just finished. Which state does it move to?', options: ['Running', 'Ready', 'Terminated'], hint: 'The event happening does not mean the CPU is free.', why: 'It goes back to Ready; the scheduler decides when it runs.' } },
answer: 1 },

{ id: 'kernel', zone: 'village', lab: null,
es: { title: 'Interrupciones y llamadas al sistema', goal: 'Explicar cómo el SO recupera el control y cómo un programa le pide servicios.',
 story: 'Un programa quiere guardar tu partida. No puede escribir en el disco como le dé la gana: tiene que pedírselo al sistema operativo.',
 body: "<h3>Dos modos de trabajo de la CPU</h3><p>Si cualquier programa pudiera hacer cualquier cosa con el hardware, un solo error podría borrar el disco o congelar el computador. Por eso la CPU tiene al menos dos modos, marcados por un bit especial:</p><ul><li><b>Modo usuario:</b> aquí corren las aplicaciones. Tienen permisos limitados.</li><li><b>Modo kernel</b> (o modo supervisor): aquí corre el SO. Puede usar <b>instrucciones privilegiadas</b>, como hablar con los dispositivos o cambiar la configuración de la memoria.</li></ul><p>Si un programa en modo usuario intenta una instrucción privilegiada, el hardware no lo deja y avisa al SO.</p><h3>Llamadas al sistema: pedirle algo al SO</h3><p>Cuando una aplicación necesita algo que solo el SO puede hacer (abrir un archivo, crear un proceso, enviar datos por la red), hace una <b>llamada al sistema</b> (<i>system call</i>):</p><ol><li>El programa pide el servicio, normalmente a través de una biblioteca (una API), por ejemplo <code>printf</code> en C.</li><li>La CPU pasa a <b>modo kernel</b> y el SO atiende la petición.</li><li>El SO devuelve el resultado y la CPU regresa a <b>modo usuario</b>.</li></ol><p>Hay llamadas para controlar procesos, manejar archivos, manejar dispositivos, pedir información (como la hora) y comunicarse.</p><h3>Interrupciones: el hardware avisa</h3><p>Una <b>interrupción</b> es una señal que avisa a la CPU que algo pasó: llegó una tecla, el disco terminó de leer, llegó un paquete por la red. La CPU deja lo que estaba haciendo, el SO ejecuta el código que atiende ese evento y después continúa.</p><p>Hay una interrupción muy importante: la del <b>temporizador</b> (<i>timer</i>). Suena cada cierto tiempo y le devuelve el control al SO, para que ningún programa pueda quedarse con la CPU para siempre.</p><h3>El cambio de contexto</h3><p>Cuando el SO decide cambiar de proceso, hace un <b>cambio de contexto</b>: guarda el estado del proceso actual en su PCB y carga el estado del siguiente desde el suyo. Es trabajo necesario, pero mientras se hace no avanza ningún programa: es tiempo «perdido».</p><p>Una interrupción no siempre termina en cambio de contexto: el SO puede atenderla y devolverle la CPU al mismo proceso.</p><div class=\"recap\"><b>Para recordar.</b> Las aplicaciones piden servicios con llamadas al sistema; el hardware avisa con interrupciones. En ambos casos la CPU pasa a modo kernel para que actúe el SO.</div>",
 mc: 'Guardar el mundo en el disco termina en llamadas al sistema: el juego (a través de Java) pide al SO que escriba los archivos.',
 example: '<p>Guardar una partida:</p><ol><li>El juego llama a una función de una biblioteca.</li><li>La biblioteca hace la <i>system call</i> de escritura.</li><li>La CPU pasa a modo kernel y el SO inicia la operación de disco.</li><li>El SO regresa a modo usuario, quizá con otro proceso.</li><li>Cuando el disco termina, una interrupción avisa al SO.</li></ol>',
 quiz: { q: 'Llega una interrupción del teclado mientras corre el proceso A. ¿Qué es correcto?', options: ['El SO la atiende y puede devolver la CPU a A', 'Siempre se cambia a otro proceso', 'A queda terminado'], hint: 'Cambio de modo y cambio de proceso no son lo mismo.', why: 'Hay cambio a modo kernel; cambiar de proceso es una decisión aparte.' } },
en: { title: 'Interrupts and system calls', goal: 'Explain how the OS regains control and how a program asks it for services.',
 story: 'A program wants to save your game. It cannot write to disk however it likes: it has to ask the operating system.',
 body: "<h3>Two CPU working modes</h3><p>If any program could do anything with the hardware, one mistake could wipe the disk or freeze the computer. That is why the CPU has at least two modes, marked by a special bit:</p><ul><li><b>User mode:</b> applications run here. Their permissions are limited.</li><li><b>Kernel mode</b> (or supervisor mode): the OS runs here. It can use <b>privileged instructions</b>, such as talking to devices or changing the memory setup.</li></ul><p>If a program in user mode tries a privileged instruction, the hardware blocks it and tells the OS.</p><h3>System calls: asking the OS for something</h3><p>When an application needs something only the OS can do (open a file, create a process, send data over the network), it makes a <b>system call</b>:</p><ol><li>The program asks for the service, usually through a library (an API), for example <code>printf</code> in C.</li><li>The CPU switches to <b>kernel mode</b> and the OS handles the request.</li><li>The OS returns the result and the CPU goes back to <b>user mode</b>.</li></ol><p>There are calls to control processes, handle files, handle devices, get information (such as the time) and communicate.</p><h3>Interrupts: the hardware gives notice</h3><p>An <b>interrupt</b> is a signal telling the CPU that something happened: a key was pressed, the disk finished reading, a network packet arrived. The CPU stops what it was doing, the OS runs the code that handles the event and then carries on.</p><p>One interrupt is especially important: the <b>timer</b>. It goes off every so often and gives control back to the OS, so no program can keep the CPU forever.</p><h3>The context switch</h3><p>When the OS decides to change process, it performs a <b>context switch</b>: it saves the current process’s state in its PCB and loads the next one’s state from its own. It is necessary work, but while it happens no program moves forward: it is “lost” time.</p><p>An interrupt does not always lead to a context switch: the OS can handle it and give the CPU back to the same process.</p><div class=\"recap\"><b>Remember.</b> Applications ask for services with system calls; the hardware gives notice with interrupts. In both cases the CPU switches to kernel mode so the OS can act.</div>",
 mc: 'Saving the world to disk ends in system calls: the game (through Java) asks the OS to write the files.',
 example: '<p>Saving a game:</p><ol><li>The game calls a library function.</li><li>The library makes the write <i>system call</i>.</li><li>The CPU enters kernel mode and the OS starts the disk operation.</li><li>The OS returns to user mode, maybe running another process.</li><li>When the disk finishes, an interrupt notifies the OS.</li></ol>',
 quiz: { q: 'A keyboard interrupt arrives while process A runs. Which statement is right?', options: ['The OS handles it and may give the CPU back to A', 'The CPU always switches to another process', 'A is terminated'], hint: 'A mode switch and a process switch are different things.', why: 'There is a switch to kernel mode; switching processes is a separate decision.' } },
answer: 0 },

{ id: 'tick', zone: 'village', lab: { route: 'server' },
es: { title: 'El reloj del servidor: el tick', goal: 'Calcular TPS a partir de MSPT y distinguir concurrencia de paralelismo.',
 story: 'Cuando el servidor “tiene lag”, las puertas tardan en abrir y los animales se mueven a saltos. Algo no está alcanzando a hacerse a tiempo.',
 body: "<h3>El reloj del juego</h3><p>Minecraft no simula el mundo de forma continua: lo hace avanzar a saltos llamados <b>ticks</b>. En cada tick se mueven las criaturas, crecen los cultivos, funcionan los circuitos y se procesan las acciones de los jugadores. La meta es <b>20 ticks por segundo</b>, así que cada tick tiene un presupuesto de 1000 ÷ 20 = <b>50 ms</b>.</p><ul><li><b>MSPT</b> (milisegundos por tick): cuánto tardó de verdad un tick.</li><li><b>TPS</b> (ticks por segundo): cuántos ticks se logran en un segundo.</li></ul><p class=\"math\">si MSPT ≤ 50: TPS = 20 · si MSPT &gt; 50: TPS ≈ 1000 ÷ MSPT</p><p>Si un tick tarda más de 50 ms, el siguiente empieza tarde y el mundo se pone lento: eso es el <b>lag</b> del servidor.</p><h3>Concurrencia y paralelismo</h3><p>Son dos ideas que se confunden mucho:</p><ul><li><b>Concurrencia:</b> varias tareas <b>avanzan en el mismo periodo</b>, turnándose. Con un solo núcleo, la CPU salta de una tarea a otra tan rápido que parece que van a la vez.</li><li><b>Paralelismo:</b> varias tareas se ejecutan <b>en el mismo instante</b>, cada una en un núcleo distinto. Necesita varios núcleos.</li></ul><p>Puede haber concurrencia sin paralelismo (un solo núcleo con turnos), pero no paralelismo sin varias unidades de ejecución.</p><h3>Hilos</h3><p>Un <b>hilo</b> (<i>thread</i>) es una línea de ejecución dentro de un proceso. Un proceso puede tener varios hilos: todos comparten el código, los datos y los archivos abiertos, pero cada uno tiene su propio contador de programa, sus registros y su pila.</p><p>¿Por qué usar hilos? Porque crear un hilo es más barato que crear un proceso, porque comparten memoria sin necesidad de IPC, porque un programa sigue respondiendo aunque uno de sus hilos esté esperando, y porque varios hilos pueden aprovechar varios núcleos.</p><p>Los hilos pueden ser de <b>usuario</b> (los maneja una biblioteca del programa) o de <b>kernel</b> (los maneja el SO). Los sistemas modernos, como Linux y Windows, usan el modelo <b>uno a uno</b>: cada hilo de usuario corresponde a un hilo de kernel.</p><div class=\"recap\"><b>Para recordar.</b> 20 TPS = 50 ms por tick. Concurrencia es turnarse; paralelismo es trabajar a la vez en varios núcleos. Un hilo es una línea de ejecución que comparte la memoria de su proceso.</div>",
 mc: 'MineOS modela un solo hilo principal que ejecuta las tareas de cada tick, una a la vez: hay concurrencia, pero no paralelismo. Los servidores reales usan además otros hilos para algunas labores.',
 example: '<p>Si el trabajo de un tick toma 80 ms:</p><p class="math">TPS = 1000 / 80 = 12,5</p><p>El mundo avanza a 12,5 pasos por segundo en lugar de 20.</p>',
 quiz: { q: 'Cada tick tarda 100 ms. ¿Cuántos TPS logra el servidor?', options: ['20', '10', '5'], hint: '¿Cuántos bloques de 100 ms caben en un segundo?', why: '1000 / 100 = 10 TPS.' } },
en: { title: 'The server clock: the tick', goal: 'Compute TPS from MSPT and tell concurrency from parallelism.',
 story: 'When the server “lags”, doors open late and animals move in jumps. Some work is not getting done in time.',
 body: "<h3>The game clock</h3><p>Minecraft does not simulate the world continuously: it moves it forward in jumps called <b>ticks</b>. In each tick creatures move, crops grow, circuits work and players’ actions are processed. The target is <b>20 ticks per second</b>, so each tick has a budget of 1000 ÷ 20 = <b>50 ms</b>.</p><ul><li><b>MSPT</b> (milliseconds per tick): how long a tick actually took.</li><li><b>TPS</b> (ticks per second): how many ticks are completed in one second.</li></ul><p class=\"math\">if MSPT ≤ 50: TPS = 20 · if MSPT &gt; 50: TPS ≈ 1000 ÷ MSPT</p><p>If a tick takes longer than 50 ms, the next one starts late and the world slows down: that is server <b>lag</b>.</p><h3>Concurrency and parallelism</h3><p>These two ideas are often mixed up:</p><ul><li><b>Concurrency:</b> several tasks <b>make progress in the same period</b>, taking turns. With a single core, the CPU jumps between tasks so fast that they seem to run together.</li><li><b>Parallelism:</b> several tasks run <b>at the same instant</b>, each on a different core. It needs several cores.</li></ul><p>You can have concurrency without parallelism (one core taking turns), but not parallelism without several execution units.</p><h3>Threads</h3><p>A <b>thread</b> is a line of execution inside a process. A process can have several threads: they all share the code, the data and the open files, but each has its own program counter, registers and stack.</p><p>Why use threads? Because creating a thread is cheaper than creating a process, because they share memory without needing IPC, because a program stays responsive even if one of its threads is waiting, and because several threads can use several cores.</p><p>Threads can be <b>user</b> threads (handled by a library in the program) or <b>kernel</b> threads (handled by the OS). Modern systems such as Linux and Windows use the <b>one-to-one</b> model: each user thread maps to one kernel thread.</p><div class=\"recap\"><b>Remember.</b> 20 TPS = 50 ms per tick. Concurrency is taking turns; parallelism is working at the same time on several cores. A thread is a line of execution that shares its process’s memory.</div>",
 mc: 'MineOS models a single main thread that runs the tasks of each tick one at a time: there is concurrency but no parallelism. Real servers also use other threads for some work.',
 example: '<p>If one tick’s work takes 80 ms:</p><p class="math">TPS = 1000 / 80 = 12.5</p><p>The world advances 12.5 steps per second instead of 20.</p>',
 quiz: { q: 'Each tick takes 100 ms. How many TPS does the server reach?', options: ['20', '10', '5'], hint: 'How many 100 ms blocks fit in one second?', why: '1000 / 100 = 10 TPS.' } },
answer: 1 },

{ id: 'metrics', zone: 'station', lab: { route: 'cpu', preset: 'convoy' },
es: { title: 'Planificación y métricas', goal: 'Calcular tiempo de respuesta, de retorno y de espera.',
 story: 'Varias criaturas hacen fila frente a una sola máquina. El planificador es quien decide cuál entra.',
 body: "<h3>Ráfagas de CPU y de E/S</h3><p>Casi ningún proceso usa la CPU de corrido. Alterna <b>ráfagas de CPU</b> (calcula) con <b>ráfagas de E/S</b> (espera al disco, a la red, al teclado). Mientras un proceso espera su E/S, la CPU queda libre para otro. Esa es la idea de la <b>multiprogramación</b>: tener varios procesos en memoria para que la CPU casi nunca esté desocupada.</p><h3>El planificador y el despachador</h3><ul><li>El <b>planificador de CPU</b> elige a cuál proceso de la cola de listos le toca la CPU.</li><li>El <b>despachador</b> (<i>dispatcher</i>) hace el cambio: guarda el contexto del proceso que sale, carga el del que entra y le entrega la CPU. El tiempo que tarda se llama <b>latencia de despacho</b>.</li></ul><h3>¿Cuándo se decide?</h3><p>El planificador actúa cuando un proceso: (1) pasa de Running a Waiting, (2) pasa de Running a Ready, (3) pasa de Waiting a Ready o (4) termina.</p><ul><li>Si solo decide en los casos 1 y 4 (cuando el proceso suelta la CPU por su cuenta), es <b>no apropiativo</b>.</li><li>Si también decide en los casos 2 y 3, puede quitarle la CPU a un proceso que todavía la quería: es <b>apropiativo</b> (<i>preemptive</i>). Windows, macOS y Linux son apropiativos.</li></ul><h3>Cómo saber si un planificador es bueno</h3><table><tr><th>Métrica</th><th>Cómo se calcula</th><th>Se busca…</th></tr><tr><td>Utilización de CPU</td><td>tiempo con la CPU ocupada ÷ tiempo total</td><td>que sea alta</td></tr><tr><td><i>Throughput</i></td><td>procesos terminados ÷ tiempo total</td><td>que sea alto</td></tr><tr><td>Retorno (<i>turnaround</i>)</td><td>finalización − llegada</td><td>que sea bajo</td></tr><tr><td>Espera</td><td>tiempo total en la cola de listos</td><td>que sea baja</td></tr><tr><td>Respuesta</td><td>primera vez que usa la CPU − llegada</td><td>que sea baja</td></tr></table><p>Si no hay E/S ni costo de cambio de contexto, se cumple: <b>espera = retorno − tiempo de CPU</b>.</p><h3>El diagrama de Gantt</h3><p>Para calcular estas métricas se dibuja un <b>diagrama de Gantt</b>: una barra de tiempo que muestra qué proceso usó la CPU en cada intervalo. En esta página los intervalos se escriben como [inicio, fin): incluyen el inicio pero no el fin.</p><div class=\"recap\"><b>Para recordar.</b> Retorno = fin − llegada. Respuesta = primer turno − llegada. Espera = tiempo en la cola de listos.</div>",
 mc: 'La respuesta de la tarea de un jugador es lo que se siente: cuánto tarda el mundo en reaccionar a lo que hizo.',
 example: '<p>A llega en 0, empieza en 2, usa 3 unidades seguidas y termina en 5.</p><p class="math">respuesta = 2 − 0 = 2 · retorno = 5 − 0 = 5 · espera = 5 − 3 = 2</p>',
 quiz: { q: 'B llega en 1, empieza en 4 y termina en 9 tras una sola ráfaga de 5. ¿Cuáles son su respuesta, retorno y espera?', options: ['3, 8 y 3', '4, 9 y 4', '3, 9 y 5'], hint: 'Resta siempre la llegada.', why: 'Respuesta 4−1=3, retorno 9−1=8, espera 8−5=3.' } },
en: { title: 'Scheduling and metrics', goal: 'Compute response, turnaround and waiting time.',
 story: 'Several creatures queue in front of a single machine. The scheduler decides who goes in.',
 body: "<h3>CPU bursts and I/O bursts</h3><p>Almost no process uses the CPU non-stop. It alternates <b>CPU bursts</b> (computing) with <b>I/O bursts</b> (waiting for the disk, the network, the keyboard). While a process waits for its I/O, the CPU is free for another one. That is the idea of <b>multiprogramming</b>: keeping several processes in memory so the CPU is almost never idle.</p><h3>The scheduler and the dispatcher</h3><ul><li>The <b>CPU scheduler</b> chooses which process in the ready queue gets the CPU.</li><li>The <b>dispatcher</b> makes the change: it saves the outgoing process’s context, loads the incoming one’s and hands it the CPU. The time this takes is the <b>dispatch latency</b>.</li></ul><h3>When is the decision made?</h3><p>The scheduler acts when a process: (1) goes from Running to Waiting, (2) goes from Running to Ready, (3) goes from Waiting to Ready or (4) terminates.</p><ul><li>If it only decides in cases 1 and 4 (when the process gives up the CPU on its own), it is <b>non-preemptive</b>.</li><li>If it also decides in cases 2 and 3, it can take the CPU from a process that still wanted it: it is <b>preemptive</b>. Windows, macOS and Linux are preemptive.</li></ul><h3>How to tell whether a scheduler is good</h3><table><tr><th>Metric</th><th>How it is computed</th><th>We want it…</th></tr><tr><td>CPU utilisation</td><td>time the CPU is busy ÷ total time</td><td>high</td></tr><tr><td>Throughput</td><td>processes finished ÷ total time</td><td>high</td></tr><tr><td>Turnaround</td><td>finish − arrival</td><td>low</td></tr><tr><td>Waiting</td><td>total time in the ready queue</td><td>low</td></tr><tr><td>Response</td><td>first time on the CPU − arrival</td><td>low</td></tr></table><p>With no I/O and no context-switch cost: <b>waiting = turnaround − CPU time</b>.</p><h3>The Gantt chart</h3><p>To compute these metrics we draw a <b>Gantt chart</b>: a time bar showing which process used the CPU in each interval. On this site intervals are written as [start, end): they include the start but not the end.</p><div class=\"recap\"><b>Remember.</b> Turnaround = finish − arrival. Response = first turn − arrival. Waiting = time in the ready queue.</div>",
 mc: 'The response time of a player’s task is what you feel: how long the world takes to react to what you did.',
 example: '<p>A arrives at 0, starts at 2, uses 3 units in a row and finishes at 5.</p><p class="math">response = 2 − 0 = 2 · turnaround = 5 − 0 = 5 · waiting = 5 − 3 = 2</p>',
 quiz: { q: 'B arrives at 1, starts at 4 and finishes at 9 after a single burst of 5. What are its response, turnaround and waiting times?', options: ['3, 8 and 3', '4, 9 and 4', '3, 9 and 5'], hint: 'Always subtract the arrival time.', why: 'Response 4−1=3, turnaround 9−1=8, waiting 8−5=3.' } },
answer: 0 },

{ id: 'fcfs', zone: 'station', lab: { route: 'cpu', preset: 'convoy' },
es: { title: 'FCFS y el efecto convoy', goal: 'Dibujar un diagrama de Gantt FCFS y explicar el efecto convoy.',
 story: 'Una máquina enorme entra primero a la CPU. Detrás, dos jugadores que solo querían abrir una puerta tienen que esperar.',
 body: "<h3>La idea: una fila de banco</h3><p><b>FCFS</b> (<i>First-Come, First-Served</i>, «el primero que llega es el primero en ser atendido») es el planificador más simple. La cola de listos funciona como una fila: el proceso que llegó primero usa la CPU hasta terminar su ráfaga, y luego sigue el próximo de la fila.</p><h3>Cómo funciona</h3><ol><li>Cuando un proceso llega (o vuelve de E/S), se pone al <b>final</b> de la cola.</li><li>Cuando la CPU queda libre, se le entrega al <b>primero</b> de la cola.</li><li>Ese proceso no suelta la CPU hasta que termina su ráfaga o pide E/S: FCFS es <b>no apropiativo</b>.</li></ol><h3>Ventajas</h3><ul><li>Es muy fácil de entender y de programar.</li><li>Es justo en un sentido: nadie se queda sin turno para siempre, porque todos avanzan en la fila.</li></ul><h3>El problema: el efecto convoy</h3><p>Imagina una carretera de un solo carril con un camión lento adelante y varios carros rápidos detrás: todos van a la velocidad del camión. En FCFS pasa lo mismo: si un proceso con una ráfaga <b>larga</b> llega primero, todos los procesos <b>cortos</b> que vienen detrás tienen que esperarlo. A eso se le llama <b>efecto convoy</b>.</p><p>El trabajo total no cambia, pero la <b>espera media</b> puede subir muchísimo solo por el orden de llegada. Por eso FCFS casi nunca se usa solo en sistemas interactivos.</p><div class=\"recap\"><b>Para recordar.</b> FCFS atiende en orden de llegada y no expropia. Su punto débil es el efecto convoy: un proceso largo adelante hace esperar a todos los cortos.</div>",
 mc: "En el laboratorio «Servidor: antes y después», el «antes» es FCFS: una sola fila y cada tarea corre hasta terminar. Es una simplificación del modelo, no una descripción exacta del código de Minecraft.",
 example: '<p>P1 = 24, P2 = 3, P3 = 3; todos llegan en 0 en ese orden.</p><div class="flow">P1 [0,24) → P2 [24,27) → P3 [27,30)</div><p class="math">espera media = (0 + 24 + 27) / 3 = 17</p><p>Con el orden P2, P3, P1: (0 + 3 + 6) / 3 = <b>3</b>. El trabajo total es igual; cambió quién espera.</p>',
 code: 'next():\n    return readyQueue.removeFirst()     // runs until it blocks or ends',
 quiz: { q: 'A, B y C llegan juntos, en ese orden, con ráfagas 6, 2 y 1. ¿Cuál es la espera media?', options: ['3', '14/3 ≈ 4,67', '9'], hint: 'Cada uno espera la suma de las ráfagas que tiene delante.', why: 'Esperas 0, 6 y 8: suman 14 y se dividen entre 3.' } },
en: { title: 'FCFS and the convoy effect', goal: 'Draw an FCFS Gantt chart and explain the convoy effect.',
 story: 'A huge machine gets the CPU first. Behind it, two players who only wanted to open a door have to wait.',
 body: "<h3>The idea: a bank queue</h3><p><b>FCFS</b> (<i>First-Come, First-Served</i>) is the simplest scheduler. The ready queue works like a line: the process that arrived first uses the CPU until its burst ends, then the next one in line goes.</p><h3>How it works</h3><ol><li>When a process arrives (or returns from I/O), it joins the <b>back</b> of the queue.</li><li>When the CPU becomes free, it goes to the <b>first</b> in the queue.</li><li>That process keeps the CPU until its burst ends or it asks for I/O: FCFS is <b>non-preemptive</b>.</li></ol><h3>Advantages</h3><ul><li>It is very easy to understand and to program.</li><li>It is fair in one sense: nobody is left without a turn forever, because everyone moves up the line.</li></ul><h3>The problem: the convoy effect</h3><p>Picture a single-lane road with a slow truck in front and several fast cars behind: they all drive at the truck’s speed. FCFS works the same way: if a process with a <b>long</b> burst arrives first, all the <b>short</b> processes behind it have to wait for it. This is the <b>convoy effect</b>.</p><p>The total work does not change, but the <b>average waiting time</b> can rise a lot just because of the arrival order. That is why FCFS is almost never used on its own in interactive systems.</p><div class=\"recap\"><b>Remember.</b> FCFS serves in order of arrival and never preempts. Its weak point is the convoy effect: one long process in front makes all the short ones wait.</div>",
 mc: "In the “Server: before and after” lab, “before” is FCFS: a single line and each task runs to completion. It is a simplification of the model, not an exact description of Minecraft’s code.",
 example: '<p>P1 = 24, P2 = 3, P3 = 3; all arrive at 0 in that order.</p><div class="flow">P1 [0,24) → P2 [24,27) → P3 [27,30)</div><p class="math">average waiting = (0 + 24 + 27) / 3 = 17</p><p>With the order P2, P3, P1: (0 + 3 + 6) / 3 = <b>3</b>. Total work is the same; what changed is who waits.</p>',
 code: 'next():\n    return readyQueue.removeFirst()     // runs until it blocks or ends',
 quiz: { q: 'A, B and C arrive together, in that order, with bursts 6, 2 and 1. What is the average waiting time?', options: ['3', '14/3 ≈ 4.67', '9'], hint: 'Each one waits for the sum of the bursts ahead of it.', why: 'Waits 0, 6 and 8 add up to 14, divided by 3.' } },
answer: 1 },

{ id: 'sjf', zone: 'station', lab: { route: 'cpu', preset: 'srtf' },
es: { title: 'SJF y SRTF: primero lo más corto', goal: 'Comparar la versión no apropiativa y la apropiativa de “primero el más corto”.',
 story: 'Si en la fila hay alguien que solo necesita un segundo, ¿conviene dejarlo pasar?',
 body: "<h3>La idea: atender primero lo más rápido</h3><p>Si en una fila de supermercado alguien lleva un solo producto y otro lleva un carrito lleno, dejar pasar primero al del producto hace que <b>el promedio de espera baje</b>. Esa es la idea de <b>SJF</b> (<i>Shortest Job First</i>, «primero el trabajo más corto»).</p><h3>Dos versiones</h3><table><tr><th></th><th>SJF (no apropiativo)</th><th>SRTF (apropiativo)</th></tr><tr><td>Cuándo decide</td><td>Solo cuando la CPU queda libre</td><td>Cuando la CPU queda libre y cada vez que llega alguien</td></tr><tr><td>Qué elige</td><td>La ráfaga más corta de la cola</td><td>Al que le falta menos tiempo (<i>Shortest Remaining Time First</i>)</td></tr><tr><td>¿Interrumpe?</td><td>No: quien empieza, termina su ráfaga</td><td>Sí, si llega alguien a quien le falta <b>estrictamente menos</b> que al que está en la CPU</td></tr></table><p>Para comparar en SRTF se usa lo que <b>le falta</b> al proceso actual, no su ráfaga completa.</p><h3>¿Por qué es tan bueno?</h3><p>Se puede demostrar que SJF da la <b>menor espera media posible</b> cuando todos los procesos están disponibles a la vez y se conocen sus ráfagas.</p><h3>El problema: no se conoce el futuro</h3><p>El SO no sabe cuánto va a durar la próxima ráfaga de un proceso. Lo que hace es <b>estimarla</b> a partir de las ráfagas anteriores con el <b>promedio exponencial</b>:</p><p class=\"math\">τ nueva = α · ráfaga observada + (1 − α) · τ anterior, con 0 ≤ α ≤ 1</p><p>Con α = 0,5 la estimación da el mismo peso a la última ráfaga real y a la historia anterior.</p><h3>Riesgo: inanición</h3><p>Si siguen llegando procesos cortos, uno largo puede quedarse esperando indefinidamente. A eso se le llama <b>inanición</b> (<i>starvation</i>).</p><div class=\"recap\"><b>Para recordar.</b> SJF elige la ráfaga más corta y minimiza la espera media. SRTF es su versión apropiativa: compara con lo que le falta al proceso actual.</div>",
 mc: 'Un servidor no sabe con exactitud cuánto costará actualizar una criatura antes de hacerlo. Solo podría estimarlo a partir de lo que costó antes.',
 example: '<p>SRTF con P1(llegada 0, CPU 8), P2(1, 4), P3(2, 9), P4(3, 5):</p><div class="flow">P1 [0,1) → P2 [1,5) → P4 [5,10) → P1 [10,17) → P3 [17,26)</div><p class="math">esperas 9, 0, 15, 2 → media 6,5</p><p>Predicción: con α = 0,5, τ anterior = 10 y observada = 6, τ nueva = <b>8</b>.</p>',
 code: 'on arrival of p:\n    if p.remaining < running.remaining:   // strictly smaller\n        preempt(running)\nnext():\n    return ready.minBy(remaining)',
 quiz: { q: 'A empieza en t=0 con ráfaga 5. En t=2 llega B con ráfaga 4. ¿SRTF interrumpe a A?', options: ['Sí, porque 4 < 5', 'No, porque a A solo le faltan 3', 'Sí, porque B es nuevo'], hint: 'Compara contra lo que le falta.', why: 'A tiene 3 restantes, menos que las 4 de B.' } },
en: { title: 'SJF and SRTF: shortest first', goal: 'Compare the non-preemptive and preemptive versions of “shortest first”.',
 story: 'If someone in the queue only needs one second, should we let them go first?',
 body: "<h3>The idea: serve the quickest first</h3><p>If one person in a supermarket line has a single item and another has a full trolley, letting the single item go first <b>lowers the average wait</b>. That is the idea behind <b>SJF</b> (<i>Shortest Job First</i>).</p><h3>Two versions</h3><table><tr><th></th><th>SJF (non-preemptive)</th><th>SRTF (preemptive)</th></tr><tr><td>When it decides</td><td>Only when the CPU becomes free</td><td>When the CPU becomes free and every time someone arrives</td></tr><tr><td>What it picks</td><td>The shortest burst in the queue</td><td>The one with the least time left (<i>Shortest Remaining Time First</i>)</td></tr><tr><td>Does it interrupt?</td><td>No: whoever starts finishes its burst</td><td>Yes, if someone arrives needing <b>strictly less</b> than the process on the CPU</td></tr></table><p>In SRTF the comparison uses what the current process <b>still needs</b>, not its whole burst.</p><h3>Why is it so good?</h3><p>It can be proved that SJF gives the <b>lowest possible average waiting time</b> when all processes are available at once and their bursts are known.</p><h3>The problem: the future is unknown</h3><p>The OS does not know how long a process’s next burst will be. What it does is <b>estimate</b> it from previous bursts with the <b>exponential average</b>:</p><p class=\"math\">τ new = α · observed burst + (1 − α) · τ previous, with 0 ≤ α ≤ 1</p><p>With α = 0.5 the estimate gives the same weight to the last real burst and to the earlier history.</p><h3>Risk: starvation</h3><p>If short processes keep arriving, a long one can be left waiting indefinitely. This is called <b>starvation</b>.</p><div class=\"recap\"><b>Remember.</b> SJF picks the shortest burst and minimises the average wait. SRTF is its preemptive version: it compares with what the current process still needs.</div>",
 mc: 'A server does not know exactly how much updating a creature will cost before doing it. It could only estimate it from earlier costs.',
 example: '<p>SRTF with P1(arrival 0, CPU 8), P2(1, 4), P3(2, 9), P4(3, 5):</p><div class="flow">P1 [0,1) → P2 [1,5) → P4 [5,10) → P1 [10,17) → P3 [17,26)</div><p class="math">waits 9, 0, 15, 2 → average 6.5</p><p>Prediction: with α = 0.5, previous τ = 10 and observed = 6, new τ = <b>8</b>.</p>',
 code: 'on arrival of p:\n    if p.remaining < running.remaining:   // strictly smaller\n        preempt(running)\nnext():\n    return ready.minBy(remaining)',
 quiz: { q: 'A starts at t=0 with a burst of 5. At t=2, B arrives with a burst of 4. Does SRTF preempt A?', options: ['Yes, because 4 < 5', 'No, because A only has 3 left', 'Yes, because B is new'], hint: 'Compare against what is left.', why: 'A has 3 left, less than B’s 4.' } },
answer: 1 },

{ id: 'rr', zone: 'station', lab: { route: 'cpu', preset: 'rr' },
es: { title: 'Round Robin: turnos justos', goal: 'Trazar Round Robin y explicar el efecto del quantum.',
 story: 'Todos reciben un turno corto. Si no alcanzas a terminar, vuelves al final de la fila.',
 body: "<h3>La idea: turnos con cronómetro</h3><p><b>Round Robin</b> (RR) es como un juego de mesa en el que cada jugador tiene un tiempo máximo por turno. A cada proceso se le da la CPU por un tiempo fijo llamado <b>quantum</b>. Es el planificador típico de los sistemas de tiempo compartido, donde muchas personas o programas deben sentir que el computador les responde.</p><h3>Cómo funciona</h3><ol><li>La cola de listos es una fila, como en FCFS.</li><li>El primero de la fila usa la CPU como máximo un quantum.</li><li>Si termina antes, suelta la CPU de inmediato y entra el siguiente.</li><li>Si se le acaba el quantum y no ha terminado, el temporizador interrumpe, el proceso vuelve al <b>final</b> de la fila y entra el siguiente.</li></ol><p>RR es <b>apropiativo</b>: el temporizador le quita la CPU al proceso cuando agota su quantum.</p><h3>El tamaño del quantum importa</h3><ul><li><b>Quantum muy grande:</b> casi nadie lo agota y RR se comporta como FCFS.</li><li><b>Quantum muy pequeño:</b> todos reciben turnos muy seguido y el sistema responde rápido, pero se hacen tantos cambios de contexto que se pierde mucho tiempo en ellos.</li></ul><p>En la práctica se busca un quantum bastante mayor que el costo de un cambio de contexto, y tal que la mayoría de las ráfagas cortas quepan en un solo turno.</p><h3>Una regla de este curso</h3><p>Si un proceso nuevo llega justo en el mismo instante en que a otro se le acaba el quantum, <b>el que llega entra a la cola antes</b> que el que sale.</p><div class=\"recap\"><b>Para recordar.</b> Round Robin reparte la CPU en turnos de un quantum. Responde rápido a todos, pero con un quantum muy pequeño gasta mucho en cambios de contexto.</div>",
 mc: "Dentro de cada nivel del planificador por prioridad de MineOS se usa Round Robin, para que las tareas del mismo tipo se turnen la CPU.",
 example: '<p>P1 = 24, P2 = 3, P3 = 3, quantum 4, sin costo de cambio.</p><div class="flow">P1 [0,4) → P2 [4,7) → P3 [7,10) → P1 [10,30)</div><p class="math">esperas 6, 4, 7 → media 17/3 ≈ 5,67</p><p>Desde t=10, P1 está solo: recibe varios turnos seguidos sin cambiar de proceso.</p>',
 code: 'on quantum expired:\n    ready.addLast(running)   // after processes arriving at the same instant\nnext():\n    return ready.removeFirst()',
 quiz: { q: 'A = 3 y B = 2 llegan en 0 (A primero), con quantum 1. ¿Quién termina primero y cuándo?', options: ['A en t=3', 'B en t=4', 'B en t=2'], hint: 'Escribe los turnos: A, B, A, B, A.', why: 'B recibe su segundo turno en [3,4).' } },
en: { title: 'Round Robin: fair turns', goal: 'Trace Round Robin and explain the effect of the quantum.',
 story: 'Everyone gets a short turn. If you do not finish, you go to the back of the queue.',
 body: "<h3>The idea: turns with a stopwatch</h3><p><b>Round Robin</b> (RR) is like a board game where each player has a maximum time per turn. Each process gets the CPU for a fixed time called the <b>quantum</b>. It is the typical scheduler of time-sharing systems, where many people or programs must feel that the computer responds to them.</p><h3>How it works</h3><ol><li>The ready queue is a line, as in FCFS.</li><li>The first in line uses the CPU for at most one quantum.</li><li>If it finishes earlier, it releases the CPU at once and the next one starts.</li><li>If its quantum runs out and it has not finished, the timer interrupts, the process goes to the <b>back</b> of the line and the next one starts.</li></ol><p>RR is <b>preemptive</b>: the timer takes the CPU away when the quantum runs out.</p><h3>The quantum size matters</h3><ul><li><b>Very large quantum:</b> almost nobody uses it up and RR behaves like FCFS.</li><li><b>Very small quantum:</b> everyone gets turns very often and the system responds quickly, but there are so many context switches that a lot of time is lost on them.</li></ul><p>In practice the quantum should be much larger than a context switch, and large enough for most short bursts to fit in one turn.</p><h3>A rule used in this course</h3><p>If a new process arrives at exactly the same instant another one’s quantum runs out, <b>the newcomer enters the queue first</b>, ahead of the one leaving the CPU.</p><div class=\"recap\"><b>Remember.</b> Round Robin shares the CPU in turns of one quantum. It responds quickly to everyone, but a very small quantum wastes a lot on context switches.</div>",
 mc: "Inside each level of the MineOS priority scheduler, Round Robin is used so tasks of the same kind take turns on the CPU.",
 example: '<p>P1 = 24, P2 = 3, P3 = 3, quantum 4, no switch cost.</p><div class="flow">P1 [0,4) → P2 [4,7) → P3 [7,10) → P1 [10,30)</div><p class="math">waits 6, 4, 7 → average 17/3 ≈ 5.67</p><p>From t=10, P1 is alone: it gets several turns in a row without a process switch.</p>',
 code: 'on quantum expired:\n    ready.addLast(running)   // after processes arriving at the same instant\nnext():\n    return ready.removeFirst()',
 quiz: { q: 'A = 3 and B = 2 arrive at 0 (A first), quantum 1. Who finishes first, and when?', options: ['A at t=3', 'B at t=4', 'B at t=2'], hint: 'Write the turns: A, B, A, B, A.', why: 'B gets its second turn in [3,4).' } },
answer: 1 },

{ id: 'priority', zone: 'station', lab: { route: 'cpu', preset: 'starve' },
es: { title: 'Prioridades, inanición y aging', goal: 'Provocar inanición y mitigarla con envejecimiento.',
 story: 'Los jugadores pasan primero. Pero si siempre hay jugadores, ¿cuándo crecen los cultivos?',
 body: "<h3>La idea: atender primero lo más importante</h3><p>En una sala de urgencias no se atiende por orden de llegada, sino según la gravedad. La <b>planificación por prioridad</b> hace lo mismo: cada proceso tiene un número de <b>prioridad</b> y la CPU se le da al más importante.</p><p>En este curso, <b>número menor = más importante</b>: un proceso con prioridad 0 va antes que uno con prioridad 3.</p><h3>Apropiativa o no</h3><ul><li><b>No apropiativa:</b> si llega un proceso más importante, espera a que el actual termine su ráfaga.</li><li><b>Apropiativa:</b> si llega un proceso más importante, le quita la CPU de inmediato al actual.</li></ul><p>SJF es un caso particular de prioridad: allí la «prioridad» es la duración de la ráfaga.</p><h3>El problema: inanición</h3><p>Si siempre hay procesos importantes listos, uno poco importante puede esperar <b>indefinidamente</b>. Eso es la <b>inanición</b>. Se cuenta que, al apagar un computador antiguo del MIT en 1973, encontraron un proceso de baja prioridad que llevaba esperando desde 1967.</p><h3>La solución: envejecimiento (aging)</h3><p>El <b>envejecimiento</b> (<i>aging</i>) mejora poco a poco la prioridad de un proceso mientras más tiempo lleva esperando. Como aquí número menor es mejor, el aging <b>le baja el número</b>. Tarde o temprano el proceso se vuelve lo bastante importante para recibir la CPU.</p><p>En el laboratorio, la mejora que da el aging dura hasta que el proceso deja la CPU; después vuelve a su prioridad original.</p><div class=\"recap\"><b>Para recordar.</b> Prioridad: se atiende primero al número menor. El riesgo es la inanición, y el aging la evita mejorando la prioridad de quien espera mucho.</div>",
 mc: 'MineOS ordena las tareas así: jugador (0), circuitos o redstone (1), criaturas y entidades (2) y ticks de bloques como cultivos (3). Una tarea sube un nivel si pasa 3 ticks esperando.',
 example: '<p>Todos llegan en 0. Ráfagas P1=10, P2=1, P3=2, P4=1, P5=5; prioridades 3, 1, 4, 5, 2.</p><div class="flow">P2 → P5 → P1 → P3 → P4</div><p class="math">esperas 6, 0, 16, 18, 1 → media 41/5 = 8,2</p>',
 code: 'every N units waiting:\n    p.effectivePriority = max(0, p.effectivePriority - 1)\nnext():\n    return ready.minBy(effectivePriority)',
 quiz: { q: 'Con “número menor = más importante”, ¿qué debe hacer el aging con un proceso que espera mucho?', options: ['Subirle el número', 'Bajarle el número', 'Eliminarlo'], hint: 'Revisa qué dirección significa más importancia.', why: 'Un número menor le permite competir mejor.' } },
en: { title: 'Priorities, starvation and aging', goal: 'Cause starvation and reduce it with aging.',
 story: 'Players go first. But if there are always players, when do the crops grow?',
 body: "<h3>The idea: serve the most important first</h3><p>An emergency room does not treat patients in order of arrival, but by how serious they are. <b>Priority scheduling</b> does the same: each process has a <b>priority</b> number and the CPU goes to the most important one.</p><p>In this course, <b>lower number = more important</b>: a process with priority 0 goes before one with priority 3.</p><h3>Preemptive or not</h3><ul><li><b>Non-preemptive:</b> if a more important process arrives, it waits until the current one finishes its burst.</li><li><b>Preemptive:</b> if a more important process arrives, it takes the CPU from the current one at once.</li></ul><p>SJF is a special case of priority: there the “priority” is the burst length.</p><h3>The problem: starvation</h3><p>If there are always important processes ready, an unimportant one can wait <b>indefinitely</b>. That is <b>starvation</b>. The story goes that when an old MIT computer was shut down in 1973, they found a low-priority process that had been waiting since 1967.</p><h3>The fix: aging</h3><p><b>Aging</b> gradually improves the priority of a process the longer it waits. Since lower numbers are better here, aging <b>lowers its number</b>. Sooner or later the process becomes important enough to get the CPU.</p><p>In the lab, the boost from aging lasts until the process leaves the CPU; then it goes back to its original priority.</p><div class=\"recap\"><b>Remember.</b> Priority: the lowest number is served first. The risk is starvation, and aging prevents it by improving the priority of whoever waits a long time.</div>",
 mc: 'MineOS orders tasks like this: player (0), circuits or redstone (1), creatures and entities (2), and block ticks such as crops (3). A task moves up one level after waiting 3 ticks.',
 example: '<p>All arrive at 0. Bursts P1=10, P2=1, P3=2, P4=1, P5=5; priorities 3, 1, 4, 5, 2.</p><div class="flow">P2 → P5 → P1 → P3 → P4</div><p class="math">waits 6, 0, 16, 18, 1 → average 41/5 = 8.2</p>',
 code: 'every N units waiting:\n    p.effectivePriority = max(0, p.effectivePriority - 1)\nnext():\n    return ready.minBy(effectivePriority)',
 quiz: { q: 'With “lower number = more important”, what should aging do to a process that has waited long?', options: ['Raise its number', 'Lower its number', 'Remove it'], hint: 'Check which direction means more important.', why: 'A lower number lets it compete better.' } },
answer: 1 },

{ id: 'pq', zone: 'station', lab: { route: 'cpu', preset: 'queues' },
es: { title: 'Priority Queue: varias colas fijas', goal: 'Seguir un planificador con una cola por nivel de prioridad.',
 story: 'En vez de una sola fila hay cuatro: una para cada tipo de trabajo.',
 body: "<h3>La idea: varias filas, no una</h3><p>No todos los procesos son iguales. Un videojuego necesita responder rápido; una copia de seguridad puede esperar. En vez de una sola cola de listos, una <b>cola multinivel</b> tiene <b>varias colas</b>, una por tipo de proceso o por nivel de prioridad (Q0, Q1, Q2…).</p><h3>Dos reglas</h3><ol><li><b>Dentro de cada cola</b> hay un planificador propio. En el laboratorio, cada cola usa Round Robin.</li><li><b>Entre colas</b> manda la prioridad estricta: Q0 va antes que Q1, Q1 antes que Q2, y así. Una cola de abajo solo usa la CPU cuando todas las de arriba están vacías.</li></ol><p>Si llega trabajo a una cola superior mientras corre un proceso de una inferior, el proceso actual es <b>expropiado</b> y vuelve al final de su propia cola.</p><h3>Colas fijas</h3><p>En la cola multinivel <b>fija</b> (la de esta lección), cada proceso pertenece <b>siempre</b> a la misma cola: nunca sube ni baja. Por ejemplo: Q0 para procesos interactivos y Q3 para trabajos en segundo plano.</p><h3>El riesgo</h3><p>Como las colas de abajo esperan a que las de arriba se vacíen, pueden sufrir <b>inanición</b> si siempre hay trabajo importante. Para evitarlo se puede usar aging, o repartir el tiempo de CPU entre colas (por ejemplo, 80 % para Q0 y 20 % para las demás).</p><div class=\"recap\"><b>Para recordar.</b> Varias colas: Round Robin dentro de cada una y prioridad estricta entre ellas. Los procesos no cambian de cola.</div>",
 mc: "Es la idea del planificador por prioridad de MineOS: cuatro colas, una por tipo de tarea (jugadores, circuitos, criaturas y cultivos). MineOS le agrega aging para que las colas de abajo no esperen para siempre.",
 example: '<p>“low” (cola 3, CPU 6) llega en 0. “high” (cola 0, CPU 2) llega en 2. Quantum 4.</p><div class="flow">low [0,2) → high [2,4) → low [4,8)</div>',
 code: 'next():\n    for level in 0..3:\n        if queue[level] not empty:\n            return queue[level].removeFirst()',
 quiz: { q: 'La cola 0 está vacía, la cola 1 tiene dos procesos y la cola 3 tiene uno. ¿Cuándo corre el de la cola 3?', options: ['Cuando no quede trabajo listo en colas superiores', 'Se turna con los de la cola 1', 'De primero, porque su número es mayor'], hint: 'Entre colas hay prioridad estricta.', why: 'Mientras exista trabajo listo en colas 0 a 2, la cola 3 espera.' } },
en: { title: 'Priority Queue: several fixed queues', goal: 'Follow a scheduler with one queue per priority level.',
 story: 'Instead of one line there are four: one for each kind of work.',
 body: "<h3>The idea: several lines, not one</h3><p>Not all processes are alike. A video game needs to respond quickly; a backup can wait. Instead of a single ready queue, a <b>multilevel queue</b> has <b>several queues</b>, one per kind of process or priority level (Q0, Q1, Q2…).</p><h3>Two rules</h3><ol><li><b>Inside each queue</b> there is its own scheduler. In the lab, every queue uses Round Robin.</li><li><b>Between queues</b> strict priority rules: Q0 goes before Q1, Q1 before Q2, and so on. A lower queue only gets the CPU when all the queues above it are empty.</li></ol><p>If work arrives in a higher queue while a process from a lower one is running, the current process is <b>preempted</b> and goes back to the end of its own queue.</p><h3>Fixed queues</h3><p>In a <b>fixed</b> multilevel queue (the one in this lesson), each process <b>always</b> belongs to the same queue: it never moves up or down. For example: Q0 for interactive processes and Q3 for background jobs.</p><h3>The risk</h3><p>Since lower queues wait for the upper ones to empty, they can <b>starve</b> if there is always important work. To avoid it you can use aging, or split CPU time between queues (for example, 80 % for Q0 and 20 % for the rest).</p><div class=\"recap\"><b>Remember.</b> Several queues: Round Robin inside each one and strict priority between them. Processes never change queue.</div>",
 mc: "This is the idea behind the MineOS priority scheduler: four queues, one per kind of task (players, circuits, creatures and crops). MineOS adds aging so the lower queues do not wait forever.",
 example: '<p>“low” (queue 3, CPU 6) arrives at 0. “high” (queue 0, CPU 2) arrives at 2. Quantum 4.</p><div class="flow">low [0,2) → high [2,4) → low [4,8)</div>',
 code: 'next():\n    for level in 0..3:\n        if queue[level] not empty:\n            return queue[level].removeFirst()',
 quiz: { q: 'Queue 0 is empty, queue 1 has two processes and queue 3 has one. When does the one in queue 3 run?', options: ['When no ready work is left in higher queues', 'It alternates with queue 1', 'First, because its number is larger'], hint: 'Priority between queues is strict.', why: 'While queues 0 to 2 have ready work, queue 3 waits.' } },
answer: 0 },

{ id: 'mfq', zone: 'station', lab: { route: 'cpu', preset: 'mfq' },
es: { title: 'MFQ: colas con retroalimentación', goal: 'Seguir un proceso que cambia de cola según su comportamiento.',
 story: 'Nadie le dice al planificador qué tareas son cortas. Él lo descubre mirando cómo se comportan.',
 body: "<h3>La idea: aprender del comportamiento</h3><p>En la cola multinivel fija hay que decidir de antemano a qué cola va cada proceso. Pero muchas veces no se sabe si un proceso será corto o largo. La <b>cola multinivel con retroalimentación</b> (MFQ, <i>Multilevel Feedback Queue</i>) lo descubre <b>observando</b>: los procesos <b>cambian de cola</b> según cómo usan la CPU.</p><h3>Las reglas del laboratorio</h3><ol><li>Todo proceso nuevo entra a la cola más alta, <b>Q0</b>.</li><li>Q0 es Round Robin con quantum q; Q1 es Round Robin con quantum 2q; Q2 es FCFS.</li><li>Si un proceso <b>agota su quantum</b>, baja una cola: de Q0 a Q1, de Q1 a Q2.</li><li>Si suelta la CPU antes (porque terminó o pidió E/S), se queda en su nivel.</li><li>Si lo expropia un proceso de una cola superior, también conserva su nivel.</li><li>Entre colas manda la prioridad estricta: Q0 antes que Q1, y Q1 antes que Q2.</li></ol><h3>¿Qué se logra?</h3><ul><li>Los procesos <b>cortos e interactivos</b> terminan en Q0, sin bajar, y responden rápido.</li><li>Los procesos <b>largos</b> bajan poco a poco y quedan en las colas de abajo, donde reciben turnos más largos con menos cambios de contexto.</li></ul><p>Es decir, MFQ se parece a SJF sin necesidad de conocer las ráfagas por adelantado.</p><h3>El riesgo y su remedio</h3><p>Los procesos de Q2 pueden sufrir inanición si siempre llegan procesos nuevos a Q0. Un <b>boost</b> periódico (subir a todos a Q0 cada cierto tiempo) les da otra oportunidad. El laboratorio por pasos no aplica el boost; el laboratorio del servidor sí.</p><div class=\"recap\"><b>Para recordar.</b> En MFQ todos empiezan arriba; quien agota su quantum baja. Así los cortos terminan rápido y los largos se van a las colas de abajo.</div>",
 mc: "En el servidor de MineOS, MFQ dejó a los circuitos de redstone esperando varios segundos cuando había mucha carga: sus tareas son largas, así que bajaban a la última cola. MFQ premia lo corto, no lo importante.",
 example: '<p>Un proceso de 30 unidades, solo, con q = 8:</p><div class="flow">Q0: 8 unidades → Q1: 16 unidades → Q2: 6 unidades</div>',
 code: 'on quantum expired:\n    p.level = min(p.level + 1, 2)\n    queue[p.level].addLast(p)',
 quiz: { q: 'Con q = 8, un proceso solo necesita 10 unidades. ¿Cómo las reparte?', options: ['8 en Q0 y 2 en Q1', '10 en Q0', '8 en Q0, 1 en Q1 y 1 en Q2'], hint: 'Al agotar el quantum baja un nivel.', why: 'Gasta 8 en Q0, baja y termina las 2 restantes en Q1.' } },
en: { title: 'MFQ: queues with feedback', goal: 'Follow a process that changes queue according to its behaviour.',
 story: 'Nobody tells the scheduler which tasks are short. It finds out by watching how they behave.',
 body: "<h3>The idea: learn from behaviour</h3><p>With a fixed multilevel queue you must decide in advance which queue each process goes to. But often you do not know whether a process will be short or long. The <b>multilevel feedback queue</b> (MFQ) finds out by <b>watching</b>: processes <b>change queue</b> depending on how they use the CPU.</p><h3>The lab’s rules</h3><ol><li>Every new process enters the top queue, <b>Q0</b>.</li><li>Q0 is Round Robin with quantum q; Q1 is Round Robin with quantum 2q; Q2 is FCFS.</li><li>If a process <b>uses up its quantum</b>, it moves down one queue: from Q0 to Q1, from Q1 to Q2.</li><li>If it releases the CPU earlier (because it finished or asked for I/O), it stays at its level.</li><li>If a process from a higher queue preempts it, it also keeps its level.</li><li>Strict priority rules between queues: Q0 before Q1, and Q1 before Q2.</li></ol><h3>What does it achieve?</h3><ul><li><b>Short, interactive</b> processes finish in Q0 without moving down, and respond quickly.</li><li><b>Long</b> processes move down step by step and settle in the lower queues, where they get longer turns with fewer context switches.</li></ul><p>In other words, MFQ behaves like SJF without needing to know the bursts in advance.</p><h3>The risk and its remedy</h3><p>Processes in Q2 can starve if new processes keep arriving in Q0. A periodic <b>boost</b> (moving everyone back to Q0 every so often) gives them another chance. The step-by-step lab does not apply the boost; the server lab does.</p><div class=\"recap\"><b>Remember.</b> In MFQ everyone starts at the top; whoever uses up its quantum moves down. Short processes finish fast and long ones sink to the lower queues.</div>",
 mc: "On the MineOS server, MFQ left redstone circuits waiting several seconds under heavy load: their tasks are long, so they sank to the last queue. MFQ rewards what is short, not what is important.",
 example: '<p>A single 30-unit process with q = 8:</p><div class="flow">Q0: 8 units → Q1: 16 units → Q2: 6 units</div>',
 code: 'on quantum expired:\n    p.level = min(p.level + 1, 2)\n    queue[p.level].addLast(p)',
 quiz: { q: 'With q = 8, a lone process needs 10 units. How are they split?', options: ['8 in Q0 and 2 in Q1', '10 in Q0', '8 in Q0, 1 in Q1 and 1 in Q2'], hint: 'Using up the quantum moves it down one level.', why: 'It uses 8 in Q0, moves down and finishes the other 2 in Q1.' } },
answer: 0 },

{ id: 'cfs', zone: 'station', lab: { route: 'cpu', preset: 'fair' },
es: { title: 'CFS: reparto justo', goal: 'Usar el tiempo virtual (vruntime) para decidir turnos.',
 story: '¿Y si en vez de filas rígidas llevamos la cuenta de cuánto ha recibido cada uno?',
 body: "<h3>La idea: que todos reciban su parte justa</h3><p>Imagina repartir una pizza entre amigos: si alguien ya comió mucho, le toca al que ha comido menos. El <b>CFS</b> (<i>Completely Fair Scheduler</i>, «planificador completamente justo») fue durante muchos años el planificador de Linux y sigue esa idea: lleva la cuenta de cuánta CPU ha recibido cada proceso y siempre atiende al que va <b>más atrasado</b>.</p><h3>El tiempo virtual (vruntime)</h3><p>Cada proceso tiene un contador llamado <b>vruntime</b> (tiempo de ejecución virtual). Cada vez que usa la CPU, su vruntime crece. El planificador escoge siempre al proceso con el <b>menor vruntime</b>.</p><h3>Los pesos</h3><p>No todos los procesos merecen la misma parte: algunos son más importantes. Por eso cada proceso tiene un <b>peso</b>, y su vruntime crece más despacio mientras más peso tiene:</p><p class=\"math\">vruntime += tiempo usado ÷ peso</p><p>Como el vruntime de un proceso pesado sube despacio, se mantiene bajo y es elegido más seguido: recibe <b>más CPU</b>. Pero ninguno se queda sin turno, porque el vruntime de los que esperan no crece y tarde o temprano son los menores.</p><h3>La versión del laboratorio</h3><ul><li>Pesos 4, 3, 2 y 1 para las prioridades 0 a 3.</li><li>Un proceso recién llegado arranca con el menor vruntime activo, para que no tenga ventaja injusta por empezar en cero.</li><li>Solo se expropia después de q unidades de uso, para no cambiar de proceso a cada instante.</li></ul><p>El CFS real es más elaborado (usa una tabla de pesos según el valor <i>nice</i> y guarda los procesos en un árbol rojo-negro), y las versiones recientes de Linux lo reemplazaron por otro algoritmo, EEVDF.</p><div class=\"recap\"><b>Para recordar.</b> CFS escoge al menor vruntime. Con más peso, el vruntime crece más despacio y el proceso recibe más CPU, pero nadie se queda sin turno.</div>",
 mc: "En el laboratorio de CPU puedes comparar CFS con los demás planificadores usando los mismos procesos. Fíjate en que nadie se queda sin turno, aunque los de más peso reciben más CPU.",
 example: '<p>“heavy” (peso 4) y “light” (peso 1) usan 1 unidad cada vez:</p><p class="math">heavy suma 0,25 · light suma 1</p><p>A largo plazo, heavy recibe cerca de 4 unidades por cada 1 de light.</p>',
 code: 'charge(p):  p.vruntime += 1 / weight[p.priority]\nnext():     return ready.minBy(vruntime)',
 quiz: { q: 'A tiene vruntime 6 y B tiene 4,5. ¿Quién sigue?', options: ['A', 'B', 'El que llegó primero, sin mirar el vruntime'], hint: 'Se elige al que menos ha recibido, ponderado.', why: 'B tiene el menor vruntime.' } },
en: { title: 'CFS: fair sharing', goal: 'Use virtual runtime (vruntime) to decide turns.',
 story: 'What if, instead of rigid lines, we kept track of how much each one has received?',
 body: "<h3>The idea: everyone gets a fair share</h3><p>Picture sharing a pizza among friends: if someone has already eaten a lot, it is the turn of whoever has eaten least. The <b>CFS</b> (<i>Completely Fair Scheduler</i>) was Linux’s scheduler for many years and follows that idea: it keeps track of how much CPU each process has received and always serves the one that is <b>furthest behind</b>.</p><h3>Virtual runtime (vruntime)</h3><p>Each process has a counter called <b>vruntime</b> (virtual runtime). Every time it uses the CPU, its vruntime grows. The scheduler always picks the process with the <b>lowest vruntime</b>.</p><h3>Weights</h3><p>Not every process deserves the same share: some are more important. So each process has a <b>weight</b>, and its vruntime grows more slowly the more weight it has:</p><p class=\"math\">vruntime += time used ÷ weight</p><p>Since a heavy process’s vruntime rises slowly, it stays low and is picked more often: it gets <b>more CPU</b>. But nobody goes without a turn, because the vruntime of waiting processes does not grow and sooner or later they are the lowest.</p><h3>The lab’s version</h3><ul><li>Weights 4, 3, 2 and 1 for priorities 0 to 3.</li><li>A newly arrived process starts with the lowest active vruntime, so starting at zero gives it no unfair advantage.</li><li>Preemption only happens after q units of use, so the process does not change at every instant.</li></ul><p>The real CFS is more elaborate (it uses a weight table based on the <i>nice</i> value and keeps processes in a red-black tree), and recent Linux versions replaced it with another algorithm, EEVDF.</p><div class=\"recap\"><b>Remember.</b> CFS picks the lowest vruntime. With more weight, vruntime grows more slowly and the process gets more CPU, but nobody goes without a turn.</div>",
 mc: "In the CPU lab you can compare CFS with the other schedulers using the same processes. Notice that nobody goes without a turn, even though the heavier ones get more CPU.",
 example: '<p>“heavy” (weight 4) and “light” (weight 1) use 1 unit at a time:</p><p class="math">heavy adds 0.25 · light adds 1</p><p>In the long run heavy gets about 4 units for every 1 of light.</p>',
 code: 'charge(p):  p.vruntime += 1 / weight[p.priority]\nnext():     return ready.minBy(vruntime)',
 quiz: { q: 'A has vruntime 6 and B has 4.5. Who goes next?', options: ['A', 'B', 'Whoever arrived first, ignoring vruntime'], hint: 'Pick the one that has received least, after weighting.', why: 'B has the smallest vruntime.' } },
answer: 1 }
];
