{ id: 'uros', zone: 'tower', lab: null,
es: { title: 'UR-OS: un sistema operativo para aprender', goal: 'Explicar qué es un simulador de sistema operativo y reconocer las piezas de UR-OS.',
 story: 'Los pilotos aprenden en simuladores de vuelo antes de manejar un avión de verdad. Con los sistemas operativos pasa algo parecido: primero se practica en una maqueta.',
 body: '<h3>¿Qué es un simulador?</h3><p>Un <b>simulador</b> es un programa que imita a otro sistema para estudiarlo sin riesgo. Cambiar el kernel real de Windows o de Linux es difícil y peligroso: un error puede dejar el computador sin arrancar. En un simulador, en cambio, se puede probar un algoritmo, verlo funcionar paso a paso y repetirlo con los mismos datos todas las veces que haga falta.</p><h3>UR-OS</h3><p><b>UR-OS</b> es un simulador escrito en Java por el profesor <b>Pedro Wightman</b>, de la Universidad del Rosario. Imita las piezas principales de un computador y de su sistema operativo. En el curso, cada entrega consistió en <b>programar una pieza que le faltaba</b>.</p><table><tr><th>Pieza de UR-OS</th><th>Qué imita</th></tr><tr><td><b>Proceso</b> (<code>Process</code>)</td><td>Un programa en ejecución, con su lista de ráfagas: de CPU, de entrada/salida y de operaciones de memoria (leer o escribir en una dirección lógica)</td></tr><tr><td><b>CPU</b></td><td>Ejecuta una unidad de trabajo en cada ciclo del reloj</td></tr><tr><td><b>Planificador</b> (<code>Scheduler</code>)</td><td>Decide qué proceso de la cola de listos usa la CPU. Su método clave es <code>getNext()</code></td></tr><tr><td><b>Cola de E/S</b> (<code>IOQueue</code>)</td><td>Guarda a los procesos que esperan un dispositivo</td></tr><tr><td><b>Gestor de memoria del sistema</b></td><td>Traduce cada dirección lógica a una física (es la MMU)</td></tr><tr><td><b>Gestor de memoria del proceso</b></td><td>Recuerda dónde quedó cada proceso: su base y límite, o su tabla de páginas o de segmentos</td></tr><tr><td><b>Gestor de memoria libre</b></td><td>Lleva la cuenta de los huecos o marcos libres. Su método clave es <code>getSlot()</code></td></tr></table><h3>Política y mecanismo</h3><p>UR-OS separa dos cosas que conviene no mezclar:</p><ul><li>El <b>mecanismo</b>: el reloj, la CPU y las colas. Funciona siempre igual.</li><li>La <b>política</b>: la regla que decide. Qué proceso sigue, qué hueco de memoria se usa.</li></ul><p>Gracias a esa separación, para probar un algoritmo nuevo basta con escribir <b>una clase nueva con su regla</b>, sin tocar el resto. Es una de las ideas centrales del diseño de sistemas operativos.</p><h3>Lo que hicimos en el curso</h3><ul><li><b>Entrega 1:</b> planificadores de CPU.</li><li><b>Entrega 2:</b> gestión de memoria: políticas de huecos, cálculo de fragmentación, paginación y segmentación.</li><li>La entrega 3 trató de memoria virtual, que queda fuera de esta página.</li></ul><p>Las siguientes lecciones resumen cada entrega, y la última las junta en el <b>Mini UR-OS</b>.</p><div class="recap"><b>Para recordar.</b> UR-OS es un simulador de SO. Cada algoritmo es una política (una clase con su regla) que se conecta a un mecanismo que no cambia.</div>',
 mc: 'MineOS usa la misma idea: en vez de cambiar un servidor de Minecraft real, se estudia un modelo del servidor que siempre se comporta igual con los mismos datos. Los laboratorios de esta página funcionan como un pequeño UR-OS dentro del navegador.',
 example: '<p>Esto es lo que hace UR-OS en cada ciclo del reloj, y quién se encarga de cada paso:</p><table><tr><th>Paso</th><th>Qué pasa</th><th>Quién lo hace</th></tr><tr><td>1</td><td>Llega un proceso nuevo y se le busca memoria</td><td>Gestor de memoria libre (<code>getSlot</code>)</td></tr><tr><td>2</td><td>Si la CPU está libre, se elige quién la usa</td><td>Planificador (<code>getNext</code>)</td></tr><tr><td>3</td><td>La CPU ejecuta una unidad de trabajo</td><td>CPU</td></tr><tr><td>4</td><td>Si la instrucción lee o escribe memoria, se traduce la dirección</td><td>Gestor de memoria del sistema</td></tr><tr><td>5</td><td>Si el proceso terminó, se devuelve su memoria</td><td>Gestor de memoria libre</td></tr></table>',
 quiz: { q: 'Quieres probar un planificador nuevo en UR-OS. ¿Qué tienes que cambiar?', options: ['El reloj y la CPU', 'El gestor de memoria libre', 'Solo la regla de elección, escribiendo una clase nueva con su propio getNext()'], hint: 'Recuerda la diferencia entre política y mecanismo.', why: 'El reloj, la CPU y las colas son el mecanismo y no cambian. Un planificador nuevo es una política nueva: una clase con su propio getNext().' } },
en: { title: 'UR-OS: an operating system for learning', goal: 'Explain what an operating-system simulator is and recognise the parts of UR-OS.',
 story: 'Pilots learn in flight simulators before flying a real plane. Operating systems work in a similar way: you practise on a scale model first.',
 body: '<h3>What is a simulator?</h3><p>A <b>simulator</b> is a program that imitates another system so it can be studied safely. Changing the real kernel of Windows or Linux is hard and risky: one mistake can leave the computer unable to start. In a simulator you can try an algorithm, watch it work step by step and repeat it with the same data as often as you need.</p><h3>UR-OS</h3><p><b>UR-OS</b> is a simulator written in Java by Professor <b>Pedro Wightman</b> at Universidad del Rosario. It imitates the main parts of a computer and its operating system. In the course, each deliverable consisted of <b>programming a part it was missing</b>.</p><table><tr><th>UR-OS part</th><th>What it imitates</th></tr><tr><td><b>Process</b> (<code>Process</code>)</td><td>A program in execution, with its list of bursts: CPU, input/output and memory operations (reading or writing a logical address)</td></tr><tr><td><b>CPU</b></td><td>Runs one unit of work on each clock cycle</td></tr><tr><td><b>Scheduler</b> (<code>Scheduler</code>)</td><td>Decides which process in the ready queue gets the CPU. Its key method is <code>getNext()</code></td></tr><tr><td><b>I/O queue</b> (<code>IOQueue</code>)</td><td>Holds the processes waiting for a device</td></tr><tr><td><b>System memory manager</b></td><td>Translates every logical address into a physical one (it is the MMU)</td></tr><tr><td><b>Process memory manager</b></td><td>Remembers where each process was placed: its base and limit, or its page or segment table</td></tr><tr><td><b>Free memory manager</b></td><td>Keeps track of the free holes or frames. Its key method is <code>getSlot()</code></td></tr></table><h3>Policy and mechanism</h3><p>UR-OS keeps two things apart:</p><ul><li>The <b>mechanism</b>: the clock, the CPU and the queues. It always works the same way.</li><li>The <b>policy</b>: the rule that decides. Which process goes next, which memory hole is used.</li></ul><p>Because of that split, testing a new algorithm only takes <b>one new class with its rule</b>, without touching anything else. It is one of the central ideas of operating-system design.</p><h3>What we did in the course</h3><ul><li><b>Deliverable 1:</b> CPU schedulers.</li><li><b>Deliverable 2:</b> memory management: hole policies, fragmentation, paging and segmentation.</li><li>Deliverable 3 was about virtual memory, which is outside the scope of this site.</li></ul><p>The next lessons summarise each deliverable, and the last one puts them together in the <b>Mini UR-OS</b>.</p><div class="recap"><b>Remember.</b> UR-OS is an OS simulator. Each algorithm is a policy (a class with its rule) plugged into a mechanism that does not change.</div>',
 mc: 'MineOS uses the same idea: instead of changing a real Minecraft server, it studies a model of the server that always behaves the same way with the same data. The labs on this site work like a small UR-OS inside your browser.',
 example: '<p>This is what UR-OS does on every clock cycle, and who handles each step:</p><table><tr><th>Step</th><th>What happens</th><th>Who does it</th></tr><tr><td>1</td><td>A new process arrives and memory is found for it</td><td>Free memory manager (<code>getSlot</code>)</td></tr><tr><td>2</td><td>If the CPU is free, someone is chosen to use it</td><td>Scheduler (<code>getNext</code>)</td></tr><tr><td>3</td><td>The CPU runs one unit of work</td><td>CPU</td></tr><tr><td>4</td><td>If the instruction reads or writes memory, the address is translated</td><td>System memory manager</td></tr><tr><td>5</td><td>If the process has finished, its memory is given back</td><td>Free memory manager</td></tr></table>',
 quiz: { q: 'You want to test a new scheduler in UR-OS. What do you have to change?', options: ['The clock and the CPU', 'The free memory manager', 'Only the choosing rule, by writing a new class with its own getNext()'], hint: 'Remember the difference between policy and mechanism.', why: 'The clock, the CPU and the queues are the mechanism and do not change. A new scheduler is a new policy: a class with its own getNext().' } },
answer: 2 },

{ id: 'deliv1', zone: 'tower', lab: { route: 'cpu' },
es: { title: 'Entrega 1: programar planificadores', goal: 'Describir cómo se programa un planificador en UR-OS y cómo se comparan con indicadores.',
 story: 'Al empezar el curso, UR-OS solo sabía atender a los procesos en orden de llegada. La primera entrega fue enseñarle otras formas de decidir.',
 body: '<h3>El método getNext</h3><p>En UR-OS cada planificador es una clase que hereda de <code>Scheduler</code>. Cada vez que la CPU queda libre, el sistema llama a <code>getNext()</code> y la clase escoge un proceso de la cola de listos.</p><p>Los planificadores <b>apropiativos</b> tienen un trabajo extra: cuando llega un proceso nuevo o uno vuelve de E/S, revisan si conviene quitarle la CPU al que la está usando.</p><h3>Los planificadores que programamos</h3><table><tr><th>Planificador</th><th>Su regla</th></tr><tr><td>FCFS</td><td>Toma el primero de la cola (ya venía hecho)</td></tr><tr><td>SJF no apropiativo</td><td>Recorre la cola y toma al que tiene la ráfaga más corta. Si hay empate, usa una regla fija de desempate</td></tr><tr><td>SJF apropiativo (SRTF)</td><td>Igual que SJF, pero si llega alguien con menos tiempo restante que el que está en la CPU, el actual vuelve a la cola</td></tr><tr><td>Round Robin</td><td>Un contador cuenta los ciclos del proceso actual. Al llegar al quantum, lo manda al final de la cola y toma al siguiente</td></tr><tr><td>Priority Queue</td><td>Una cola por nivel de prioridad, y dentro de cada cola un Round Robin</td></tr><tr><td>MFQ</td><td>Varias colas: quien agota su quantum baja a una cola de menor prioridad</td></tr><tr><td>FAIR (CFS simplificado)</td><td>Escoge al que tiene el menor <i>vruntime</i>. Con más peso, el vruntime crece más despacio (pesos 4, 3, 2 y 1)</td></tr></table><h3>Cómo se comparan</h3><p>Al terminar, UR-OS imprime qué proceso usó la CPU en cada ciclo y calcula los <b>indicadores de desempeño</b>: utilización de la CPU, throughput, tiempo de retorno, de espera y de respuesta, y número de cambios de contexto. Para que la comparación sea justa, todos los planificadores se prueban con <b>los mismos procesos</b>.</p><div class="recap"><b>Para recordar.</b> Un planificador en UR-OS es una clase con su getNext(). Se comparan corriendo todos con los mismos procesos y mirando los indicadores.</div>',
 mc: 'En la Estación del Planificador están todos estos algoritmos, y el laboratorio de CPU tiene un botón para compararlos con los mismos procesos, igual que hicimos en la entrega.',
 example: '<p>Así se veían los indicadores que imprimía UR-OS al correr FCFS con los procesos de nuestra entrega:</p><table><tr><th>Indicador</th><th>Valor</th><th>Qué significa</th></tr><tr><td>Ciclos totales</td><td>108</td><td>Tiempo hasta que terminó el último proceso</td></tr><tr><td>Utilización de CPU</td><td>1,0</td><td>La CPU nunca estuvo libre</td></tr><tr><td>Throughput</td><td>0,037</td><td>4 procesos ÷ 108 ciclos</td></tr><tr><td>Retorno medio</td><td>81,25</td><td>Desde que llega hasta que termina</td></tr><tr><td>Espera media</td><td>47,5</td><td>Tiempo en la cola de listos</td></tr><tr><td>Respuesta media</td><td>13,75</td><td>Desde que llega hasta su primer turno</td></tr></table>',
 code: '# SJF apropiativo: al llegar un proceso nuevo\nif cpu_ocupada and nuevo.restante < en_cpu.restante:\n    devolver_a_la_cola(en_cpu)      # el nuevo competirá en getNext\n\n# Round Robin: en cada ciclo\ncontador += 1\nif contador >= q:\n    devolver_a_la_cola(en_cpu)\n    en_cpu = cola.sacar_primero()\n    contador = 0',
 quiz: { q: 'En Round Robin con q = 3, el contador del proceso actual llega a 3 y todavía le falta trabajo. ¿Qué hace el planificador?', options: ['Lo manda al final de la cola y toma al siguiente', 'Lo deja seguir hasta que termine', 'Lo da por terminado'], hint: 'El quantum es el turno máximo.', why: 'Al agotar el quantum se hace un cambio de contexto: el proceso vuelve al final de la cola y entra el siguiente.' } },
en: { title: 'Deliverable 1: programming schedulers', goal: 'Describe how a scheduler is programmed in UR-OS and how schedulers are compared with indicators.',
 story: 'At the start of the course, UR-OS could only serve processes in order of arrival. The first deliverable was to teach it other ways of deciding.',
 body: '<h3>The getNext method</h3><p>In UR-OS each scheduler is a class that extends <code>Scheduler</code>. Every time the CPU becomes free, the system calls <code>getNext()</code> and the class picks a process from the ready queue.</p><p><b>Preemptive</b> schedulers have an extra job: when a new process arrives or one returns from I/O, they check whether the process using the CPU should be taken off it.</p><h3>The schedulers we programmed</h3><table><tr><th>Scheduler</th><th>Its rule</th></tr><tr><td>FCFS</td><td>Takes the first in the queue (already provided)</td></tr><tr><td>Non-preemptive SJF</td><td>Goes through the queue and takes the one with the shortest burst. On a tie, it uses a fixed tie-break rule</td></tr><tr><td>Preemptive SJF (SRTF)</td><td>Like SJF, but if someone arrives with less remaining time than the process on the CPU, the current one goes back to the queue</td></tr><tr><td>Round Robin</td><td>A counter counts the current process’s cycles. When it reaches the quantum, the process goes to the back of the queue and the next one starts</td></tr><tr><td>Priority Queue</td><td>One queue per priority level, with Round Robin inside each queue</td></tr><tr><td>MFQ</td><td>Several queues: whoever uses up its quantum moves down to a lower-priority queue</td></tr><tr><td>FAIR (simplified CFS)</td><td>Picks the one with the lowest <i>vruntime</i>. With more weight, vruntime grows more slowly (weights 4, 3, 2 and 1)</td></tr></table><h3>How they are compared</h3><p>At the end, UR-OS prints which process used the CPU on every cycle and computes the <b>performance indicators</b>: CPU utilisation, throughput, turnaround, waiting and response time, and the number of context switches. To make the comparison fair, every scheduler is tested with <b>the same processes</b>.</p><div class="recap"><b>Remember.</b> A scheduler in UR-OS is a class with its getNext(). They are compared by running them all with the same processes and looking at the indicators.</div>',
 mc: 'All these algorithms are in the Scheduler Station, and the CPU lab has a button to compare them with the same processes, just as we did in the deliverable.',
 example: '<p>These are the indicators UR-OS printed when running FCFS with the processes from our deliverable:</p><table><tr><th>Indicator</th><th>Value</th><th>What it means</th></tr><tr><td>Total cycles</td><td>108</td><td>Time until the last process finished</td></tr><tr><td>CPU utilisation</td><td>1.0</td><td>The CPU was never idle</td></tr><tr><td>Throughput</td><td>0.037</td><td>4 processes ÷ 108 cycles</td></tr><tr><td>Average turnaround</td><td>81.25</td><td>From arrival to finish</td></tr><tr><td>Average waiting</td><td>47.5</td><td>Time in the ready queue</td></tr><tr><td>Average response</td><td>13.75</td><td>From arrival to its first turn</td></tr></table>',
 code: '# Preemptive SJF: when a new process arrives\nif cpu_busy and new.remaining < on_cpu.remaining:\n    back_to_queue(on_cpu)      # the new one competes in getNext\n\n# Round Robin: on every cycle\ncounter += 1\nif counter >= q:\n    back_to_queue(on_cpu)\n    on_cpu = queue.take_first()\n    counter = 0',
 quiz: { q: 'In Round Robin with q = 3, the current process’s counter reaches 3 and it still has work left. What does the scheduler do?', options: ['Sends it to the back of the queue and takes the next one', 'Lets it run until it finishes', 'Marks it as finished'], hint: 'The quantum is the longest possible turn.', why: 'When the quantum runs out there is a context switch: the process goes to the back of the queue and the next one starts.' } },
answer: 0 },

{ id: 'deliv2', zone: 'tower', lab: { route: 'memory', preset: 'teamA' },
es: { title: 'Entrega 2: programar la memoria', goal: 'Explicar las capas de memoria de UR-OS y por qué ninguna política de huecos gana siempre.',
 story: 'En la segunda entrega UR-OS ya cargaba procesos en memoria, pero solo sabía escoger huecos con First Fit. Había que agregar otras políticas y medir cuál aprovecha mejor la memoria.',
 body: '<h3>Las tres capas de memoria de UR-OS</h3><ol><li><b>Gestor del sistema:</b> traduce direcciones. En asignación contigua: física = base + lógica, y si la dirección lógica es mayor o igual que el límite, hay error de protección.</li><li><b>Gestor del proceso:</b> guarda dónde quedó cada proceso (su base y su tamaño).</li><li><b>Gestor de memoria libre:</b> mantiene una lista de huecos libres ordenada por dirección. Cuando se crea un proceso, pide un hueco con <code>getSlot(tamaño)</code>; cuando el proceso termina, devuelve su espacio y los huecos vecinos se unen.</li></ol><h3>Un solo método cambia</h3><p>Partir un hueco, devolverlo y unir huecos vecinos ya venía programado y se hereda. Lo único que cambia entre políticas es <b>cómo <code>getSlot</code> escoge el hueco</b>:</p><ul><li><b>First Fit:</b> el primero que alcanza.</li><li><b>Best Fit:</b> el más pequeño que alcanza.</li><li><b>Worst Fit:</b> el más grande.</li><li><b>Segregated Fit:</b> agrupa los huecos por clases de tamaño y busca primero en la clase del pedido.</li></ul><h3>Medir la fragmentación</h3><p>Para comparar las políticas, la entrega calculó la <b>fragmentación externa</b>: memoria libre total menos el hueco libre más grande. Si es alta, hay mucha memoria libre, pero en pedazos que no sirven para un proceso grande.</p><h3>Paginación y segmentación</h3><p>También se trabajó con las dos técnicas que evitan pedir un solo bloque seguido. En <b>paginación</b>, el gestor libre es una lista de marcos libres. En <b>segmentación</b>, cada segmento del proceso pide su propio hueco con <code>getSlot</code>, así que la fragmentación externa sigue existiendo.</p><div class="recap"><b>Para recordar.</b> Las políticas de huecos solo se diferencian en getSlot(). Ninguna gana siempre y ninguna elimina la fragmentación externa.</div>',
 mc: 'En la Mina de Memoria puedes repetir nuestro escenario A con las cuatro políticas lado a lado: el botón del laboratorio lo carga listo.',
 example: '<p><b>Escenario A</b> de la entrega. Memoria de 1000 bytes con tres huecos libres: [0, 300), [400, 500) y [600, 1000), es decir, 300, 100 y 400 bytes (800 libres en total). Llegan pedidos de 90, 250, 100, 120 y 180 bytes:</p><table><tr><th>Política</th><th>Pedidos atendidos</th><th>Qué pasa con el de 180</th></tr><tr><td>First Fit</td><td>4 de 5</td><td>Falla: quedan 240 libres, pero el hueco mayor mide 110</td></tr><tr><td>Best Fit</td><td><b>5 de 5</b></td><td>Entra en [820, 1000)</td></tr><tr><td>Worst Fit</td><td>4 de 5</td><td>Falla: quedan 240 libres, pero el hueco mayor mide 100</td></tr></table><p>En el <b>escenario B</b> (pedidos de 150, 200 y 250) el resultado se invierte: Worst Fit atiende los 3 y las otras dos solo 2. <b>Conclusión de la entrega:</b> ninguna política es la mejor para todas las cargas, y ninguna elimina la fragmentación externa; solo cambian cómo se reparte.</p>',
 quiz: { q: 'En el escenario A con First Fit, el pedido de 180 falla aunque quedan 240 bytes libres. ¿Por qué?', options: ['Por fragmentación interna', 'Porque ningún hueco por sí solo mide 180: es fragmentación externa', 'Porque la memoria está completamente llena'], hint: 'Sumar los huecos no los vuelve un solo bloque.', why: 'La memoria libre está repartida en huecos más pequeños que 180. Eso es fragmentación externa.' } },
en: { title: 'Deliverable 2: programming memory', goal: 'Explain the memory layers of UR-OS and why no hole policy always wins.',
 story: 'In the second deliverable UR-OS could already load processes into memory, but it only knew how to choose holes with First Fit. The task was to add other policies and measure which one uses memory best.',
 body: '<h3>The three memory layers of UR-OS</h3><ol><li><b>System manager:</b> translates addresses. In contiguous allocation: physical = base + logical, and if the logical address is greater than or equal to the limit, there is a protection error.</li><li><b>Process manager:</b> stores where each process was placed (its base and size).</li><li><b>Free memory manager:</b> keeps a list of free holes ordered by address. When a process is created it asks for a hole with <code>getSlot(size)</code>; when the process ends it gives its space back and neighbouring holes are merged.</li></ol><h3>Only one method changes</h3><p>Splitting a hole, giving it back and merging neighbouring holes were already programmed and are inherited. The only thing that changes between policies is <b>how <code>getSlot</code> chooses the hole</b>:</p><ul><li><b>First Fit:</b> the first one that is big enough.</li><li><b>Best Fit:</b> the smallest one that is big enough.</li><li><b>Worst Fit:</b> the largest one.</li><li><b>Segregated Fit:</b> groups holes into size classes and searches the request’s class first.</li></ul><h3>Measuring fragmentation</h3><p>To compare the policies, the deliverable computed <b>external fragmentation</b>: total free memory minus the largest free hole. When it is high, there is plenty of free memory, but in pieces that are useless for a large process.</p><h3>Paging and segmentation</h3><p>We also worked with the two techniques that avoid asking for one single block. In <b>paging</b>, the free manager is a list of free frames. In <b>segmentation</b>, each segment of the process asks for its own hole with <code>getSlot</code>, so external fragmentation still exists.</p><div class="recap"><b>Remember.</b> Hole policies only differ in getSlot(). None always wins and none removes external fragmentation.</div>',
 mc: 'In the Memory Mine you can repeat our scenario A with all four policies side by side: the lab button loads it ready to go.',
 example: '<p><b>Scenario A</b> from the deliverable. A 1000-byte memory with three free holes: [0, 300), [400, 500) and [600, 1000), that is, 300, 100 and 400 bytes (800 free in total). Requests of 90, 250, 100, 120 and 180 bytes arrive:</p><table><tr><th>Policy</th><th>Requests served</th><th>What happens to the 180 one</th></tr><tr><td>First Fit</td><td>4 of 5</td><td>Fails: 240 are free, but the largest hole is 110</td></tr><tr><td>Best Fit</td><td><b>5 of 5</b></td><td>Placed in [820, 1000)</td></tr><tr><td>Worst Fit</td><td>4 of 5</td><td>Fails: 240 are free, but the largest hole is 100</td></tr></table><p>In <b>scenario B</b> (requests of 150, 200 and 250) the result flips: Worst Fit serves all 3 and the other two only 2. <b>The deliverable’s conclusion:</b> no policy is best for every workload, and none removes external fragmentation; they only change how it is spread.</p>',
 quiz: { q: 'In scenario A with First Fit, the 180-byte request fails even though 240 bytes are free. Why?', options: ['Because of internal fragmentation', 'Because no single hole is 180 bytes: it is external fragmentation', 'Because memory is completely full'], hint: 'Adding the holes together does not turn them into one block.', why: 'The free memory is split into holes smaller than 180. That is external fragmentation.' } },
answer: 1 },

{ id: 'urosall', zone: 'tower', lab: { route: 'uros', preset: 'contig' },
es: { title: 'Todo junto: el mini UR-OS', goal: 'Seguir a un proceso desde que llega hasta que termina, pasando por la memoria y por la CPU.',
 story: 'Hasta ahora estudiamos la CPU y la memoria por separado. En un sistema operativo real pasan al mismo tiempo: un proceso que no consigue memoria ni siquiera puede hacer fila para usar la CPU.',
 body: '<h3>El ciclo de vida completo</h3><p>Cuando un proceso llega, el SO primero intenta <b>cargarlo en memoria</b>. Solo cuando ya está cargado entra a la cola de listos y puede competir por la CPU.</p><div class="flow">Llega → ¿cabe en memoria?<br>   sí → cola de listos → CPU → (E/S → cola de listos → CPU …) → termina → se libera su memoria<br>   no → cola de trabajos → espera a que otro proceso libere memoria</div><h3>Dos colas, dos decisiones</h3><ul><li>La <b>cola de trabajos</b> guarda a los procesos que llegaron pero todavía no tienen memoria. Decidir a quién se carga es trabajo del <b>planificador de largo plazo</b> (o de admisión).</li><li>La <b>cola de listos</b> guarda a los que ya están en memoria y esperan la CPU. Decidir quién usa la CPU es trabajo del <b>planificador de corto plazo</b>, el que estudiamos en la Estación.</li></ul><p>El de corto plazo decide muchas veces por segundo. El de largo plazo decide pocas veces: cuando llega un proceso o cuando se libera memoria.</p><h3>Qué mirar en el laboratorio</h3><ul><li><b>Espera de memoria:</b> cuánto tiempo pasó un proceso en la cola de trabajos.</li><li><b>Fragmentación:</b> externa en asignación contigua y segmentación; interna en paginación.</li><li><b>Tablas de cada proceso:</b> base y límite, tabla de páginas o tabla de segmentos. Con ellas puedes traducir cualquier dirección lógica, igual que la MMU.</li></ul><div class="recap"><b>Para recordar.</b> Primero memoria, después CPU: un proceso sin memoria espera en la cola de trabajos y no puede competir por la CPU.</div>',
 mc: 'Es como un servidor lleno: si no hay espacio para cargar la zona del mundo de un jugador, ese jugador tiene que esperar antes de poder moverse, aunque la CPU esté desocupada.',
 example: '<p>Escenario «Contigua: espera por fragmentación externa». Memoria de 1000 bytes, First Fit, FCFS. Los procesos piden 300, 400, 350 y 200 bytes.</p><table><tr><th>Instante</th><th>Qué pasa</th></tr><tr><td>t = 0</td><td>P1 entra en [0, 300) y P2 en [300, 700)</td></tr><tr><td>t = 1</td><td>Llega P3 (350): solo hay 300 libres → cola de trabajos</td></tr><tr><td>t = 2</td><td>Llega P4 (200): entra en [700, 900)</td></tr><tr><td>t = 4</td><td>Terminó P1. Hay 400 libres, pero en dos huecos de 300 y 100: P3 sigue sin caber (fragmentación externa)</td></tr><tr><td>t = 7</td><td>Terminó P2. Se unen los huecos en [0, 700) y P3 por fin se carga en la base 0</td></tr></table><p>P3 esperó <b>6</b> unidades por memoria antes de poder hacer fila para la CPU.</p>',
 quiz: { q: 'Un proceso está en la cola de trabajos. ¿Qué tiene que pasar para que entre a la cola de listos?', options: ['Que el planificador de CPU lo elija', 'Que termine una operación de E/S', 'Que se libere memoria suficiente para cargarlo'], hint: 'La cola de trabajos es de procesos que todavía no están en memoria.', why: 'Sin memoria no puede estar listo. Cuando otro proceso termina y libera espacio suficiente, se carga y pasa a la cola de listos.' } },
en: { title: 'All together: the mini UR-OS', goal: 'Follow a process from arrival to exit, through memory and through the CPU.',
 story: 'So far we have studied the CPU and memory separately. In a real operating system they happen at the same time: a process that cannot get memory cannot even queue for the CPU.',
 body: '<h3>The complete life cycle</h3><p>When a process arrives, the OS first tries to <b>load it into memory</b>. Only once it is loaded does it enter the ready queue and compete for the CPU.</p><div class="flow">Arrives → does it fit in memory?<br>   yes → ready queue → CPU → (I/O → ready queue → CPU …) → ends → its memory is freed<br>   no → job queue → waits until another process frees memory</div><h3>Two queues, two decisions</h3><ul><li>The <b>job queue</b> holds processes that have arrived but have no memory yet. Deciding who gets loaded is the job of the <b>long-term scheduler</b> (or admission scheduler).</li><li>The <b>ready queue</b> holds those already in memory waiting for the CPU. Deciding who uses the CPU is the job of the <b>short-term scheduler</b>, the one we studied in the Station.</li></ul><p>The short-term scheduler decides many times per second. The long-term one decides rarely: when a process arrives or when memory is freed.</p><h3>What to watch in the lab</h3><ul><li><b>Memory wait:</b> how long a process spent in the job queue.</li><li><b>Fragmentation:</b> external with contiguous allocation and segmentation; internal with paging.</li><li><b>Each process’s table:</b> base and limit, page table or segment table. With it you can translate any logical address, just like the MMU.</li></ul><div class="recap"><b>Remember.</b> Memory first, then CPU: a process without memory waits in the job queue and cannot compete for the CPU.</div>',
 mc: 'It is like a full server: if there is no room to load the part of the world a player is in, that player has to wait before moving, even if the CPU is idle.',
 example: '<p>Scenario “Contiguous: waiting because of external fragmentation”. 1000 bytes of memory, First Fit, FCFS. The processes need 300, 400, 350 and 200 bytes.</p><table><tr><th>Instant</th><th>What happens</th></tr><tr><td>t = 0</td><td>P1 goes into [0, 300) and P2 into [300, 700)</td></tr><tr><td>t = 1</td><td>P3 (350) arrives: only 300 are free → job queue</td></tr><tr><td>t = 2</td><td>P4 (200) arrives: placed in [700, 900)</td></tr><tr><td>t = 4</td><td>P1 has finished. 400 are free, but in two holes of 300 and 100: P3 still does not fit (external fragmentation)</td></tr><tr><td>t = 7</td><td>P2 has finished. The holes merge into [0, 700) and P3 is finally loaded at base 0</td></tr></table><p>P3 waited <b>6</b> units for memory before it could even queue for the CPU.</p>',
 quiz: { q: 'A process is in the job queue. What has to happen for it to enter the ready queue?', options: ['The CPU scheduler has to pick it', 'An I/O operation has to finish', 'Enough memory has to be freed to load it'], hint: 'The job queue holds processes that are not in memory yet.', why: 'Without memory it cannot be ready. When another process ends and frees enough space, it is loaded and moves to the ready queue.' } },
answer: 2 }
  );
  // Tower terms in the glossary.
  M.pages.glossary.push(
    ['simulator', 'Simulador', 'Simulator', 'Programa que imita a otro sistema para estudiarlo sin riesgo.', 'A program that imitates another system so it can be studied safely.', 'uros'],
    ['policy', 'Política y mecanismo', 'Policy and mechanism', 'La regla que decide (política) separada de la maquinaria que la ejecuta (mecanismo).', 'The rule that decides (policy) kept apart from the machinery that carries it out (mechanism).', 'uros'],
    ['jobq', 'Cola de trabajos', 'Job queue', 'Procesos que llegaron pero todavía no tienen memoria.', 'Processes that have arrived but have no memory yet.', 'urosall'],
    ['ltsched', 'Planificador de largo plazo', 'Long-term scheduler', 'Decide qué procesos se cargan en memoria.', 'Decides which processes are loaded into memory.', 'urosall']
  );
})();

/* Original procedural 16x16 pixel textures. Generated at run time; no third-party game assets. CC0-1.0. */
window.MineOS = window.MineOS || {};
window.MineOS.textures = (function () {
  'use strict';
  function rand(seed) { let a = seed; return () => { a = (a * 16807) % 2147483647; return a / 2147483647; }; }
  function canvas(paint, seed) {
    const c = document.createElement('canvas'); c.width = c.height = 16;
    const g = c.getContext('2d'); const r = rand(seed);
    const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
    paint(px, r, g);
    return c;
  }
  const speckle = (colors) => (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, colors[Math.floor(r() * colors.length)]); };
  const defs = {
    grassTop: speckle(['#67a94a', '#5d9c43', '#72b552', '#579040', '#6aae4c']),
    dirt: speckle(['#8a6242', '#7b5639', '#976d4b', '#6f4c32']),
    grassSide: (px, r) => { speckle(['#8a6242', '#7b5639', '#976d4b'])(px, r); for (let x = 0; x < 16; x++) { const h = 3 + Math.floor(r() * 3); for (let y = 0; y < h; y++) px(x, y, r() < 0.5 ? '#67a94a' : '#579040'); } },
    stone: (px, r) => { speckle(['#8d9298', '#858a90', '#959aa0'])(px, r); for (let i = 0; i < 9; i++) { const x = Math.floor(r() * 12), y = Math.floor(r() * 15); for (let k = 0; k < 4; k++) px(x + k, y, '#6f747a'); } },
    sand: speckle(['#dccf9a', '#d3c58e', '#e4d8a6']),
    wood: (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, x % 4 === 0 ? '#5b3d22' : r() < 0.5 ? '#7a5430' : '#704c2a'); },
    leaves: speckle(['#3f7d35', '#356b2d', '#4b8f3f', '#2c5a26', '#57a049']),
    plank: (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, y % 4 === 3 || (x === (y < 8 ? 4 : 11)) ? '#8a6a3c' : r() < 0.5 ? '#b99157' : '#ae874f'); },
    water: speckle(['#3a78c9', '#3f82d4', '#346dba']),
    lamp: (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const edge = x < 2 || y < 2 || x > 13 || y > 13; px(x, y, edge ? '#6b4a1f' : r() < 0.5 ? '#ffd75e' : '#ffc23a'); } },
    circuit: (px, r) => { speckle(['#243447', '#203042'])(px, r); for (let i = 0; i < 16; i++) { px(i, 5, '#38e0c0'); px(10, i, '#38e0c0'); } [[3, 5], [10, 12], [10, 5]].forEach(([x, y]) => { for (let a = -1; a < 2; a++) for (let b = -1; b < 2; b++) px(x + a, y + b, '#f2b84b'); }); },
    brick: (px, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const o = Math.floor(y / 4) % 2 ? 4 : 0; px(x, y, y % 4 === 3 || (x + o) % 8 === 7 ? '#cfc4b8' : r() < 0.5 ? '#a4503f' : '#97473a'); } }
  };
  const cache = {};
  function get(name) { if (!cache[name]) cache[name] = canvas(defs[name], 7 + Object.keys(defs).indexOf(name) * 131); return cache[name]; }
  /* faces: [top, side, bottom] */
  const blocks = {
    grass: ['grassTop', 'grassSide', 'dirt'], dirt: ['dirt', 'dirt', 'dirt'], stone: ['stone', 'stone', 'stone'], sand: ['sand', 'sand', 'sand'],
    wood: ['plank', 'wood', 'plank'], leaves: ['leaves', 'leaves', 'leaves'], plank: ['plank', 'plank', 'plank'], water: ['water', 'water', 'water'],
    lamp: ['lamp', 'lamp', 'lamp'], circuit: ['circuit', 'circuit', 'circuit'], brick: ['brick', 'brick', 'brick']
  };
  function install() {
    const root = document.documentElement.style;
    ['dirt', 'stone', 'plank', 'grassTop', 'grassSide', 'wood', 'lamp', 'circuit'].forEach((n) => root.setProperty('--tex-' + n, `url(${get(n).toDataURL()})`));
  }
  return { get, blocks, install };
})();

</script>
<script>
/* Teachers' page: a separate page, not linked from the student site. CC0-1.0. */
(function () {
  'use strict';
  const M = window.MineOS;
  const main = document.getElementById('main');
  const get = (k, d) => { try { const v = localStorage.getItem('mineos.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  let lang = get('lang', (navigator.language || 'es').toLowerCase().startsWith('en') ? 'en' : 'es');
  if (lang !== 'en') lang = 'es';
  const t = (k, p) => { let s = M.strings[lang][k]; if (s === undefined) return k; if (p) s = s.replace(/\{(\w+)\}/g, (_, x) => (p[x] === undefined ? '' : p[x])); return s; };

  function draw() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    // The order map lets the teacher plan a session with the same lock order the students see.
    const map = M.zones.map((z, i) => `<tr><td><b>${i + 1}. ${z[lang]}</b></td><td><ol>${M.lessons.filter((l) => l.zone === z.id).map((l) => `<li><a href="MineOS_estudiantes.html#/lesson/${l.id}">${l[lang].title}</a><br><small class="muted">${lang === 'es' ? 'Respuesta del reto' : 'Challenge answer'}: <b>${'ABC'[l.answer]}</b> · ${l[lang].quiz.options[l.answer]}</small></li>`).join('')}</ol></td></tr>`).join('');
    main.innerHTML = `<article class="page prose"><h1>${t('teachTitle')}</h1>
      <p class="info">${t('teachIntro')}</p>
      ${M.pages.teach[lang]}
      <h2>${t('teachLock')}</h2><p>${t('teachLockText')}</p>
      <div class="scroll"><table><thead><tr><th>${lang === 'es' ? 'Mundo' : 'World'}</th><th>${lang === 'es' ? 'Lecciones en orden y respuesta de cada reto (A, B o C, según el orden de las opciones)' : 'Lessons in order and each challenge answer (A, B or C, by option order)'}</th></tr></thead><tbody>${map}</tbody></table></div>
      <p><a class="btn primary" href="MineOS_estudiantes.html">${t('teachOpen')} →</a></p></article>`;
    document.title = 'MineOS · ' + t('teachTitle');
  }
  M.textures.install();
  document.querySelectorAll('[data-lang]').forEach((b) => { b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('mineos.lang', JSON.stringify(lang)); } catch (e) { /* storage may be blocked */ } draw(); }; });
  draw();
})();

</script>
